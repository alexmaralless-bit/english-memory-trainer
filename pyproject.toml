[project]
name = "english-memory-trainer"
version = "0.0.0"
description = "Local-first CLI trainer for American English with interchangeable AI tutors"
requires-python = ">=3.12"
# Код под MIT, данные учебной программы под CC BY-SA 4.0.
# См. LICENSE, curriculum/LICENSE и ATTRIBUTIONS.md.
license = { text = "MIT" }

# Runtime dependencies of code that actually exists today. The kernel (roadmap
# 1.2) needs pydantic for envelope validation (foundation contract 7: stdlib +
# pydantic); the CLI increment brought typer for the `trainer` entry point.
# SQLAlchemy stays deliberately absent -- SQLite goes through the thin sqlite3
# layer, no ORM.
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
trainer = "english_trainer.cli.app:main"

[project.optional-dependencies]
# Corpus enrichment for the lexicon (P.4b). wordfreq is pinned to an exact
# version on purpose: curriculum/lexicon/_provenance.yaml records the sha256 of
# this exact wheel, and tools/enrich_lexicon.py refuses to run against a
# different artifact. Bumping the version here without updating the manifest
# will fail the check, which is the intended behaviour.
corpus = [
    "wordfreq==3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The application code lives under src/ (src layout). wiki/, curriculum/ and
# staging/ remain data, not packages.
package-dir = { "" = "src" }
packages = [
    "english_trainer",
    "english_trainer.kernel",
    "english_trainer.cli",
    "english_trainer.storage",
    "english_trainer.curriculum",
    "english_trainer.control",
    "english_trainer.lessons",
    "english_trainer.evidence",
    "english_trainer.scoring",
    "english_trainer.scheduler",
    "english_trainer.memory",
    "english_trainer.adapters",
]

[tool.ruff]
target-version = "py312"
line-length = 110
indent-width = 4
extend-exclude = [".venv", "staging"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["^\\.venv/"]
