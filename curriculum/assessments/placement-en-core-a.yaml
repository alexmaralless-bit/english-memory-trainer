passages:
- passage_id: p-a2-1
  cefr: A2
  title: New parking rules
  text: Meridian Software is changing its parking rules starting next month. Right now, any employee can
    park in the main lot on a first-come basis. From March 1, spaces will be assigned by department, and
    visitors will use the lot behind Building C. Employees who arrive after nine often struggle to find
    a space, so the new system aims to fix that problem. Staff who bike or take the bus will still get
    a small discount on their gym membership. Managers will email each team its assigned row by the end
    of next week. Anyone with questions should contact facilities, not IT support.
- passage_id: p-b1-1
  cefr: B1
  title: New ticket-routing bot
  text: 'Note from Marcus, on the support team, posted to the #support-tools channel: starting Monday,
    incoming tickets will be sorted automatically by the new routing bot instead of by the duty manager.
    To get ready, tag your ticket queue with the correct category before Thursday, since the bot only
    reads the category field and ignores the ticket text itself. Anyone who handles billing questions
    will also need to request access to the finance queue separately, because the bot no longer grants
    it automatically. I tested the bot against last month''s tickets over the weekend, and it sorted almost
    everything correctly, though a few urgent tickets from enterprise clients ended up in the wrong queue.
    That is probably just a gap in its training data rather than proof that the bot cannot be trusted,
    so for now, please double-check anything marked urgent before it sits too long.'
- passage_id: p-b2-1
  cefr: B2
  title: The case for automated monitoring
  text: Our support team currently learns about outages only when customers report them, often hours after
    a problem begins. This delay damages trust and increases the workload during an already stressful
    incident. Automated monitoring would detect unusual error rates within minutes and alert the on-call
    engineer before most customers notice anything wrong. Critics argue that monitoring tools are expensive
    and require ongoing maintenance, and that concern is fair. However, the cost of one prevented outage,
    in both engineering hours and customer trust, would likely cover a year of the subscription. For these
    reasons, I recommend a three-month trial with our smallest customer segment before a full rollout.
- passage_id: p-c1-1
  cefr: C1
  title: One survey, two conclusions
  text: The product team's report concluded that the redesign had improved customer satisfaction, citing
    a five-point rise in the average rating collected during the week the new interface launched, when
    a banner promoting the change was shown to every visitor. A separate review from customer support
    reached a more cautious conclusion, noting that ticket volume for the same month actually rose, especially
    among users who complained about the removed search filters. Both teams treat the rating survey's
    respondents as representative of the whole customer base, even though the survey pop-up appeared only
    on the desktop site and most of the complaining users accessed the product through the mobile app.
    Leadership wants to expand the redesign to every region next quarter based on the improved rating,
    but doing so would do nothing for the mobile complaints the support review flagged, unless the assumption
    about who the survey actually reached turns out not to matter.
