passages:
- passage_id: p-a2-1
  cefr: A2
  title: New expense tool
  text: Starting next Monday, the finance team will roll out a new expense-report tool called QuickClaim.
    The old system will still work until the end of the month, so staff can submit either one for now.
    IT ran a short pilot last week with volunteers from three departments, and the pilot hit a few snags
    with photo uploads on older phones. Those bugs are already fixed. Every employee must create a QuickClaim
    account before March 30, because after that date the finance team will stop accepting paper receipts
    completely. If you need help setting up your account, message the IT help desk any time this week.
- passage_id: p-b1-1
  cefr: B1
  title: VPN client migration
  text: 'Posted in #it-updates by Priya, IT Operations: starting next week, remote access will move to
    the new VPN client. To switch over, uninstall the old client, restart your laptop, and install the
    new one from the internal portal before Friday. If your team handles production deployments, you will
    also need to request the elevated-access role separately, since the new client no longer grants it
    automatically. I tested the migration on my own laptop yesterday, and it went smoothly, though a few
    people on the mobile team reported longer login times right after switching. That is probably a temporary
    caching issue rather than anything wrong with the new client itself, so please just restart once if
    it happens to you.'
- passage_id: p-b2-1
  cefr: B2
  title: Remote work productivity
  text: Several companies have reduced their office space over the past two years, citing data that shows
    employees completing more tasks per week when working from home. Critics argue that this productivity
    figure is misleading, since it usually counts finished tickets rather than the quality or complexity
    of the work involved. A recent internal survey at one software firm found that remote engineers closed
    more tickets on average, but their code required more follow-up fixes than code written by employees
    who worked in the office at least three days a week. The company's leadership still describes the
    shift to remote work as an unambiguous success, pointing mainly to the ticket counts and rarely mentioning
    the follow-up fixes in public updates.
- passage_id: p-c1-1
  cefr: C1
  title: Two retrospectives, one quarter
  text: Team A's retrospective attributed last quarter's slower release cadence to an increase in code
    review turnaround time, based on a sample of forty pull requests from a single, unusually busy sprint.
    Team B's independent review of the same quarter reached a different conclusion, pointing instead to
    a rise in flaky integration tests as the primary bottleneck. Both analyses assume that the recorded
    timestamps in the project tracker accurately reflect when engineers actually did the work, rather
    than when they merely updated a ticket's status. Management's proposed fix, hiring two additional
    reviewers, would address Team A's explanation but would do little for the flaky-test problem Team
    B identified, unless the shared assumption about the timestamps also holds true across both samples.
