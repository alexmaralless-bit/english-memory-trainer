texts:
  - id: text.recon.passive-expanded-process.data-pipeline
    title: "Data processing pipeline"
    cefr: B1
    topic: grammar.passive.expanded-process
    carries: [tense:passive, tense:present-simple, tense:present-perfect]
    domain: work
    context: deployment-report
    text: "The raw data files are validated carefully when they arrive from the client each day. All records are checked thoroughly against the database schema. Duplicate entries are removed automatically during the processing stage. The cleaned data has been stored securely in the central data warehouse. Historical records had been archived completely before the migration started. The new incoming data is tracked continuously by the system daily. Errors are logged automatically and sent directly to the team. Weekly reports are generated by the automated system."
    word_count: 84
    keywords: ["data files are validated", "arrive from client", "records are checked", "schema", "duplicates are removed", "processing", "cleaned data has been stored", "warehouse", "records had been archived", "before migration", "data is tracked", "errors are logged", "reports are generated"]
    target_spans: ["are validated carefully when", "are checked thoroughly against", "are removed automatically", "has been stored securely", "had been archived completely", "is tracked continuously", "are logged automatically", "are generated"]
    summary_ru: "Файлы данных проверяют при поступлении. Записи проверяют по схеме. Дубликаты удаляют при обработке. Очищенные данные хранят в хранилище. Исторические записи архивировали до миграции. Новые данные отслеживают постоянно. Ошибки логируют автоматически. Отчеты генерируют еженедельно."
    transformations: [authored]

  - id: text.recon.passive-expanded-process.renovation-steps
    title: "Home renovation process"
    cefr: B1
    topic: grammar.passive.expanded-process
    carries: [tense:passive, tense:past-simple, tense:present-perfect]
    domain: everyday
    context: process-description
    text: "The walls were carefully prepared before the painting began last week. Old paint is removed slowly and carefully with special tools. The surface is smoothed with fine sandpaper to make it perfect. New paint is applied in two even coats across all walls. Each coat has been dried completely between the applications. Trim pieces are installed after the walls are fully finished. The final touches and details are done carefully by experienced specialists. Everything has been completed well within the schedule."
    word_count: 81
    keywords: ["walls were prepared", "before painting began", "old paint is removed", "carefully", "surface is smoothed", "sandpaper", "new paint is applied", "two coats", "has been dried", "between applications", "trim pieces are installed", "walls are finished", "final touches are done", "has been completed"]
    target_spans: ["were carefully prepared", "is removed slowly", "is smoothed with", "is applied in", "has been dried completely", "are installed", "are fully finished", "are done", "has been completed"]
    summary_ru: "Стены подготовили перед покраской. Старую краску снимают аккуратно. Поверхность шлифуют наждачной бумагой. Новую краску наносят двумя слоями. Каждый слой сохнет между нанесениями. Плинтусы устанавливают после стен. Последние штрихи делают специалисты. Всё закончено в срок."
    transformations: [authored]
