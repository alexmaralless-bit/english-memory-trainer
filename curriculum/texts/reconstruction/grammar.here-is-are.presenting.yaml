    keywords: ["new laptop", "work", "charging cables", "mouse", "desk setup", "pens", "office", "notebook", "meetings", "keys", "workspace", "badge"]
    target_spans: ["Here is your new laptop", "Here are the charging cables", "Here is a mouse", "Here are three pens", "Here is your notebook", "Here are the keys", "Here is your badge"]
    summary_ru: "Выдача оборудования: вот ноутбук, кабели, мышка, ручки, тетрадь, ключи."
