  - id: text.recon.here-is-are-presenting.equipment-handoff
    title: "Equipment handoff"
    cefr: A1
    topic: grammar.here-is-are.presenting
    carries: [structure:here-is]
    domain: everyday
    context: interface-walkthrough
    text: "Here is your new laptop for work today. Here are the charging cables you will need. Here is a mouse for your desk setup area. Here are three pens for your office space. Here is your notebook for all meetings. Here are the keys to your new workspace. Here is your badge too."
