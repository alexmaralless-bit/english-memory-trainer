    carries: [structure:here-is]
    domain: work
    context: interface-walkthrough
    text: "Here is your new access card with your name on it. Here are the login instructions for the system. Here is the database password you will need. Here are the steps to set up your email. Here is a quick guide to the software. Here are all the forms you must complete."
