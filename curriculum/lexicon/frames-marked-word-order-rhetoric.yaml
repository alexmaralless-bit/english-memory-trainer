# Frames for grammar.marked-word-order.rhetoric (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.marked-word-order-rhetoric.direct-object-fronting, type: chunk, title: "___ we cannot ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "… мы не можем …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:reference], slot_hint_ru: "объект + глагол отрицания", examples: ["This proposal we cannot endorse without evidence.", "Such arguments we cannot accept."], contrast: {frame: "We cannot ___", note_ru: "normal word order нейтрален, fronting emphatic и выражает решительность"}, trap: {learner_form: "This proposal we not can endorse.", correction: "This proposal we cannot endorse.", cause_ru: "cannot (не can not); основной глагол в правильной позиции после подлежащего"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.such-was-that, type: chunk, title: "Such was the ___ that ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "такой была … что …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "качество + следствие настолько серьёзное", examples: ["Such was the complexity that we required redesign.", "Such was the discrepancy that analysis needed reevaluation."], contrast: {frame: "The ___ was so ___", note_ru: "normal order более прямолинейна, such-инверсия более литературна и подчёркивает степень"}, trap: {learner_form: "Such was the complexity so we redesigned.", correction: "Such was the complexity that we required a redesign.", cause_ru: "that (не so) в этом инверсионном структуре; правильная грамматическая цепь"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.so-adjective-was, type: chunk, title: "So ___ was ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "так … был …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "интенсивный адъектив + существительное", examples: ["So severe was the performance degradation.", "So unprecedented was the market shift."], contrast: {frame: "___ was so ___", note_ru: "normal word order более простой, inversion emphasizes и усиливает нарратив"}, trap: {learner_form: "So severe the performance was.", correction: "So severe was the performance.", cause_ru: "was перед существительным (inversion); degradation правильно"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.only-then-did, type: chunk, title: "Only then did ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "только тогда …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "событие с emphatically delayed timing", examples: ["Only then did we recognize the systemic risk in our infrastructure.", "Only then did management approve the investment in automation."], contrast: {frame: "Then we ___", note_ru: "normal order показывает последовательность, only-inversion выделяет момент осознания или решения"}, trap: {learner_form: "Only then we recognized the risk.", correction: "Only then did we recognize the risk.", cause_ru: "did перед подлежащим после only then (обязательная инверсия)"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.adjective-though-it, type: chunk, title: "___ though it was, ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "… хотя это было, …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "уступительное качество + главная идея", examples: ["Counterintuitive though it was, the algorithm proved efficient.", "Expensive though it was, training investment paid off."], contrast: {frame: "Although it was ___", note_ru: "although clause более стандартна, fronted adjective с though более литературна и выразительна"}, trap: {learner_form: "Counterintuitive it was though, the algorithm proved.", correction: "Counterintuitive though it was, the algorithm proved.", cause_ru: "though после адъектива (не в конце); subject и be перед запятой"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.into-this-came, type: chunk, title: "Into this ___ came ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "в эту … пришла …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "установленный контекст + неожиданное событие", examples: ["Into this fragile process came an unexpected requirement.", "Into this stability came three consecutive failures."], contrast: {frame: "___ appeared in ___", note_ru: "normal order более простой, fronted prepositional phrase emphasizes the disruption"}, trap: {learner_form: "Into this fragile process a requirement came.", correction: "Into this fragile process came a requirement.", cause_ru: "инверсия: глагол перед подлежащим после фронтированного prepositional phrase"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.what-clause-was, type: chunk, title: "What ___ was ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "то, что … было …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:cleft], slot_hint_ru: "событие + категоризация результата", examples: ["What the inquiry did not establish was unclear.", "What the analysis revealed was a pattern."], contrast: {frame: "The inquiry did not establish ___", note_ru: "normal clause более прямая, cleft-структура выделяет what-clause как информационный фокус"}, trap: {learner_form: "What the inquiry not established was unclear.", correction: "What the inquiry did not establish was unclear.", cause_ru: "did not establish (не not established) — в отрицании нужен вспомогательный глагол did"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.nowhere-was-this, type: chunk, title: "Nowhere was this ___ more evident", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "нигде это … не было более очевидно", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "явление в контексте фокуса", examples: ["Nowhere was this disconnect more evident.", "Nowhere was this impact more evident."], contrast: {frame: "This was most evident in ___", note_ru: "normal order более нейтрален, fronted nowhere emphasizes contrast с другими местами"}, trap: {learner_form: "Nowhere this disconnect was more evident.", correction: "Nowhere was this disconnect more evident.", cause_ru: "was перед подлежащим после nowhere; правильный порядок слов"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.never-before-had, type: chunk, title: "Never before had we ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "никогда раньше мы не …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "исторически необычное событие", examples: ["Never before had we faced such migration.", "Never before had we observed such adoption."], contrast: {frame: "We had never ___", note_ru: "normal order более стандартна, fronted never emphasizes uniqueness и историческое значение"}, trap: {learner_form: "Never before we had seen adoption.", correction: "Never before had we seen such adoption.", cause_ru: "had перед подлежащим после never before; используй past perfect"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.not-only-did, type: chunk, title: "Not only did ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "не только … …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "первое достижение", examples: ["Not only did the refactoring improve performance.", "Not only did the policy correct injustices."], contrast: {frame: "___ improved performance", note_ru: "coordinate clause более простая, not-only инверсия emphasizes magnification"}, trap: {learner_form: "Not only the refactoring improved performance.", correction: "Not only did the refactoring improve performance.", cause_ru: "did перед подлежащим после not only; правильный inversion"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.little-did-they, type: chunk, title: "Little did they know ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "они мало знали …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "то, что они не предусмотрели или осознали", examples: ["Little did they know the migration would fail twice.", "Little did they know the storm would cancel the trip."], contrast: {frame: "They did not know ___", note_ru: "normal order прямолинейнее, little-инверсия more literary и создаёт dramatic irony"}, trap: {learner_form: "Little they knew about this decision.", correction: "Little did they know about this decision.", cause_ru: "после little в начале предложения нужна инверсия (did they know)"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.crucial-though-they-were, type: chunk, title: "Crucial though they were, ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "хотя они были важны, …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "уступительное качество + главное событие", examples: ["Crucial though they were, the initial prototypes did not survive into the final release.", "Crucial though they were, the early prototypes required significant rework."], contrast: {frame: "Although they were crucial", note_ru: "although clause более простой, fronted adjective с though более emphatic и literary"}, trap: {learner_form: "Crucial they were though, the prototypes not survived.", correction: "Crucial though they were, the prototypes did not survive into the final release.", cause_ru: "though после адъектива; главное предложение с proper verb tense"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.among-the-most, type: chunk, title: "Among the most ___ were ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, data], meaning_ru: "среди самых … были …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "категория + конкретные примеры в порядке важности", examples: ["Among the most critical were latency and performance.", "Among the most important factors were documentation and stability."], contrast: {frame: "___ were among the most ___", note_ru: "normal order более стандартна, fronted prepositional phrase emphasizes categorization"}, trap: {learner_form: "Among the most significant findings the correlations were.", correction: "Among the most significant findings were the correlations.", cause_ru: "инверсия: глагол перед подлежащим (were the correlations, не the correlations were)"}, transformations: [authored]}
  - {id: chunk.marked-word-order-rhetoric.remarkable-as-it-was, type: chunk, title: "Remarkable as it was, ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "как бы это ни было замечательно, …", frame_of: grammar.marked-word-order.rhetoric, carries: [structure:inversion], slot_hint_ru: "уступительное качество + главное развитие", examples: ["Remarkable as it was, the breakthrough did not translate to advantage.", "Remarkable as it was, the discovery changed nothing in practice."], contrast: {frame: "Although it was remarkable", note_ru: "although clause более стандартна, fronted adjective с as more literary и subtle"}, trap: {learner_form: "Remarkable it was as, breakthrough translated.", correction: "Remarkable as it was, the breakthrough did not translate.", cause_ru: "as перед be; полное главное предложение; отрицание если необходимо"}, transformations: [authored]}
