# Frames for grammar.mixed-conditionals.consequences (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.mixed-conditionals-consequences.past-present-would, type: chunk, title: "If we had ___, we would ___ now", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы мы …, мы бы … сейчас (прошлое условие → настоящий результат)", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3], slot_hint_ru: "глагол третьей формы + Present Simple", examples: ["If we had documented the workaround, we would know what to do now.", "If she had learned the process, she would handle the calls better now."], contrast: {frame: "If we had ___, we would have ___", note_ru: "это третий условный для обоих прошлых времен"}, trap: {learner_form: "If we had documented, we would know yesterday.", correction: "If we had documented, we would know now.", cause_ru: "смешанный условный соединяет прошлое с настоящим, не с прошлым"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.present-past-would-have, type: chunk, title: "If the service were ___, we would have ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Если бы сервис был …, мы бы … (текущее условие → прошлый результат)", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3], slot_hint_ru: "прилагательное + глагол третьей формы", examples: ["If the service were easier to configure, we would have adopted it last year.", "If the interface were more intuitive, users would have submitted fewer tickets."], contrast: {frame: "If the service were ___, we would ___", note_ru: "если результат в настоящем, то would без have"}, trap: {learner_form: "If the service were easier, we would adopted it.", correction: "If the service were easier, we would have adopted it.", cause_ru: "с прошлым результатом нужно would have, не would"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.if-not-did-would, type: chunk, title: "If they did not ___, they would not have ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы они не … (текущее), они не бы не … (прошлое)", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3, structure:negative], slot_hint_ru: "Present Simple + глагол третьей формы", examples: ["If they did not ignore the warning, they would not have made the mistake.", "If we did not skip testing, we would not have faced these issues."], contrast: {frame: "If they did not ___, they would ___", note_ru: "если результат в настоящем, то would без have"}, trap: {learner_form: "If they did not ignore, they would not faced.", correction: "If they did not ignore, they would not have faced.", cause_ru: "прошлый результат требует would have"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.had-not-would, type: chunk, title: "If we had not ___, we would ___ today", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы мы не …, мы бы … сегодня", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3, structure:negative], slot_hint_ru: "глагол третьей формы + Present Simple", examples: ["If we had not invested in automation, we would need twice as many people today.", "If the team had not documented the code, maintenance would be impossible now."], contrast: {frame: "If we had not ___, we would not have ___", note_ru: "оба времени в прошлом — третий условный"}, trap: {learner_form: "If we had not invested, we would needed people.", correction: "If we had not invested, we would need people.", cause_ru: "настоящее время не добавляет have"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.if-were-would-have, type: chunk, title: "If I were ___, I would have ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "Если бы я был …, я бы …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3], slot_hint_ru: "прилагательное/существительное + глагол третьей формы", examples: ["If I were in her position, I would have escalated immediately.", "If I were aware of the issue, I would have warned everyone."], contrast: {frame: "If I am ___, I would have ___", note_ru: "если условие реально, то используется Present Simple"}, trap: {learner_form: "If I were in her position, I would escalate.", correction: "If I were in her position, I would have escalated.", cause_ru: "прошлый результат требует would have"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.would-not-have-if-had-not, type: chunk, title: "We would not have ___ if they had not ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы не бы не … если бы они не …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-3], slot_hint_ru: "глагол третьей формы + глагол третьей формы", examples: ["We would not have recovered so quickly if they had not isolated the fault.", "The team would not have found the bottleneck if the user had not reported the slowdown."], contrast: {frame: "We would not have ___ if ___", note_ru: "это третий условный, оба в прошлом"}, trap: {learner_form: "We would not have recovered if they had not isolate.", correction: "We would not have recovered if they had not isolated.", cause_ru: "оба глагола требуют Past Perfect формы"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.would-understand-if-had, type: chunk, title: "We would understand better if they had ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы бы лучше понимали, если бы они …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3], slot_hint_ru: "глагол третьей формы", examples: ["We would understand better if they had provided examples.", "The team would understand better if the vendor had been more transparent."], contrast: {frame: "We would have understood if they had ___", note_ru: "это третий условный, оба в прошлом"}, trap: {learner_form: "We would understand better if they provided.", correction: "We would understand better if they had provided.", cause_ru: "прошлое условие в смешанном условном требует Past Perfect (had provided), а не Past Simple (provided)"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.would-be-different-if-had, type: chunk, title: "The outcome would be different if we had ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Результат был бы другим, если бы мы …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3], slot_hint_ru: "глагол третьей формы", examples: ["The outcome would be different if we had tested the integration.", "The timeline would be different if they had planned ahead."], contrast: {frame: "The outcome would have been different if we had ___", note_ru: "это третий условный, оба в прошлом"}, trap: {learner_form: "The outcome would be different if we tested.", correction: "The outcome would be different if we had tested.", cause_ru: "прошлое условие требует Past Perfect"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.would-still-need-if-had-not, type: chunk, title: "We would still need ___ if they had not ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Нам все еще нужен был бы …, если бы они не …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3, structure:negative], slot_hint_ru: "существительное + глагол третьей формы", examples: ["We would still need a workaround if they had not released the patch.", "The team would still rely on manual checks if automation had not been implemented."], contrast: {frame: "We would have needed ___ if they had not ___", note_ru: "оба времени в прошлом — третий условный"}, trap: {learner_form: "We would still need workaround if they had not released.", correction: "We would still need a workaround if they had not released.", cause_ru: "нужен артикль перед существительным"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.would-know-if-had-told, type: chunk, title: "They would know if we had ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Они бы знали, если бы мы …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3], slot_hint_ru: "глагол третьей формы", examples: ["They would know if we had told them the real deadline.", "The team would know the issue if we had communicated it earlier."], contrast: {frame: "They would have known if we had ___", note_ru: "оба действия в прошлом"}, trap: {learner_form: "They would know if we told them.", correction: "They would know if we had told them.", cause_ru: "прошлое условие требует Past Perfect"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.if-had-been-would, type: chunk, title: "If it had been ___, we would ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы это было …, мы бы …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, tense:conditional-3], slot_hint_ru: "прилагательное + глагол Present Simple", examples: ["If it had been clearer, we would have noticed the mistake immediately.", "If it had been available sooner, we would use it today."], contrast: {frame: "If it had been ___, we would have ___", note_ru: "оба времени в прошлом"}, trap: {learner_form: "If it had been clear, we noticed the mistake.", correction: "If it had been clear, we would have noticed the mistake.", cause_ru: "прошлый результат требует would have"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.would-still-use-if-not-were, type: chunk, title: "We would still use ___ if it were not ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Мы бы все еще использовали …, если бы это не было …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2, structure:negative], slot_hint_ru: "существительное + прилагательное", examples: ["We would still use the old system if it were not so unreliable.", "They would still hire more staff if the tools were not so efficient."], contrast: {frame: "We would have used ___ if it had not been ___", note_ru: "оба времени в прошлом — третий условный"}, trap: {learner_form: "We would still use it if it had not been broken.", correction: "We would still use it if it were not broken.", cause_ru: "путают со вторым и третьим условным: здесь актуальное состояние (it were not), а не прошлое действие (had not been)"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.might-not-have-if-had, type: chunk, title: "We might not ___ now if they had ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы, возможно, сейчас бы не …, если бы они …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-3, structure:modal, structure:negative], slot_hint_ru: "базовый глагол (present result) + глагол третьей формы", examples: ["We might not need this workaround now if they had fixed the root cause.", "We might not still be blocked now if they had responded faster."], contrast: {frame: "We would not have needed this if they had fixed it.", note_ru: "чистый третий условный: результат тоже в прошлом (would have + V3); здесь результат — в настоящем (now)"}, trap: {learner_form: "We might not have needed this workaround now if they had fixed it.", correction: "We might not need this workaround now if they had fixed it.", cause_ru: "результат относится к настоящему (now) — без have; had + третья форма только в if-части"}, transformations: [authored]}
  - {id: chunk.mixed-conditionals-consequences.would-apply-if-was, type: chunk, title: "That rule would apply if the situation were ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "То правило бы применялось, если бы ситуация была …", frame_of: grammar.mixed-conditionals.consequences, carries: [tense:conditional-2], slot_hint_ru: "прилагательное", examples: ["That rule would apply if the situation were more straightforward.", "The old approach would work if circumstances were different."], contrast: {frame: "That rule would have applied if the situation had been ___", note_ru: "оба времени в прошлом"}, trap: {learner_form: "That rule would apply if the situation was different.", correction: "That rule would apply if the situation were different.", cause_ru: "в условии использовать were, не was, для hypothetical"}, transformations: [authored]}
