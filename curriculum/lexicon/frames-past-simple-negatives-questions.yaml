# Frames for grammar.past-simple.negatives-questions (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.past-simple-negatives-questions.did-you-test, type: chunk, title: "Did you test ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ты протестировал(а) ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-do], slot_hint_ru: "что протестировать", examples: ["Did you test the fix before deploying?", "Did she test the new build?"], contrast: {frame: "Have you tested ___?", note_ru: "Have you tested = уже готово, важен результат сейчас; Did you test = в конкретный момент прошлого"}, trap: {learner_form: "Did you tested the fix?", correction: "Did you test the fix?", cause_ru: "после did используется базовая форма глагола, не past simple"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.i-did-not-receive, type: chunk, title: "I did not receive ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я не получил(а) ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "что не получил", examples: ["I did not receive the email yesterday.", "She did not receive the notification."], contrast: {frame: "I haven't received ___", note_ru: "haven't received = до сих пор не получил; did not receive = конкретно не получил в прошлом"}, trap: {learner_form: "I did not received the message.", correction: "I did not receive the message.", cause_ru: "после did используется базовая форма, не past form"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.we-didnt-finish, type: chunk, title: "We didn't finish ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work], meaning_ru: "мы не завершили ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "что не завершили", examples: ["We didn't finish the report yesterday.", "They didn't finish the task on time."], contrast: {frame: "We haven't finished ___", note_ru: "haven't finished = ещё не готово; didn't finish = не завершили в конкретный момент"}, trap: {learner_form: "We didn't finished the work.", correction: "We didn't finish the work.", cause_ru: "после didn't используется базовая форма глагола, не past simple"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.did-they-approve, type: chunk, title: "Did they approve ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "они одобрили ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-do], slot_hint_ru: "что на одобрение", examples: ["Did they approve the budget yesterday?", "Did the manager approve the plan?"], contrast: {frame: "Have they approved ___?", note_ru: "Have they approved = сейчас готово?; Did they approve = готово к конкретному времени?"}, trap: {learner_form: "Did they approved the request?", correction: "Did they approve the request?", cause_ru: "после did используется базовая форма, не approved"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.the-server-didnt-crash, type: chunk, title: "The server didn't crash ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "сервер не упал ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative, structure:time-marker], slot_hint_ru: "когда", examples: ["The server didn't crash during the deployment.", "The server didn't crash after the fix."], contrast: {frame: "The server hasn't crashed", note_ru: "hasn't crashed = до сих пор не падал; didn't crash = не упал в конкретный момент"}, trap: {learner_form: "The server didn't crashed last night.", correction: "The server didn't crash last night.", cause_ru: "после didn't нужна базовая форма, не crashed"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.what-did-you-do, type: chunk, title: "What did you do ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "что ты сделал(а) ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-wh], slot_hint_ru: "когда или в какой ситуации", examples: ["What did you do when the error appeared?", "What did she do after the call ended?"], contrast: {frame: "What have you done?", note_ru: "What have you done = что ты сделал (с какими результатами)?; What did you do = что ты делал в прошлый момент?"}, trap: {learner_form: "What did you did?", correction: "What did you do?", cause_ru: "используется только один 'did'; 'do' остаётся в базовой форме"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.i-did-not-check, type: chunk, title: "I did not check ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я не проверил(а) ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "что не проверил", examples: ["I did not check the logs before restarting.", "He did not check the data format."], contrast: {frame: "I haven't checked ___", note_ru: "haven't checked = ещё не проверил; did not check = не проверил в конкретный момент"}, trap: {learner_form: "I did not checked the logs.", correction: "I did not check the logs.", cause_ru: "после did используется базовая форма, не past form"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.when-did-it-stop, type: chunk, title: "When did it stop ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "когда это остановилось ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-wh, structure:time-marker], slot_hint_ru: "дополнительный контекст", examples: ["When did it stop working yesterday?", "When did it stop responding?"], contrast: {frame: "When has it stopped?", note_ru: "When has it stopped = только что остановилось?; When did it stop = в какой момент остановилось?"}, trap: {learner_form: "When did it stopped?", correction: "When did it stop?", cause_ru: "после did глагол в базовой форме, не stop в past simple"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.we-did-not-deploy, type: chunk, title: "We did not deploy ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы не развернули ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative, structure:time-marker], slot_hint_ru: "что не развернули и когда", examples: ["We did not deploy the update yesterday.", "They did not deploy the version as planned."], contrast: {frame: "We haven't deployed ___", note_ru: "haven't deployed = ещё не развернули; did not deploy = не развернули в конкретный момент"}, trap: {learner_form: "We did not deployed the patch.", correction: "We did not deploy the patch.", cause_ru: "после did используется базовая форма, не deployed"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.did-you-find, type: chunk, title: "Did you find ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ты нашёл(а) ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-do], slot_hint_ru: "что найти", examples: ["Did you find the bug in the query?", "Did she find the missing file?"], contrast: {frame: "Have you found ___?", note_ru: "Have you found = ты уже нашёл?; Did you find = ты нашёл в конкретный момент?"}, trap: {learner_form: "Did you found the issue?", correction: "Did you find the issue?", cause_ru: "после did используется базовая форма find, не found"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.they-didnt-respond, type: chunk, title: "They didn't respond ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они не ответили ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative, structure:time-marker], slot_hint_ru: "когда (in time, yesterday, etc.)", examples: ["They didn't respond to the email yesterday.", "The vendor didn't respond by the deadline."], contrast: {frame: "They haven't responded", note_ru: "haven't responded = до сих пор не ответили; didn't respond = не ответили в конкретный момент"}, trap: {learner_form: "They didn't responded yesterday.", correction: "They didn't respond yesterday.", cause_ru: "после didn't используется базовая форма, не responded"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.who-did-you-tell, type: chunk, title: "Who did you tell ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "кому ты сказал(а) ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-wh], slot_hint_ru: "контекст или о чём", examples: ["Who did you tell about the delay?", "Who did she tell about the changes?"], contrast: {frame: "Who have you told?", note_ru: "Who have you told = кому ты сказал (с какими результатами)?; Who did you tell = кому ты говорил в прошлый момент?"}, trap: {learner_form: "Who did you told?", correction: "Who did you tell?", cause_ru: "используется только один вспомогательный глагол 'did'; 'tell' в базовой форме"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.the-test-didnt-pass, type: chunk, title: "The test didn't pass ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "тест не прошёл ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative, structure:time-marker], slot_hint_ru: "когда или почему", examples: ["The test didn't pass yesterday.", "The test didn't pass as expected."], contrast: {frame: "The test hasn't passed", note_ru: "hasn't passed = до сих пор не прошел; didn't pass = не прошел в конкретный момент"}, trap: {learner_form: "The test didn't passed yesterday.", correction: "The test didn't pass yesterday.", cause_ru: "после didn't используется базовая форма, не passed"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.why-did-you-choose, type: chunk, title: "Why did you choose ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "почему ты выбрал(а) ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-wh], slot_hint_ru: "что или это решение", examples: ["Why did you choose that approach?", "Why did they choose this vendor?"], contrast: {frame: "Why have you chosen ___?", note_ru: "Why have you chosen = почему выбрал (и каков результат)?; Why did you choose = почему выбрал в тот момент?"}, trap: {learner_form: "Why did you chosen this option?", correction: "Why did you choose this option?", cause_ru: "после did используется базовая форма choose, не chosen"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.i-didnt-send, type: chunk, title: "I didn't send ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я не отправил(а) ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "что не отправил", examples: ["I didn't send the report yesterday.", "She didn't send the form on time."], contrast: {frame: "I haven't sent ___", note_ru: "I haven't sent = ещё не отправил; I didn't send = не отправил в конкретный момент"}, trap: {learner_form: "I didn't sent the email.", correction: "I didn't send the email.", cause_ru: "после didn't используется базовая форма send, не sent (past form)"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.did-we-make-a-mistake, type: chunk, title: "Did we make a mistake ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы допустили ошибку ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-do], slot_hint_ru: "когда или где", examples: ["Did we make a mistake during the deployment?", "Did they make a mistake in the review?"], contrast: {frame: "Have we made a mistake?", note_ru: "Have we made = мы ошиблись (и это важно)?; Did we make = мы ошиблись в конкретный момент?"}, trap: {learner_form: "Did we made a mistake?", correction: "Did we make a mistake?", cause_ru: "после did используется базовая форма make, не made"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.she-didnt-leave, type: chunk, title: "She didn't leave ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work], meaning_ru: "она не ушла ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative, structure:time-marker], slot_hint_ru: "когда", examples: ["She didn't leave the office until late.", "He didn't leave after the meeting."], contrast: {frame: "She hasn't left", note_ru: "hasn't left = ещё не ушла (может быть в пути); didn't leave = ушла в конкретный момент"}, trap: {learner_form: "She didn't left at five.", correction: "She didn't leave at five.", cause_ru: "после didn't используется базовая форма leave, не left"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.where-did-you-put, type: chunk, title: "Where did you put ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "где ты положил(а) ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-wh], slot_hint_ru: "что искать", examples: ["Where did you put the backup file?", "Where did they put the archive?"], contrast: {frame: "Where have you put ___?", note_ru: "Where have you put = куда положил (и это важно)?; Where did you put = куда положил в прошлый момент?"}, trap: {learner_form: "Where did you putted the document?", correction: "Where did you put the document?", cause_ru: "put — неправильный глагол, все три формы одинаковы (put-put-put); окончание -ed добавлять не нужно"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.they-did-not-understand, type: chunk, title: "They did not understand ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они не поняли ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "что они не поняли", examples: ["They did not understand the requirements yesterday.", "The client did not understand the proposal."], contrast: {frame: "They haven't understood ___", note_ru: "haven't understood = ещё не поняли; did not understand = не поняли в конкретный момент"}, trap: {learner_form: "They did not understood the task.", correction: "They did not understand the task.", cause_ru: "после did используется базовая форма, не understood"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.how-did-you-solve, type: chunk, title: "How did you solve ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "как ты решил(а) ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-wh], slot_hint_ru: "что решать", examples: ["How did you solve the performance issue?", "How did they solve the connectivity problem?"], contrast: {frame: "How have you solved ___?", note_ru: "How have you solved = как решил (и какой результат)?; How did you solve = как решал в прошлый момент?"}, trap: {learner_form: "How did you solved the problem?", correction: "How did you solve the problem?", cause_ru: "после did используется базовая форма solve, не solved"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.we-didnt-notice, type: chunk, title: "We didn't notice ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы не заметили ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "что не заметили", examples: ["We didn't notice the error until later.", "They didn't notice the warning message."], contrast: {frame: "We haven't noticed ___", note_ru: "haven't noticed = ещё не заметили; didn't notice = не заметили в конкретный момент"}, trap: {learner_form: "We didn't noticed the issue.", correction: "We didn't notice the issue.", cause_ru: "после didn't используется базовая форма, не noticed"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.did-the-fix-work, type: chunk, title: "Did the fix work ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "исправление сработало ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-do, structure:time-marker], slot_hint_ru: "когда или в какой ситуации", examples: ["Did the fix work yesterday?", "Did the patch work as expected?"], contrast: {frame: "Has the fix worked?", note_ru: "Has the fix worked = исправление сработало?; Did the fix work = исправление сработало в конкретный момент?"}, trap: {learner_form: "Did the fix worked?", correction: "Did the fix work?", cause_ru: "после did используется базовая форма work, не worked"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.they-didnt-know, type: chunk, title: "They didn't know ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они не знали ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "что они не знали", examples: ["They didn't know about the changes yesterday.", "The team didn't know about the new deadline."], contrast: {frame: "They haven't known ___", note_ru: "haven't known = не знали до сих пор; didn't know = не знали в конкретный момент"}, trap: {learner_form: "They didn't knew the answer.", correction: "They didn't know the answer.", cause_ru: "после didn't используется базовая форма know, не knew"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.did-you-get-the-message, type: chunk, title: "Did you get the message ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ты получил(а) сообщение ...?", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:question-do], slot_hint_ru: "когда", examples: ["Did you get the message yesterday?", "Did she get the notification on time?"], contrast: {frame: "Have you gotten the message?", note_ru: "Have you gotten = ты получил (и это важно)?; Did you get = ты получил в конкретный момент?"}, trap: {learner_form: "Did you got the email?", correction: "Did you get the email?", cause_ru: "после did используется базовая форма get, не got"}, transformations: [authored]}
  - {id: chunk.past-simple-negatives-questions.i-didnt-break-anything, type: chunk, title: "I didn't break anything ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я ничего не сломал(а) ...", frame_of: grammar.past-simple.negatives-questions, carries: [tense:past-simple, structure:negative], slot_hint_ru: "когда", examples: ["I didn't break anything during the update.", "She didn't break anything in the migration."], contrast: {frame: "I haven't broken anything", note_ru: "haven't broken = до сих пор ничего не сломал; didn't break = не сломал в конкретный момент"}, trap: {learner_form: "I didn't broken anything.", correction: "I didn't break anything.", cause_ru: "после didn't используется базовая форма break, не broken"}, transformations: [authored]}
