# Frames for grammar.do-questions (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.do-questions.do-you-work, type: chunk, title: "Do you work ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы работаете …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "где или как", examples: ["Do you work in this office?", "Do you work from home?"], contrast: {frame: "You work ___.", note_ru: "вопрос: Do … verb, утверждение: you … verb"}, trap: {learner_form: "Do you works here?", correction: "Do you work here?", cause_ru: "do + инфинитив, без -s на глаголе"}, transformations: [authored]}
  - {id: chunk.do-questions.does-he-work, type: chunk, title: "Does he work ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он работает …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "где, как часто, с кем", examples: ["Does he work with you on projects?", "Does she work on weekends?"], contrast: {frame: "He works ___.", note_ru: "вопрос: Does … verb, утверждение: he works …"}, trap: {learner_form: "Does he works there?", correction: "Does he work there?", cause_ru: "does уже содержит -s, основной глагол = базовая форма"}, transformations: [authored]}
  - {id: chunk.do-questions.do-they-handle, type: chunk, title: "Do they handle ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "они занимаются …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "что (развертывания, тесты, поддержка)", examples: ["Do they handle all deployments?", "Do they manage the database?"], contrast: {frame: "They handle ___.", note_ru: "вопрос инвертирует порядок: Do + subject"}, trap: {learner_form: "Do they handles the updates?", correction: "Do they handle the updates?", cause_ru: "они = множественное число, do без -s"}, transformations: [authored]}
  - {id: chunk.do-questions.what-do-you-do, type: chunk, title: "What do you do?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "чем вы занимаетесь?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], examples: ["So, at this company, what do you do?", "Just curious, what do you do these days?"], contrast: {frame: "What did you do?", note_ru: "what do — вопрос в Present Simple о настоящем; what did — вопрос в Past Simple о прошлом"}, trap: {learner_form: "What do you does?", correction: "What do you do?", cause_ru: "do уже в вопросе, основной глагол = инфинитив"}, transformations: [authored]}
  - {id: chunk.do-questions.where-do-you, type: chunk, title: "Where do you ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "где вы …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "глагол (работаете, встречаетесь, тестируете)", examples: ["Where do you work on this project?", "Where do you test the code?"], transformations: [authored]}
  - {id: chunk.do-questions.where-does-she, type: chunk, title: "Where does she ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "где она …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "глагол (работает, встречается)", examples: ["Where does she sit on the floor?", "Where does he work today?"], transformations: [authored]}
  - {id: chunk.do-questions.how-often-do-you, type: chunk, title: "How often do you ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "как часто вы …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "глагол (встречаетесь, проверяете, развертываете)", examples: ["How often do you run tests?", "How often do you check for bugs?"], transformations: [authored]}
  - {id: chunk.do-questions.how-long-do-you, type: chunk, title: "How long do you ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "как долго вы …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "глагол (работаете, встречаетесь)", examples: ["How long do you work on this task?", "How long do you spend on reviews?"], transformations: [authored]}
  - {id: chunk.do-questions.when-do-you-start, type: chunk, title: "When do you start?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "когда вы начинаете?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], examples: ["In the mornings, when do you start?", "When do you usually start your shift?"], transformations: [authored]}
  - {id: chunk.do-questions.when-does-the-team, type: chunk, title: "When does the team ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "когда команда …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "глагол (встречается, встречается)", examples: ["When does the team meet?", "When does the stand-up start?"], transformations: [authored]}
  - {id: chunk.do-questions.who-do-you-report, type: chunk, title: "Who do you report to?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "кому вы подчиняетесь?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], examples: ["Who do you report to?", "Who does she work with?"], transformations: [authored]}
  - {id: chunk.do-questions.what-do-you-need, type: chunk, title: "What do you need?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "что вам нужно?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], examples: ["Before we start the sprint, what do you need?", "What do you need to complete this task?"], transformations: [authored]}
  - {id: chunk.do-questions.what-does-he-need, type: chunk, title: "What does he need?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "что ему нужно?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], examples: ["Before the meeting starts, what does he need?", "What does the team need?"], transformations: [authored]}
  - {id: chunk.do-questions.do-you-have, type: chunk, title: "Do you have ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "у вас есть …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "объект или информация", examples: ["Do you have the latest code?", "Do you have time to review?"], contrast: {frame: "Do you have ___ or does he?", note_ru: "have + do/does в вопросе даже в Present Simple"}, transformations: [authored]}
  - {id: chunk.do-questions.do-you-know, type: chunk, title: "Do you know ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы знаете …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "кто, что, как", examples: ["Do you know where the file is?", "Do you know how to run this?"], transformations: [authored]}
  - {id: chunk.do-questions.does-anyone-know, type: chunk, title: "Does anyone know ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "кто-нибудь знает …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "информация", examples: ["Does anyone know where the server is?", "Does anyone know when the release is?"], transformations: [authored]}
  - {id: chunk.do-questions.do-we-need, type: chunk, title: "Do we need ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "нам нужны …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "объект или действие", examples: ["Do we need approval from the client?", "Do we need to run tests again?"], transformations: [authored]}
  - {id: chunk.do-questions.why-do-you-think, type: chunk, title: "Why do you think ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "почему вы думаете, что …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "предложение", examples: ["Why do you think this will work?", "Why do you think we should wait?"], transformations: [authored]}
  - {id: chunk.do-questions.how-do-you-prefer, type: chunk, title: "How do you prefer to ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "как вы предпочитаете …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "инфинитив", examples: ["How do you prefer to communicate?", "How do you prefer to receive updates?"], transformations: [authored]}
  - {id: chunk.do-questions.do-you-agree, type: chunk, title: "Do you agree ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "вы согласны …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "на что (с решением, с планом)", examples: ["Do you agree with this approach?", "Do you agree on the timeline?"], transformations: [authored]}
  - {id: chunk.do-questions.do-you-mind, type: chunk, title: "Do you mind ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "вы не против …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "действие (герундий)", examples: ["Do you mind checking this code?", "Do you mind if I send this to the client?"], transformations: [authored]}
  - {id: chunk.do-questions.does-it-work, type: chunk, title: "Does it work ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "это работает …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "как (правильно, в браузере)", examples: ["Does it work in production?", "Does it work in the browser?"], transformations: [authored]}
  - {id: chunk.do-questions.why-does-it-fail, type: chunk, title: "Why does it fail ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "почему это ломается …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "где или как часто", examples: ["Why does it fail in staging?", "Why does it fail every time?"], transformations: [authored]}
  - {id: chunk.do-questions.how-do-we-fix, type: chunk, title: "How do we fix ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "как мы исправляем …?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], slot_hint_ru: "проблема", examples: ["How do we fix this bug?", "How do we prevent this error?"], transformations: [authored]}
  - {id: chunk.do-questions.did-you-forget, type: chunk, title: "Did you forget to ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы не забыли …?", frame_of: grammar.do-questions, carries: [structure:question-do, tense:past-simple], slot_hint_ru: "инфинитив", examples: ["Did you forget to commit?", "Did you forget to update the ticket?"], transformations: [authored]}
  - {id: chunk.do-questions.does-this-need, type: chunk, title: "Does this need ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "это требует …?", frame_of: grammar.do-questions, carries: [structure:question-do], slot_hint_ru: "действие (утверждения, проверки)", examples: ["Does this need approval from the lead?", "Does this need testing in staging?"], transformations: [authored]}
  - {id: chunk.do-questions.when-do-we-deploy, type: chunk, title: "When do we deploy?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "когда мы развертываем?", frame_of: grammar.do-questions, carries: [structure:question-do, structure:question-wh], examples: ["Given the current schedule, when do we deploy?", "When do we usually deploy new features?"], transformations: [authored]}
