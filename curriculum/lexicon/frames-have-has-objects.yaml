  - {id: chunk.have-has-objects.they-have, type: chunk, title: "They have ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work], meaning_ru: "у них есть … / они имеют …", frame_of: grammar.have-has.objects, carries: [structure:possessive], slot_hint_ru: "объект или ресурс", examples: ["They have experience with cloud deployment.", "They have a better solution for this problem."], transformations: [authored]}
