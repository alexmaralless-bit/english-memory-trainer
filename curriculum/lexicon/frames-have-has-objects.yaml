# Frames for grammar.have-has.objects (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.have-has-objects.i-have, type: chunk, title: "I have ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work], meaning_ru: "у меня есть …", frame_of: grammar.have-has.objects, carries: [structure:possessive], slot_hint_ru: "объект (ед. или множ. число)", examples: ["I have two backup files on my drive.", "I have a list of all open tickets."], contrast: {frame: "I don't have", note_ru: "отрицание — don't have"}, trap: {learner_form: "At me is a file.", correction: "I have a file.", cause_ru: "калькирование русского 'у меня есть'"}, transformations: [authored]}
  - {id: chunk.have-has-objects.he-has, type: chunk, title: "He has ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work], meaning_ru: "у него есть … / он имеет …", frame_of: grammar.have-has.objects, carries: [structure:possessive], slot_hint_ru: "объект", examples: ["He has access to the production database.", "He has several years of experience."], contrast: {frame: "He doesn't have", note_ru: "отрицание — doesn't have"}, trap: {learner_form: "He have a key.", correction: "He has a key.", cause_ru: "неправильное окончание для третьего лица"}, transformations: [authored]}
  - {id: chunk.have-has-objects.she-has, type: chunk, title: "She has ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work], meaning_ru: "у неё есть … / она имеет …", frame_of: grammar.have-has.objects, carries: [structure:possessive], slot_hint_ru: "объект", examples: ["She has the report we need for tomorrow.", "She has permission to deploy to production."], transformations: [authored]}
  - {id: chunk.have-has-objects.it-has, type: chunk, title: "It has ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "это имеет / в этом есть …", frame_of: grammar.have-has.objects, carries: [structure:possessive], slot_hint_ru: "характеристика или часть объекта", examples: ["It has three required fields in the form.", "It has advanced filtering options for search."], transformations: [authored]}
