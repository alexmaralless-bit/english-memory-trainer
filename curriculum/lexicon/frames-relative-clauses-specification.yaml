# Frames for grammar.relative-clauses.specification (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.relative-clauses-specification.noun-discussed, type: chunk, title: "the ___ that we discussed", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "то ..., что мы обсуждали", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (requirement, issue, approach)", examples: ["I have reviewed the requirements that we discussed yesterday.", "The solution that we discussed is now implemented."], contrast: {frame: "the requirement which we discussed", note_ru: "that и which оба работают для неодушевленного; that более распространено в work English"}, trap: {learner_form: "the requirements that we discussed it", correction: "the requirements that we discussed", cause_ru: "не повторяем существительное местоимением внутри relative clause"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.user-who, type: chunk, title: "the user who ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "пользователь, который ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (reported, submitted, complained)", examples: ["The user who reported the bug has confirmed the fix works.", "The admin who manages access requested the audit."], contrast: {frame: "the person which reported the bug", note_ru: "who используется для людей; which для систем и объектов"}, trap: {learner_form: "the user which reported the bug", correction: "the user who reported the bug", cause_ru: "который переводит на which в русском, но в английском for people используется who"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.file-contains, type: chunk, title: "the file which contains ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "файл, который содержит ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (data, logs, backup)", examples: ["The file which contains the user data is encrypted.", "I found the file which stores the configuration."], contrast: {frame: "the file that contains the user data", note_ru: "which и that оба работают для неодушевленного; которые взаимозаменяемы"}, trap: {learner_form: "the file which it contains the data", correction: "the file which contains the data", cause_ru: "не повторяем существительное местоимением it"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.reason-why, type: chunk, title: "the reason why ___ failed", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "причина, по которой ... не удалось", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the migration, the test, the update)", examples: ["The reason why the migration failed was a network timeout.", "Do you know the reason why the server stopped?"], contrast: {frame: "the reason that the migration failed", note_ru: "why более идиоматично с reason; что is also possible but why is preferred"}, trap: {learner_form: "the reason why it failed is", correction: "the reason why the migration failed", cause_ru: "why уже содержит значение because; не добавляем it"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.person-whose, type: chunk, title: "the person whose ___ ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "человек, чей ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause, structure:possessive], slot_hint_ru: "существительное (account, access, approval) + глагол", examples: ["The person whose account was compromised needs immediate notification.", "I contacted the manager whose team owns the database."], contrast: {frame: "the person that their account was compromised", note_ru: "possessive whose в английском; Russian calque часто использует that + their"}, trap: {learner_form: "the person whose account it was compromised", correction: "the person whose account was compromised", cause_ru: "не повторяем after whose; whose уже указывает на принадлежность"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.which-means, type: chunk, title: "___, which means that ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "..., что означает, что ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "ситуация или факт + следствие", examples: ["We missed the deadline, which means that the client will need to reschedule.", "The token expired, which means that we need to refresh it."], contrast: {frame: "___, that means that ___", note_ru: "which в non-restrictive clause; that не используется"}, trap: {learner_form: "___, what means that ___", correction: "___, which means that ___", cause_ru: "which для non-restrictive; что translates but what is not the structure here"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.team-built, type: chunk, title: "the team that built ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "команда, которая построила ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the platform, the system, the feature)", examples: ["The team that built the authentication system knows the edge cases.", "I joined the team that built the data pipeline."], contrast: {frame: "the team which built", note_ru: "that и which оба работают; that более распространено в informal work English"}, trap: {learner_form: "the team that it built the system", correction: "the team that built the system", cause_ru: "не повторяем существительное местоимением после relative pronoun"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.approach-suggested, type: chunk, title: "the approach that ___ suggested", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "подход, который предложил ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the consultant, she, the vendor)", examples: ["The approach that the vendor suggested requires fewer changes.", "The solution that Sarah recommended is simpler than expected."], contrast: {frame: "the approach which suggested", note_ru: "that и which оба работают"}, trap: {learner_form: "the approach that the vendor it suggested", correction: "the approach that the vendor suggested", cause_ru: "не повторяем после who/that"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.system-processes, type: chunk, title: "the system that ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "система, которая ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (stores, processes, monitors)", examples: ["The system that processes all orders is down for maintenance.", "The database that stores the customer records was corrupted."], contrast: {frame: "the system which stores customer records", note_ru: "that и which оба подходят; that более краткий"}, trap: {learner_form: "the system that it stores customer records", correction: "the system that stores customer records", cause_ru: "относительное местоимение заменяет подлежащее; не добавляем it"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.change-requested, type: chunk, title: "the change that ___ requested", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "изменение, которое ... запросил", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the client, the reviewer, management)", examples: ["The change that the client requested increases the page load time.", "We implemented the change that the team requested last week."], contrast: {frame: "the change which the client requested", note_ru: "оба варианта верны; that чаще встречается в деловой переписке"}, trap: {learner_form: "the change that the client it requested", correction: "the change that the client requested", cause_ru: "не повторяем after relative clause"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.requirement-mentioned, type: chunk, title: "the requirement that ___ mentioned", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "требование, которое ... упомянул", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the client, they, he)", examples: ["The requirement that the client mentioned will delay the release.", "We cannot ignore the requirement that the security team emphasized."], contrast: {frame: "the requirement which the client mentioned", note_ru: "оба варианта верны; that проще"}, trap: {learner_form: "the requirement that the client he mentioned", correction: "the requirement that the client mentioned", cause_ru: "не добавляем второе подлежащее"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.issue-affects, type: chunk, title: "the issue that ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "проблема, которая ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (affects, delays, occurs)", examples: ["The issue that affects the older browser versions is documented.", "We still see the issue that occurred during the first migration."], contrast: {frame: "the issue which affects older versions", note_ru: "оба варианта работают одинаково хорошо"}, trap: {learner_form: "the issue that it affects older browsers", correction: "the issue that affects older browsers", cause_ru: "относительное местоимение that заменяет подлежащее; не добавляем it"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.solution-found, type: chunk, title: "the solution that ___ found", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "решение, которое ... нашёл", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (we, the team, the developer)", examples: ["The solution that the team found is simple but effective.", "I was impressed by the solution that she discovered."], contrast: {frame: "the solution which the team found", note_ru: "оба варианта одинаково верны"}, trap: {learner_form: "the solution that the team it found", correction: "the solution that the team found", cause_ru: "не повторяем существительное после that"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.document-outlines, type: chunk, title: "the document that ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "документ, который ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (outlines, explains, describes)", examples: ["The document that outlines the process is shared in the project folder.", "I attached the document that describes the implementation plan."], contrast: {frame: "the document which outlines", note_ru: "оба варианта одинаково верны"}, trap: {learner_form: "the document that it outlines the process", correction: "the document that outlines the process", cause_ru: "не добавляем местоимение it после that"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.vendor-who, type: chunk, title: "the vendor who ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "поставщик, который ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (manages, provides, handles)", examples: ["The vendor who manages the cloud infrastructure is highly responsive.", "We chose the vendor who provides the best support."], contrast: {frame: "the vendor that manages", note_ru: "who предпочтительнее для людей; that тоже допустимо, но звучит менее естественно"}, trap: {learner_form: "the vendor who they manage the infrastructure", correction: "the vendor who manages the infrastructure", cause_ru: "не добавляем отдельное подлежащее they после who"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.person-owns, type: chunk, title: "the person who owns ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "человек, который владеет ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the account, the ticket, the project)", examples: ["The person who owns this account must reset the password.", "I contacted the person who is responsible for the database."], contrast: {frame: "the person that owns this account", note_ru: "who естественнее для людей; that менее предпочтительно, но тоже допустимо"}, trap: {learner_form: "the person who they own the account", correction: "the person who owns the account", cause_ru: "не добавляем they; who уже выполняет роль подлежащего"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.developer-wrote, type: chunk, title: "the developer who wrote ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "разработчик, который написал ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the code, the library, the module)", examples: ["The developer who wrote the authentication module is very thorough.", "I want to meet the developer who implemented this feature."], contrast: {frame: "the developer that wrote the code", note_ru: "who предпочтительнее для людей, но that тоже допустимо"}, trap: {learner_form: "the developer who he wrote the code", correction: "the developer who wrote the code", cause_ru: "не добавляем he после who"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.rule-applies, type: chunk, title: "the rule that ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "правило, которое ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (applies, requires, prohibits)", examples: ["The rule that prohibits direct access is important for security.", "There is a rule that requires approval before deployment."], contrast: {frame: "the rule which applies", note_ru: "оба варианта верны; that проще и встречается чаще"}, trap: {learner_form: "the rule that it requires approval", correction: "the rule that requires approval", cause_ru: "не добавляем it после that"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.test-validates, type: chunk, title: "the test that ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "тест, который ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (checks, validates, detects)", examples: ["The test that validates the input is not running correctly.", "We fixed the test that detected the memory leak."], contrast: {frame: "the test which validates", note_ru: "оба варианта одинаково хороши"}, trap: {learner_form: "the test that it validates the input", correction: "the test that validates the input", cause_ru: "не добавляем it"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.service-handles, type: chunk, title: "the service that handles ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "сервис, который обрабатывает ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (payments, notifications, auth)", examples: ["The service that handles email notifications is down.", "We use the service that processes payment information."], contrast: {frame: "the service which handles payments", note_ru: "оба варианта работают одинаково хорошо"}, trap: {learner_form: "the service that it handles emails", correction: "the service that handles emails", cause_ru: "не добавляем it после that"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.standard-follows, type: chunk, title: "the standard that ___ follows", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "стандарт, который следует ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the team, we, our company)", examples: ["The standard that the team follows is documented in the guidelines.", "This is the standard that our company follows for all new hires."], contrast: {frame: "the standard which we follow", note_ru: "оба варианта верны"}, trap: {learner_form: "the standard that we it follow", correction: "the standard that we follow", cause_ru: "не добавляем it"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.feature-allows, type: chunk, title: "the feature that ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "функция, которая ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "глагол (allows, enables, adds)", examples: ["The feature that allows bulk uploads is very popular.", "I implemented the feature that enables custom theming."], contrast: {frame: "the feature which allows", note_ru: "оба варианта верны; that проще"}, trap: {learner_form: "the feature that it allows bulk uploads", correction: "the feature that allows bulk uploads", cause_ru: "не добавляем it"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.manager-oversees, type: chunk, title: "the manager who oversees ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "менеджер, который руководит ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "существительное (the project, the team, the budget)", examples: ["The manager who oversees the development team is very organized.", "We report to the manager who manages three departments."], contrast: {frame: "the manager that oversees", note_ru: "who естественнее для людей, но that тоже допустимо"}, trap: {learner_form: "the manager who he oversees the team", correction: "the manager who oversees the team", cause_ru: "не добавляем he после who"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.model-use, type: chunk, title: "the model which we use ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, data], meaning_ru: "модель, которую мы используем ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "обстоятельство (for production, for testing)", examples: ["The model which we use for predictions is accurate.", "The machine learning model which the team trained is deployed in production."], contrast: {frame: "the model that we use for predictions", note_ru: "which и that оба работают; which с запятой означает non-restrictive"}, trap: {learner_form: "the model which we use it for predictions", correction: "the model which we use for predictions", cause_ru: "не добавляем it после which"}, transformations: [authored]}
  - {id: chunk.relative-clauses-specification.event-occurred, type: chunk, title: "the event that occurred ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "событие, которое произошло ...", frame_of: grammar.relative-clauses.specification, carries: [structure:relative-clause], slot_hint_ru: "обстоятельство (yesterday, last week, during the meeting)", examples: ["The event that occurred last week disrupted the entire team.", "We discussed the event that happened during the deployment."], contrast: {frame: "the event which occurred", note_ru: "оба варианта верны; that чаще встречается в разговорной речи"}, trap: {learner_form: "the event that it occurred yesterday", correction: "the event that occurred yesterday", cause_ru: "не добавляем it после that"}, transformations: [authored]}
