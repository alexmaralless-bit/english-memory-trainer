# Frames for grammar.when-while.sequence (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.when-while-sequence.when-happened-we, type: chunk, title: "When the ___ happened, we ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Когда произошло …, мы …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-simple], slot_hint_ru: "быстрое событие + быстрое действие", examples: ["When the outage happened, we called support right away.", "When the power went out, we switched to backup."], contrast: {frame: "While the ___ happened, we ___", note_ru: "while нужен для фона (было в процессе), not для быстрых событий"}, trap: {learner_form: "While the server crashed, we called support.", correction: "When the server crashed, we called support.", cause_ru: "Два быстрых события требуют when, не while"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.while-we-were-ing, type: chunk, title: "While we were ___-ing, the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Пока мы были в процессе …, … произошло", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-continuous], slot_hint_ru: "действие-фон + событие", examples: ["While we were testing the flow, the network dropped.", "While we were on the call, the screen froze."], contrast: {frame: "When we were ___-ing, the ___", note_ru: "When может быть для фона + событие, но while яснее показывает одновременность"}, trap: {learner_form: "While we tested the flow, the network dropped.", correction: "While we were testing the flow, the network dropped.", cause_ru: "While требует Past Continuous для действия-фона, не Past Simple"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.it-happened-while-were, type: chunk, title: "It happened while we were ___-ing", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Это произошло, пока мы были в процессе …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-continuous], slot_hint_ru: "быстрое событие + фон", examples: ["It happened while we were reviewing the logs.", "It happened while we were having the meeting."], contrast: {frame: "It happened when we ___", note_ru: "When также может работать для event + background, но while яснее для одновременности"}, trap: {learner_form: "It happened while we reviewing the logs.", correction: "It happened while we were reviewing the logs.", cause_ru: "После we need were, не опускать вспомогательный глагол"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.when-alert-came-we, type: chunk, title: "When the alert came, we ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Когда пришло оповещение, мы …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-simple], slot_hint_ru: "быстрое событие + реакция", examples: ["When the alert came, we immediately checked the system.", "When the call dropped, we reconnected right away."], contrast: {frame: "While the alert was coming, we ___", note_ru: "Alert приходит мгновенно, не процесс → when, not while"}, trap: {learner_form: "While the alert came, we checked the system.", correction: "When the alert came, we checked the system.", cause_ru: "Быстрое событие требует when, не while"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.the-error-began-while, type: chunk, title: "The error began while we were ___-ing", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Ошибка началась, пока мы были в процессе …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-continuous], slot_hint_ru: "быстрый старт события + фон", examples: ["The error began while we were running tests.", "The outage began while we were on the conference call."], contrast: {frame: "The error began when we ___", note_ru: "When работает с началом события, но while лучше для одновременного фона"}, trap: {learner_form: "The error began while we running tests.", correction: "The error began while we were running tests.", cause_ru: "После while we нужен were, не опускать be"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.we-discovered-when, type: chunk, title: "We discovered the issue when we ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы обнаружили проблему, когда мы …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-simple], slot_hint_ru: "открытие + быстрое действие", examples: ["We discovered the issue when we tested the update.", "We discovered the problem when we reviewed the logs."], contrast: {frame: "We were discovering when we ___", note_ru: "Если оба события быстрые → оба Past Simple, не Past Continuous"}, trap: {learner_form: "We discovered the issue when we were test the update.", correction: "We discovered the issue when we tested the update.", cause_ru: "Два быстрых события → оба Past Simple, не один Continuous"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.while-running-deployment, type: chunk, title: "While running the deployment, we ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Во время запуска развёртывания мы …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-continuous], slot_hint_ru: "процесс + одновременное действие", examples: ["While running the deployment, we monitored the servers.", "While running the backup, we kept the team informed."], contrast: {frame: "We ran the deployment when we ___", note_ru: "Этот порядок не передаёт одновременность так же ясно"}, trap: {learner_form: "While run the deployment, we monitored the servers.", correction: "While running the deployment, we monitored the servers.", cause_ru: "После while нужна -ing форма, не базовый глагол"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.when-i-checked, type: chunk, title: "When I checked, the ___ was ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Когда я проверил, … было …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-simple], slot_hint_ru: "мой быстрый check + findings в Past Simple или Continuous", examples: ["When I checked, the server was down.", "When I reviewed the logs, the error was clear."], contrast: {frame: "While I was checking, the ___ was ___", note_ru: "Если мой check был в процессе → Past Continuous для меня, state для сервера"}, trap: {learner_form: "When I was check, the server was down.", correction: "When I checked, the server was down.", cause_ru: "Прошлый быстрый check → Past Simple, не Continuous; нет -ing после Past Simple"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.during-the-incident, type: chunk, title: "During the incident, we were ___-ing", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Во время инцидента мы были в процессе …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-continuous], slot_hint_ru: "временной маркер + фоновое действие", examples: ["During the incident, we were collecting data for analysis.", "During the outage, we were keeping users informed."], contrast: {frame: "The incident, we were ___-ing", note_ru: "During требуется для выражения времени, не просто существительное"}, trap: {learner_form: "During the incident, we was collecting data.", correction: "During the incident, we were collecting data.", cause_ru: "We требует were, не was, даже после During"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.by-the-time-we, type: chunk, title: "By the time we checked, the ___ had ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "К тому времени, как мы проверили, … уже …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-perfect], slot_hint_ru: "последовательность: first action → second action → third", examples: ["By the time we checked, the backup had started.", "By the time we responded, the error had spread."], contrast: {frame: "When we checked, the ___ ___", note_ru: "By the time требует Past Perfect для первого действия, чтобы показать предшествование"}, trap: {learner_form: "By the time we checked, the backup started.", correction: "By the time we checked, the backup had started.", cause_ru: "Действие, которое произошло до основного → Past Perfect с had"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.what-happened-when, type: chunk, title: "What happened when the system ___?", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Что произошло, когда система …?", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, structure:question-wh], slot_hint_ru: "WH-вопрос о последовательности", examples: ["What happened when the system crashed?", "What happened when the network went down?"], contrast: {frame: "What were you doing when the system ___", note_ru: "Если спрашиваешь о фоне → What were you doing, если о результате → What happened"}, trap: {learner_form: "What happened when the system was crashed?", correction: "What happened when the system crashed?", cause_ru: "Crash — это действие, не состояние; не нужен was для действия в Past Simple"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.right-when-the, type: chunk, title: "Right when the ___ occurred, we ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Прямо в момент, когда произошло …, мы …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-simple], slot_hint_ru: "точный момент + реакция", examples: ["Right when the outage occurred, we jumped into action.", "Right when the error appeared, we started debugging."], contrast: {frame: "Just as the ___ occurred", note_ru: "Just as работает так же для точного момента"}, trap: {learner_form: "Right when the alert was fired, we jumped into action.", correction: "Right when the alert fired, we jumped into action.", cause_ru: "Быстрое событие (alert fired) → Past Simple, не was fired (active voice в narratives)"}, transformations: [authored]}
  - {id: chunk.when-while-sequence.the-next-thing, type: chunk, title: "The next thing that happened was when ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Следующее, что произошло — это когда …", frame_of: grammar.when-while.sequence, carries: [structure:connector, structure:sequencing, tense:past-simple], slot_hint_ru: "последовательность событий", examples: ["The next thing that happened was when we lost connection.", "The next thing that happened was when the backup failed."], contrast: {frame: "Then ___", note_ru: "Then более просто, но this frame лучше подчёркивает последовательность в нарративе"}, trap: {learner_form: "The next thing that happened was when we were lose connection.", correction: "The next thing that happened was when we lost connection.", cause_ru: "После when в Past Simple не нужен be для действия; simply was when we lost → потеря была Past Simple"}, transformations: [authored]}
