# Frames for grammar.participle-clauses.compression (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.participle-clauses-compression.having-verified, type: chunk, title: "Having verified the ___, the engineer ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "проверив …, инженер …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "что проверили + что произошло потом", examples: ["Having verified the backup, the engineer started the migration.", "Having verified the configuration, she felt confident about the deployment."], contrast: {frame: "After the engineer verified the ___, he ___", note_ru: "более длинно и менее компактно"}, trap: {learner_form: "Having verify the backup, the engineer started.", correction: "Having verified the backup, the engineer started.", cause_ru: "после having используется прошедшее причастие (verified)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.running-on-smaller, type: chunk, title: "Running on a smaller instance, the service ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "если запустить на меньшем экземпляре, сервис …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "условие + результат", examples: ["Running on a smaller instance, the service reaches its memory limit sooner.", "Running without caching, the query takes twice as long."], contrast: {frame: "When the service runs on a smaller instance, it ___", note_ru: "более явное, менее компактное выражение условия"}, trap: {learner_form: "Running on smaller instance, the service reaches the limit.", correction: "Running on a smaller instance, the service reaches the limit.", cause_ru: "нужен артикль перед smaller (a smaller)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.once-deployed, type: chunk, title: "Once deployed, the ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "когда развёрнут …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "что произойдёт после развёртывания", examples: ["Once deployed, the service becomes immediately available to users.", "Once tested, the code is merged into the main branch."], contrast: {frame: "After the service is deployed, it ___", note_ru: "полная форма пассива, менее компактно"}, trap: {learner_form: "Once deploy, the service is available.", correction: "Once deployed, the service is available.", cause_ru: "используется прошедшее причастие пассива (deployed, не deploy)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.the-report-released, type: chunk, title: "The report, released last week, ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "отчёт, опубликованный на прошлой неделе, …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "предмет + его характеристика + что о нём говорится", examples: ["The report, released last week, confirmed our suspicions about the bottleneck.", "The update, pushed yesterday, introduced a regression in the payment flow."], contrast: {frame: "The report that was released last week ___", note_ru: "полное относительное придаточное предложение"}, trap: {learner_form: "The report, release last week, confirmed our findings.", correction: "The report, released last week, confirmed our findings.", cause_ru: "используется прошедшее причастие пассива (released, не release)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.having-identified-the-issue, type: chunk, title: "Having identified the issue, we ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "определив проблему, мы …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "то, что определили + следующее действие", examples: ["Having identified the issue, we immediately notified the stakeholders.", "Having pinpointed the root cause, the team created a fix."], contrast: {frame: "After we identified the issue, we ___", note_ru: "более явное и менее компактное"}, trap: {learner_form: "Having identify the issue, we notified everyone.", correction: "Having identified the issue, we notified everyone.", cause_ru: "после having используется прошедшее причастие (identified)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.excluding-empty-records, type: chunk, title: "Excluding empty records, the dataset ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "исключив пустые записи, набор данных …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "условие + результат", examples: ["Excluding empty records, the dataset contains 850 valid entries.", "Excluding failed transactions, the conversion rate improves significantly."], contrast: {frame: "If we exclude empty records, the dataset ___", note_ru: "условное предложение, более явное"}, trap: {learner_form: "Excluding empty record, the dataset size is different.", correction: "Excluding empty records, the dataset size is different.", cause_ru: "нужно множественное число (records, не record)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.considering-the-budget, type: chunk, title: "Considering the budget, the option we chose ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "учитывая бюджет, вариант, который мы выбрали, …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "условие + решение", examples: ["Considering the budget, the option we chose offers the best value.", "Considering the budget, the option we chose keeps costs predictable."], contrast: {frame: "Since we considered the budget, the option ___", note_ru: "полное придаточное предложение причины"}, trap: {learner_form: "Considering the budget, the best option we choose makes sense.", correction: "Considering the budget, the best option we chose makes sense.", cause_ru: "нужен past simple (chose, не choose)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.after-fixing-the-cache, type: chunk, title: "After fixing the cache issue, performance ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "после исправления проблемы с кешем, производительность …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "завершённое действие + результат", examples: ["After fixing the cache issue, performance improved by 40%.", "After removing the redundant queries, the endpoint response time dropped."], contrast: {frame: "When we fixed the cache issue, performance ___", note_ru: "подчинённое предложение времени"}, trap: {learner_form: "After fixing the cache issue, the endpoint becomes faster.", correction: "After fixing the cache issue, the endpoint is faster.", cause_ru: "используется настоящее время вместо past tense"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.having-run-the-load-test, type: chunk, title: "Having run the load test, the team ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "проведя тестирование нагрузки, команда …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "завершённое действие + следствие", examples: ["Having run the load test, the team knew exactly where the bottleneck was.", "Having completed the audit, we found three critical security gaps."], contrast: {frame: "After running the load test, the team ___", note_ru: "менее формально, менее компактно"}, trap: {learner_form: "Having run the load test, we know the limit.", correction: "Having run the load test, we knew the limit.", cause_ru: "используется present tense (know) вместо past (knew)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.the-function-added, type: chunk, title: "The function, added in the latest build, ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "функция, добавленная в последнюю сборку, …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "что-то + его описание + утверждение о нём", examples: ["The function, added in the latest build, simplifies data validation considerably.", "The feature, introduced yesterday, is still under review by the architecture team."], contrast: {frame: "The function that was added in the latest build ___", note_ru: "полное относительное придаточное предложение"}, trap: {learner_form: "The function, add in the latest build, is stable.", correction: "The function, added in the latest build, is stable.", cause_ru: "используется прошедшее причастие пассива (added, не add)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.given-the-constraints, type: chunk, title: "Given the constraints, the solution ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "учитывая ограничения, решение …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "условие + его последствие", examples: ["Given the constraints, the solution we implemented is the most cost-effective.", "Given the time pressure, the team delivered a solid prototype."], contrast: {frame: "Since we have the constraints, the solution ___", note_ru: "менее естественно звучит"}, trap: {learner_form: "Given the constraints, best solution is choosing this option.", correction: "Given the constraints, the best solution is this option.", cause_ru: "нужен артикль (the) перед best solution"}, transformations: [authored]}
  - {id: chunk.participle-clauses-compression.the-file-saved, type: chunk, title: "The file, saved automatically, ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "файл, сохранённый автоматически, …", frame_of: grammar.participle-clauses.compression, carries: [structure:participle-clause], slot_hint_ru: "файл + условие сохранения + его характеристика", examples: ["The file, saved automatically, contains a full snapshot of the system state.", "The backup, created nightly, ensures we never lose more than 24 hours of data."], contrast: {frame: "The file that was saved automatically ___", note_ru: "полное относительное придаточное предложение"}, trap: {learner_form: "The file, save automatically, keeps the data safe.", correction: "The file, saved automatically, keeps the data safe.", cause_ru: "используется прошедшее причастие пассива (saved, не save)"}, transformations: [authored]}
