# Frames for grammar.connectors.cause-contrast (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.connectors-cause-contrast.because, type: chunk, title: "because ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "потому что (с полным предложением)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "независимое предложение", examples: ["The page crashed because the server ran out of memory.", "I arrived late because the traffic was heavy this morning."], contrast: {frame: "because of ___", note_ru: "because + предложение; because of + существительное или существительное с артиклем"}, trap: {learner_form: "The page crashed because of the server ran out of memory.", correction: "The page crashed because the server ran out of memory.", cause_ru: "because of требует существительного или герундия, не полного предложения"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.because-of-the, type: chunk, title: "because of the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "из-за (с существительным)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "существительное или фраза", examples: ["The project is delayed because of the missing data.", "We couldn't access the system because of the security update."], contrast: {frame: "because ___", note_ru: "because of + существительное; because + полное предложение"}, trap: {learner_form: "because of the server ran out", correction: "because the server ran out / because of the memory issue", cause_ru: "because of требует существительного или герундия"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.so, type: chunk, title: "so ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "поэтому (в результате)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "подлежащее и глагол для результата", examples: ["The test failed, so we investigated the root cause.", "Traffic increased yesterday, so the server became slow."], contrast: {frame: "because ___", note_ru: "so показывает результат; because показывает причину"}, trap: {learner_form: "The test failed, so because we investigated.", correction: "The test failed, so we investigated.", cause_ru: "нельзя использовать so и because вместе в одном предложении"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.thats-why, type: chunk, title: "that's why ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "вот почему", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "независимое предложение", examples: ["The file was corrupted during upload, that's why the import failed.", "The new team is still learning the system, that's why progress is slow."], contrast: {frame: "because of that ___", note_ru: "that's why более разговорное и прямое"}, trap: {learner_form: "that's why because", correction: "that's why", cause_ru: "that's why уже содержит причину; не нужно добавлять because"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.although, type: chunk, title: "although ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "хотя (с предложением)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "зависимое предложение", examples: ["Although the tests passed, we found issues in production.", "Although the deadline is tomorrow, the team is taking a break."], contrast: {frame: "but ___", note_ru: "although в начале зависимого предложения; but соединяет два независимых"}, trap: {learner_form: "Although the tests passed, but we found issues.", correction: "Although the tests passed, we found issues.", cause_ru: "нельзя использовать although и but вместе"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.however, type: chunk, title: "however, ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "однако (с запятой, в начале предложения)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "независимое предложение", examples: ["The release was scheduled for Friday. However, we found critical bugs.", "The client approved the design. However, they requested significant changes."], contrast: {frame: "but ___", note_ru: "however требует запятой; соединяет два независимых предложения; but проще"}, trap: {learner_form: "The tests passed, however we found issues.", correction: "The tests passed. However, we found issues.", cause_ru: "however требует точки или точки с запятой перед ним, не запятую"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.despite-the, type: chunk, title: "despite the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "несмотря на", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "существительное или фраза с артиклем", examples: ["Despite the budget cuts, we managed to hire two new engineers.", "Despite the bad weather, the conference attracted a large audience."], contrast: {frame: "although ___", note_ru: "despite the + существительное; although + полное предложение"}, trap: {learner_form: "despite of the budget cuts", correction: "despite the budget cuts", cause_ru: "despite не требует предлога of; конструкция 'despite of' — ошибка"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.even-though, type: chunk, title: "even though ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "даже хотя", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "зависимое предложение", examples: ["Even though the code was messy, it worked correctly.", "Even though we warned them, they pushed the release anyway."], contrast: {frame: "despite ___", note_ru: "even though + предложение; despite + существительное или герундий"}, trap: {learner_form: "even though of the issues", correction: "even though there were issues / despite the issues", cause_ru: "even though требует полного предложения"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.therefore, type: chunk, title: "therefore, ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "таким образом, следовательно", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "независимое предложение", examples: ["The audit found no errors. Therefore, the system is ready for release.", "All tests passed. Therefore, we can proceed to production."], contrast: {frame: "so ___", note_ru: "therefore более формально; so более устно"}, trap: {learner_form: "The tests passed because therefore we launched.", correction: "The tests passed. Therefore, we launched.", cause_ru: "therefore требует отдельного предложения с запятой"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.as-a-result, type: chunk, title: "As a result, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "в результате", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "независимое предложение", examples: ["The server went down. As a result, users could not access the service.", "We improved the algorithm. As a result, performance increased by 40%."], contrast: {frame: "so ___", note_ru: "as a result более формально и подробно"}, trap: {learner_form: "As a result of the server went down.", correction: "As a result, the server went down. / Because the server went down.", cause_ru: "as a result требует независимого предложения после запятой"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.thats-why-clause, type: chunk, title: "that's why we need ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "вот почему нам нужно", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "существительное или инфинитив", examples: ["The system is unstable, that's why we need a redesign.", "The client changed their mind, that's why we must restart the timeline."], contrast: {frame: "that's why ___", note_ru: "вариант с модальным глаголом после that's why"}, trap: {learner_form: "that's why we are needing", correction: "that's why we need", cause_ru: "после that's why используется базовая форма, не continuous"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.instead-of, type: chunk, title: "Instead of ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "вместо того чтобы", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "герундий или существительное", examples: ["Instead of fixing the bug, the team decided to rewrite the module.", "Instead of a meeting, we sent an email with the update."], contrast: {frame: "because ___", note_ru: "instead of показывает альтернативу; because показывает причину"}, trap: {learner_form: "instead of to fix the bug", correction: "instead of fixing the bug", cause_ru: "после instead of используется герундий (форма на -ing), не инфинитив"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.due-to-the, type: chunk, title: "due to the ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "из-за (формально)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "существительное или фраза", examples: ["The outage was due to the misconfiguration of the database.", "The delay is due to the shortage of resources."], contrast: {frame: "because of ___", note_ru: "due to более формально; because of более устно"}, trap: {learner_form: "due to the server ran out", correction: "due to the memory issue / because the server ran out", cause_ru: "due to требует существительного или герундия"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.even-if, type: chunk, title: "even if ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "даже если", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "гипотетическое предложение", examples: ["Even if the client delays their response, we will meet the deadline.", "Even if the tests fail, we still need to investigate the issue."], contrast: {frame: "even though ___", note_ru: "even if для гипотезы; even though для реального факта"}, trap: {learner_form: "even if we will finish", correction: "even if we finish", cause_ru: "even if требует present simple для будущего смысла"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.in-spite-of, type: chunk, title: "in spite of ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "несмотря на (формально)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "существительное или герундий", examples: ["In spite of the challenges, the team finished the project on time.", "In spite of the budget constraints, we invested in the best tools."], contrast: {frame: "despite ___", note_ru: "in spite of и despite близки; in spite of немного более формально"}, trap: {learner_form: "in spite of the team tried hard.", correction: "in spite of the team's effort / despite the team trying hard", cause_ru: "in spite of требует существительного или герундия"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.whereas, type: chunk, title: "whereas ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "в то время как (контраст)", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "предложение для сравнения", examples: ["The old system was slow, whereas the new one is fast.", "The first version had many bugs, whereas version 2.0 is stable."], contrast: {frame: "but ___", note_ru: "whereas более формально и подчеркивает контраст; but проще"}, trap: {learner_form: "The old system was slow, whereas the new system was slow too.", correction: "The old system was slow, whereas the new system is fast.", cause_ru: "whereas требует контраста значений, а не повторения одного и того же"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.conversely, type: chunk, title: "conversely, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "наоборот", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "противоположное утверждение", examples: ["The team welcomed the change; conversely, management was skeptical.", "Adding more tests improved quality. Conversely, skipping reviews caused bugs."], contrast: {frame: "on the other hand ___", note_ru: "conversely более формально и подчеркивает полное противоположение"}, trap: {learner_form: "Conversely, but the team was happy.", correction: "Conversely, the team was happy.", cause_ru: "conversely уже означает контраст; не нужен дополнительный but"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.accordingly, type: chunk, title: "accordingly, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "соответственно, поэтому", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "следствие из предыдущего", examples: ["The specifications changed. Accordingly, we revised our approach.", "The project scope increased by 30%. Accordingly, we need more time."], contrast: {frame: "therefore ___", note_ru: "accordingly подчеркивает соответствие; therefore более общее"}, trap: {learner_form: "accordingly we have to do", correction: "Accordingly, we have to do", cause_ru: "accordingly требует запятой после слова и заглавной буквы в начале предложения"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.nevertheless, type: chunk, title: "Nevertheless, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "тем не менее", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "независимое предложение", examples: ["The budget was cut by half. Nevertheless, the team delivered the project.", "The timeline was tight. Nevertheless, everyone worked hard."], contrast: {frame: "however, ___", note_ru: "nevertheless и however близки; nevertheless немного более формально"}, trap: {learner_form: "Nevertheless, although the budget was cut.", correction: "Nevertheless, the budget was cut.", cause_ru: "не нужно использовать другой connector после nevertheless"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.on-the-other-hand, type: chunk, title: "on the other hand, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "с другой стороны", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "альтернативная точка зрения", examples: ["The old framework was stable. On the other hand, it was slow.", "We could launch quickly. On the other hand, we'd need to cut features."], contrast: {frame: "on one hand ... on the other hand", note_ru: "на первую часть часто не указывают явно"}, trap: {learner_form: "on the other hand, but we should", correction: "on the other hand, we should", cause_ru: "on the other hand уже выражает контраст; не нужен but"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.otherwise, type: chunk, title: "otherwise ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "иначе, в противном случае", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "альтернативный результат", examples: ["We must fix the bug today, otherwise the release will be delayed.", "You need to back up your data, otherwise you risk losing it."], contrast: {frame: "or else ___", note_ru: "otherwise и or else близки; otherwise более формально"}, trap: {learner_form: "otherwise we will lose data or the system will crash", correction: "otherwise we will lose data", cause_ru: "otherwise требует одного результата, не нескольких"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.as-such, type: chunk, title: "as such, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "как таковой, в таком случае", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "логическое следствие", examples: ["This is a critical issue, as such, it requires immediate attention.", "The data is confidential, as such, access is restricted."], contrast: {frame: "therefore ___", note_ru: "as such подчеркивает природу/категорию; therefore показывает логический результат"}, trap: {learner_form: "as such, we will try to", correction: "as such, we must / as such, we need to", cause_ru: "as such часто требует более решительного глагола"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.under-these-circumstances, type: chunk, title: "Under these circumstances, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "при данных обстоятельствах", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "действие в контексте условий", examples: ["Under these circumstances, we must postpone the launch.", "Under these circumstances, the best option is to escalate the issue."], contrast: {frame: "because of the situation ___", note_ru: "under these circumstances более формально"}, trap: {learner_form: "Under these circumstances, because we have no budget.", correction: "Under these circumstances, we have no budget.", cause_ru: "under these circumstances уже показывает причину; не добавляйте because"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.prompted-by, type: chunk, title: "prompted by ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "побуждаемый", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector, structure:participle-clause], slot_hint_ru: "причина или обстоятельство", examples: ["Prompted by customer feedback, we redesigned the dashboard.", "Prompted by the security breach, we upgraded all our systems."], contrast: {frame: "because of ___", note_ru: "prompted by более литературно; because of более устно"}, trap: {learner_form: "Prompted by we need to act.", correction: "Prompted by the situation, we need to act.", cause_ru: "prompted by требует существительного или герундия после"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.with-that-said, type: chunk, title: "With that said, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "при всём при том, сказав это", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "добавляющее замечание", examples: ["The project has challenges. With that said, the team is confident.", "The budget is tight. With that said, we will find a solution."], contrast: {frame: "however ___", note_ru: "with that said более разговорное; however более формально"}, trap: {learner_form: "with that said, although we try.", correction: "with that said, we try", cause_ru: "с with that said не нужны дополнительные connectors"}, transformations: [authored]}
  - {id: chunk.connectors-cause-contrast.if-anything, type: chunk, title: "if anything, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "если что, то скорее", frame_of: grammar.connectors.cause-contrast, carries: [structure:connector], slot_hint_ru: "усиленное альтернативное утверждение", examples: ["The issue is not urgent. If anything, it's a minor inconvenience.", "We're not behind schedule. If anything, we're ahead of it."], contrast: {frame: "on the contrary ___", note_ru: "if anything немного менее формально"}, trap: {learner_form: "if anything because", correction: "if anything, it's", cause_ru: "if anything требует независимого предложения"}, transformations: [authored]}
