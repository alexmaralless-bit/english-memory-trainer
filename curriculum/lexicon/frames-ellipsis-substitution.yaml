# Frames for grammar.ellipsis-substitution (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.ellipsis-substitution.so-did, type: chunk, title: "___ so did ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "… и тоже … (вместо повторения глагола)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], slot_hint_ru: "глаголы + субъект; оба в одинаковом времени", examples: ["The team adopted the framework in Q1, and so did partners.", "Our model predicted the decline, and so did the baseline."], contrast: {frame: "___ also did ___", note_ru: "so did = более формальный и полный, чем also"}, trap: {learner_form: "The team adopted the framework, and partners so did.", correction: "The team adopted the framework, and so did partners.", cause_ru: "после 'so' нужна инверсия — вспомогательный глагол перед подлежащим (so did partners, не partners so did)"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.but-not, type: chunk, title: "___, but not ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "… но не … (элизис глагола при контрасте)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["The first dataset included outliers, but not the cleaned version.", "The initial review uncovered risks, but not the subsequent audit."], contrast: {frame: "___, and not ___", note_ru: "but not подчёркивает контраст; and not более нейтрален"}, trap: {learner_form: "The first dataset included outliers, but not was cleaned.", correction: "The first dataset included outliers, but not cleaned.", cause_ru: "пропускаем глагол, не повторяем его форму"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.if-not, type: chunk, title: "If not, ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "если нет, то …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["Rollback may be supported by week three. If not, we escalate.", "The pipeline might be optimized next sprint. If not, defer to Q4."], contrast: {frame: "If that fails, ___", note_ru: "If not — более сжато; if that fails — более явно"}, trap: {learner_form: "If we will not, escalate.", correction: "If not, escalate.", cause_ru: "if not уже подразумевает отрицание условия; не нужно повторять субъект и will"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.same-goes-for, type: chunk, title: "the same goes for ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "то же самое относится к …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis, structure:reference], examples: ["The legacy system remains unsupported. The same goes for the library.", "Our findings apply to desktop users; the same goes for mobile."], contrast: {frame: "and the same for ___", note_ru: "the same goes for — более литературно и формально"}, trap: {learner_form: "The same goes for them.", correction: "The same goes for mobile users.", cause_ru: "слишком краткое местоимение (them) вместо явного антецедента (mobile users)"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.do-so-instead, type: chunk, title: "do so ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "сделать это … (элизис основного глагола)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], slot_hint_ru: "наречие или обстоятельство после do so", examples: ["We could fix it manually, or do so through automation.", "We could paint the room now, or do so next weekend."], contrast: {frame: "to do it instead", note_ru: "do so — формально; do it — разговорно"}, trap: {learner_form: "Others did so migrate to the cloud.", correction: "Others did so.", cause_ru: "не повторяем глагол (migrate) после do so — do so уже его заменяет"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.ones-plural, type: chunk, title: "the ___ ones", cefr: C2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [academic, reporting], meaning_ru: "те, которые … (заменитель существительного во множественном числе)", frame_of: grammar.ellipsis-substitution, carries: [structure:reference], slot_hint_ru: "прилагательное перед ones", examples: ["We prioritized urgent requests; the routine ones await next week.", "Successful experiments outperformed the failed ones significantly."], contrast: {frame: "the ___ items", note_ru: "ones — более формально и сжато; items — явнее"}, trap: {learner_form: "the urgent ones requests are ready", correction: "the urgent ones are ready", cause_ru: "ones уже заменяет существительное; не добавляем его снова"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.as-expected, type: chunk, title: "___ as expected", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "… как и ожидалось", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["The model's forecast proved accurate, as expected.", "Performance degraded under load, as expected under stress."], contrast: {frame: "just as expected", note_ru: "без усилителя just — более нейтрально"}, trap: {learner_form: "Proved as expected accurate here.", correction: "Proved accurate, as expected.", cause_ru: "as expected занимает позицию в конце, не в середине"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.and-that, type: chunk, title: "and that ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "и это …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis, structure:reference], slot_hint_ru: "глагол в нужной форме", examples: ["The API throttles after 1000 per minute, and that happens silently.", "The workflow stalled at approval stage, and that was critical."], contrast: {frame: "and this ___", note_ru: "that подчёркивает дистанцию; this — близость"}, trap: {learner_form: "and that was happening quietly", correction: "and that happened quietly", cause_ru: "для разового завершённого события — Past Simple (happened), не Past Continuous (was happening)"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.some-others-dont, type: chunk, title: "Some ___, others don't", cefr: C2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [academic, reporting], meaning_ru: "одни … другие не …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], slot_hint_ru: "глагол в базовой форме", examples: ["Some teams adopt the new standard, others don't.", "Some vendors support on-premise deployments, others don't."], contrast: {frame: "Some do, some don't", note_ru: "с объектом — более информативно"}, trap: {learner_form: "Some adopted the standard, others not supporting.", correction: "Some adopted the standard, others didn't.", cause_ru: "нужна полная форма отрицания с didn't, а не '-ing' без вспомогательного глагола"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.likewise, type: chunk, title: "Likewise, ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "аналогично …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["Performance improved in Q1. Likewise, revenue exceeded forecast.", "The first model showed promise. Likewise, the ensemble converged."], contrast: {frame: "In the same way, ___", note_ru: "Likewise более краткое и формальное"}, trap: {learner_form: "Likewise improved the second metric overall.", correction: "Likewise, the second metric improved.", cause_ru: "Likewise требует полного предложения, не просто глагола"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.would-have-too, type: chunk, title: "would have ___ too", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "тоже бы … (элизис модального + have + V3)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], slot_hint_ru: "причастие прошедшего времени (V3)", examples: ["Without a fallback, the service would have failed too.", "If the storm had hit, the trip would have been canceled too."], contrast: {frame: "would also have ___", note_ru: "would have too — более свернуто"}, trap: {learner_form: "The service would have too failed under load.", correction: "The service would have failed too.", cause_ru: "too стоит в конце фразы (would have failed too), не в середине"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.neither-can, type: chunk, title: "neither can ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "тоже не может …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["The legacy API cannot handle batches; neither can the deprecated one.", "Neither can the old infrastructure accommodate the new load."], contrast: {frame: "and it cannot either", note_ru: "neither can — формальнее и компактнее"}, trap: {learner_form: "Neither the old system can process.", correction: "Neither can the old system.", cause_ru: "инверсия после neither обязательна"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.nor-would, type: chunk, title: "___ nor would ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "и … тоже не (сделал бы)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["We would not recommend this, nor would Security.", "The old code would not scale under load, nor would manual override."], contrast: {frame: "and the ___ would not", note_ru: "nor would — формально и сжато"}, trap: {learner_form: "We would not recommend this, and we would not either.", correction: "We would not recommend this, nor would we.", cause_ru: "после nor нужна инверсия (nor would we), а не обычный порядок слов (and we would not)"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.former-latter, type: chunk, title: "the former ___, the latter ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "первый … второй …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis, structure:reference], slot_hint_ru: "предикат для каждого", examples: ["We chose between rollback and compensation: the former was faster, the latter safer.", "Two databases differ: the former prioritizes speed, the latter atomicity."], contrast: {frame: "the first ___ and the second ___", note_ru: "former/latter — более литературные"}, trap: {learner_form: "the former is better, but the latter nothing", correction: "the former is better; the latter is not", cause_ru: "после latter нужна полная оценка или контраст"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.does-not-either, type: chunk, title: "___ does not ___ either", cefr: C2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [academic, reporting], meaning_ru: "… тоже не …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["The primary index does not cover that column either.", "The documentation does not address edge cases either."], contrast: {frame: "___ also does not ___", note_ru: "does not either — формальнее"}, trap: {learner_form: "The secondary index does not either cover that column.", correction: "The secondary index does not cover that column either.", cause_ru: "either стоит в конце предложения, не перед глаголом"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.can-one, type: chunk, title: "one can ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, communication], meaning_ru: "можно … (безличное; элизис основного предиката)", frame_of: grammar.ellipsis-substitution, carries: [structure:reference], examples: ["The system accepts YAML or JSON; one can use either.", "With refactored interface, one can configure in seconds."], contrast: {frame: "you can ___", note_ru: "one — более формально; you — разговорнее"}, trap: {learner_form: "One can to do this task.", correction: "One can do this task.", cause_ru: "после can пропускаем to в инфинитиве"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.would-be-too, type: chunk, title: "would be ___ too", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "бы тоже … (элизис be)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["Without redundancy, the service would be fragile too.", "If we skip warm-up, the workout would be riskier too."], contrast: {frame: "would also be ___", note_ru: "would be too — свернуто в конце"}, trap: {learner_form: "Changing vendors would be too risky.", correction: "Changing vendors would be risky too.", cause_ru: "too стоит в конце (would be risky too), не перед прилагательным"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.so-have, type: chunk, title: "so have ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "… тоже … (present perfect с элизисом)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], slot_hint_ru: "субъект; have уже указывает на present perfect", examples: ["We have validated in production, so have three other teams.", "The metrics have improved dramatically; so have retention rates."], contrast: {frame: "and the same ___", note_ru: "so have — формальнее; and the same — мягче"}, trap: {learner_form: "so have they adopted the approach", correction: "so have they", cause_ru: "глагол уже подразумевается после so have"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.had-not-yet, type: chunk, title: "___ had not yet ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "… ещё не …", frame_of: grammar.ellipsis-substitution, carries: [tense:past-perfect], examples: ["The team had not yet released when the bug hit.", "The vendor had not yet provided the warranty docs."], contrast: {frame: "___ still had not ___", note_ru: "not yet — более нейтрально; still not — подчёркивает неожиданность"}, trap: {learner_form: "had not yet been delivered it on time", correction: "had not yet been delivered", cause_ru: "не повторяем объект после пассива"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.does-the, type: chunk, title: "does the ___?", cefr: C2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [academic, communication], meaning_ru: "… ли …? (в вопросе с элизисом)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], slot_hint_ru: "существительное; глагол подразумевается", examples: ["The primary covers user_id, but does the secondary?", "The frontend handles retries, but does the backend?"], contrast: {frame: "does the ___ do so?", note_ru: "без do so — компактнее"}, trap: {learner_form: "but does the backend handle retries too?", correction: "but does the backend?", cause_ru: "глагол (handle retries) уже подразумевается — не повторяем его в вопросе с элизисом"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.will-you, type: chunk, title: "Will you ___?", cefr: C2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [academic, communication], meaning_ru: "вы …? (в вопросе с элизисом глагола)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["The deadline is Friday. Will you be ready then?", "The client expects feedback today. Will you have notes?"], contrast: {frame: "Will you have completed ___?", note_ru: "с объектом — более полно; с элизисом — более сжато"}, trap: {learner_form: "Will you be completing ready by Friday?", correction: "Will you be ready by Friday?", cause_ru: "не смешиваем future continuous (be completing) с простым сказуемым (be ready)"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.did-it-work, type: chunk, title: "Did it work?", cefr: C2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [academic, communication], meaning_ru: "это сработало?", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["We deployed the hotfix last night. Did it work?", "They tried the new approach. Did it work?"], contrast: {frame: "Did it produce results?", note_ru: "Did it work — разговорнее и прямее"}, trap: {learner_form: "Did it the approach work well", correction: "Did it work", cause_ru: "не добавляем существительное в краткий вопрос с элизисом"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.so-will, type: chunk, title: "so will ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "… тоже будет …", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["Metrics will improve after optimization; so will UX.", "The team will complete by year-end, so will partners."], contrast: {frame: "and ___ will too", note_ru: "so will — инверсия подчёркивает параллелизм"}, trap: {learner_form: "so will they migrate to the cloud", correction: "so will they", cause_ru: "глагол (migrate to the cloud) уже подразумевается после so will — не повторяем его"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.be-so-too, type: chunk, title: "so is ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "… тоже … (элизис глагола to be)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], slot_hint_ru: "субъект после so is", examples: ["The legacy system is outdated; so is the contract.", "The interface is confusing; so is the documentation."], contrast: {frame: "and ___ is as well", note_ru: "too/as well в конце — более разговорно; so + инверсия — компактнее"}, trap: {learner_form: "so be the contract outdated too", correction: "so is the contract", cause_ru: "be — только словарная форма; после so нужна личная форма глагола (is) с инверсией перед подлежащим"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.likewise-has, type: chunk, title: "Likewise, ___ has", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "аналогично … имеет … (элизис причастия после has)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["Our framework has evolved with feedback. Likewise, the vendor has.", "The neighbors have redone their kitchen. Likewise, my sister has."], contrast: {frame: "Similarly, ___ also has", note_ru: "Likewise — более литературно"}, trap: {learner_form: "Likewise, the vendor has evolved too.", correction: "Likewise, the vendor has.", cause_ru: "не повторяем причастие (evolved) после has — has уже подразумевает его"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.can-have, type: chunk, title: "can have ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, planning], meaning_ru: "может иметь … (модальный с элизисом)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["Errors in input data can have serious downstream consequences.", "Refactoring can have unintended side effects."], contrast: {frame: "can be ___", note_ru: "can have — с объектом; can be — со состоянием"}, trap: {learner_form: "can have to serious consequences", correction: "can have serious consequences", cause_ru: "после can have не нужен инфинитив (to); сразу существительное"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.just-as, type: chunk, title: "just as ___ did", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: semi_opaque, domains: [academic, study], meaning_ru: "точно так же, как … (with ellipsis in subordinate clause)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis], examples: ["The initial rollout succeeded; just as the previous did.", "The new model performs better, just as the pilot did."], contrast: {frame: "exactly as ___ did", note_ru: "just as — менее интенсивно; exactly as — сильнее"}, trap: {learner_form: "just as did we implement the fix", correction: "just as we did", cause_ru: "порядок слов после just as — обычный, не инверсия"}, transformations: [authored]}
  - {id: chunk.ellipsis-substitution.opposite-is-true, type: chunk, title: "the opposite is true", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "верно обратное (элизис предшествующего предложения)", frame_of: grammar.ellipsis-substitution, carries: [structure:ellipsis, structure:reference], examples: ["One might expect costs to rise sharply; the opposite is true.", "The docs claim the feature is experimental; the opposite is true."], contrast: {frame: "the opposite happens", note_ru: "is true — более статично; happens — более динамично"}, trap: {learner_form: "the opposite of it is true", correction: "the opposite is true", cause_ru: "не повторяем антецедент"}, transformations: [authored]}
