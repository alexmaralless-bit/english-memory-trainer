# Frames for grammar.prepositions.location (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.prepositions-location.in-the-menu, type: chunk, title: "in the menu", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "в меню", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The setting is in the menu.", "The export option is in the menu."], contrast: {frame: "on the menu", note_ru: "menu — интерфейс, в котором выбор, а не на котором лежит"}, trap: {learner_form: "The setting is on the menu.", correction: "The setting is in the menu.", cause_ru: "путаница on/in для интерфейсов; on = на поверхности"}, transformations: [authored]}
  - {id: chunk.prepositions-location.in-the-folder, type: chunk, title: "in the folder", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "в папке", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The report is in the folder.", "All files are in the folder."], contrast: {frame: "on the folder", note_ru: "folder — контейнер, содержит файлы внутри"}, trap: {learner_form: "The report is on the folder.", correction: "The report is in the folder.", cause_ru: "русское на папку → on; папка — контейнер"}, transformations: [authored]}
  - {id: chunk.prepositions-location.under-the-title, type: chunk, title: "under the title", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "под названием", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The note is under the title.", "You'll find the ID number under the title."], contrast: {frame: "below the title", note_ru: "below более абстрактно (ниже); under — непосредственно под"}, trap: {learner_form: "The note is below the title.", correction: "The note is under the title.", cause_ru: "путаница below/under для интерфейсов; under точнее здесь"}, transformations: [authored]}
  - {id: chunk.prepositions-location.on-the-left, type: chunk, title: "on the left", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "слева", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The menu is on the left side.", "You'll see the sidebar on the left."], contrast: {frame: "in the left", note_ru: "on the left — на стороне; in может быть для контейнеров"}, trap: {learner_form: "The menu is in the left.", correction: "The menu is on the left.", cause_ru: "left — направление, not контейнер; on the side"}, transformations: [authored]}
  - {id: chunk.prepositions-location.on-the-right, type: chunk, title: "on the right", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "справа", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The search box is on the right.", "The button is on the right side."], contrast: {frame: "in the right", note_ru: "on the right — сторона поверхности"}, trap: {learner_form: "The button is in the right.", correction: "The button is on the right.", cause_ru: "right как направление, на стороне = on"}, transformations: [authored]}
  - {id: chunk.prepositions-location.at-the-bottom, type: chunk, title: "at the bottom", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "внизу", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The submit button is at the bottom.", "The signature is at the bottom of the page."], contrast: {frame: "in the bottom", note_ru: "at the bottom — точка; in = внутри контейнера"}, trap: {learner_form: "The button is in the bottom.", correction: "The button is at the bottom.", cause_ru: "русское внутри → in; bottom — точка местоположения"}, transformations: [authored]}
  - {id: chunk.prepositions-location.at-the-top, type: chunk, title: "at the top", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "вверху", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The navigation bar is at the top.", "The logo appears at the top of the page."], contrast: {frame: "on the top", note_ru: "at the top — позиция; on может быть поверхность предмета"}, trap: {learner_form: "The logo is on the top.", correction: "The logo is at the top.", cause_ru: "on для поверхности; at — точка в пространстве"}, transformations: [authored]}
  - {id: chunk.prepositions-location.next-to-the, type: chunk, title: "next to the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "рядом с …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "имя существительного", examples: ["The save button is next to the cancel button.", "The filter is next to the search box."], contrast: {frame: "beside the ___", note_ru: "beside — более фиксированная позиция; next to более временная"}, trap: {learner_form: "The button is near to the cancel button.", correction: "The save button is next to the cancel button.", cause_ru: "near не требует to в позиционном контексте"}, transformations: [authored]}
  - {id: chunk.prepositions-location.between-the, type: chunk, title: "between the ___ and the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "между … и …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "два существительных", examples: ["The icon is between the search box and the menu.", "The divider is between the panels."], contrast: {frame: "in the middle of", note_ru: "between = два объекта; in the middle of = центр пространства"}, trap: {learner_form: "The icon is between the search and menu.", correction: "The icon is between the search box and the menu.", cause_ru: "between требует both items; need to repeat the article"}, transformations: [authored]}
  - {id: chunk.prepositions-location.in-the-top-left, type: chunk, title: "in the top left", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "в левом верхнем углу", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The logo is in the top left.", "The minimize button is in the top right."], contrast: {frame: "at the top right", note_ru: "in the corner; at the top side — оба верны, но for corners in better"}, trap: {learner_form: "The logo is at the top left.", correction: "The logo is in the top left.", cause_ru: "corner как область → in, не at"}, transformations: [authored]}
  - {id: chunk.prepositions-location.beneath-the, type: chunk, title: "beneath the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "под …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное", examples: ["The description is beneath the title.", "The error message appears beneath the input field."], contrast: {frame: "below the ___", note_ru: "beneath более литературное и точное; below — более общее"}, trap: {learner_form: "The error is under the field.", correction: "The error is beneath the input field.", cause_ru: "under может быть недостаточно точно для текстового поля"}, transformations: [authored]}
  - {id: chunk.prepositions-location.above-the, type: chunk, title: "above the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "над …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное", examples: ["The heading is above the paragraph.", "The toolbar is above the text area."], contrast: {frame: "over the ___", note_ru: "above — вертикально выше; over — перекрытие"}, trap: {learner_form: "The heading is over the text.", correction: "The heading is above the text.", cause_ru: "над = over в русском; но в позиции above точнее"}, transformations: [authored]}
  - {id: chunk.prepositions-location.at-the-center, type: chunk, title: "at the center", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "в центре", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The logo is at the center.", "The main image appears at the center of the screen."], contrast: {frame: "in the center", note_ru: "at the center и in the center оба нормальны; at звучит немного точнее"}, trap: {learner_form: "The logo is in the center.", correction: "The logo is at the center.", cause_ru: "обе формы норм, но at точнее"}, transformations: [authored]}
  - {id: chunk.prepositions-location.in-the-bottom-right, type: chunk, title: "in the bottom right", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "в правом нижнем углу", frame_of: grammar.prepositions.location, carries: [structure:preposition-place, article:definite-shared-context], examples: ["The close button is in the bottom right.", "You'll find the timestamp in the bottom right."], contrast: {frame: "at the bottom right", note_ru: "in — для областей вроде угла экрана; at — для точек на краю"}, trap: {learner_form: "The button is at the bottom right.", correction: "The button is in the bottom right.", cause_ru: "угол (corner) — с in; край (edge) — с at"}, transformations: [authored]}
  - {id: chunk.prepositions-location.throughout-the, type: chunk, title: "throughout the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [data], meaning_ru: "по всему …, во всём …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное (контейнер)", examples: ["The changes appear throughout the document.", "The pattern is found throughout the dataset."], contrast: {frame: "in the whole ___", note_ru: "throughout — по всем частям целиком; whole — просто указывает на размер, без идеи распределения"}, trap: {learner_form: "The errors are in all the system.", correction: "The errors are throughout the system.", cause_ru: "все → whole; но throughout более правильно"}, transformations: [authored]}
  - {id: chunk.prepositions-location.from-the, type: chunk, title: "from the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "из …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное (источник)", examples: ["Click the button from the toolbar.", "Select an option from the dropdown menu."], contrast: {frame: "in the ___", note_ru: "from = источник; in = локация"}, trap: {learner_form: "Select from dropdown.", correction: "Select from the dropdown menu.", cause_ru: "need article перед dropdown"}, transformations: [authored]}
  - {id: chunk.prepositions-location.toward-the, type: chunk, title: "toward the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "в сторону …, к …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное (направление)", examples: ["Move the slider toward the right.", "Drag the element toward the top."], contrast: {frame: "to the ___", note_ru: "toward = направление движения; to = конечная точка"}, trap: {learner_form: "Drag toward right.", correction: "Drag toward the right.", cause_ru: "need article перед direction"}, transformations: [authored]}
  - {id: chunk.prepositions-location.near-the, type: chunk, title: "near the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "рядом с …, около …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное", examples: ["The settings icon is near the top right corner.", "You'll find it near the help section."], contrast: {frame: "next to the ___", note_ru: "near — неточная близость; next to — точная соседство"}, trap: {learner_form: "Near the corner.", correction: "Near the top right corner.", cause_ru: "need more context перед location"}, transformations: [authored]}
  - {id: chunk.prepositions-location.alongside-the, type: chunk, title: "alongside the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [data], meaning_ru: "рядом с …, вместе с …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное", examples: ["The new field appears alongside the old one.", "The data is shown alongside the graph."], contrast: {frame: "next to the ___", note_ru: "alongside — параллельное расположение рядом; next to — просто соседство, без идеи параллельности"}, trap: {learner_form: "The field next to the old one.", correction: "The new field appears alongside the old one.", cause_ru: "alongside более формально и точно для параллельных items"}, transformations: [authored]}
  - {id: chunk.prepositions-location.deep-in-the, type: chunk, title: "deep in the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "глубоко в …, в глубине …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное (контейнер)", examples: ["The backup file is deep in the archive folder.", "The setting is deep in the menu tree."], contrast: {frame: "in the ___", note_ru: "deep добавляет акцент на то, что предмет спрятан глубоко/вложен"}, trap: {learner_form: "Deep into the folder.", correction: "Deep in the folder.", cause_ru: "into suggests movement; in для position"}, transformations: [authored]}
  - {id: chunk.prepositions-location.outside-the, type: chunk, title: "outside the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "вне …, снаружи …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное (контейнер)", examples: ["Click outside the dialog to close it.", "Don't place content outside the frame."], contrast: {frame: "outside of the ___", note_ru: "outside и outside of близко; outside more common"}, trap: {learner_form: "Click outside from the dialog.", correction: "Click outside the dialog.", cause_ru: "from лишне; outside уже означает вне"}, transformations: [authored]}
  - {id: chunk.prepositions-location.across-the, type: chunk, title: "across the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "поперёк …, через …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное", examples: ["The banner spans across the top.", "The line runs across the screen."], contrast: {frame: "through the ___", note_ru: "across — из стороны в сторону, по поверхности; through — сквозь, проходя внутри"}, trap: {learner_form: "The banner through the top.", correction: "The banner spans across the top.", cause_ru: "через = through в русском; но across для ширины"}, transformations: [authored]}
  - {id: chunk.prepositions-location.within-the, type: chunk, title: "within the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology], meaning_ru: "в пределах …, в границах …", frame_of: grammar.prepositions.location, carries: [structure:preposition-place], slot_hint_ru: "существительное (контейнер, граница)", examples: ["Keep the content within the margin.", "All data stays within the system."], contrast: {frame: "inside the ___", note_ru: "within — в пределах установленной границы; inside — просто указывает на местоположение внутри"}, trap: {learner_form: "Inside the margin.", correction: "Within the margin.", cause_ru: "within подразумевает соблюдение границ"}, transformations: [authored]}
