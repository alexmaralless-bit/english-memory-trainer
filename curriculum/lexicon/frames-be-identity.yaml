# Frames for grammar.be.identity (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.be-identity.i-am-a, type: chunk, title: "I am a ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я (работаю)...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "профессия без артикля или артикль + профессия", examples: ["I am a quality engineer at the startup.", "I am a coffee lover on weekends."], contrast: {frame: "I work as ___", note_ru: "work as не требует артикля перед профессией"}, trap: {learner_form: "I am engineer.", correction: "I am an engineer.", cause_ru: "перед гласным звуком нужен an (an engineer), перед согласным — a"}, transformations: [authored]}
  - {id: chunk.be-identity.you-are-a, type: chunk, title: "You are a ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы (работаете)...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "профессия или описание", examples: ["You are a great developer, aren't you?", "You are a good listener for sure."], contrast: {frame: "You're not ___", note_ru: "можно использовать отрицание вместо утверждения"}, trap: {learner_form: "You are a manager very good.", correction: "You are a very good manager.", cause_ru: "прилагательное идёт перед существительным"}, transformations: [authored]}
  - {id: chunk.be-identity.he-is, type: chunk, title: "He is ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "описание или профессия", examples: ["He is the lead developer on the platform.", "He is a great mentor."], contrast: {frame: "She is ___", note_ru: "для женщин форма глагола та же, но местоимение другое"}, trap: {learner_form: "He are a manager.", correction: "He is a manager.", cause_ru: "третье лицо единственное требует is, а не are"}, transformations: [authored]}
  - {id: chunk.be-identity.she-is, type: chunk, title: "She is ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "описание или профессия", examples: ["She is the product owner for our team.", "She is really skilled at problem solving."], contrast: {frame: "They are ___", note_ru: "множественное число требует are вместо is"}, trap: {learner_form: "She are an expert.", correction: "She is an expert.", cause_ru: "третье лицо единственное — is, не are"}, transformations: [authored]}
  - {id: chunk.be-identity.we-are, type: chunk, title: "We are ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "описание команды или группы", examples: ["We are the data platform team at the company.", "We are pretty stressed with the deadline today."], contrast: {frame: "They are ___", note_ru: "оба требуют are, но we — первое лицо множественное"}, trap: {learner_form: "We is developers.", correction: "We are developers.", cause_ru: "множественное число требует are, а не is"}, transformations: [authored]}
  - {id: chunk.be-identity.they-are, type: chunk, title: "They are ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "описание людей или групп", examples: ["They are the senior architects on the project.", "They are always helpful when we have issues."], contrast: {frame: "He is ___", note_ru: "they требует are (множественное), he требует is (единственное)"}, trap: {learner_form: "They is good programmers.", correction: "They are good programmers.", cause_ru: "третье лицо множественное требует are"}, transformations: [authored]}
  - {id: chunk.be-identity.it-is, type: chunk, title: "It is ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "это...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "описание проекта, компании или системы", examples: ["It is a very modern software stack.", "It is a small team but talented."], contrast: {frame: "They are ___", note_ru: "it — единственное (is), they — множественное (are)"}, trap: {learner_form: "It are the latest framework.", correction: "It is the latest framework.", cause_ru: "it — третье лицо единственное, требует is"}, transformations: [authored]}
  - {id: chunk.be-identity.i-am-not, type: chunk, title: "I'm not ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я не...", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:negative], slot_hint_ru: "профессия или описание", examples: ["I'm not a full-time employee here.", "I'm not very patient when systems are slow."], contrast: {frame: "I am ___", note_ru: "отрицание добавляет not после am"}, trap: {learner_form: "I not am a manager.", correction: "I'm not a manager.", cause_ru: "в английском не/глагол идут в порядке am not, а не not am"}, transformations: [authored]}
  - {id: chunk.be-identity.you-are-not, type: chunk, title: "You're not ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы не...", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:negative], slot_hint_ru: "профессия или описание", examples: ["You're not the only one with this problem.", "You're not the lead developer right?"], contrast: {frame: "You are ___", note_ru: "отрицание: are not или aren't"}, trap: {learner_form: "You are not a manager good.", correction: "You're not a good manager.", cause_ru: "прилагательное идёт перед существительным"}, transformations: [authored]}
  - {id: chunk.be-identity.he-is-not, type: chunk, title: "He's not ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он не...", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:negative], slot_hint_ru: "профессия или описание", examples: ["He's not the only engineer on the team.", "He's not available for the meeting today."], contrast: {frame: "She's not ___", note_ru: "то же самое для женщин, но местоимение другое"}, trap: {learner_form: "He not is a developer.", correction: "He's not a developer.", cause_ru: "отрицание is not идёт после is, а не перед ним"}, transformations: [authored]}
  - {id: chunk.be-identity.she-is-not, type: chunk, title: "She's not ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она не...", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:negative], slot_hint_ru: "профессия или описание", examples: ["She's not feeling well today.", "She's not the product owner anymore."], contrast: {frame: "He's not ___", note_ru: "то же отрицание, но для мужчин"}, trap: {learner_form: "She is not good in math.", correction: "She's not good at math.", cause_ru: "предлог in (в русском) становится at (в английском для навыков)"}, transformations: [authored]}
  - {id: chunk.be-identity.are-you, type: chunk, title: "Are you ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be], slot_hint_ru: "профессия или описание", examples: ["Are you the new team lead here?", "Are you feeling better today?"], contrast: {frame: "You are ___", note_ru: "вопрос: инвертируем are и you; утверждение: you are"}, trap: {learner_form: "You are the lead?", correction: "Are you the lead?", cause_ru: "русский порядок слов сохраняется, но в английском вопросе вспомогательный глагол идёт первым"}, transformations: [authored]}
  - {id: chunk.be-identity.is-he, type: chunk, title: "Is he ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be], slot_hint_ru: "профессия или описание", examples: ["Is he the principal engineer on this project?", "Is he available for a quick chat?"], contrast: {frame: "He is ___", note_ru: "в вопросе is идёт перед he; в утверждении — после"}, trap: {learner_form: "He is the lead?", correction: "Is he the lead?", cause_ru: "вспомогательный глагол в английском вопросе идёт в начало"}, transformations: [authored]}
  - {id: chunk.be-identity.is-she, type: chunk, title: "Is she ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be], slot_hint_ru: "профессия или описание", examples: ["Is she the client manager for this account?", "Is she coming to the standup?"], contrast: {frame: "She is ___", note_ru: "вопрос требует инверсии: is she vs she is"}, trap: {learner_form: "She is a senior developer?", correction: "Is she a senior developer?", cause_ru: "прямой порядок слов из русского, но в английском вопросе нужна инверсия"}, transformations: [authored]}
  - {id: chunk.be-identity.what-are-you, type: chunk, title: "What are you?", cefr: A1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "кто вы (по профессии)?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-wh], examples: ["If you don't mind my asking, what are you?", "Out of curiosity, what are you these days?"], contrast: {frame: "What do you ___?", note_ru: "what are вы с be для описания, what do вы с обычным глаголом"}, trap: {learner_form: "What you are?", correction: "What are you?", cause_ru: "русский порядок слов, но в английском вопросе вспомогательный глагол идёт после вопросительного слова"}, transformations: [authored]}
  - {id: chunk.be-identity.who-is, type: chunk, title: "Who is ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "кто это?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-wh], slot_hint_ru: "имя или роль", examples: ["Who is the project manager for this release?", "Who is your favorite colleague?"], contrast: {frame: "Who are ___?", note_ru: "who is — один человек, who are — несколько"}, trap: {learner_form: "Who are the lead engineer?", correction: "Who is the lead engineer?", cause_ru: "даже если говорится о группе профессионалов, один человек требует is"}, transformations: [authored]}
  - {id: chunk.be-identity.am-i, type: chunk, title: "Am I ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be], examples: ["Am I the only one without access here?", "Am I understanding this correctly?"], contrast: {frame: "I am ___", note_ru: "вопрос требует инверсии: am i vs i am"}, trap: {learner_form: "I am the lead?", correction: "Am I the lead?", cause_ru: "нужна инверсия для вопроса"}, transformations: [authored]}
  - {id: chunk.be-identity.is-it, type: chunk, title: "Is it ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "это...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be], examples: ["Is it the right approach for this issue?", "Is it ready for production yet?"], contrast: {frame: "It is ___", note_ru: "вопрос требует инверсии: is it vs it is"}, trap: {learner_form: "It is ready?", correction: "Is it ready?", cause_ru: "в английском вопросе с be нужна инверсия"}, transformations: [authored]}
  - {id: chunk.be-identity.are-we, type: chunk, title: "Are we ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "мы...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be], examples: ["Are we on the same page about this?", "Are we running late for the sync?"], contrast: {frame: "We are ___", note_ru: "вопрос: инверсия are we vs we are"}, trap: {learner_form: "We are ready?", correction: "Are we ready?", cause_ru: "вспомогательный глагол в начало для вопроса"}, transformations: [authored]}
  - {id: chunk.be-identity.are-they, type: chunk, title: "Are they ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "они...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be], examples: ["Are they coming to the standup tomorrow?", "Are they the new hires on the team?"], contrast: {frame: "They are ___", note_ru: "вопрос требует инверсии: are they vs they are"}, trap: {learner_form: "They are available?", correction: "Are they available?", cause_ru: "инверсия в английском вопросе"}, transformations: [authored]}
  - {id: chunk.be-identity.is-the-team, type: chunk, title: "Is the ___ team ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "команда ___ ...?", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:question-be, article:definite-shared-context], slot_hint_ru: "название команды, затем описание", examples: ["Is the platform team ready for the migration?", "Is the QA team in the office today?"], contrast: {frame: "The ___ team is ___", note_ru: "утверждение vs вопрос"}, trap: {learner_form: "The team data is ready?", correction: "Is the data team ready?", cause_ru: "неправильный порядок определения (data team, не team data)"}, transformations: [authored]}
  - {id: chunk.be-identity.not-a, type: chunk, title: "I'm not ___ a ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, everyday-life], meaning_ru: "я не очень...", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:negative], slot_hint_ru: "прилагательное, затем существительное", examples: ["I'm not just a developer; I enjoy meetings too.", "I'm not really a morning person, honestly."], contrast: {frame: "I'm a ___", note_ru: "отрицание добавляет not и часто уточнение like, just"}, trap: {learner_form: "I not am a careful person.", correction: "I'm not a very careful person.", cause_ru: "отрицание в английском: am + not, а не not + am"}, transformations: [authored]}
  - {id: chunk.be-identity.we-are-all, type: chunk, title: "We are all ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы все...", frame_of: grammar.be.identity, carries: [tense:present-simple], slot_hint_ru: "описание группы", examples: ["We are all software engineers working on this product.", "We are all stressed about the release deadline."], contrast: {frame: "We are ___", note_ru: "all усиливает универсальность утверждения"}, trap: {learner_form: "We all are engineers.", correction: "We are all engineers.", cause_ru: "в английском all идёт после глагола be"}, transformations: [authored]}
  - {id: chunk.be-identity.they-are-not, type: chunk, title: "They're not ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "они не...", frame_of: grammar.be.identity, carries: [tense:present-simple, structure:negative], examples: ["They're not the senior architects anymore.", "They're not available for the meeting right now."], contrast: {frame: "They are ___", note_ru: "отрицание: are not или aren't"}, trap: {learner_form: "They not are good managers.", correction: "They're not good managers.", cause_ru: "are not идёт после they, а не перед"}, transformations: [authored]}
