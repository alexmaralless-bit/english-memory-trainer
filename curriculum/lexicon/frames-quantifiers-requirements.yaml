# Frames for grammar.quantifiers.requirements (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.quantifiers-requirements.we-need-at-least, type: chunk, title: "We need at least ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "нам нужно как минимум", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "существительное или число", examples: ["We need at least three developers for this project.", "We need at least five minutes before the meeting starts."], contrast: {frame: "We need ___ only", note_ru: "at least указывает минимум, only указывает ограничение"}, trap: {learner_form: "We need at least of resources.", correction: "We need at least some resources.", cause_ru: "at least не требует предлога of перед существительным"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.there-isnt-enough, type: chunk, title: "There isn't enough ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "недостаточно ...", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier, structure:there-is], slot_hint_ru: "неисчисляемое существительное", examples: ["There isn't enough space on the server.", "There isn't enough time to check everything today."], contrast: {frame: "There are not enough ___", note_ru: "aren't enough для исчисляемых во множественном числе"}, trap: {learner_form: "There is not enough of space.", correction: "There isn't enough space.", cause_ru: "enough не требует предлога of в этой позиции; space неисчисляемое"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.too-many, type: chunk, title: "too many ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "слишком много (исчисляемых)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное исчисляемое существительное", examples: ["There are too many requests in the queue.", "Too many people joined the call at once."], contrast: {frame: "too much ___", note_ru: "too much для неисчисляемых существительных"}, trap: {learner_form: "too many information", correction: "too much information", cause_ru: "information неисчисляемое, требует too much"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.too-much, type: chunk, title: "too much ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "слишком много (неисчисляемого)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "неисчисляемое существительное", examples: ["There's too much traffic on this network today.", "Too much time was spent on debugging."], contrast: {frame: "too many ___", note_ru: "too many для исчисляемых существительных"}, trap: {learner_form: "too much tickets", correction: "too many tickets", cause_ru: "tickets исчисляемое, требует too many"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.we-have-enough, type: chunk, title: "We have enough ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "у нас достаточно", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "существительное", examples: ["We have enough budget for the next quarter.", "We have enough team members to start the work."], contrast: {frame: "There is enough ___", note_ru: "have enough подчеркивает обладание; there is enough констатирует факт"}, trap: {learner_form: "We have enough of resources.", correction: "We have enough resources.", cause_ru: "enough не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.most-of-the, type: chunk, title: "most of the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "большинство (из известного набора)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное существительное или неисчисляемое с the", examples: ["Most of the bugs are in the login module.", "Most of the data has been processed successfully."], contrast: {frame: "most ___", note_ru: "most of the для конкретного набора; most для общего утверждения"}, trap: {learner_form: "most of tickets", correction: "most of the tickets", cause_ru: "most of the требует артикля the перед существительным"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.none-of-the, type: chunk, title: "none of the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "ни один из (известного набора)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное или неисчисляемое существительное", examples: ["None of the test cases passed in the first run.", "None of the resources are available right now."], contrast: {frame: "no ___", note_ru: "none of the для конкретного набора; no для общего случая"}, trap: {learner_form: "none of resources", correction: "none of the resources", cause_ru: "none of the требует артикля the"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.a-few-more, type: chunk, title: "a few more ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "ещё несколько", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное существительное", examples: ["We need a few more hours to finish the testing.", "Just a few more details to clarify before launch."], contrast: {frame: "a few more of the ___", note_ru: "a few more без of для общего набора; a few more of the для конкретного"}, trap: {learner_form: "a few more of resources", correction: "a few more resources", cause_ru: "a few more не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.some-of-the, type: chunk, title: "Some of the ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "некоторые (из известного набора)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное или неисчисляемое существительное", examples: ["Some of the servers need to be upgraded soon.", "Some of the feedback was helpful for the redesign."], contrast: {frame: "some ___", note_ru: "some of the для конкретного набора; some для общего"}, trap: {learner_form: "some of tickets", correction: "some of the tickets", cause_ru: "some of the требует артикля the"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.a-lot-of, type: chunk, title: "a lot of ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "много", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier, article:fixed-expression], slot_hint_ru: "существительное множественное или неисчисляемое", examples: ["We got a lot of requests from users yesterday.", "A lot of work is waiting for the new team."], contrast: {frame: "many ___ / much ___", note_ru: "a lot of более информально; many/much в отрицаниях и вопросах"}, trap: {learner_form: "a lot requests", correction: "a lot of requests", cause_ru: "a lot of требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.not-enough, type: chunk, title: "not enough ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "недостаточно", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "существительное", examples: ["There was not enough information in the ticket.", "We have not enough people for two parallel projects."], contrast: {frame: "not ___ enough", note_ru: "not enough существительного vs существительное not enough (примеси ошибки)"}, trap: {learner_form: "not enough of data", correction: "not enough data", cause_ru: "not enough not требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.only-a-few, type: chunk, title: "only a few ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "только несколько", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное существительное", examples: ["Only a few developers know this system well.", "Only a few minutes remain before the deadline."], contrast: {frame: "a few ___", note_ru: "only a few указывает на ограниченное количество; a few нейтрально"}, trap: {learner_form: "only a few of people", correction: "only a few people", cause_ru: "only a few не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.a-number-of, type: chunk, title: "a number of ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "ряд, несколько", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier, article:fixed-expression], slot_hint_ru: "множественное существительное", examples: ["A number of issues were reported in this release.", "A number of improvements have been made to the system."], contrast: {frame: "a few ___", note_ru: "a number of более формально; a few более устно"}, trap: {learner_form: "a number of issue", correction: "a number of issues", cause_ru: "a number of требует множественного числа"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.hardly-any, type: chunk, title: "hardly any ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "почти никаких", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное существительное", examples: ["There are hardly any errors left in the code.", "Hardly any calls came through during the outage."], contrast: {frame: "no ___", note_ru: "hardly any подчеркивает приблизительность; no категорично"}, trap: {learner_form: "hardly any of resources", correction: "hardly any resources", cause_ru: "hardly any не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.more-than, type: chunk, title: "more than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "более, чем", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "число или существительное", examples: ["More than fifty tickets are waiting for review.", "More than two hours were spent on this call."], contrast: {frame: "less than ___", note_ru: "more than для увеличения; less than для уменьшения"}, trap: {learner_form: "more than of tickets", correction: "more than fifty tickets", cause_ru: "more than not требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.less-than, type: chunk, title: "less than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "менее, чем", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "число или неисчисляемое существительное", examples: ["The database has less than one gigabyte of free space.", "Less than a week remains to prepare the presentation."], contrast: {frame: "fewer than ___ (для исчисляемых)", note_ru: "less than для неисчисляемых; fewer than для исчисляемых"}, trap: {learner_form: "less than tickets", correction: "fewer than tickets", cause_ru: "fewer than для исчисляемых во множественном"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.much-of-the, type: chunk, title: "Much of the ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "большая часть (неисчисляемого)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "неисчисляемое существительное", examples: ["Much of the setup was automated by the script.", "Much of the time goes into manual testing."], contrast: {frame: "most of the ___", note_ru: "much of the для неисчисляемых в нейтральном контексте"}, trap: {learner_form: "much of requests", correction: "many of the requests", cause_ru: "requests исчисляемое, требует many"}, transformations: [authored]}
