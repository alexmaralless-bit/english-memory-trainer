  - {id: chunk.quantifiers-requirements.plenty-of, type: chunk, title: "plenty of ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "достаточно много", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "существительное", examples: ["There is plenty of room in the backup drive.", "We have plenty of time to prepare before the launch."], contrast: {frame: "enough ___", note_ru: "plenty of указывает на избыток; enough на минимум необходимого"}, trap: {learner_form: "plenty resources", correction: "plenty of resources", cause_ru: "plenty требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.all-of-the, type: chunk, title: "All of the ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "все (из известного набора)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное или неисчисляемое существительное", examples: ["All of the tests passed without errors.", "All of the data was backed up successfully."], contrast: {frame: "all ___", note_ru: "all of the для конкретного набора; all для общего"}, trap: {learner_form: "all of tests", correction: "all of the tests", cause_ru: "all of the требует артикля the"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.still-not-enough, type: chunk, title: "still not enough ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "всё ещё недостаточно", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier, structure:time-marker], slot_hint_ru: "существительное", examples: ["Even with the new server, there is still not enough capacity.", "We made progress, but there is still not enough clarity on the timeline."], contrast: {frame: "finally enough ___", note_ru: "still not enough подчеркивает продолжающуюся проблему"}, trap: {learner_form: "still not of enough", correction: "still not enough", cause_ru: "still not enough не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.way-too-many, type: chunk, title: "way too many ___", cefr: A2, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "слишком много (усиление)", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное существительное", examples: ["There are way too many dependencies in this module.", "Way too many bugs are blocking the release."], contrast: {frame: "too many ___", note_ru: "way too many более эмфатично; too many нейтрально"}, trap: {learner_form: "way too much people", correction: "way too many people", cause_ru: "people исчисляемое во множественном"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.barely-any, type: chunk, title: "barely any ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "едва ли есть", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное существительное", examples: ["Barely any team members know about this legacy system.", "There is barely any documentation for this feature."], contrast: {frame: "hardly any ___", note_ru: "barely any и hardly any близки по смыслу"}, trap: {learner_form: "barely any of details", correction: "barely any details", cause_ru: "barely any не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.relatively-few, type: chunk, title: "relatively few ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "относительно мало", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное существительное", examples: ["Relatively few companies use this approach.", "Relatively few errors were found in the code review."], contrast: {frame: "not many ___", note_ru: "relatively few более формально; not many разговорнее"}, trap: {learner_form: "relatively few of resources", correction: "relatively few resources", cause_ru: "relatively few не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.around, type: chunk, title: "around ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "около, приблизительно", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "число или количество", examples: ["Around fifty people attended the meeting.", "It takes around two hours to process all the data."], contrast: {frame: "approximately ___", note_ru: "around более устно; approximately более формально"}, trap: {learner_form: "around of fifty", correction: "around fifty", cause_ru: "around не требует предлога of"}, transformations: [authored]}
  - {id: chunk.quantifiers-requirements.such-limited, type: chunk, title: "such limited ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "такие ограниченные", frame_of: grammar.quantifiers.requirements, carries: [structure:quantifier], slot_hint_ru: "множественное или неисчисляемое существительное", examples: ["With such limited resources, the team still delivered quality work.", "Such limited information made the decision difficult."], contrast: {frame: "so limited ___", note_ru: "such limited перед существительным; so limited перед прилагательным"}, trap: {learner_form: "such limited of options", correction: "such limited options", cause_ru: "such limited не требует предлога of"}, transformations: [authored]}
