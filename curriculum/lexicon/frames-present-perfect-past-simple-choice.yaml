# Frames for grammar.present-perfect-past-simple.choice (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.present-perfect-past-simple-choice.ive-sent-i-sent, type: chunk, title: "I've sent it / I sent it ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я отправил(а) это / я отправил(а) это …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "результат актуален сейчас vs. конкретное время в прошлом", examples: ["I've sent it and I'm waiting for feedback. / I sent it yesterday when you asked.", "I've sent the files; they should arrive soon. / I sent them last Monday."], contrast: {frame: "I sent it ___", note_ru: "с конкретным временем (yesterday, last week) требуется только Past Simple, не Present Perfect"}, trap: {learner_form: "I have sent it yesterday.", correction: "I sent it yesterday.", cause_ru: "yesterday — законченное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.we-fixed-vs-we-have-fixed, type: chunk, title: "We've fixed it / We fixed it ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы это исправили / мы это исправили …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "результат актуален сейчас vs. конкретное прошлое время", examples: ["We've fixed it; the feature works now. / We fixed it on Tuesday before the meeting.", "We've fixed the issue and deployed the patch. / We fixed the bug three days ago."], contrast: {frame: "We fixed it ___", note_ru: "Tuesday, three days ago требуют Past Simple, не Present Perfect"}, trap: {learner_form: "We have fixed it on Tuesday.", correction: "We fixed it on Tuesday.", cause_ru: "конкретное время (on Tuesday) требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.hasnt-anyone-vs-didnt-anyone, type: chunk, title: "Hasn't anyone ___? / Didn't anyone ___?", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "никто не …? (когда-нибудь) / никто не …? (в конкретное время)", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:question-do], slot_hint_ru: "жизненный опыт vs. конкретное прошлое", examples: ["Hasn't anyone seen this error before? / Didn't anyone notice it yesterday?", "Hasn't anyone used this tool? / Didn't anyone try it during testing?"], contrast: {frame: "Did anyone ___ yesterday?", note_ru: "yesterday требует Past Simple; без времени используй Present Perfect"}, trap: {learner_form: "Hasn't anyone noticed yesterday?", correction: "Didn't anyone notice yesterday?", cause_ru: "yesterday — конкретное время, требует Past Simple Did, не Present Perfect Have"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.they-have-gone-vs-they-went, type: chunk, title: "They've gone / They went ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "они ушли (и их нет) / они ушли …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "результат актуален сейчас (их нет) vs. конкретное прошлое время", examples: ["They've gone; we should start without them. / They went to the conference last week.", "They've gone home for the day. / They went home early yesterday."], contrast: {frame: "They went ___", note_ru: "yesterday требует Past Simple; без времени — Present Perfect для текущего отсутствия"}, trap: {learner_form: "They have gone yesterday.", correction: "They went yesterday.", cause_ru: "yesterday — конкретное время, требует Past Simple went, не have gone"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.the-code-has-passed-vs-passed, type: chunk, title: "The code has passed / The code passed ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "код прошел проверку / код прошел проверку …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "результат актуален сейчас vs. конкретное прошлое время", examples: ["The code has passed all tests. / The code passed the review on Friday.", "The solution has passed validation. / The solution passed checks yesterday."], contrast: {frame: "The code passed ___", note_ru: "yesterday, Friday требуют Past Simple; без времени — Present Perfect"}, trap: {learner_form: "The code has passed yesterday.", correction: "The code passed yesterday.", cause_ru: "yesterday — конкретное прошлое время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.i-have-checked-vs-checked, type: chunk, title: "I have checked / I checked ___", cefr: A2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "я проверил(а) / я проверил(а) …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "результат имеет значение сейчас vs. конкретное прошлое время", examples: ["I have checked the data and all is correct. / I checked it this morning.", "I have checked the logs for errors. / I checked the system at noon."], contrast: {frame: "I checked it ___", note_ru: "this morning, at noon требуют Past Simple; без времени — Present Perfect"}, trap: {learner_form: "I have checked this morning.", correction: "I checked this morning.", cause_ru: "this morning — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.have-you-asked-vs-did-you-ask, type: chunk, title: "Have you asked? / Did you ask ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ты спросил(а)? (вообще) / ты спросил(а) …? (в конкретное время)", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:question-do], slot_hint_ru: "жизненный опыт или актуальный результат vs. конкретное прошлое", examples: ["Have you asked the client about this? / Did you ask him during the call yesterday?", "Have you asked for clarification? / Did you ask when I told you?"], contrast: {frame: "Did you ask ___?", note_ru: "yesterday требует Did; без времени используй Have you"}, trap: {learner_form: "Have you asked yesterday?", correction: "Did you ask yesterday?", cause_ru: "yesterday — конкретное время, требует Past Simple Did, не Present Perfect Have"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.weve-discovered-vs-discovered, type: chunk, title: "We've discovered / We discovered ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы обнаружили / мы обнаружили …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "результат актуален сейчас vs. конкретное прошлое время", examples: ["We've discovered a pattern in the data. / We discovered the issue during testing last week.", "We've discovered a workaround. / We discovered it on Monday."], contrast: {frame: "We discovered it ___", note_ru: "last week требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "We have discovered last week.", correction: "We discovered last week.", cause_ru: "last week — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.no-one-has-seen-vs-no-one-saw, type: chunk, title: "No one has seen / No one saw ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "никто не видел (никогда) / никто не видел …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:negative], slot_hint_ru: "жизненный опыт vs. конкретное прошлое время", examples: ["No one has seen that error before. / No one saw it during yesterday's test.", "No one has seen the final report. / No one saw it last night."], contrast: {frame: "No one saw it ___", note_ru: "yesterday, last night требуют Past Simple; без времени — Present Perfect"}, trap: {learner_form: "No one has seen yesterday.", correction: "No one saw yesterday.", cause_ru: "yesterday — конкретное время, требует Past Simple saw, не have seen"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.have-you-found-vs-did-you-find, type: chunk, title: "Have you found? / Did you find ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ты найду(л)? / ты нашел(а) …?", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:question-do], slot_hint_ru: "результат актуален сейчас vs. конкретное прошлое время", examples: ["Have you found the root cause? / Did you find it when you reviewed the logs?", "Have you found a solution? / Did you find one during testing?"], contrast: {frame: "Did you find it ___?", note_ru: "when testing требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "Have you found when reviewing?", correction: "Did you find it when reviewing?", cause_ru: "when reviewing — конкретное время, требует Past Simple Did, не Have"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.the-system-has-been-down-vs-was-down, type: chunk, title: "The system has been down / The system was down ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "система была недоступна / система была недоступна …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "период с прошлого до сейчас vs. конкретное время в прошлом", examples: ["The system has been down for two hours. / The system was down during the night.", "The API has been down since morning. / The API was down at 3 PM."], contrast: {frame: "The system was down ___", note_ru: "at 3 PM, during the night требуют Past Simple; has been down указывает на текущее состояние"}, trap: {learner_form: "The system has been down at 3 PM.", correction: "The system was down at 3 PM.", cause_ru: "at 3 PM — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.ive-done-vs-i-did, type: chunk, title: "I've done it / I did it ___", cefr: A2, curriculum_priority_band: CORE, register: casual, transparency: transparent, domains: [work, everyday-life], meaning_ru: "я это сделал(а) / я это сделал(а) …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "результат актуален сейчас vs. конкретное прошлое время", examples: ["I've done it and it works perfectly. / I did it this morning and then forgot.", "I've done everything you asked. / I did it as soon as you told me."], contrast: {frame: "I did it ___", note_ru: "this morning требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "I have done it this morning.", correction: "I did it this morning.", cause_ru: "this morning — конкретное время, требует Past Simple did, не have done"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.they-havent-vs-they-didnt, type: chunk, title: "They haven't ___ yet / They didn't ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "они ещё не … / они не …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:negative], slot_hint_ru: "ожидание результата vs. конкретное прошлое событие", examples: ["They haven't replied yet to the email. / They didn't reply when we asked yesterday.", "The team hasn't finished yet. / The team didn't finish by the deadline."], contrast: {frame: "They didn't reply ___", note_ru: "yesterday требует Past Simple; hasn't replied yet указывает на ожидание результата"}, trap: {learner_form: "They haven't replied yesterday.", correction: "They didn't reply yesterday.", cause_ru: "yesterday — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.has-anyone-tested-vs-did-anyone-test, type: chunk, title: "Has anyone tested? / Did anyone test ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "кто-нибудь протестировал? / кто-нибудь протестировал …?", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:question-do], slot_hint_ru: "жизненный опыт vs. конкретное прошлое время", examples: ["Has anyone tested the new feature? / Did anyone test it during the demo?", "Has anyone tried this approach? / Did anyone try it in discussion?"], contrast: {frame: "Did anyone test it ___?", note_ru: "during the demo требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "Has anyone tested during the demo?", correction: "Did anyone test during the demo?", cause_ru: "during the demo — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.weve-learned-vs-learned, type: chunk, title: "We've learned / We learned ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, study], meaning_ru: "мы научились / мы научились …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple], slot_hint_ru: "жизненный опыт vs. конкретное время обучения", examples: ["We've learned a lot from this project. / We learned it during the training last month.", "We've learned how to optimize the query. / We learned the technique in a course."], contrast: {frame: "We learned it ___", note_ru: "last month требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "We have learned during the training.", correction: "We learned during the training.", cause_ru: "during the training — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.the-issue-has-been-fixed-vs-was-fixed, type: chunk, title: "The issue has been fixed / The issue was fixed ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "проблема была решена / проблема была решена …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, tense:passive], slot_hint_ru: "результат актуален сейчас vs. конкретное прошлое время", examples: ["The issue has been fixed and deployed. / The issue was fixed on Tuesday.", "The bug has been fixed in the latest build. / The bug was fixed yesterday."], contrast: {frame: "The issue was fixed ___", note_ru: "on Tuesday требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "The issue has been fixed on Tuesday.", correction: "The issue was fixed on Tuesday.", cause_ru: "on Tuesday — конкретное время, требует Past Simple was fixed, не has been fixed"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.i-havent-seen-vs-i-didnt-see, type: chunk, title: "I haven't seen / I didn't see ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я не видел(а) / я не видел(а) …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:negative], slot_hint_ru: "жизненный опыт vs. конкретное прошлое событие", examples: ["I haven't seen that approach used before. / I didn't see it during the demo.", "I haven't seen the final numbers. / I didn't see them yesterday."], contrast: {frame: "I didn't see it ___", note_ru: "yesterday требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "I haven't seen yesterday.", correction: "I didn't see yesterday.", cause_ru: "yesterday — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.we-havent-finished-vs-we-didnt-finish, type: chunk, title: "We haven't finished / We didn't finish ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы не закончили / мы не закончили …", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:negative], slot_hint_ru: "ожидание результата vs. конкретное время", examples: ["We haven't finished the migration yet. / We didn't finish it by Friday.", "The team hasn't finished testing. / The team didn't finish by the deadline last week."], contrast: {frame: "We didn't finish it ___", note_ru: "by Friday требует Past Simple; haven't finished указывает на незаконченное действие"}, trap: {learner_form: "We haven't finished by Friday.", correction: "We didn't finish by Friday.", cause_ru: "by Friday — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-past-simple-choice.what-have-you-done-vs-what-did-you-do, type: chunk, title: "What have you done? / What did you do ___?", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "что ты сделал(а)? / что ты сделал(а) …?", frame_of: grammar.present-perfect-past-simple.choice, carries: [tense:present-perfect, tense:past-simple, structure:question-wh], slot_hint_ru: "жизненный опыт или результат vs. конкретное прошлое время", examples: ["What have you done to fix this? / What did you do during the incident?", "What have you done so far? / What did you do when the error appeared?"], contrast: {frame: "What did you do ___?", note_ru: "yesterday требует Past Simple; без времени — Present Perfect"}, trap: {learner_form: "What have you done yesterday?", correction: "What did you do yesterday?", cause_ru: "yesterday — конкретное время, требует Past Simple, не Present Perfect"}, transformations: [authored]}
