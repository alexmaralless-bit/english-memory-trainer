# Frames for grammar.comparatives.options (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.comparatives-options.er-than, type: chunk, title: "is faster than ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "быстрее чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное", examples: ["This option is faster than the previous one.", "Email is simpler than a meeting."], contrast: {frame: "This is the ___ est ___", note_ru: "comparative = два предмета, superlative = все остальные"}, trap: {learner_form: "This is more faster than that.", correction: "This is faster than that.", cause_ru: "-er и more используются раздельно, не вместе"}, transformations: [authored]}
  - {id: chunk.comparatives-options.more-than, type: chunk, title: "is more ___ than ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "более … чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "прилагательное, существительное", examples: ["This approach is more reliable than the other.", "Asking is more professional than assuming."], contrast: {frame: "This is ___ est ___", note_ru: "more = два предмета, -est = все остальные"}, trap: {learner_form: "That option is more better for us.", correction: "That option is better for us.", cause_ru: "better уже имеет форму comparative, не нужно more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.as-as, type: chunk, title: "This is as ___ as ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это такой же … как …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "прилагательное, существительное", examples: ["This is as powerful as the previous version.", "The new process is as simple as the old one."], contrast: {frame: "This is ___ er than ___", note_ru: "as...as = одинаково, -er than = различие"}, trap: {learner_form: "This is as more complicated as that.", correction: "This is as complicated as that.", cause_ru: "в as...as используется базовая форма прилагательного"}, transformations: [authored]}
  - {id: chunk.comparatives-options.cheaper-than, type: chunk, title: "___ is cheaper than ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… дешевле чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This plan is cheaper than the other one.", "The open-source solution is cheaper than buying a license."], contrast: {frame: "This is the cheapest ___", note_ru: "cheaper = два варианта, cheapest = лучший из всех"}, trap: {learner_form: "This is more cheaper than that.", correction: "This is cheaper than that.", cause_ru: "cheap + -er, не используется more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.better-than, type: chunk, title: "This is better than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это лучше чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное", examples: ["This is better than the previous solution.", "Asking questions is better than making assumptions."], contrast: {frame: "This is the best ___", note_ru: "better = два варианта, best = лучший из всех"}, trap: {learner_form: "This solution is more better.", correction: "This solution is better.", cause_ru: "better уже имеет сравнительную форму"}, transformations: [authored]}
  - {id: chunk.comparatives-options.worse-than, type: chunk, title: "___ is worse than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… хуже чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This approach is worse than the recommended one.", "Delay is worse than being honest about the issue."], contrast: {frame: "___ is better than ___", note_ru: "worse и better противоположны"}, trap: {learner_form: "This is more worse than that.", correction: "This is worse than that.", cause_ru: "worse = неправильная форма сравнительного, не нужно more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.easier-than, type: chunk, title: "This is easier than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это легче чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное", examples: ["This is easier than the manual process.", "Email is easier than meeting in person."], contrast: {frame: "This is the easiest ___", note_ru: "easier = два варианта, easiest = самый легкий из всех"}, trap: {learner_form: "This is more easier than doing it manually.", correction: "This is easier than doing it manually.", cause_ru: "easy + -ier, не используется more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.more-complex-than, type: chunk, title: "This is more complex than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это более сложно чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное", examples: ["This is more complex than needed.", "The new interface is more complex than the previous version."], contrast: {frame: "This is simpler than ___", note_ru: "complex требует more для сравнительной формы"}, trap: {learner_form: "This process is more complicated than simple.", correction: "This process is more complicated than that.", cause_ru: "нужно сравнивать два предмета, не использовать антонимы"}, transformations: [authored]}
  - {id: chunk.comparatives-options.faster-than, type: chunk, title: "___ is faster than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… быстрее чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This solution is faster than the old one.", "Automation is faster than manual work."], contrast: {frame: "This is the fastest ___", note_ru: "faster = два варианта, fastest = быстрее всех"}, trap: {learner_form: "This process is more faster.", correction: "This process is faster.", cause_ru: "fast + -er, не используется more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.slower-than, type: chunk, title: "___ is slower than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… медленнее чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["Manual testing is slower than automation.", "The old system is slower than the new one."], contrast: {frame: "___ is faster than ___", note_ru: "slower и faster противоположны"}, trap: {learner_form: "This is more slower than that.", correction: "This is slower than that.", cause_ru: "slow + -er, не используется more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.more-reliable-than, type: chunk, title: "___ is more reliable than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… более надежно чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This vendor is more reliable than the other.", "Automated tests are more reliable than manual checking."], contrast: {frame: "This is the most reliable ___", note_ru: "more = два предмета, most = все варианты"}, trap: {learner_form: "This is more reliable as the other.", correction: "This is more reliable than the other.", cause_ru: "в comparative используется than, не as"}, transformations: [authored]}
  - {id: chunk.comparatives-options.more-expensive-than, type: chunk, title: "___ is more expensive than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… дороже чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This solution is more expensive than the alternative.", "The licensed version is more expensive than open-source."], contrast: {frame: "This is the most expensive ___", note_ru: "more = два варианта, most = все остальные"}, trap: {learner_form: "This is more expensive like that.", correction: "This is more expensive than that.", cause_ru: "в comparative используется than, не like или as"}, transformations: [authored]}
  - {id: chunk.comparatives-options.less-than, type: chunk, title: "This requires less ___ than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это требует меньше … чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This requires less effort than rewriting from scratch.", "Option A needs less maintenance than Option B."], contrast: {frame: "This requires more ___ than ___", note_ru: "less и more противоположны"}, trap: {learner_form: "This is less better than that.", correction: "This is worse than that.", cause_ru: "less + прилагательное не стандартно; используй worse"}, transformations: [authored]}
  - {id: chunk.comparatives-options.more-efficient-than, type: chunk, title: "___ is more efficient than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… более эффективно чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["Cloud storage is more efficient than local servers.", "The new workflow is more efficient than the old one."], contrast: {frame: "This is the most efficient ___", note_ru: "more = два варианта, most = все остальные"}, trap: {learner_form: "This approach is more efficient like that.", correction: "This approach is more efficient than that.", cause_ru: "в comparative используется than"}, transformations: [authored]}
  - {id: chunk.comparatives-options.bigger-than, type: chunk, title: "___ is bigger than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… больше чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This team is bigger than the other department.", "The new server is bigger than the previous one."], contrast: {frame: "This is the biggest ___", note_ru: "bigger = два варианта, biggest = самый большой из всех"}, trap: {learner_form: "This is more bigger than that.", correction: "This is bigger than that.", cause_ru: "big + -ger, не используется more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.smaller-than, type: chunk, title: "The new feature is smaller than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "новая функция меньше чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное", examples: ["The new feature is smaller than the full redesign.", "Our office is smaller than the competitor's."], contrast: {frame: "___ is bigger than ___", note_ru: "smaller и bigger противоположны"}, trap: {learner_form: "This is more smaller than that.", correction: "This is smaller than that.", cause_ru: "small + -er, не используется more"}, transformations: [authored]}
  - {id: chunk.comparatives-options.more-suitable-for, type: chunk, title: "This is more suitable for ___ than ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это более подходит для … чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This is more suitable for large teams than small ones.", "Email is more suitable for formal communication than chat."], contrast: {frame: "This is the most suitable for ___", note_ru: "more = два варианта, most = все остальные"}, trap: {learner_form: "This is more suitable like that.", correction: "This is more suitable than that.", cause_ru: "в comparative используется than"}, transformations: [authored]}
  - {id: chunk.comparatives-options.different-from, type: chunk, title: "___ is different from ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… отличается от …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This approach is different from the standard method.", "The new interface is different from the old one."], contrast: {frame: "This is the same as ___", note_ru: "different = различие, same = одинаково"}, trap: {learner_form: "This is different than that.", correction: "This is different from that.", cause_ru: "different требует from, не than"}, transformations: [authored]}
  - {id: chunk.comparatives-options.the-same-as, type: chunk, title: "This is the same as ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это то же самое как …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное", examples: ["This is the same as the previous version.", "The process is the same as before."], contrast: {frame: "This is different from ___", note_ru: "same = одинаково, different = различие"}, trap: {learner_form: "This is the same like that.", correction: "This is the same as that.", cause_ru: "the same требует as, не like или than"}, transformations: [authored]}
  - {id: chunk.comparatives-options.much-more-than, type: chunk, title: "This is much more ___ than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это намного более … чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "прилагательное, существительное", examples: ["This is much more complex than expected.", "The new system is much more powerful than the old one."], contrast: {frame: "This is slightly more ___ than ___", note_ru: "much более сильный интенсификатор, чем slightly"}, trap: {learner_form: "This is much more better than that.", correction: "This is much better than that.", cause_ru: "better уже имеет форму comparative"}, transformations: [authored]}
  - {id: chunk.comparatives-options.slightly-more-than, type: chunk, title: "is slightly more ___ than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "немного более … чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "прилагательное, существительное", examples: ["This approach is slightly more efficient than the other.", "Option B is slightly more expensive than Option A."], contrast: {frame: "This is much more ___ than ___", note_ru: "slightly слабее, чем much"}, trap: {learner_form: "This is slightly more better.", correction: "This is slightly better.", cause_ru: "better уже имеет сравнительную форму"}, transformations: [authored]}
  - {id: chunk.comparatives-options.far-more-than, type: chunk, title: "This is far more ___ than ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это гораздо более … чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "прилагательное, существительное", examples: ["This is far more robust than the alternative.", "The new process is far more efficient than before."], contrast: {frame: "This is slightly more ___ than ___", note_ru: "far более интенсивно, чем slightly"}, trap: {learner_form: "This is far more better.", correction: "This is far better.", cause_ru: "better уже имеет сравнительную форму"}, transformations: [authored]}
  - {id: chunk.comparatives-options.better-for, type: chunk, title: "This is better for ___ than ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это лучше для … чем …", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "существительное, существительное", examples: ["This is better for beginners than for professionals.", "Email is better for formal requests than chat."], contrast: {frame: "This is the best for ___", note_ru: "better = два варианта, best = лучший из всех"}, trap: {learner_form: "This is better like that.", correction: "This is better than that.", cause_ru: "в comparative используется than"}, transformations: [authored]}
  - {id: chunk.comparatives-options.not-as-good-as, type: chunk, title: "This is not as good as ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это не так хорошо как …", frame_of: grammar.comparatives.options, carries: [structure:comparative, structure:negative], slot_hint_ru: "существительное", examples: ["This is not as good as the recommended solution.", "Manual processes are not as good as automation."], contrast: {frame: "This is better than ___", note_ru: "not as...as = мягче отрицание, -er than = прямое сравнение"}, trap: {learner_form: "This is not so good as that.", correction: "This is not as good as that.", cause_ru: "not as...as, не not so...as"}, transformations: [authored]}
  - {id: chunk.comparatives-options.than-required, type: chunk, title: "This is ___ than required", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это более … чем требуется", frame_of: grammar.comparatives.options, carries: [structure:comparative], slot_hint_ru: "прилагательное в сравнительной форме", examples: ["This is more complex than required.", "The budget is higher than required for the project."], contrast: {frame: "This is ___ enough", note_ru: "than required = сравнение, enough = достаточность"}, trap: {learner_form: "This is more complex than what is required.", correction: "This is more complex than required.", cause_ru: "чем требуется достаточно просто, без what"}, transformations: [authored]}
