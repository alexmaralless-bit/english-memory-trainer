# Frames for grammar.zero-conditional.processes (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.zero-conditional-processes.if-you, type: chunk, title: "If you ___, it ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если вы ..., то это (общее правило)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "первый слот — действие; второй — результат", examples: ["If you click the button, it resets.", "If you restart the service, it works again."], contrast: {frame: "If you will click, it will reset", note_ru: "в zero conditional обе части используют Present Simple, а не future"}, trap: {learner_form: "If you will click the button, it resets.", correction: "If you click the button, it resets.", cause_ru: "zero conditional требует Present Simple в условии, не will"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.if-the, type: chunk, title: "If the ___, it ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "если ... (неживой субъект), то это", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "первый слот — условие; второй — результат", examples: ["If the password is wrong, it rejects the login.", "If the network is slow, it times out."], contrast: {frame: "If I ___", note_ru: "здесь подлежащее — предмет/система, а не человек"}, trap: {learner_form: "If the password is wrong, it will reject.", correction: "If the password is wrong, it rejects.", cause_ru: "результат в zero conditional also uses present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.when-the, type: chunk, title: "When the ___, it ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "когда ... (временной момент в системе), то", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "первый слот — условие; второй — результат", examples: ["When the timer expires, it sends a notification.", "When the request arrives, it validates the data."], contrast: {frame: "When I arrive", note_ru: "when здесь описывает автоматический процесс, не человеческое действие"}, trap: {learner_form: "When the timer will expire, it sends.", correction: "When the timer expires, it sends.", cause_ru: "when в zero conditional требует present simple, не will"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.unless, type: chunk, title: "Unless ___, ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если не ... (отрицательное условие)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "условие в отрицательной форме", examples: ["Unless you provide credentials, the system blocks access.", "Unless the task completes, the workflow stops."], contrast: {frame: "If you don't provide", note_ru: "unless = if not; часто более формальный вариант"}, trap: {learner_form: "Unless you will provide credentials.", correction: "Unless you provide credentials.", cause_ru: "unless в zero conditional требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.whenever, type: chunk, title: "Whenever ___, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "всякий раз когда ... (повторяющееся условие)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "условие, которое повторяется", examples: ["Whenever the user logs in, the dashboard loads.", "Whenever a new ticket arrives, it notifies the team."], contrast: {frame: "When ___", note_ru: "whenever подчеркивает повторяемость; when просто связывает события"}, trap: {learner_form: "Whenever the user will log in, it loads.", correction: "Whenever the user logs in, it loads.", cause_ru: "whenever также требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.if-there-is, type: chunk, title: "If there is ___, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если есть ... (ошибка, проблема), то", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0, structure:there-is], slot_hint_ru: "существование чего-либо", examples: ["If there is a timeout, the request retries automatically.", "If there is an error, the log captures it."], contrast: {frame: "If an error occurs", note_ru: "if there is подчеркивает наличие, не действие"}, trap: {learner_form: "If there will be a timeout.", correction: "If there is a timeout.", cause_ru: "zero conditional требует present simple для there is/are"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.in-case, type: chunk, title: "In case ___, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в случае если (профилактическое условие)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "условие, которое может произойти", examples: ["In case the upload fails, the file stays in draft.", "In case the connection drops, we save your progress."], contrast: {frame: "If ___", note_ru: "in case подчеркивает готовность к сценарию; if более нейтрально"}, trap: {learner_form: "In case the upload will fail.", correction: "In case the upload fails.", cause_ru: "in case требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.as-long-as, type: chunk, title: "As long as ___, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "пока ... (устойчивое условие)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "непрерывное или устойчивое условие", examples: ["As long as the server runs, the app works.", "As long as the subscription is active, users have access."], contrast: {frame: "If ___", note_ru: "as long as подчеркивает длительность условия"}, trap: {learner_form: "As long as the server will run.", correction: "As long as the server runs.", cause_ru: "as long as требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.if-you-dont, type: chunk, title: "If you don't ___, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если не ... (отрицательное действие)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0, structure:negative], slot_hint_ru: "отрицательное действие", examples: ["If you don't save the file, the changes disappear.", "If you don't close the tab, the session stays active."], contrast: {frame: "Unless ___", note_ru: "if you don't более прямое; unless более формально"}, trap: {learner_form: "If you don't will save.", correction: "If you don't save.", cause_ru: "не нужно will после don't в zero conditional"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.should, type: chunk, title: "Should ___, ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "в случае если ... (формальное условие с инверсией)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0, structure:inversion], slot_hint_ru: "формальное условие", examples: ["Should the system fail, a backup automatically activates.", "Should an error occur, the alert goes to the team."], contrast: {frame: "If ___", note_ru: "should инверсия более формально и книжно; if более устно"}, trap: {learner_form: "Should the system will fail.", correction: "Should the system fail.", cause_ru: "should инверсия требует базовой формы"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.the-more-the-more, type: chunk, title: "The more ___, the more ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "чем больше ..., тем больше", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0, structure:comparative], slot_hint_ru: "параллельные сравнительные структуры", examples: ["The more users join, the slower the system becomes.", "The more data we process, the more power we need."], contrast: {frame: "If more users join", note_ru: "the more ... the more показывает причинную связь и пропорцию"}, trap: {learner_form: "The more users join, the system is slower.", correction: "The more users join, the slower the system becomes.", cause_ru: "второе the more требует сравнительной формы прилагательного"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.once, type: chunk, title: "Once ___, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "как только ... (временное условие)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "условие срабатывания", examples: ["Once the data is validated, it enters the database.", "Once the test passes, the code can be merged."], contrast: {frame: "When ___", note_ru: "once подчеркивает переходный момент; when более общее"}, trap: {learner_form: "Once the data will be validated.", correction: "Once the data is validated.", cause_ru: "once в zero conditional требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.provided-that, type: chunk, title: "Provided that ___, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "при условии что ... (обязательное условие)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "обязательное условие", examples: ["Provided that the tests pass, the deployment proceeds.", "Provided that the budget is approved, the project starts next quarter."], contrast: {frame: "If ___", note_ru: "provided that более формально; if более устно"}, trap: {learner_form: "Provided that the tests will pass.", correction: "Provided that the tests pass.", cause_ru: "provided that требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.no-matter-if, type: chunk, title: "No matter if ___, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [everyday-life, work], meaning_ru: "неважно если, в любом случае", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "условие, которое не влияет на результат", examples: ["No matter if you use Windows or Mac, the software works.", "No matter if it rains or shines, the deadline stays the same."], contrast: {frame: "Even if ___", note_ru: "no matter if подчеркивает неважность условия; even if выражает контраст"}, trap: {learner_form: "No matter if you will use.", correction: "No matter if you use.", cause_ru: "no matter if требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.providing-that, type: chunk, title: "Providing that ___, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, technology], meaning_ru: "при условии что, если (формальное)", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "обязательное условие", examples: ["Providing that the client approves, we start the work immediately.", "Providing that all requirements are met, the feature launches on time."], contrast: {frame: "As long as ___", note_ru: "providing that более формально о разовом условии; as long as о длительном"}, trap: {learner_form: "Providing that the client will approve.", correction: "Providing that the client approves.", cause_ru: "providing that требует present simple"}, transformations: [authored]}
  - {id: chunk.zero-conditional-processes.every-time, type: chunk, title: "Every time ___, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "каждый раз когда", frame_of: grammar.zero-conditional.processes, carries: [tense:conditional-0], slot_hint_ru: "повторяющееся условие", examples: ["Every time you press Enter, the form submits.", "Every time the phone rings, my cat runs away."], contrast: {frame: "When ___", note_ru: "every time подчеркивает повторяемость"}, trap: {learner_form: "Every time you will press Enter.", correction: "Every time you press Enter.", cause_ru: "every time требует present simple"}, transformations: [authored]}
