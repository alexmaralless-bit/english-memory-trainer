# Frames for grammar.basic-word-order (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.basic-word-order.subject-verb-object, type: chunk, title: "The ___ needs the report", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Подлежащее ... дополнение", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "существительное (client, team, manager)", examples: ["The client needs the report by tomorrow morning.", "The manager needs the report before the review."], contrast: {frame: "The report is needed by the ___", note_ru: "чтобы поставить объект в начало, нужен пассивный залог, а не просто обратный порядок слов"}, trap: {learner_form: "The report the client needs.", correction: "The client needs the report.", cause_ru: "русский свободный порядок, но в английском SVO"}, transformations: [authored]}
  - {id: chunk.basic-word-order.we-verb-object, type: chunk, title: "We ___ the ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["We handle the bug reports very quickly.", "We maintain the database in good shape."], contrast: {frame: "The ___ we ___", note_ru: "объект не может быть перед субъектом и глаголом"}, trap: {learner_form: "The report we handle.", correction: "We handle the report.", cause_ru: "объект в начало из русского языка"}, transformations: [authored]}
  - {id: chunk.basic-word-order.i-verb-object, type: chunk, title: "I ___ the ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Я ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["I check the code very carefully before committing.", "I update the database after each transaction."], contrast: {frame: "The ___ I ___", note_ru: "неправильный порядок"}, trap: {learner_form: "The code I check.", correction: "I check the code.", cause_ru: "объект перемещается в начало"}, transformations: [authored]}
  - {id: chunk.basic-word-order.they-verb-object, type: chunk, title: "They ___ the ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Они ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["They review the pull requests within two hours.", "They track the performance metrics daily."], contrast: {frame: "The ___ they ___", note_ru: "неправильный порядок"}, trap: {learner_form: "The metrics they track.", correction: "They track the metrics.", cause_ru: "свободный порядок слов"}, transformations: [authored]}
  - {id: chunk.basic-word-order.subject-verb-today, type: chunk, title: "We ___ today", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы ... сегодня", frame_of: grammar.basic-word-order, carries: [structure:svo-order, structure:time-marker], slot_hint_ru: "глагол", examples: ["We test the system today.", "We release the update today."], contrast: {frame: "Today we ___", note_ru: "в английском обычно время маркер в конце, не в начале"}, trap: {learner_form: "Today we deploy release.", correction: "We deploy the release today.", cause_ru: "маркер времени в начало из русского"}, transformations: [authored]}
  - {id: chunk.basic-word-order.you-verb-object, type: chunk, title: "You ___ the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Вы ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["You handle the customer requests very professionally.", "You understand the project requirements well."], contrast: {frame: "The ___ you ___", note_ru: "объект не начинает предложение"}, trap: {learner_form: "The customers you handle.", correction: "You handle the customers.", cause_ru: "неправильный порядок из русского"}, transformations: [authored]}
  - {id: chunk.basic-word-order.she-verbs-object, type: chunk, title: "She ___ the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Она ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["She reviews the code for security issues.", "She manages the project timeline effectively."], contrast: {frame: "The ___ she ___", note_ru: "объект не может быть в начале"}, trap: {learner_form: "The code she reviews.", correction: "She reviews the code.", cause_ru: "свободный порядок"}, transformations: [authored]}
  - {id: chunk.basic-word-order.he-verbs-object, type: chunk, title: "He ___ the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Он ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["He runs the database server reliably.", "He documents the architecture very thoroughly."], contrast: {frame: "The ___ he ___", note_ru: "неправильный порядок"}, trap: {learner_form: "The server he runs.", correction: "He runs the server.", cause_ru: "объект в начало"}, transformations: [authored]}
  - {id: chunk.basic-word-order.we-verb-time, type: chunk, title: "We ___ next ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "Мы ... в следующий...", frame_of: grammar.basic-word-order, carries: [structure:svo-order, structure:time-marker], slot_hint_ru: "глагол, затем день/месяц", examples: ["We start the migration next Monday.", "We deploy the changes next week."], contrast: {frame: "Next ___ we ___", note_ru: "время маркер может быть в начале или в конце"}, trap: {learner_form: "Next week we start.", correction: "We start next week.", cause_ru: "маркер времени часто в конце в письменном английском"}, transformations: [authored]}
  - {id: chunk.basic-word-order.i-verb-time, type: chunk, title: "I ___ on ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "Я ... в/на ...", frame_of: grammar.basic-word-order, carries: [structure:svo-order, structure:preposition-time], slot_hint_ru: "глагол, затем день недели", examples: ["I work on the refactoring on Monday.", "I review the tests on Friday."], contrast: {frame: "On ___ I ___", note_ru: "время маркер с предлогом может быть в конце"}, trap: {learner_form: "On Friday I test.", correction: "I test on Friday.", cause_ru: "маркер времени в начало"}, transformations: [authored]}
  - {id: chunk.basic-word-order.complete-sentence, type: chunk, title: "The team ___ the proposal today", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Подлежащее ... дополнение сегодня", frame_of: grammar.basic-word-order, carries: [structure:svo-order, structure:time-marker], slot_hint_ru: "глагол (confirms, approves, reviews)", examples: ["The team confirms the proposal today.", "The client approves the architecture today."], contrast: {frame: "Today the team ___ the proposal", note_ru: "маркер времени обычно в конце"}, trap: {learner_form: "The team today the proposal confirms.", correction: "The team confirms the proposal today.", cause_ru: "неправильный порядок элементов"}, transformations: [authored]}
  - {id: chunk.basic-word-order.we-do-verb, type: chunk, title: "We review the ___ every day", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы ... существительное каждый день", frame_of: grammar.basic-word-order, carries: [structure:svo-order, structure:frequency-adverb], slot_hint_ru: "существительное (metrics, code, results)", examples: ["We review the metrics every day.", "We test the software every day."], contrast: {frame: "Every day we review the ___", note_ru: "маркер частоты может быть в начале или конце"}, trap: {learner_form: "Every day we review the code.", correction: "We review the code every day.", cause_ru: "маркер частоты в конце более естественно"}, transformations: [authored]}
  - {id: chunk.basic-word-order.does-he-verb, type: chunk, title: "Does he ___ the ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Он ... существительное?", frame_of: grammar.basic-word-order, carries: [structure:question-do, structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["Does he handle the support tickets?", "Does he manage the team budget?"], contrast: {frame: "He ___ the ___?", note_ru: "вопрос требует do/does в начале, заявление нет"}, trap: {learner_form: "He does handle the tickets?", correction: "Does he handle the tickets?", cause_ru: "вспомогательный глагол должен быть перед субъектом в вопросе"}, transformations: [authored]}
  - {id: chunk.basic-word-order.do-you-verb, type: chunk, title: "Do you ___ the ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Вы ... существительное?", frame_of: grammar.basic-word-order, carries: [structure:question-do, structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["Do you test the code before deploying?", "Do you document your changes?"], contrast: {frame: "You ___ the ___?", note_ru: "вопрос требует do в начале"}, trap: {learner_form: "You do test the code?", correction: "Do you test the code?", cause_ru: "вспомогательный глагол в начало в вопросе"}, transformations: [authored]}
  - {id: chunk.basic-word-order.do-they-verb, type: chunk, title: "Do they ___ the ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Они ... существительное?", frame_of: grammar.basic-word-order, carries: [structure:question-do, structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["Do they review the requirements before starting?", "Do they track the performance metrics?"], contrast: {frame: "They ___ the ___?", note_ru: "утверждение vs вопрос"}, trap: {learner_form: "They do handle the tickets?", correction: "Do they handle the tickets?", cause_ru: "инверсия нужна в вопросе"}, transformations: [authored]}
  - {id: chunk.basic-word-order.what-verb-do, type: chunk, title: "What do you ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Что вы ...?", frame_of: grammar.basic-word-order, carries: [structure:question-wh, structure:question-do], slot_hint_ru: "глагол", examples: ["What do you do with this data?", "What do you suggest for the solution?"], contrast: {frame: "You ___ what?", note_ru: "неправильный порядок слов в вопросе"}, trap: {learner_form: "You do what?", correction: "What do you do?", cause_ru: "русский порядок в вопросе"}, transformations: [authored]}
  - {id: chunk.basic-word-order.when-do-they, type: chunk, title: "When do they ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "Когда они ...?", frame_of: grammar.basic-word-order, carries: [structure:question-wh, structure:question-do], slot_hint_ru: "глагол", examples: ["When do they release the new features?", "When do they review the code?"], contrast: {frame: "They ___ when?", note_ru: "вопросительное слово в начало"}, trap: {learner_form: "They release when?", correction: "When do they release?", cause_ru: "вопросительное слово должно быть в начало"}, transformations: [authored]}
  - {id: chunk.basic-word-order.where-does-it, type: chunk, title: "Where does it ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, communication], meaning_ru: "Где это ...?", frame_of: grammar.basic-word-order, carries: [structure:question-wh, structure:question-do], slot_hint_ru: "глагол", examples: ["Where does it store the data?", "Where does the config file go?"], contrast: {frame: "It ___ where?", note_ru: "вопрос требует where в начало"}, trap: {learner_form: "It stores where?", correction: "Where does it store?", cause_ru: "вопросительное слово в начало"}, transformations: [authored]}
  - {id: chunk.basic-word-order.positive-no-do, type: chunk, title: "I write code", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Я пишу код", frame_of: grammar.basic-word-order, carries: [structure:svo-order], examples: ["I write code every single day.", "I write code for the backend team."], contrast: {frame: "I don't write code", note_ru: "в отрицании нужен вспомогательный do (don't), в утверждении — нет"}, trap: {learner_form: "I do write code.", correction: "I write code.", cause_ru: "в утверждении не нужен вспомогательный do"}, transformations: [authored]}
  - {id: chunk.basic-word-order.she-does-verb, type: chunk, title: "She ___ the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "Она ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["She creates the test cases for every feature.", "She validates the database schema carefully."], contrast: {frame: "She does ___ the ___", note_ru: "в утверждении не нужно do"}, trap: {learner_form: "She does creates the tests.", correction: "She creates the tests.", cause_ru: "в утверждении не нужен вспомогательный глагол"}, transformations: [authored]}
  - {id: chunk.basic-word-order.it-verbs-object, type: chunk, title: "It ___ the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, data], meaning_ru: "Это ... существительное", frame_of: grammar.basic-word-order, carries: [structure:svo-order], slot_hint_ru: "глагол и существительное", examples: ["It stores the information in the database.", "It processes the requests very quickly."], contrast: {frame: "The ___ it ___", note_ru: "неправильный порядок"}, trap: {learner_form: "The database it stores.", correction: "It stores the database.", cause_ru: "объект в начало"}, transformations: [authored]}
