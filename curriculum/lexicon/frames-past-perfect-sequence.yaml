# Frames for grammar.past-perfect.sequence (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.past-perfect-sequence.by-the-time-had, type: chunk, title: "By the time ___, we had already ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "к тому времени, когда …, мы уже …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "событие 2 / событие 1 в третьей форме", examples: ["By the time we released the patch, we had already tested it on five systems.", "By the time I woke up, my phone had already rung five times."], contrast: {frame: "We tested it on five systems and released the patch.", note_ru: "события в одинаковом порядке; порядок в русском языке может отличаться"}, trap: {learner_form: "By the time we released the patch, we had already test it.", correction: "By the time we released the patch, we had already tested it.", cause_ru: "после have нужна третья форма, не базовая"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.had-before, type: chunk, title: "We had ___ before the ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы … до того, как …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "завершённое действие / более позднее событие", examples: ["We had sent the request before the deadline passed.", "She had already made a backup before the system crashed."], contrast: {frame: "We sent the request and the deadline passed.", note_ru: "просто два события; не ясна их последовательность"}, trap: {learner_form: "We had sent the request before the deadline is passing.", correction: "We had sent the request before the deadline passed.", cause_ru: "время после before должно быть Past Simple, не Present Continuous"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.it-turned-out-that, type: chunk, title: "It turned out that ___ had ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "выяснилось, что … уже …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "подлежащее + третья форма с информацией о прошлом", examples: ["It turned out that the file had been corrupted by malware.", "It turned out that someone had already contacted the vendor about this issue."], contrast: {frame: "The file was corrupted by malware.", note_ru: "просто факт; не то, что это было до чего-то ещё"}, trap: {learner_form: "It turned out that the file had corrupted by malware.", correction: "It turned out that the file had been corrupted by malware.", cause_ru: "в пассиве Past Perfect нужны be + третья форма"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.when-had, type: chunk, title: "When ___ happened, we had already ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "когда произошло …, мы уже …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "более позднее событие / более раннее в третьей форме", examples: ["When the outage happened, we had already restarted every server.", "When the crash happened, the team had already saved a backup."], contrast: {frame: "When the alert arrived, we started the investigation.", note_ru: "события в одинаковом порядке; непонятно, которое первое"}, trap: {learner_form: "When the alert arrived, we had already start the investigation.", correction: "When the alert arrived, we had already started the investigation.", cause_ru: "после have нужна третья форма"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.had-by-then, type: chunk, title: "By then, the ___ had already ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "к тому времени … уже …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "существительное / третья форма", examples: ["By then, the team had already released three versions of the software.", "By then, half the users had already switched to the new interface."], contrast: {frame: "By then, the team released three versions of the software.", note_ru: "не ясна связь с текущим моментом в рассказе"}, trap: {learner_form: "By then, the team had already release three versions.", correction: "By then, the team had already released three versions.", cause_ru: "после have нужна третья форма, не инфинитив"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.before-that, type: chunk, title: "Before that, nobody ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "до этого никто не …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "третья форма в отрицании", examples: ["Before that, nobody had ever asked for this feature.", "Before that, the system had never crashed under this load."], contrast: {frame: "Nobody asked for this feature.", note_ru: "просто прошлое событие; не связано с более поздним"}, trap: {learner_form: "Before that, nobody had ever ask for this feature.", correction: "Before that, nobody had ever asked for this feature.", cause_ru: "после have нужна третья форма"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.once-had, type: chunk, title: "Once we had ___, the ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "как только мы …, …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "завершённое действие / следующее событие", examples: ["Once we had deployed the fix, the errors started to decrease.", "Once the audit had finished, management reviewed the report."], contrast: {frame: "We deployed the fix and the errors started to decrease.", note_ru: "лишь порядок событий; не ясно, что одно нужно было для другого"}, trap: {learner_form: "Once we had deploy the fix, the errors started.", correction: "Once we had deployed the fix, the errors started to decrease.", cause_ru: "после have нужна третья форма"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.not-until, type: chunk, title: "Not until ___ did we realize ___", cefr: B1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только когда …, мы поняли, что …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing, structure:inversion], slot_hint_ru: "событие / что мы поняли", examples: ["Not until we reviewed the logs did we realize someone had deleted the backup.", "Not until the client complained did we discover we had shipped an older version."], contrast: {frame: "We reviewed the logs and realized someone had deleted the backup.", note_ru: "просто факты в порядке; без акцента на неожиданность"}, trap: {learner_form: "Not until we reviewed the logs we realized someone had deleted.", correction: "Not until we reviewed the logs did we realize someone had deleted the backup.", cause_ru: "в инверсии после Not until нужен did, и полное предложение"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.after-had-and-then, type: chunk, title: "After we had ___, we ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "после того, как мы …, мы …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "завершённое действие / следующее действие", examples: ["After we had tested the migration, we scheduled the production rollout.", "After I had submitted my resignation, I started looking for a new job."], contrast: {frame: "We tested the migration and scheduled the production rollout.", note_ru: "просто цепочка событий; не выделено, какое раньше"}, trap: {learner_form: "After we had tested, we schedule the production rollout.", correction: "After we had tested the migration, we scheduled the production rollout.", cause_ru: "действие после after нужно доделать, и время должно соответствовать"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.only-after-had, type: chunk, title: "Only after we had ___ did ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только после того, как мы …, …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "завершённое действие / следующее событие", examples: ["Only after we had deployed the patch did the errors start to decrease.", "Only after she had left the office did we realize the mistake."], contrast: {frame: "After we deployed the patch, the errors started to decrease.", note_ru: "просто два события; нет акцента на последовательность"}, trap: {learner_form: "Only after we had deployed the patch the errors started.", correction: "Only after we had deployed the patch did the errors start to decrease.", cause_ru: "в инверсии после Only after нужен did"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.had-been-down, type: chunk, title: "It had been down for ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "это было отключено/недоступно на протяжении …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "период времени", examples: ["It had been down for three days when they finally called support.", "The database had been down for hours before the team noticed."], contrast: {frame: "The service was down for three days.", note_ru: "просто длительность; не ясна связь с другим событием"}, trap: {learner_form: "The service had been down three days when they called.", correction: "The service had been down for three days when they finally called us.", cause_ru: "нужен for перед периодом времени в Past Perfect"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.hardly-had, type: chunk, title: "Hardly had we ___ when ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "едва мы …, как …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing, structure:inversion], slot_hint_ru: "завершённое действие / следующее событие", examples: ["Hardly had we launched the new feature when we received a hundred support tickets.", "Hardly had she arrived at the office when the network went down."], contrast: {frame: "We launched the new feature and received a hundred support tickets.", note_ru: "просто два события; без акцента на скорость следования"}, trap: {learner_form: "Hardly had we launch the feature, we received tickets.", correction: "Hardly had we launched the new feature when we received a hundred support tickets.", cause_ru: "после Hardly had нужна третья форма и when (не comma)"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.the-time-had-come, type: chunk, title: "The time had come to ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "пришло время, чтобы мы …", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "инфинитив", examples: ["The time had come to shut down the old system and migrate to the new one.", "The time had come to tell the client about the delay."], contrast: {frame: "It was time to shut down the old system.", note_ru: "просто пришло время; не связано с событиями, которые этому предшествовали"}, trap: {learner_form: "The time had come shut down the old system.", correction: "The time had come to shut down the old system and migrate to the new one.", cause_ru: "после come нужен to + инфинитив"}, transformations: [authored]}
  - {id: chunk.past-perfect-sequence.the-had-broken, type: chunk, title: "The ___ had broken", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… уже сломался/сломалась", frame_of: grammar.past-perfect.sequence, carries: [tense:past-perfect, structure:sequencing], slot_hint_ru: "существительное (система, сервер и т.п.)", examples: ["The system had broken just before the launch.", "The link had broken by the time we tried to test it."], contrast: {frame: "The system broke.", note_ru: "просто действие в прошлом; не ясна связь с другим событием"}, trap: {learner_form: "The system had break before the launch.", correction: "The system had broken just before the launch.", cause_ru: "после have нужна третья форма (broken)"}, transformations: [authored]}
