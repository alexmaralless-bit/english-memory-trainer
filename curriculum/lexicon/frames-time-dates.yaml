  - {id: chunk.time-dates.at-nine, type: chunk, title: "at ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work], meaning_ru: "в … (о времени)", frame_of: grammar.time-dates, carries: [structure:time-marker, structure:preposition-time], slot_hint_ru: "время (9, 14:30)", examples: ["The call starts at nine in the morning.", "The team meets at two o'clock for standup."], contrast: {frame: "on ___", note_ru: "on используется для дней недели и дат, at — для времени"}, trap: {learner_form: "The call starts nine.", correction: "The call starts at nine.", cause_ru: "в русском языке предлог может быть опущен"}, transformations: [authored]}
