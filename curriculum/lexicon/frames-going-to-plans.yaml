# Frames for grammar.going-to.plans (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.going-to-plans.im-going-to, type: chunk, title: "I'm going to ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "я собираюсь …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "инфинитив без to, действие", examples: ["I'm going to call you after the meeting.", "I'm going to test this tomorrow morning."], contrast: {frame: "I will ___", note_ru: "I'm going to подчёркивает уже намеченный план; will используется для решения в момент речи"}, trap: {learner_form: "I'm going to calling you later.", correction: "I'm going to call you later.", cause_ru: "после going to нужен инфинитив without to, не герундий"}, transformations: [authored]}
  - {id: chunk.going-to-plans.were-going-to, type: chunk, title: "We're going to ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "мы собираемся …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "инфинитив, совместное действие", examples: ["We're going to deploy the fix tomorrow.", "We're going to meet with the client next week."], contrast: {frame: "We will ___", note_ru: "We're going to показывает заранее намеченный план; will для спонтанного решения"}, trap: {learner_form: "We're going to to fix this issue.", correction: "We're going to fix this issue.", cause_ru: "после going to нужен инфинитив без частицы to"}, transformations: [authored]}
  - {id: chunk.going-to-plans.hes-going-to, type: chunk, title: "He's going to ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "он собирается …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "инфинитив, действие другого лица", examples: ["He's going to review the pull request today.", "He's going to present the findings to the team."], contrast: {frame: "He will ___", note_ru: "He's going to — заранее спланированное; he will — спонтанное решение"}, trap: {learner_form: "He's going to to submit the results.", correction: "He's going to submit the results.", cause_ru: "going to + инфинитив без to, не double to"}, transformations: [authored]}
  - {id: chunk.going-to-plans.shes-going-to, type: chunk, title: "She's going to ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "она собирается …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "инфинитив, действие женского лица", examples: ["She's going to check the database tomorrow.", "She's going to send the contract by Friday."], contrast: {frame: "She will ___", note_ru: "She's going to — план; she will — объявление решения"}, trap: {learner_form: "She's going to calling the vendor.", correction: "She's going to call the vendor.", cause_ru: "после going to нужен чистый инфинитив, не форма с -ing"}, transformations: [authored]}
  - {id: chunk.going-to-plans.theyre-going-to, type: chunk, title: "They're going to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "они собираются …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "действие третьих лиц", examples: ["They're going to announce the new product next month.", "They're going to start the audit process."], contrast: {frame: "They will ___", note_ru: "They're going to — ранее намеченный план; they will — быстрое решение"}, trap: {learner_form: "They're going to to implement this change.", correction: "They're going to implement this change.", cause_ru: "После going to инфинитив пишется без частицы to"}, transformations: [authored]}
  - {id: chunk.going-to-plans.arent-going-to, type: chunk, title: "I'm not going to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "я не собираюсь …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to, structure:negative], slot_hint_ru: "то, чего не будет делать", examples: ["I'm not going to work weekends.", "I'm not going to update the system today."], contrast: {frame: "I won't ___", note_ru: "I'm not going to — отмена плана; I won't — объявление новой позиции"}, trap: {learner_form: "I'm not going to calling you back.", correction: "I'm not going to call you back.", cause_ru: "отрицание не меняет структуру: be + not + going to + инфинитив"}, transformations: [authored]}
  - {id: chunk.going-to-plans.arent-they-going-to, type: chunk, title: "Are they going to ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "они собираются …?", frame_of: grammar.going-to.plans, carries: [tense:future-going-to, structure:question-be], slot_hint_ru: "действие, о котором спрашиваем", examples: ["Are they going to attend the meeting?", "Are you going to join the call tomorrow?"], contrast: {frame: "Will they ___?", note_ru: "Are they going to? — вопрос о плане; Will they? — вопрос о спонтанном решении"}, trap: {learner_form: "Are they going to called the client?", correction: "Are they going to call the client?", cause_ru: "в вопросе структура: auxiliary + subject + going to + base form"}, transformations: [authored]}
  - {id: chunk.going-to-plans.planning-to, type: chunk, title: "We're planning to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "мы планируем …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "запланированное действие", examples: ["We're planning to roll out the feature next quarter.", "We're planning to hire two new engineers."], contrast: {frame: "We're going to ___", note_ru: "Planning to и going to очень похожи, planning to более формально"}, trap: {learner_form: "We're planning on to release this next month.", correction: "We're planning to release this next month.", cause_ru: "planning to, а не planning on to"}, transformations: [authored]}
  - {id: chunk.going-to-plans.thats-the-plan, type: chunk, title: "That's the plan ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [planning, communication], meaning_ru: "это по плану …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "время или условие плана", examples: ["That's the plan for tomorrow.", "That's the plan at least, if things go well."], contrast: {frame: "That's my goal.", note_ru: "That's the plan — о конкретном плане; That's my goal — об желаемом результате"}, trap: {learner_form: "That's the plan to do it now.", correction: "That's the plan for now.", cause_ru: "That's the plan часто используется с временными маркерами (for, by), не с инфинитивом"}, transformations: [authored]}
  - {id: chunk.going-to-plans.what-are-you-going-to, type: chunk, title: "What are you going to ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "что ты собираешься …?", frame_of: grammar.going-to.plans, carries: [tense:future-going-to, structure:question-wh], slot_hint_ru: "действие, о котором спрашиваем", examples: ["What are you going to do after this?", "What are you going to wear to the event?"], contrast: {frame: "What will you ___?", note_ru: "What are you going to? — спрос о плане; What will you? — о спонтанном решении"}, trap: {learner_form: "What are you going to to do?", correction: "What are you going to do?", cause_ru: "в вопросе: WH + be + subject + going to + base form"}, transformations: [authored]}
  - {id: chunk.going-to-plans.is-going-to-happen, type: chunk, title: "Is ___ going to happen?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "то ___ произойдёт?", frame_of: grammar.going-to.plans, carries: [tense:future-going-to, structure:question-be], slot_hint_ru: "событие или явление", examples: ["Is the year-end release going to happen?", "Is the product launch going to happen?"], contrast: {frame: "Will ___ happen?", note_ru: "Is ... going to happen? — вопрос о плане; Will ... happen? — о возможности"}, trap: {learner_form: "Is the deploy going to to start?", correction: "Is the deploy going to start?", cause_ru: "Is ... going to + инфинитив, без лишнего to"}, transformations: [authored]}
  - {id: chunk.going-to-plans.how-are-you-going-to, type: chunk, title: "How are you going to ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "как ты собираешься …?", frame_of: grammar.going-to.plans, carries: [tense:future-going-to, structure:question-wh], slot_hint_ru: "способ или метод действия", examples: ["How are you going to solve this problem?", "How are you going to get there by noon?"], contrast: {frame: "How will you ___?", note_ru: "How are you going to? — о плане способа; How will you? — открытый вопрос"}, trap: {learner_form: "How are you going to to reach the goal?", correction: "How are you going to reach the goal?", cause_ru: "How + be + subject + going to + инфинитив без to"}, transformations: [authored]}
  - {id: chunk.going-to-plans.plan-is-to, type: chunk, title: "The plan is to ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "план такой: …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "суть плана", examples: ["The plan is to migrate by Friday.", "The plan is to test thoroughly before launch."], contrast: {frame: "We plan to ___", note_ru: "The plan is to — безличный стиль; We plan to — с субъектом"}, trap: {learner_form: "The plan is to calling the client.", correction: "The plan is to call the client.", cause_ru: "The plan is to + инфинитив, не герундий с -ing"}, transformations: [authored]}
  - {id: chunk.going-to-plans.im-planning, type: chunk, title: "I'm planning ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [planning, communication], meaning_ru: "я планирую …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "действие или событие", examples: ["I'm planning a team lunch for next week.", "I'm planning to take a day off soon."], contrast: {frame: "I'm planning on ___", note_ru: "I'm planning может быть с герундием; I'm planning on + герундий"}, trap: {learner_form: "I'm planning going to the conference.", correction: "I'm planning to go to the conference.", cause_ru: "после planning usually used to + инфинитив, не герундий, в американском английском"}, transformations: [authored]}
  - {id: chunk.going-to-plans.going-to-be, type: chunk, title: "It's going to be ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "это будет …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "описание качества или состояния", examples: ["It's going to be a long meeting.", "It's going to be ready by tomorrow."], contrast: {frame: "It will be ___", note_ru: "It's going to be — предсказание на основе плана; It will be — более общее утверждение"}, trap: {learner_form: "It's going to being difficult.", correction: "It's going to be difficult.", cause_ru: "be в инфинитиве после going to, не в форме being"}, transformations: [authored]}
  - {id: chunk.going-to-plans.when-are-you-going, type: chunk, title: "When are you going to ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "когда ты собираешься …?", frame_of: grammar.going-to.plans, carries: [tense:future-going-to, structure:question-wh], slot_hint_ru: "действие, о котором спрашиваем", examples: ["When are you going to call them back?", "When are you going to submit the report?"], contrast: {frame: "When will you ___?", note_ru: "When are you going to? — о спланированном; When will you? — открытый вопрос"}, trap: {learner_form: "When are you going to calling?", correction: "When are you going to call?", cause_ru: "When + be + subject + going to + base form глагола"}, transformations: [authored]}
  - {id: chunk.going-to-plans.someone-going-to, type: chunk, title: "___ is going to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "___ собирается …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "лицо и действие", examples: ["The manager is going to approve the design tomorrow.", "This change is going to break something."], contrast: {frame: "___ will ___", note_ru: "is going to подчёркивает спланированность; will более общее"}, trap: {learner_form: "The system is going to to fail.", correction: "The system is going to fail.", cause_ru: "is going to + инфинитив без лишнего to"}, transformations: [authored]}
  - {id: chunk.going-to-plans.probably-going-to, type: chunk, title: "That's probably going to ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [planning, communication], meaning_ru: "это, вероятно, …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "предполагаемый результат", examples: ["That's probably going to fix the issue.", "That's probably going to take longer than expected."], contrast: {frame: "That will probably ___", note_ru: "That's probably going to — с наречием внутри; That will probably — наречие после will"}, trap: {learner_form: "That's probably going to to work.", correction: "That's probably going to work.", cause_ru: "probably в середине фразы, только один инфинитив"}, transformations: [authored]}
  - {id: chunk.going-to-plans.definitely-going-to, type: chunk, title: "I'm definitely going to ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [planning, communication], meaning_ru: "я определённо буду …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "действие, совершённое обязательно", examples: ["I'm definitely going to attend the conference.", "I'm definitely going to try the new restaurant."], contrast: {frame: "I will definitely ___", note_ru: "I'm definitely going to — с наречием в be; I will definitely — наречие после will"}, trap: {learner_form: "I'm definitely going to calling.", correction: "I'm definitely going to call.", cause_ru: "definitely в середине, инфинитив без -ing"}, transformations: [authored]}
  - {id: chunk.going-to-plans.about-to, type: chunk, title: "We're about to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, communication], meaning_ru: "мы вот-вот …", frame_of: grammar.going-to.plans, carries: [tense:future-going-to], slot_hint_ru: "действие, которое произойдёт в ближайший момент", examples: ["We're about to release the update.", "We're about to start the meeting."], contrast: {frame: "We're going to ___", note_ru: "We're about to — очень скоро; We're going to может быть позже"}, trap: {learner_form: "We're about to calling the vendor.", correction: "We're about to call the vendor.", cause_ru: "about to требует инфинитива, как и going to"}, transformations: [authored]}
