# Frames for grammar.present-perfect.duration (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.present-perfect-duration.ive-worked-for, type: chunk, title: "I've worked on ___ for ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я работаю над … в течение …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "проект и длительность (three years, five months)", examples: ["I've worked on this platform for three years without major issues.", "I've worked on the migration for six weeks now."], contrast: {frame: "I worked on ___ for ___", note_ru: "Past Simple (worked) — законченный период в прошлом; Present Perfect (I've worked) — началось в прошлом и продолжается сейчас"}, trap: {learner_form: "I work here since 2022.", correction: "I've worked here since 2022.", cause_ru: "с since нужен Present Perfect (I've worked), не Present Simple (I work)"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.weve-not-had-issues, type: chunk, title: "We've not had any issues since ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "у нас не было проблем с … (момента)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "момент времени (Monday, the last update, deployment)", examples: ["We've not had any issues since the last update.", "We've not had any downtime since Monday morning."], contrast: {frame: "We don't have issues since", note_ru: "don't have (Present Simple отрицание) против haven't had (Present Perfect)"}, trap: {learner_form: "We haven't had problems for last week.", correction: "We haven't had problems for a week.", cause_ru: "с for используется длительность (a week, three days), с since — момент (Monday, 3pm)"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.how-long-have-you, type: chunk, title: "How long have you ___?", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "как долго вы …?", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "глагол опыта + объект (worked with this client, known about this issue)", examples: ["How long have you worked with this client?", "How long have you known about this issue?"], contrast: {frame: "How long do you ___?", note_ru: "How do you (Present Simple) спрашивает о привычке; How have you (Present Perfect) — об опыте с прошлого"}, trap: {learner_form: "How long do you work here?", correction: "How long have you worked here?", cause_ru: "в вопросе о длительности от прошлого к сейчас используется Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.its-been-since, type: chunk, title: "It's been ___ since ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "прошло … с …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "длительность (three weeks, two months) и момент", examples: ["It's been two months since the service went down.", "It's been five days since we started the investigation."], contrast: {frame: "It is ___ since", note_ru: "It is (Present Simple) vs It's been (Present Perfect) — длительность с прошлого"}, trap: {learner_form: "It is three weeks since the issue started.", correction: "It's been three weeks since the issue started.", cause_ru: "для выражения прошедшей длительности нужен Present Perfect (It's been)"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.we-have-had-for, type: chunk, title: "We've had the ___ for", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "у нас есть … в течение …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "объект (contract, partnership, system) и длительность", examples: ["We've had this partnership for over a year now.", "We've had the current system for three years and it's still stable."], contrast: {frame: "We have the ___ for", note_ru: "We have (Present Simple) vs We've had (Present Perfect) — владение, начавшееся в прошлом"}, trap: {learner_form: "We have this system for two years.", correction: "We've had this system for two years.", cause_ru: "для владения, начавшегося в прошлом, нужен Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.ive-known-for, type: chunk, title: "I've known about this for ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я знаю об этом … (длительность)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "длительность (a while, a month, quite some time)", examples: ["I've known about this for months, but nothing has changed.", "We've known about this for weeks now."], contrast: {frame: "I know about this for", note_ru: "I know (Present Simple) vs I've known (Present Perfect) — знание с прошлого"}, trap: {learner_form: "I know about this for three months.", correction: "I've known about this for three months.", cause_ru: "стативный глагол know в значении владения информацией требует Present Perfect для длительности"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.the-service-has-been-since, type: chunk, title: "The service has been ___ since ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "сервис … с … (момент)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "состояние (stable, down, under maintenance) и момент", examples: ["The service has been stable since Monday night.", "The service has been down since the power outage this morning."], contrast: {frame: "The service is ___ since", note_ru: "is (Present Simple) vs has been (Present Perfect) — состояние, начавшееся в прошлом"}, trap: {learner_form: "The service is down since yesterday.", correction: "The service has been down since yesterday.", cause_ru: "для состояния, начавшегося в прошлом, нужен Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.theyve-been-testing, type: chunk, title: "They've been testing the ___ for ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "они тестируют … в течение …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "объект (feature, system, integration) и длительность", examples: ["They've been testing the integration for three weeks without approval.", "They've been testing the new export for two days straight."], contrast: {frame: "They test for", note_ru: "test (Present Simple) vs have been testing (Present Perfect Continuous) — ongoing activity с прошлого"}, trap: {learner_form: "They test the feature for two weeks.", correction: "They've been testing the feature for two weeks.", cause_ru: "действие, продолжающееся с прошлого, требует Present Perfect (Continuous или Simple)"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.since-you-joined, type: chunk, title: "Since you joined, ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "с того момента как вы присоединились, …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "результат или изменение (we've improved, productivity has grown)", examples: ["Since you joined, we've improved our response time significantly.", "Since you joined, the team has grown by three people."], contrast: {frame: "After you joined", note_ru: "Since говорит о начальном моменте; After — о более позднем времени в прошлом"}, trap: {learner_form: "Since you joined, productivity improves.", correction: "Since you joined, productivity has improved.", cause_ru: "в придаточном предложении со since используется Present Perfect в главном"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.ive-been-waiting, type: chunk, title: "I've been waiting for ___ since ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я жду … с … (момент)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "объект (approval, response) и момент", examples: ["I've been waiting for their approval since Monday morning.", "I've been waiting for the results since we submitted the request last week."], contrast: {frame: "I wait for since", note_ru: "I wait (Present Simple) vs I've been waiting (Present Perfect Continuous) — ожидание, начавшееся в прошлом"}, trap: {learner_form: "I'm waiting for the approval since Monday.", correction: "I've been waiting for the approval since Monday.", cause_ru: "ожидание, начавшееся в конкретный момент, требует Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.how-long-since, type: chunk, title: "How long is it since ___?", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "как давно (прошло сколько времени с тех пор как) …?", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "событие (we last deployed, the service crashed)", examples: ["How long is it since we last deployed to production?", "How long is it since the outage started?"], contrast: {frame: "How long does it take", note_ru: "How long is it since (длительность с момента) vs How long does it take (длительность действия)"}, trap: {learner_form: "How long since we deployed?", correction: "How long is it since we deployed?", cause_ru: "в вопросе о длительности со времени события используется is it since"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.weve-been-trying, type: chunk, title: "We've been trying for ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы пытаемся … в течение … (без результата)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "длительность (a week, three days)", examples: ["We've been trying for three days to reproduce the bug.", "We've been trying for weeks to optimize the query without success."], contrast: {frame: "We try for", note_ru: "try (Present Simple) vs have been trying (Present Perfect Continuous) — безуспешные попытки с прошлого"}, trap: {learner_form: "We try for two weeks to fix this.", correction: "We've been trying for two weeks to fix this.", cause_ru: "многократные попытки требуют Present Perfect Continuous"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.ive-not-seen, type: chunk, title: "I haven't seen ___ since ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я не видел … с … (момент)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "объект (this error, that issue) и момент", examples: ["I haven't seen that error since we applied the patch.", "I haven't seen this data corruption issue since the migration."], contrast: {frame: "I don't see ___ since ___", note_ru: "don't see (Present Simple отрицание) vs haven't seen (Present Perfect отрицание от прошлого)"}, trap: {learner_form: "I haven't see that error since Monday.", correction: "I haven't seen that error since Monday.", cause_ru: "после haven't используется третья форма (seen), не базовая (see)"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.for-two-weeks-now, type: chunk, title: "We've been working on it for two weeks now", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы работаем над этим две недели (и всё ещё работаем)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], examples: ["We've been working on it for two weeks now and progress is slow.", "They've been investigating for three days now."], contrast: {frame: "We worked on it for two weeks", note_ru: "worked (Past Simple) — закончили; have been working (Present Perfect) — всё ещё идёт"}, trap: {learner_form: "We work on it for two weeks already.", correction: "We've been working on it for two weeks now.", cause_ru: "действие, продолжающееся с прошлого в настоящее, требует Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.the-project-has-been-ongoing, type: chunk, title: "The project has been ongoing since ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "проект идёт с … (момент)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "момент (January, Q1, we started the planning)", examples: ["The project has been ongoing since January with no end date yet.", "The investigation has been ongoing since the incident was reported."], contrast: {frame: "The project goes since", note_ru: "goes (Present Simple) vs has been ongoing (Present Perfect) — начало в конкретный момент прошлого"}, trap: {learner_form: "The project is ongoing since January.", correction: "The project has been ongoing since January.", cause_ru: "для начало в прошлом используется Present Perfect (has been ongoing)"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.ever-since, type: chunk, title: "Ever since the ___, we've ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "с самого … … (момента)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "событие (deployment, upgrade, merger) и результат", examples: ["Ever since the upgrade, we've been getting more complaints about speed.", "Ever since the vendor changed the API, we've had integration issues."], contrast: {frame: "Since the ___", note_ru: "Ever since подчёркивает, что это началось тогда и продолжается; Since просто указывает начальный момент"}, trap: {learner_form: "Ever since the update, we have problems.", correction: "Ever since the update, we've had problems.", cause_ru: "после Ever since используется Present Perfect для длительности до настоящего"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.theres-been-no, type: chunk, title: "There's been no ___ for ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "не было … в течение …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "существительное (progress, communication, update) и длительность", examples: ["There's been no progress for three weeks now.", "There's been no communication from the vendor for over a month."], contrast: {frame: "There is no", note_ru: "There is (Present Simple) vs There's been (Present Perfect) — отсутствие в течение периода"}, trap: {learner_form: "There is no update for two days.", correction: "There's been no update for two days.", cause_ru: "отсутствие в течение длительности требует Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.so-far-we-have, type: chunk, title: "So far, we've ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "пока мы … (на данный момент в процессе)", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect], examples: ["So far, we've moved four of the six tables to the new database.", "So far, we've identified three root causes of the slowdown."], contrast: {frame: "So far, we complete", note_ru: "So far (к настоящему моменту) требует Present Perfect (we've completed), не Present Simple"}, trap: {learner_form: "So far we complete three tasks.", correction: "So far, we've completed three tasks.", cause_ru: "выражение So far требует Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.weve-had-the-opportunity, type: chunk, title: "We've had the chance to ___ for ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "у нас была возможность … в течение …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "действие (fix this, migrate) и длительность", examples: ["We've had the chance to fix this performance issue for months.", "We've had the chance to migrate to the new platform for weeks."], contrast: {frame: "We have the chance to ___ for ___", note_ru: "have (Present Simple) — возможность есть сейчас, без акцента на давность; have had (Present Perfect) — возможность существует уже какое-то время"}, trap: {learner_form: "We have the chance to fix this for three months.", correction: "We've had the chance to fix this for three months.", cause_ru: "владение/наличие чего-либо в течение длительности требует Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.hasnt-been-updated, type: chunk, title: "The ___ hasn't been updated for ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… не обновлялась … в течение …", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "существительное (documentation, configuration) и длительность", examples: ["The documentation hasn't been updated for over a year.", "The configuration hasn't been updated for several weeks."], contrast: {frame: "The documentation is not updated for", note_ru: "isn't updated (Present Simple отрицание) vs hasn't been updated (Present Perfect отрицание с passive)"}, trap: {learner_form: "The docs not updated for months.", correction: "The documentation hasn't been updated for months.", cause_ru: "отсутствие обновления в течение периода требует Present Perfect Passive"}, transformations: [authored]}
  - {id: chunk.present-perfect-duration.have-you-heard, type: chunk, title: "Have you heard from ___ since ___?", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы слышали от … с…?", frame_of: grammar.present-perfect.duration, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "кто (the vendor, the client) и момент", examples: ["Have you heard from the vendor since we sent the request?", "Have you heard from the client since last week?"], contrast: {frame: "Did you hear from", note_ru: "Did you hear (Past Simple вопрос) vs Have you heard (Present Perfect вопрос) — c начальным моментом и до сейчас"}, trap: {learner_form: "Have you heard from the client since last week about this?", correction: "Have you heard from the client since last week?", cause_ru: "вопрос в Present Perfect со since"}, transformations: [authored]}
