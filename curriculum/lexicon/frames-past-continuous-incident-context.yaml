# Frames for grammar.past-continuous.incident-context (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.past-continuous-incident-context.it-was-ing-when, type: chunk, title: "It was ___-ing when ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Это происходило, когда …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "действие в прогрессе + событие", examples: ["It was running tests when the network dropped.", "It was raining when the power went out."], contrast: {frame: "It ___ when ___", note_ru: "если два быстрых события, только Past Simple, без was/were"}, trap: {learner_form: "It ran tests when the network dropped.", correction: "It was running tests when the network dropped.", cause_ru: "Background action (было в процессе) требует Past Continuous, не Past Simple"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.we-were-ing-when, type: chunk, title: "We were ___-ing when ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы были в процессе …, когда …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "действие в прогрессе + быстрое событие", examples: ["We were testing the form when it crashed.", "We were cooking when the fire alarm went off."], contrast: {frame: "We ___ and then ___", note_ru: "если два события друг за другом в порядке, используй и then, не when"}, trap: {learner_form: "We tested the form when it crashed.", correction: "We were testing the form when it crashed.", cause_ru: "При русском переводе 'We tested' кажется правильным, но это two quick events, не background + event"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.at-that-time-were, type: chunk, title: "At that time we were ___-ing", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "В тот момент мы были в процессе …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "действие в процессе с маркером времени", examples: ["At that time we were reviewing the logs from Tuesday.", "At that time we were installing the new software."], contrast: {frame: "At that time we ___", note_ru: "если действие завершено, Past Simple подходит"}, trap: {learner_form: "At that time we reviewed the logs.", correction: "At that time we were reviewing the logs.", cause_ru: "'At that time' требует фона (процесс), не завершённого действия"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.i-was-ing-when, type: chunk, title: "I was ___-ing when ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Я был в процессе …, когда …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "действие первого лица в процессе", examples: ["I was checking the database when the server disconnected.", "I was downloading the file when it froze."], contrast: {frame: "I ___ when ___", note_ru: "нельзя пропустить was и -ing"}, trap: {learner_form: "I was check the database when the server disconnected.", correction: "I was checking the database when the server disconnected.", cause_ru: "After was need -ing form, не базовый глагол"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.while-were-ing, type: chunk, title: "While we were ___-ing", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Пока мы были в процессе …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "действие в процессе с маркером while", examples: ["While we were deploying the update, the backup failed.", "While we were talking to the client, the network went down."], contrast: {frame: "While we ___", note_ru: "while = одновременное действие, требует Past Continuous для фона"}, trap: {learner_form: "While we deployed the update, the backup failed.", correction: "While we were deploying the update, the backup failed.", cause_ru: "While требует Past Continuous для длительного действия-фона, не Past Simple"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.they-were-ing, type: chunk, title: "They were ___-ing when ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Они были в процессе …, когда …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "третье лицо множественное в процессе", examples: ["They were fixing the issue when we lost connection.", "They were having lunch when the alarm sounded."], contrast: {frame: "They ___ the issue", note_ru: "если действие завершилось → Past Simple"}, trap: {learner_form: "They was fixing the issue.", correction: "They were fixing the issue.", cause_ru: "They требует were, не was"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.the-was-ing, type: chunk, title: "The ___ was ___-ing", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "… было в процессе …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "существительное + was + action-ing", examples: ["The system was processing requests at that time.", "The upload was running when the connection dropped."], contrast: {frame: "The ___ ___", note_ru: "если состояние, не действие, может быть просто Past Simple: The system was down"}, trap: {learner_form: "The system was process requests.", correction: "The system was processing requests.", cause_ru: "После was нужна -ing форма, не базовый глагол"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.she-was-ing-at, type: chunk, title: "She was ___-ing at that time", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Она была в процессе … в тот момент", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "женское лицо, действие в процессе с маркером времени", examples: ["She was working on the backup when the server rebooted.", "She was studying the manual when the issue appeared."], contrast: {frame: "She ___ at that time", note_ru: "если было состояние (she was busy), не action in progress"}, trap: {learner_form: "She was work on the backup.", correction: "She was working on the backup.", cause_ru: "После was нужна форма на -ing, не инфинитив"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.the-server-was, type: chunk, title: "The server was ___-ing slowly", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Сервер был … медленно (в процессе)", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "сервер в процессе + наречие скорости", examples: ["The server was running slowly during the morning.", "The database was responding slowly before the update."], contrast: {frame: "The server is ___", note_ru: "present continuous — для текущей проблемы, Past Continuous — для инцидента в прошлом"}, trap: {learner_form: "The server was run slowly.", correction: "The server was running slowly.", cause_ru: "После was нужна -ing, не инфинитив или база"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.when-error-occurred-were, type: chunk, title: "When the error occurred, we were ___-ing", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Когда ошибка произошла, мы были в процессе …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "быстрое событие + фон в Past Continuous", examples: ["When the error occurred, we were examining the code.", "When the alarm sounded, we were checking the status."], contrast: {frame: "When the error occurred, we ___", note_ru: "Когда two быстрых события → оба Past Simple"}, trap: {learner_form: "When the error occurred, we were examine the code.", correction: "When the error occurred, we were examining the code.", cause_ru: "После were нужна -ing форма, не базовый глагол"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.was-about-to-when, type: chunk, title: "I was about to ___ when ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Я был на грани того, чтобы … когда …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "намерение, прерванное событием", examples: ["I was about to send the email when the system crashed.", "I was about to commit the changes when the alarm went off."], contrast: {frame: "I decided to ___", note_ru: "decided требует просто инфинитива, не was about to"}, trap: {learner_form: "I was about to sent the email when the crash happened.", correction: "I was about to send the email when the system crashed.", cause_ru: "После to need базовый глагол, не третья форма"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.you-were-ing-when, type: chunk, title: "You were ___-ing when ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Вы были в процессе …, когда …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "второе лицо в процессе + событие", examples: ["You were testing the flow when the issue appeared.", "You were configuring the router when the power went out."], contrast: {frame: "You ___ when ___", note_ru: "если оба события быстрые → оба Past Simple"}, trap: {learner_form: "You were test the flow when the issue appeared.", correction: "You were testing the flow when the issue appeared.", cause_ru: "После were need -ing, не base form"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.not-were-ing, type: chunk, title: "We were not ___-ing when ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы не были в процессе …, когда …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:negative, structure:time-marker], slot_hint_ru: "отрицание действия в процессе", examples: ["We were not testing anything when the crash happened.", "We were not downloading files when the connection dropped."], contrast: {frame: "We didn't ___ when ___", note_ru: "didn't требует Past Simple, для действий, а не для background"}, trap: {learner_form: "We were not test anything when it crashed.", correction: "We were not testing anything when the crash happened.", cause_ru: "После not be need -ing, не база"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.were-you-ing-when, type: chunk, title: "Were you ___-ing when ___?", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Вы были в процессе …, когда …?", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:question-be, structure:time-marker], slot_hint_ru: "вопрос о действии в процессе", examples: ["Were you testing the form when it froze?", "Were you backing up data when the server went down?"], contrast: {frame: "Did you ___ when ___", note_ru: "Did требует Past Simple для завершённых действий"}, trap: {learner_form: "Were you test the form when it froze?", correction: "Were you testing the form when it froze?", cause_ru: "В вопросе с be need -ing, не базовый глагол"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.what-was-ing, type: chunk, title: "What was the team ___-ing?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Что команда делала (в процессе)?", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:question-wh, structure:time-marker], slot_hint_ru: "WH-вопрос о действии в процессе", examples: ["What was the team testing when the error appeared?", "What was the system processing when the crash happened?"], contrast: {frame: "What did the team ___", note_ru: "Did требует Past Simple для завершённого действия"}, trap: {learner_form: "What was the team test when the error appeared?", correction: "What was the team testing when the error appeared?", cause_ru: "В WH-вопросе с was need -ing, не база"}, transformations: [authored]}
  - {id: chunk.past-continuous-incident-context.reason-were-ing, type: chunk, title: "That's why we were ___-ing", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Поэтому мы были в процессе …", frame_of: grammar.past-continuous.incident-context, carries: [tense:past-continuous, structure:time-marker], slot_hint_ru: "причина действия в процессе", examples: ["That's why we were testing the payment at noon.", "That's why we were monitoring the system overnight."], contrast: {frame: "That's why we ___", note_ru: "если Past Simple → одноразовое действие, а не background process"}, trap: {learner_form: "That's why we was testing the payment.", correction: "That's why we were testing the payment.", cause_ru: "We требует were, не was"}, transformations: [authored]}
