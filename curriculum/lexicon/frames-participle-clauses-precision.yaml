# Frames for grammar.participle-clauses.precision (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.participle-clauses-precision.resulting-in, type: chunk, title: "___, resulting in ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "…, в результате чего …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "завершённое событие + следствие", examples: ["The cache was corrupted during the migration, resulting in performance degradation.", "The vendor delayed shipment by three weeks, resulting in missed deadlines across the project."], contrast: {frame: "___, so ___", note_ru: "так структура более прямая, participle clause более сжата и формальна"}, trap: {learner_form: "The migration corrupted the cache, resulting to performance degradation.", correction: "The migration corrupted the cache, resulting in performance degradation.", cause_ru: "resulting in (не resulting to)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.leaving-unresolved, type: chunk, title: "___, leaving ___ unresolved", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, troubleshooting], meaning_ru: "…, оставляя … неразрешённым", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "вызывающее событие + оставшаяся проблема", examples: ["The first patch addressed the security vulnerability, leaving performance issues unresolved.", "The initial review caught syntactic errors, leaving semantic validation unresolved."], contrast: {frame: "___, but ___ remained", note_ru: "but clause более явна, participle clause более сжата и литературна"}, trap: {learner_form: "The patch addressed the vulnerability, leaving unresolved performance issues.", correction: "The patch addressed the vulnerability, leaving performance issues unresolved.", cause_ru: "порядок: leaving + объект + unresolved (не leaving + unresolved + объект)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.given-the, type: chunk, title: "Given the ___, ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "учитывая …, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "условие или контекст + вывод", examples: ["Given the constraints, we chose to defer refactoring.", "Given the urgency, management authorized overtime budgets."], contrast: {frame: "Because of the ___", note_ru: "because of более причинна, given the более условна и аналитична"}, trap: {learner_form: "Giving the constraints, we deferred refactoring.", correction: "Given the constraints, we deferred refactoring.", cause_ru: "given (не giving) — используй завершённый participle"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.based-on-the, type: chunk, title: "Based on the ___, ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting, data], meaning_ru: "на основе …, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "источник доказательства + вывод", examples: ["Based on the log analysis, we identified a memory leak in the caching layer.", "Based on the survey data, the team prioritized usability improvements."], contrast: {frame: "From the ___", note_ru: "from более краток, based on более явно показывает методологию"}, trap: {learner_form: "Basing on the log analysis, we identified a memory leak.", correction: "Based on the log analysis, we identified a memory leak.", cause_ru: "нужен past participle (based), а не present participle (basing) — 'based on' стандартная формула"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.compared-with, type: chunk, title: "Compared with ___, ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, data], meaning_ru: "в сравнении с …, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "альтернатива + находка", examples: ["Compared with the previous quarter, retention improved by 12%.", "Compared with the legacy system, the new architecture reduced latency by 40%."], contrast: {frame: "In comparison to ___", note_ru: "prepositional phrase более простая, participle clause более интегрирована в предложение"}, trap: {learner_form: "Comparing with the quarter, retention improved.", correction: "Compared with the quarter, retention improved.", cause_ru: "compared (не comparing) — используй past participle"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.once-completed, type: chunk, title: "Once completed, ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, planning], meaning_ru: "как только это завершено, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause, structure:time-marker], slot_hint_ru: "следующий шаг или результат", examples: ["Once completed, the migration required no further validation.", "Once completed, the renovation transformed the whole apartment."], contrast: {frame: "After it was completed, ___", note_ru: "participle clause компактнее; после явного 'it was' — обычный порядок слов"}, trap: {learner_form: "Once completing, the migration required no further validation.", correction: "Once completed, the migration required no further validation.", cause_ru: "нужен past participle (completed), а не present participle (completing) — действие уже завершено"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.having-completed, type: chunk, title: "Having ___, ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "завершив …, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "предшествующее действие + следующее событие", examples: ["Having completed calibration, the researchers started the trial.", "Having reviewed feedback, management finalized the policy."], contrast: {frame: "After they had ___, ___", note_ru: "after clause показывает последовательность яснее, having clause более сжата"}, trap: {learner_form: "Having complete the calibration, researchers began.", correction: "Having completed the calibration, researchers began.", cause_ru: "completed (не complete) — нужна форма причастия прошедшего времени (3-я форма)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.not-considering, type: chunk, title: "Not considering ___, the team ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, troubleshooting], meaning_ru: "не учитав …, команда …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause, structure:negative], slot_hint_ru: "упущенный фактор + результат ошибки", examples: ["Not considering the timezone differences, the team scheduled a cross-region meeting at an inconvenient time.", "Not considering database indices, the team wrote a query that caused timeouts."], contrast: {frame: "The team did not consider ___", note_ru: "clause с didn't более явна в отношении агента, participle clause более компактна"}, trap: {learner_form: "Not considering the timezone differences, a meeting was scheduled.", correction: "Not considering the timezone differences, the team scheduled a meeting.", cause_ru: "субъект причастного оборота должен совпадать с подлежащим главного предложения — нужен явный субъект (the team), а не пассив без агента"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.surprised-by, type: chunk, title: "Surprised by ___, the team ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "удивлённая …, команда …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "неожиданное событие + реакция", examples: ["Surprised by the rapid adoption, the team accelerated development of new features.", "Surprised by the user feedback, the team allocated additional resources."], contrast: {frame: "The team was surprised by ___", note_ru: "clause более явна, participle phrase более компактна и интегрирована"}, trap: {learner_form: "Surprising by the adoption, the team accelerated.", correction: "Surprised by the adoption, the team accelerated.", cause_ru: "surprised (не surprising) — нужен past participle, а не present participle (действие направлено на подлежащее, не от него)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.provided-that, type: chunk, title: "Provided that ___, ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "при условии что …, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "условие + следствие", examples: ["Provided that the infrastructure upgrade is complete, we proceed with migration.", "Provided that all tests pass, deployment can occur automatically."], contrast: {frame: "If ___", note_ru: "if clause более простая, provided that более формальна и ясна в отношении условия"}, trap: {learner_form: "Providing that tests pass, we deploy.", correction: "Provided that tests pass, we deploy.", cause_ru: "provided (не providing) — используй past participle как условный маркер"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.using-the, type: chunk, title: "Using the ___, we ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, technology], meaning_ru: "используя …, мы …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "инструмент или подход + результат", examples: ["Using the new monitoring tool, we detected bottlenecks quickly.", "Using the phased rollout approach, we reduced deployment risk."], contrast: {frame: "By using ___", note_ru: "by using более причинна, using clause более прямолинейна в описании метода"}, trap: {learner_form: "Using the tool, the bottleneck detected.", correction: "Using the tool, we detected the bottleneck.", cause_ru: "нужен явный субъект (we) — 'the bottleneck detected' грамматически подразумевает пассив без агента"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.without-proper, type: chunk, title: "Without proper ___, the system ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, troubleshooting], meaning_ru: "без надлежащего …, система …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause, structure:negative], slot_hint_ru: "отсутствующий элемент + проблема", examples: ["Without proper versioning, the system produced conflicting changes.", "Without proper maintenance, the system will fail eventually."], contrast: {frame: "The system ___ because there was no ___", note_ru: "clause более явна в причинности, participle phrase более компактна"}, trap: {learner_form: "Without proper versioning, the changes conflicted unpredictable.", correction: "Without proper versioning, the changes conflicted unpredictably.", cause_ru: "после глагола нужно наречие (unpredictably), а не прилагательное (unpredictable)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.adjusted-to, type: chunk, title: "Adjusted to ___, the plan ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "адаптирован под …, план …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "новое условие + адаптация", examples: ["Adjusted to regulatory requirements, the plan delayed the rollout.", "Adjusted to market feedback, the plan shifted direction."], contrast: {frame: "The plan was adjusted to ___", note_ru: "clause более явна в agency, participle phrase более компактна и литературна"}, trap: {learner_form: "Adjusting to regulatory requirements, the plan was delayed.", correction: "Adjusted to regulatory requirements, the plan was delayed.", cause_ru: "adjusted (не adjusting) — нужен past participle, а не present participle (план сам был скорректирован, а не корректирует)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.depending-on, type: chunk, title: "Depending on ___, ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, planning], meaning_ru: "в зависимости от …, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "переменная + результат", examples: ["Depending on the load profile, the system automatically scaled between 5 and 50 instances.", "Depending on available bandwidth, the sync interval adjusted dynamically."], contrast: {frame: "It depends on ___", note_ru: "clause личнее и более условна, depending on более прямолинейна в описании переменной"}, trap: {learner_form: "Depending the load profile, the system scaled.", correction: "Depending on the load profile, the system scaled.", cause_ru: "depending on (не depending the)"}, transformations: [authored]}
  - {id: chunk.participle-clauses-precision.excluding-the, type: chunk, title: "Excluding the ___, ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, data], meaning_ru: "исключая …, …", frame_of: grammar.participle-clauses.precision, carries: [structure:participle-clause], slot_hint_ru: "исключение + основное событие", examples: ["Excluding the legacy system, all services deployed successfully.", "Excluding the test nodes, the entire infrastructure remained stable."], contrast: {frame: "Except for the ___", note_ru: "prepositional phrase более простая, excluding более явно показывает действие фильтрации"}, trap: {learner_form: "Excluding the legacy system, deployment success.", correction: "Excluding the legacy system, deployment succeeded.", cause_ru: "после причастного оборота нужно полное предложение с глаголом (deployment succeeded), а не фраза без глагола (deployment success)"}, transformations: [authored]}
