# Frames for grammar.passive.reporting-structures (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.passive-reporting-structures.it-is-expected-that, type: chunk, title: "It is expected that ___", cefr: B2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Ожидается, что …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["It is expected that the response time will improve next quarter.", "It is expected that all stakeholders will approve the proposal."], contrast: {frame: "We expect that ___", note_ru: "It is expected более дистанцировано, не указывает на источник"}, trap: {learner_form: "It is expected the response time will improve.", correction: "It is expected that the response time will improve.", cause_ru: "нужно that перед придаточным предложением"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.is-said-to, type: chunk, title: "The vendor is said to ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Говорят, что поставщик …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], slot_hint_ru: "глагол базовой формы", examples: ["The vendor is said to have misrepresented the timeline.", "The API is said to be vulnerable to injection attacks."], contrast: {frame: "They say the vendor ___", note_ru: "passive более вежливо дистанцирует утверждение"}, trap: {learner_form: "The vendor is said have misrepresented.", correction: "The vendor is said to have misrepresented.", cause_ru: "нужен to перед глаголом"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.is-believed-to-have, type: chunk, title: "The outage is believed to have ___", cefr: B2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Считается, что отключение …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech, tense:modal-perfect], examples: ["The outage is believed to have started during the certificate rotation.", "The bug is believed to have affected only legacy systems."], contrast: {frame: "Experts believe that the outage ___", note_ru: "пассив звучит более безлично"}, trap: {learner_form: "The outage is believed to started.", correction: "The outage is believed to have started.", cause_ru: "нужно to have перед глаголом третьей формы"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.it-was-reported-that, type: chunk, title: "It was reported that ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Было сообщено, что …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["It was reported that the new filter reduces false alerts by 40 percent.", "It was reported that the incident lasted six hours."], contrast: {frame: "They reported that ___", note_ru: "passive structure более формально"}, trap: {learner_form: "It was reported that will improve.", correction: "It was reported that it would improve.", cause_ru: "в reported speech используется would вместо will"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.are-thought-to, type: chunk, title: "The changes are thought to ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Считается, что изменения …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["The changes are thought to improve throughput significantly.", "The metrics are thought to reflect real user experience."], contrast: {frame: "We think the changes ___", note_ru: "пассив звучит более отстранённо"}, trap: {learner_form: "The changes are thought improving throughput.", correction: "The changes are thought to improve throughput.", cause_ru: "нужен to перед базовой формой глагола"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.is-known-to-have, type: chunk, title: "The issue is known to have ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Известно, что проблема …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["The issue is known to have occurred in production three times.", "The library is known to have security vulnerabilities."], contrast: {frame: "We know the issue ___", note_ru: "passive структура для дистанции"}, trap: {learner_form: "The issue is known to occur three times.", correction: "The issue is known to have occurred three times.", cause_ru: "для прошлого события нужно to have, не просто to"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.is-assumed-to, type: chunk, title: "The root cause is assumed to be ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Предполагается, что причина …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["The root cause is assumed to be a misconfiguration.", "The delay is assumed to be temporary."], contrast: {frame: "We assume the root cause ___", note_ru: "passive более непредвзято"}, trap: {learner_form: "The cause is assumed to be misconfiguration.", correction: "The cause is assumed to be a misconfiguration.", cause_ru: "нужен артикль перед существительным"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.it-has-been-reported-that, type: chunk, title: "It has been reported that ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Сообщалось, что … (с present perfect для недавнего события)", frame_of: grammar.passive.reporting-structures, carries: [tense:present-perfect, tense:passive, tense:reported-speech], examples: ["It has been reported that the new framework improves deployment speed.", "It has been reported that memory leaks have been resolved."], contrast: {frame: "It was reported that ___", note_ru: "has been reported указывает на недавнее событие"}, trap: {learner_form: "It has been reported the new version will improve performance.", correction: "It has been reported that the new version will improve performance.", cause_ru: "нужно that"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.appears-to, type: chunk, title: "The pattern appears to ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Похоже, что паттерн …", frame_of: grammar.passive.reporting-structures, carries: [structure:hedging], examples: ["The pattern appears to correlate with increased traffic.", "The issue appears to stem from the recent update."], contrast: {frame: "It appears that the pattern ___", note_ru: "appears to используется с инфинитивом"}, trap: {learner_form: "The pattern appears correlate.", correction: "The pattern appears to correlate.", cause_ru: "нужен to перед инфинитивом"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.is-claimed-to-have, type: chunk, title: "The feature is claimed to have ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Утверждается, что функция …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["The feature is claimed to have reduced latency by half.", "The algorithm is claimed to have outperformed competitors."], contrast: {frame: "They claim the feature ___", note_ru: "passive форма более дистанцирует утверждение"}, trap: {learner_form: "The feature is claimed reduced latency.", correction: "The feature is claimed to have reduced latency.", cause_ru: "нужен to have перед глаголом"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.it-is-understood-that, type: chunk, title: "It is understood that ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Понимается, что … (более формально)", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["It is understood that the budget constraints affect timelines.", "It is understood that the vendor will provide documentation."], contrast: {frame: "We understand that ___", note_ru: "it is understood звучит более дипломатично"}, trap: {learner_form: "It is understood the budget affects.", correction: "It is understood that the budget affects.", cause_ru: "нужно that"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.is-reported-to, type: chunk, title: "The dependency is reported to be ___", cefr: B2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, technology], meaning_ru: "Сообщается, что зависимость …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["The dependency is reported to be vulnerable in version 3.x.", "The service is reported to be offline in the EU region."], contrast: {frame: "They report the dependency ___", note_ru: "пассив звучит более отстранённо"}, trap: {learner_form: "The dependency is reported offline.", correction: "The dependency is reported to be offline.", cause_ru: "нужен to be для predicate adjective"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.appears-to-have, type: chunk, title: "The commit appears to have ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, technology], meaning_ru: "Похоже, что коммит …", frame_of: grammar.passive.reporting-structures, carries: [structure:hedging], examples: ["The commit appears to have introduced the regression.", "The change appears to have resolved the intermittent failures."], contrast: {frame: "It appears the commit ___", note_ru: "appears to have для прошлого события"}, trap: {learner_form: "The commit appears introduced the bug.", correction: "The commit appears to have introduced the bug.", cause_ru: "нужен to have перед глаголом"}, transformations: [authored]}
  - {id: chunk.passive-reporting-structures.is-documented-to, type: chunk, title: "The behavior is documented to ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, technology], meaning_ru: "Задокументировано, что поведение …", frame_of: grammar.passive.reporting-structures, carries: [tense:passive, tense:reported-speech], examples: ["The behavior is documented to occur only with legacy versions.", "The optimization is documented to provide ten percent gains."], contrast: {frame: "Documentation shows the behavior ___", note_ru: "is documented to более спокойно и формально"}, trap: {learner_form: "The behavior is documented occur.", correction: "The behavior is documented to occur.", cause_ru: "нужен to перед инфинитивом"}, transformations: [authored]}
