  - {id: chunk.past-participle-forms.pages-have-been-created, type: chunk, title: "The pages have been created", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "страницы были созданы", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], examples: ["The pages have been created and deployed.", "All documentation pages have been created."], contrast: {frame: "The pages were created", note_ru: "were created — Past Simple, have been created — Present Perfect результат"}, trap: {learner_form: "The pages have create and deployed.", correction: "The pages have been created and deployed.", cause_ru: "created — третья форма create, требуется have + been"}, transformations: [authored]}
