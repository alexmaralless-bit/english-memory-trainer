  - {id: chunk.past-participle-forms.issue-has-been-resolved, type: chunk, title: "The issue has been resolved", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "проблема была решена", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], examples: ["The issue has been resolved successfully.", "The bug has been resolved in the latest build."], contrast: {frame: "The issue was resolved", note_ru: "was resolved — Past Simple, has been resolved — Present Perfect результат"}, trap: {learner_form: "The issue has resolve successfully.", correction: "The issue has been resolved successfully.", cause_ru: "resolved — третья форма resolve, требуется have + been"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.ive-done-it, type: chunk, title: "I've done it", cefr: A2, curriculum_priority_band: CORE, register: casual, transparency: transparent, domains: [work, everyday-life], meaning_ru: "я это сделал(а)", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect], examples: ["I've done it and it works perfectly.", "I've done it as requested."], contrast: {frame: "I did it", note_ru: "I did it — Past Simple, I've done it — Present Perfect результат"}, trap: {learner_form: "I have do it and it works.", correction: "I've done it and it works.", cause_ru: "done — третья форма do, не базовая do"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.feature-has-been-tested, type: chunk, title: "The feature has been tested", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "функция была протестирована", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], examples: ["The feature has been tested on all browsers.", "The new code has been tested thoroughly."], contrast: {frame: "The feature was tested", note_ru: "was tested — Past Simple, has been tested — Present Perfect (результат важен сейчас)"}, trap: {learner_form: "The feature has test on all browsers.", correction: "The feature has been tested on all browsers.", cause_ru: "tested — третья форма test, требуется have + been"}, transformations: [authored]}
