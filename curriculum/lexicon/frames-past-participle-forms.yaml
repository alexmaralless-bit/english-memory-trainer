  - {id: chunk.past-participle-forms.i-have-found, type: chunk, title: "I have found", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я нашел(а)", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect], examples: ["I have found a workaround for the issue.", "I have found the source of the problem."], contrast: {frame: "I found", note_ru: "I found + время → Past Simple, I have found — Present Perfect результат"}, trap: {learner_form: "I have find a workaround.", correction: "I have found a workaround.", cause_ru: "found — третья форма find, не базовая find"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.has-been-made, type: chunk, title: "___ has been made", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "… было принято/сделано", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], slot_hint_ru: "существительное", examples: ["A decision has been made about the budget.", "Progress has been made on the migration."], contrast: {frame: "___ was made", note_ru: "was made — Past Simple, has been made указывает на актуальный результат"}, trap: {learner_form: "The decision has make about the project.", correction: "A decision has been made about the project.", cause_ru: "made — третья форма make, требуется have + been"}, transformations: [authored]}
