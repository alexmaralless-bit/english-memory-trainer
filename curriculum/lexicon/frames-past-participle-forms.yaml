# Frames for grammar.past-participle.forms (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.past-participle-forms.its-done, type: chunk, title: "It's done", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "это готово, это сделано", frame_of: grammar.past-participle.forms, carries: [tense:passive], examples: ["It's done — the report is ready for review.", "The system installation is done and working well."], contrast: {frame: "It's finished", note_ru: "both suggest completion, but done используется часто с passive forms (is done)"}, trap: {learner_form: "It's make it done.", correction: "It's done.", cause_ru: "done — третья форма do, не нужно повторять глагол"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.has-been-sent, type: chunk, title: "___ has been sent", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "… было отправлено", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], slot_hint_ru: "существительное", examples: ["The email has been sent to all members.", "The confirmation has been sent to the client."], contrast: {frame: "___ was sent", note_ru: "was sent — Past Simple passive, has been sent указывает на результат, актуальный сейчас"}, trap: {learner_form: "The email has sent to all members.", correction: "The email has been sent to all members.", cause_ru: "пассив требует been + sent (третья форма), не just sent"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.i-have-sent, type: chunk, title: "I have sent", cefr: A2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "я отправил(а)", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect], examples: ["I have sent the document to your email.", "I have sent the invoice and receipt."], contrast: {frame: "I sent", note_ru: "sent с временным маркером → Past Simple, have sent без маркера → Present Perfect"}, trap: {learner_form: "I have send the document.", correction: "I have sent the document.", cause_ru: "sent — третья форма send, не базовая send"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.it-was-written, type: chunk, title: "It was written", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "это было написано", frame_of: grammar.past-participle.forms, carries: [tense:past-simple, tense:passive], examples: ["It was written last week by the team.", "The spec was written in 2026."], contrast: {frame: "It was wrote", note_ru: "wrote — Past Simple active form, written — третья форма для passive"}, trap: {learner_form: "It was write in the spec.", correction: "It was written in the spec.", cause_ru: "пассив требует be + written (третья форма), не write"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.documentation-has-been-written, type: chunk, title: "The documentation has been written", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "документация была написана", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], examples: ["The documentation has been written and is ready.", "The spec has been written by the architect."], contrast: {frame: "The documentation was written", note_ru: "was written — Past Simple, has been written — Present Perfect с результатом"}, trap: {learner_form: "The documentation has write been ready.", correction: "The documentation has been written and is ready.", cause_ru: "Порядок: have + been + written; written — третья форма"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.the-system-has-been-built, type: chunk, title: "The system has been built", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "система была построена", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], examples: ["The system has been built to handle high load.", "The platform has been built from scratch."], contrast: {frame: "The system was built", note_ru: "was built — прошлое событие, has been built — результат, актуальный сейчас"}, trap: {learner_form: "The system has build from scratch.", correction: "The system has been built from scratch.", cause_ru: "пассив требует been + built, не build или builded"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.we-have-built, type: chunk, title: "We have built", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы построили", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect], examples: ["We have built a new feature.", "We have built three microservices."], contrast: {frame: "We built", note_ru: "We built + время → Past Simple, We have built без времени → Present Perfect"}, trap: {learner_form: "We have build a new feature.", correction: "We have built a new feature.", cause_ru: "built — третья форма build, не базовая build"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.has-been-broken, type: chunk, title: "___ has been broken", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "… было сломано", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], slot_hint_ru: "существительное", examples: ["The API has been broken since Tuesday.", "The link has been broken for a week."], contrast: {frame: "___ was broken", note_ru: "was broken — Past Simple, has been broken — Present Perfect показывающее состояние с того времени"}, trap: {learner_form: "The API has break since Tuesday.", correction: "The API has been broken since Tuesday.", cause_ru: "broken — третья форма break, не базовая break"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.what-has-been-done, type: chunk, title: "What has been done?", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "что было сделано?", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive, structure:question-do], examples: ["What has been done? The client is asking for an update.", "What has been done to improve performance?"], contrast: {frame: "What was done?", note_ru: "What was done? указывает на прошлое, What has been done? указывает на результат, актуальный сейчас"}, trap: {learner_form: "What has do about the issue?", correction: "What has been done about the issue?", cause_ru: "done — третья форма do, требуется been для пассива"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.they-have-gone, type: chunk, title: "They have gone", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "они ушли, они уехали", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect], examples: ["They have gone to the conference.", "The team has gone home for the day."], contrast: {frame: "They went", note_ru: "They went в прошлом, They have gone указывает на их отсутствие сейчас"}, trap: {learner_form: "They have go to the conference.", correction: "They have gone to the conference.", cause_ru: "gone — третья форма go (неправильный глагол), не базовая go"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.has-been-seen, type: chunk, title: "___ has been seen", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… было видно", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], slot_hint_ru: "существительное", examples: ["An improvement has been seen in the metrics.", "A pattern has been seen in the logs."], contrast: {frame: "___ was seen", note_ru: "was seen — Past Simple, has been seen указывает на актуальный результат"}, trap: {learner_form: "An improvement has see in the metrics.", correction: "An improvement has been seen in the metrics.", cause_ru: "seen — третья форма see, требуется been для пассива"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.i-have-seen, type: chunk, title: "I have seen", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication, everyday-life], meaning_ru: "я видел(а)", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect], examples: ["I have seen the updates in production.", "I have seen that error many times."], contrast: {frame: "I saw", note_ru: "I saw + время → Past Simple, I have seen — жизненный опыт"}, trap: {learner_form: "I have see that error.", correction: "I have seen that error.", cause_ru: "seen — третья форма see, не базовая see"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.has-been-taken, type: chunk, title: "___ has been taken", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "… было взято", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect, tense:passive], slot_hint_ru: "существительное", examples: ["A backup has been taken daily.", "The necessary steps have been taken."], contrast: {frame: "___ was taken", note_ru: "was taken — Past Simple, has been taken — Present Perfect (результат важен сейчас)"}, trap: {learner_form: "The steps has take action.", correction: "The necessary steps have been taken.", cause_ru: "taken — третья форма take, требуется have/has + been"}, transformations: [authored]}
  - {id: chunk.past-participle-forms.we-have-taken, type: chunk, title: "We have taken", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы предприняли", frame_of: grammar.past-participle.forms, carries: [tense:present-perfect], examples: ["We have taken all necessary precautions.", "We have taken your feedback into account."], contrast: {frame: "We took", note_ru: "We took + время → Past Simple, We have taken — Present Perfect результат"}, trap: {learner_form: "We have take the necessary precautions.", correction: "We have taken the necessary precautions.", cause_ru: "taken — третья форма take (неправильный), не базовая take"}, transformations: [authored]}
