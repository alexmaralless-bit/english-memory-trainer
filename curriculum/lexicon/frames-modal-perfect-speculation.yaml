# Frames for grammar.modal-perfect.speculation (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.modal-perfect-speculation.must-have-sent, type: chunk, title: "The ___ must have ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "…, вероятно, ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "существительное + прошедшее причастие", examples: ["The server must have crashed during the update.", "The token must have expired before we sent the request."], contrast: {frame: "The ___ should have ___", note_ru: "should have — не предположение, а ожидание/упрёк: так должно было быть, но не случилось"}, trap: {learner_form: "The server must had crashed.", correction: "The server must have crashed.", cause_ru: "после must используется have, не had"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.might-have-been, type: chunk, title: "It might have been ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это мог бы быть ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "причина или объяснение", examples: ["It might have been a network timeout.", "It might have been caused by the recent patch."], contrast: {frame: "It was ___", note_ru: "утверждение факта, а не предположение"}, trap: {learner_form: "It might be been a timeout.", correction: "It might have been a timeout.", cause_ru: "might have, не might be"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.could-have-been, type: chunk, title: "We could have ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы могли бы ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "альтернативное действие в прошлом", examples: ["We could have prevented this issue with better logging.", "We could have scaled the service earlier."], contrast: {frame: "We can ___", note_ru: "настоящее, а не гипотеза о прошлом"}, trap: {learner_form: "We could of prevented the issue.", correction: "We could have prevented the issue.", cause_ru: "'could have', не 'could of' (хотя звучит похоже)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.you-should-have-checked, type: chunk, title: "You should have ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "вам следовало бы ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "действие, которое следовало сделать", examples: ["You should have run the tests before deploying.", "You should have checked the logs for errors."], contrast: {frame: "You should ___", note_ru: "совет для будущего, а не упрёк за прошлое"}, trap: {learner_form: "You should have went to check the status.", correction: "You should have checked the status.", cause_ru: "после have используется прошедшее причастие (checked, не went)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.cannot-have-received, type: chunk, title: "She cannot have ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она не могла ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "действие, которое не произошло", examples: ["She cannot have received the message because the mail server was down.", "They cannot have completed the task in that time frame."], contrast: {frame: "She did not ___", note_ru: "утверждение факта, не логический вывод"}, trap: {learner_form: "She cannot have receive the email.", correction: "She cannot have received the email.", cause_ru: "после have используется прошедшее причастие (received)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.it-cant-have-been, type: chunk, title: "It can't have been ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это не могло быть ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "исключённая причина или объяснение", examples: ["It can't have been the disk space because we had plenty.", "It can't have been a permission issue."], contrast: {frame: "It was not ___", note_ru: "утверждение, что это не так"}, trap: {learner_form: "It can't have be the issue.", correction: "It can't have been the issue.", cause_ru: "после have используется been (не be)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.may-have-retried, type: chunk, title: "The worker may have ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "рабочий процесс, возможно, ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "действие, которое могло произойти", examples: ["The worker may have retried the request before the lock expired.", "The worker may have crashed before completing the retry."], contrast: {frame: "Maybe the worker ___", note_ru: "менее формальный способ выражения предположения"}, trap: {learner_form: "The process may have retry the operation.", correction: "The process may have retried the operation.", cause_ru: "после have используется прошедшее причастие (retried)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.might-not-have-noticed, type: chunk, title: "They might not have ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "они, возможно, не ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "действие, которое не произошло", examples: ["They might not have noticed the warning in the logs.", "The user might not have understood the error message."], contrast: {frame: "They did not ___", note_ru: "утверждение факта"}, trap: {learner_form: "They might have not noticed the warning.", correction: "They might not have noticed the warning.", cause_ru: "not ставится после might, а не после have"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.would-have-worked, type: chunk, title: "That would have ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "это бы ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "гипотетический результат", examples: ["That would have worked if the parameters were correct.", "The fix would have solved the problem back then."], contrast: {frame: "That does ___", note_ru: "настоящее время, а не гипотеза"}, trap: {learner_form: "That would have work if conditions were right.", correction: "That would have worked if conditions were right.", cause_ru: "после have используется прошедшее причастие (worked)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.cant-you-have-checked, type: chunk, title: "Couldn't you have ___?", cefr: B2, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, communication], meaning_ru: "не мог бы ты ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "действие, которое лучше было бы сделать", examples: ["Couldn't you have tested the code before pushing?", "Couldn't you have informed me sooner about the delay?"], contrast: {frame: "Why didn't you ___?", note_ru: "более прямое и менее вежливое"}, trap: {learner_form: "Couldn't you test the code earlier.", correction: "Couldn't you have tested the code earlier.", cause_ru: "нужно couldn't + have + причастие прошедшего времени (tested), а не простое прошедшее"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.should-not-have-relied, type: chunk, title: "We should not have ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "нам не следовало ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "ошибочное действие в прошлом", examples: ["We should not have relied on a single source of truth.", "We should not have skipped the security audit."], contrast: {frame: "We should ___", note_ru: "совет для будущего"}, trap: {learner_form: "We should not have skip the review.", correction: "We should not have skipped the review.", cause_ru: "после have используется прошедшее причастие (skipped)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.might-have-failed, type: chunk, title: "The request might have ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "запрос, возможно, ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "возможное событие", examples: ["The request might have timed out during transmission.", "The transaction might have been rolled back silently."], contrast: {frame: "The request did ___", note_ru: "утверждение того, что произошло"}, trap: {learner_form: "The request might have timeout.", correction: "The request might have timed out.", cause_ru: "после have используется прошедшее причастие (timed out)"}, transformations: [authored]}
  - {id: chunk.modal-perfect-speculation.could-not-have-known, type: chunk, title: "We could not have ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы не могли ...", frame_of: grammar.modal-perfect.speculation, carries: [tense:modal-perfect], slot_hint_ru: "невозможное действие в прошлом", examples: ["We could not have predicted the infrastructure failure.", "They could not have known about the edge case without more examples."], contrast: {frame: "We did not ___", note_ru: "утверждение того, что не произошло"}, trap: {learner_form: "We could not have know the outcome.", correction: "We could not have known the outcome.", cause_ru: "после have используется прошедшее причастие (known)"}, transformations: [authored]}
