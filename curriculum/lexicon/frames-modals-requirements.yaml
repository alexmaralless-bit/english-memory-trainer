# Frames for grammar.modals.requirements (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.modals-requirements.must-do, type: chunk, title: "You must ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "ты должен …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["You must save the report before the meeting.", "You must wear a seatbelt in a car."], contrast: {frame: "You should ___", note_ru: "should = совет, должен = requirement"}, trap: {learner_form: "You must to save the report.", correction: "You must save the report.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.must-negative, type: chunk, title: "You mustn't ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "тебе нельзя …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["You mustn't share the password with anyone.", "You mustn't leave the door open."], contrast: {frame: "You don't have to ___", note_ru: "mustn't = запрещено, don't have to = не требуется"}, trap: {learner_form: "You must not to share it.", correction: "You mustn't share it.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.have-to, type: chunk, title: "I have to ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "я должен …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["I have to review the code before merging.", "I have to finish my homework tonight."], contrast: {frame: "I must ___", note_ru: "have to часто для конкретной ситуации, must для общего правила"}, trap: {learner_form: "I have to to review the code.", correction: "I have to review the code.", cause_ru: "have to + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.dont-have-to, type: chunk, title: "You don't have to ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "тебе не требуется …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["You don't have to attend the optional meeting.", "You don't have to buy the expensive software."], contrast: {frame: "You mustn't ___", note_ru: "don't have to = выбор, mustn't = запрещено"}, trap: {learner_form: "You don't must attend.", correction: "You don't have to attend.", cause_ru: "don't + модальный глагол вместо do not have to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.should, type: chunk, title: "We should ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "нам стоит …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["We should check the option first.", "We should ask the customer about their preference."], contrast: {frame: "We must ___", note_ru: "should = совет, must = требование"}, trap: {learner_form: "We should to check it.", correction: "We should check it.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.should-not, type: chunk, title: "We shouldn't ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "нам не стоит …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["We shouldn't ignore the security warnings.", "We shouldn't spend too much money on this."], contrast: {frame: "We mustn't ___", note_ru: "shouldn't = не рекомендуется, mustn't = строго запрещено"}, trap: {learner_form: "We should not to delete it.", correction: "We shouldn't delete it.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.need-to, type: chunk, title: "They need to ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "им нужно …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["They need to provide more details on the request.", "They need to finish the project before Friday."], contrast: {frame: "They must ___", note_ru: "need to похож на must по значению в работе"}, trap: {learner_form: "They need to to update the system.", correction: "They need to update the system.", cause_ru: "need to + базовый глагол, но не нужна лишняя to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.can-permission, type: chunk, title: "You can ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ты можешь …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["You can access the files from home.", "You can take a break whenever you need."], contrast: {frame: "You must ___", note_ru: "can = разрешение, must = требование"}, trap: {learner_form: "You can to access the files.", correction: "You can access the files.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.may, type: chunk, title: "You may ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "ты можешь … (вежливо)", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["You may proceed with the deployment if all tests pass.", "You may request additional resources from your manager."], contrast: {frame: "You can ___", note_ru: "may более формально, can более повседневно"}, trap: {learner_form: "You may to contact us.", correction: "You may contact us.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.might, type: chunk, title: "It might ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это может …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["It might take longer than expected.", "The system might crash during the update."], contrast: {frame: "It will ___", note_ru: "might = возможность, will = уверенность"}, trap: {learner_form: "It might to fail.", correction: "It might fail.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.must-question, type: chunk, title: "Must we ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы должны … (вопрос)", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["Must we attend every single meeting?", "Must we follow the old process?"], contrast: {frame: "Do we have to ___?", note_ru: "оба вопроса возможны, но структура разная"}, trap: {learner_form: "Do we must attend the meeting?", correction: "Must we attend the meeting?", cause_ru: "модальный глагол не нужен с do в вопросе"}, transformations: [authored]}
  - {id: chunk.modals-requirements.should-question, type: chunk, title: "Should we ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "нам стоит … (вопрос)", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["Should we ask for customer feedback?", "Should we upgrade the database this month?"], contrast: {frame: "Do we should ___?", note_ru: "should в вопросе не требует do"}, trap: {learner_form: "Do we should check this option?", correction: "Should we check this option?", cause_ru: "модальный глагол не нужен с do в вопросе"}, transformations: [authored]}
  - {id: chunk.modals-requirements.have-to-question, type: chunk, title: "Do they have to ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они должны … (вопрос)", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:question-do], slot_hint_ru: "глагол", examples: ["Do they have to submit the report by Friday?", "Do they have to use the new tool?"], contrast: {frame: "Must they ___?", note_ru: "оба вопроса возможны"}, trap: {learner_form: "Have they to attend?", correction: "Do they have to attend?", cause_ru: "have to в вопросе требует do"}, transformations: [authored]}
  - {id: chunk.modals-requirements.negative-must, type: chunk, title: "It must not ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "это не должно …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["It must not contain any personal data.", "The password must not be empty."], contrast: {frame: "It doesn't have to ___", note_ru: "must not = запрещено, doesn't have to = опционально"}, trap: {learner_form: "It must not to store sensitive information.", correction: "It must not store sensitive information.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.need-negative, type: chunk, title: "You don't need to ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "тебе не нужно …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["You don't need to buy a license for that.", "You don't need to install anything today."], contrast: {frame: "You mustn't ___", note_ru: "don't need to = опционально, mustn't = запрещено"}, trap: {learner_form: "You don't need to to configure it.", correction: "You don't need to configure it.", cause_ru: "need to + базовый глагол без лишней to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.must-affirmative, type: chunk, title: "We must consider ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы должны рассмотреть …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "существительное (требование, опцию)", examples: ["We must consider the cost of the solution.", "We must consider the feedback from users."], contrast: {frame: "We should ___", note_ru: "must = требование, should = совет"}, trap: {learner_form: "We must to consider the impact.", correction: "We must consider the impact.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.can-negative, type: chunk, title: "We can't ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы не можем …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["We can't deploy without testing first.", "We can't ignore the compliance requirements."], contrast: {frame: "We mustn't ___", note_ru: "can't = невозможно, mustn't = запрещено"}, trap: {learner_form: "We can't to change this.", correction: "We can't change this.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.should-formal, type: chunk, title: "It should be ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это должно быть …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "прилагательное (готово, одобрено)", examples: ["It should be ready by tomorrow.", "The result should be correct."], contrast: {frame: "It will be ___", note_ru: "should = рекомендуется, will = факт"}, trap: {learner_form: "It should to be correct.", correction: "It should be correct.", cause_ru: "should + инфинитив, не нужна to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.might-negative, type: chunk, title: "We might not ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы может быть не …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["We might not have enough resources for that.", "We might not finish on time."], contrast: {frame: "We won't ___", note_ru: "might not = возможно не, won't = точно не"}, trap: {learner_form: "We might not to complete it.", correction: "We might not complete it.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.have-to-emphasis, type: chunk, title: "I really have to ___", cefr: A2, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, communication], meaning_ru: "я действительно должен …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["I really have to get this done today.", "I really have to ask the team about it."], contrast: {frame: "I have to ___", note_ru: "really добавляет эмфазу"}, trap: {learner_form: "I really have to to send the email.", correction: "I really have to send the email.", cause_ru: "really не меняет структуру: have to + глагол"}, transformations: [authored]}
  - {id: chunk.modals-requirements.may-negative, type: chunk, title: "You may not ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "тебе нельзя …", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["You may not override the security settings.", "You may not delete the original files."], contrast: {frame: "You can't ___", note_ru: "may not формально, can't повседневно"}, trap: {learner_form: "You may not to access it.", correction: "You may not access it.", cause_ru: "модальный глагол + базовый глагол без to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.need-to-question, type: chunk, title: "Do we need to ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "нам нужно … (вопрос)", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:question-do], slot_hint_ru: "глагол", examples: ["Do we need to validate the input?", "Do we need to update the documentation?"], contrast: {frame: "Must we ___?", note_ru: "оба возможны, need to менее строго"}, trap: {learner_form: "Need we to do it?", correction: "Do we need to do it?", cause_ru: "need to требует do в вопросе"}, transformations: [authored]}
  - {id: chunk.modals-requirements.can-question, type: chunk, title: "Can we ___?", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы можем … (вопрос)", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "глагол", examples: ["Can we proceed with the migration?", "Can we delay the deadline by a week?"], contrast: {frame: "Could we ___?", note_ru: "can = настоящее, could = более вежливо"}, trap: {learner_form: "Do we can proceed?", correction: "Can we proceed?", cause_ru: "модальный глагол не нужен с do в вопросе"}, transformations: [authored]}
  - {id: chunk.modals-requirements.should-not-question, type: chunk, title: "Shouldn't we ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "разве нам не стоит … (вопрос)", frame_of: grammar.modals.requirements, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол", examples: ["Shouldn't we check the error logs first?", "Shouldn't we notify the team about this?"], contrast: {frame: "Should we ___?", note_ru: "shouldn't we = риторический вопрос"}, trap: {learner_form: "Do we shouldn't do it?", correction: "Shouldn't we do it?", cause_ru: "модальный глагол не нужен с do в вопросе"}, transformations: [authored]}
  - {id: chunk.modals-requirements.must-be, type: chunk, title: "It must be ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это должно быть …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "прилагательное", examples: ["It must be completely accurate.", "The code must be reviewed before merge."], contrast: {frame: "It should be ___", note_ru: "must be = требование, should be = рекомендация"}, trap: {learner_form: "It must to be correct.", correction: "It must be correct.", cause_ru: "must + инфинитив, не нужна дополнительная to"}, transformations: [authored]}
  - {id: chunk.modals-requirements.have-affirmative, type: chunk, title: "They have to follow ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они должны следовать …", frame_of: grammar.modals.requirements, carries: [structure:modal], slot_hint_ru: "существительное (правилу, процессу)", examples: ["They have to follow the company policy.", "They have to follow the deployment checklist."], contrast: {frame: "They must ___", note_ru: "have to и must похожи в работе"}, trap: {learner_form: "They have to to follow the steps.", correction: "They have to follow the steps.", cause_ru: "have to + глагол без лишней to"}, transformations: [authored]}
