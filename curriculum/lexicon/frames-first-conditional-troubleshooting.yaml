# Frames for grammar.first-conditional.troubleshooting (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.first-conditional-troubleshooting.if-error-returns, type: chunk, title: "If the error returns, we will ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если ошибка вернётся, мы …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "глагол без to (restart, clear, investigate)", examples: ["If the error returns, we will restart the service immediately.", "If the error returns, I will check the logs from the previous run."], contrast: {frame: "When the error returns, we will ___", note_ru: "if — если это лишь возможно; when — если мы уверены, что это произойдёт"}, trap: {learner_form: "If it will return, we will restart.", correction: "If it returns, we will restart.", cause_ru: "в первой части условия не нужен will, только базовая форма"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-you-send-log, type: chunk, title: "If you send the ___,", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если вы отправите …,", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "существительное (log, error, file, code)", examples: ["If you send the log, I will check the service status.", "If you send the error message, I can investigate the issue."], contrast: {frame: "When you send the ___,", note_ru: "when используется, если событие точно случится; if — если это лишь вероятно"}, trap: {learner_form: "If you will send the log, I will help.", correction: "If you send the log, I will help.", cause_ru: "первая часть условия без will"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.unless-we-restart, type: chunk, title: "Unless we restart the ___, ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если мы не перезагрузим …, …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "сущ. (service) и результат", examples: ["Unless we restart the server, the errors will keep happening.", "Unless we clear the cache, users will see old data."], contrast: {frame: "If we don't restart", note_ru: "Unless = If not, but более формально"}, trap: {learner_form: "Unless we will restart, it fails.", correction: "Unless we restart, it will fail.", cause_ru: "после Unless Present Simple в условии и will в результате"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.what-happens-if, type: chunk, title: "What happens if we ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "что произойдёт, если мы …?", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "действие (skip the check, run the export, apply the patch)", examples: ["What happens if we skip this check?", "What happens if we apply the patch to the staging server?"], contrast: {frame: "What happens when we ___?", note_ru: "when для уверенного/регулярного события; if — для условия, которое может не сбыться"}, trap: {learner_form: "What will happen if we will apply the patch?", correction: "What happens if we apply the patch?", cause_ru: "в условии не будет will, используется Present Simple"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-the-request-fails, type: chunk, title: "If the request fails, we ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если запрос упадёт, мы …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "глагол (retry, log, escalate)", examples: ["If the request fails, we will retry automatically after five seconds.", "If the request fails, I will check the server status."], contrast: {frame: "When the request fails, we ___", note_ru: "if — предполагаемая, не гарантированная неудача; when — говорим об этом как о привычном сценарии"}, trap: {learner_form: "If the request will fail, we retry.", correction: "If the request fails, we will retry.", cause_ru: "условие без will и результат с will"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-that-does-not-help, type: chunk, title: "If that does not help, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если это не поможет, …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "следующий шаг (try again, contact support, escalate)", examples: ["If that does not help, contact the vendor's support team.", "If that does not help, we will open a ticket with the vendor."], contrast: {frame: "If that did not help", note_ru: "это future condition, не past — does not help, не did not help"}, trap: {learner_form: "If that does not helps, we escalate.", correction: "If that does not help, we will escalate.", cause_ru: "после does not нет s, и результат с will"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-we-do-not-act, type: chunk, title: "If we do not act now, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если мы сейчас не предпримем действия, …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "последствие (the system will crash, we'll miss the deadline)", examples: ["If we do not act now, the system will crash during peak hours.", "If we do not act now, the issue will affect production."], contrast: {frame: "Unless we act now, ___", note_ru: "if we do not = unless; более формальный/книжный вариант того же условия"}, trap: {learner_form: "If we will not act, the problem will grow.", correction: "If we do not act, the problem will grow.", cause_ru: "в if-части Present Simple: do not, не will not"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-the-deploy-succeeds, type: chunk, title: "If the deploy succeeds, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если развертывание пройдёт успешно, …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "следующее действие (we'll notify the team, the feature goes live)", examples: ["If the deploy succeeds, the feature goes live in one hour.", "If the deploy succeeds, we will run the full test suite."], contrast: {frame: "When the deploy succeeds, ___", note_ru: "if — ещё не гарантировано; when — говорим об этом как об ожидаемом событии"}, trap: {learner_form: "If the deploy will succeed, we notifying the team.", correction: "If the deploy succeeds, we will notify the team.", cause_ru: "условие без will и результат с will, правильный порядок слов"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-the-user-reports, type: chunk, title: "If the user reports ___,", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если пользователь сообщит …,", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "проблема (an issue, an error, a crash)", examples: ["If the user reports another crash, we will roll back immediately.", "If the user reports a data loss, I will investigate the export logs."], contrast: {frame: "When the user reports ___,", note_ru: "if — возможное событие; when — говорим о нём как о вероятном/ожидаемом"}, trap: {learner_form: "If the user will report a crash, we roll back.", correction: "If the user reports a crash, we will roll back.", cause_ru: "Present Simple в условии, will в результате"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-we-apply-the-patch, type: chunk, title: "If we apply the patch, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если мы применим патч, …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "результат (the bug goes away, performance improves)", examples: ["If we apply the patch, the timeout issue will disappear.", "If we apply the patch, we can skip the manual workaround."], contrast: {frame: "Once we apply the patch, ___", note_ru: "if — условие; once — как только это точно произойдёт"}, trap: {learner_form: "If we will apply the patch, the issue goes away.", correction: "If we apply the patch, the issue will go away.", cause_ru: "Present Simple в if-части, будущее в результате"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-the-test-passes, type: chunk, title: "If the test passes, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если тест пройдёт, …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "последствие (we'll merge, it's safe to deploy)", examples: ["If the test passes, we will merge the code to main.", "If the test passes, the feature is ready for staging."], contrast: {frame: "Once the test passes, ___", note_ru: "if — условие с неопределённостью; once — как только это точно произойдёт"}, trap: {learner_form: "If the test will passes, we merging the code.", correction: "If the test passes, we will merge the code.", cause_ru: "Present Simple в условии, правильная форма будущего в результате"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-we-do-not-check, type: chunk, title: "If we do not check the ___, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если мы не проверим …, …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "объект (logs, data, config) и результат", examples: ["If we do not check the logs, we will miss the root cause.", "If we do not check the backups, the recovery will fail."], contrast: {frame: "If we did not check", note_ru: "это не past — do not check (present), не did not check"}, trap: {learner_form: "If we will not check the logs, we missing the error.", correction: "If we do not check the logs, we will miss the error.", cause_ru: "Present Simple в условии и будущее в результате"}, transformations: [authored]}
  - {id: chunk.first-conditional-troubleshooting.if-that-works, type: chunk, title: "If that works, we're ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если это сработает, мы …", frame_of: grammar.first-conditional.troubleshooting, carries: [tense:conditional-1], slot_hint_ru: "состояние (done, good, ready to deploy)", examples: ["If that works, we're done for the day.", "If that works, we're ready to roll out the fix."], contrast: {frame: "Once that works, we're ___", note_ru: "if — условие; once — как только это подтвердится"}, trap: {learner_form: "If that will work, we're finished.", correction: "If that works, we're finished.", cause_ru: "Present Simple в условии, не Future"}, transformations: [authored]}
