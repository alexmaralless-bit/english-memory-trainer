# Frames for grammar.inversion.emphasis (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.inversion-emphasis.only-after-did-we, type: chunk, title: "Only after ___ did we ___", cefr: B2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только после того как ..., мы ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "событие + действие, которое последовало", examples: ["Only after the rollback did we restore the service.", "Only after the meeting did everyone understand the new policy."], contrast: {frame: "We ___ after ___", note_ru: "обычный порядок, без инверсии, менее эмфатичный"}, trap: {learner_form: "Only after the rollback we restored the service.", correction: "Only after the rollback did we restore the service.", cause_ru: "в русском порядок слов свободный; в англ. инверсия: did + we"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.rarely-have-we, type: chunk, title: "Rarely have we ___", cefr: B2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "редко когда мы ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "глагол в прошедшем совершённом", examples: ["Rarely have we encountered such a critical bug in production.", "Rarely have we seen response times drop this far."], contrast: {frame: "We have rarely ___", note_ru: "нормальный порядок; менее формально"}, trap: {learner_form: "Rarely we have seen such a bug.", correction: "Rarely have we seen such a bug.", cause_ru: "инверсия обязательна: have + we"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.under-no-circumstances-should, type: chunk, title: "Under no circumstances should ___", cefr: B2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ни при каких обстоятельствах не следует ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "действие, которое недопустимо", examples: ["Under no circumstances should you restart the database without a backup.", "Under no circumstances should this credential be shared in chat."], contrast: {frame: "You should not ___", note_ru: "обычный порядок; менее категоричный"}, trap: {learner_form: "Under no circumstances you should restart the database.", correction: "Under no circumstances should you restart the database.", cause_ru: "инверсия с should: should + you"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.not-only-did-we, type: chunk, title: "Not only did we ___, but ___", cefr: B2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "не только мы ..., но и ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "два действия: основное + дополнительное", examples: ["Not only did we fix the bug, but we also optimized the query.", "Not only did we meet the deadline, but we delivered ahead of schedule."], contrast: {frame: "We did not only ___, but ___", note_ru: "обычный порядок, без инверсии"}, trap: {learner_form: "Not only did we fixed the bug, but also optimized it.", correction: "Not only did we fix the bug, but we also optimized it.", cause_ru: "после did используется базовая форма глагола (fix, не fixed)"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.never-have-i-seen, type: chunk, title: "Never have I ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "никогда я не ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "глагол в прошедшем совершённом", examples: ["Never have I seen a data loss at that scale.", "Never have I encountered such poor documentation."], contrast: {frame: "I have never ___", note_ru: "нормальный порядок"}, trap: {learner_form: "Never have I saw such a bug.", correction: "Never have I seen such a bug.", cause_ru: "после have используется прошедшее причастие (seen, не saw)"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.only-then-did-they, type: chunk, title: "Only then did they ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только тогда они ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "действие, которое произошло после определённого момента", examples: ["Only then did they realize the scope of the problem.", "Only then did the team approve the redesign."], contrast: {frame: "They ___ only then", note_ru: "нарушает нормальный порядок в английском"}, trap: {learner_form: "Only then they did realize the problem.", correction: "Only then did they realize the problem.", cause_ru: "инверсия: did + they"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.little-did-we-know, type: chunk, title: "Little did we know ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "мы и не знали, что ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "неожиданный результат или поворот", examples: ["Little did we know that the cache would run out so quickly.", "Little did the team know that the vendor would sunset the service."], contrast: {frame: "We did not know that ___", note_ru: "прямой порядок слов"}, trap: {learner_form: "Little we did know that the system would fail.", correction: "Little did we know that the system would fail.", cause_ru: "инверсия: did + we"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.scarcely-had-i-finished, type: chunk, title: "Scarcely had I ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "едва только я ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "действие в прошедшем совершённом", examples: ["Scarcely had I completed the migration when the alarm went off.", "Scarcely had we sent the release when reports started coming in."], contrast: {frame: "I had scarcely ___", note_ru: "нормальный порядок"}, trap: {learner_form: "Scarcely had I completed when the error appeared.", correction: "Scarcely had I completed the deployment when the error appeared.", cause_ru: "после had используется прошедшее причастие (completed)"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.no-sooner-had-we, type: chunk, title: "No sooner had we ___ than ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "едва мы ..., как сразу ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "два быстро следующих друг за другом события", examples: ["No sooner had we fixed the bug than another one appeared.", "No sooner had we deployed the service than it started failing."], contrast: {frame: "As soon as we ___, ___", note_ru: "менее эмфатичный способ выражения"}, trap: {learner_form: "No sooner had we fix the issue than another one came.", correction: "No sooner had we fixed the issue than another one appeared.", cause_ru: "после had используется прошедшее причастие (fixed)"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.at-no-point-should, type: chunk, title: "At no point should ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ни в какой момент не должно ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "действие, которое запрещено", examples: ["At no point should you bypass the security check.", "At no point should we compromise on data integrity."], contrast: {frame: "You should not at any time ___", note_ru: "менее категоричный вариант"}, trap: {learner_form: "At no point you should skip the validation.", correction: "At no point should you skip the validation.", cause_ru: "инверсия: should + you"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.hardly-had-the-team, type: chunk, title: "Hardly had the team ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "едва команда ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "действие в прошедшем совершённом", examples: ["Hardly had the team begun the refactoring when new requirements arrived.", "Hardly had we established the baseline when the metrics started diverging."], contrast: {frame: "The team had hardly ___", note_ru: "нормальный порядок слов"}, trap: {learner_form: "Hardly had the team begin the work when the issue occurred.", correction: "Hardly had the team begun the work when the issue occurred.", cause_ru: "после had используется прошедшее причастие (begun)"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.so-critical-was-the-issue, type: chunk, title: "So critical was the ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "настолько критичным был ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "существительное, описывающее проблему или ситуацию", examples: ["So critical was the bug that we released a hotfix overnight.", "So urgent was the request that we prioritized it over everything else."], contrast: {frame: "The ___ was so critical", note_ru: "нормальный порядок слов"}, trap: {learner_form: "So critical was the bug that we released hotfix.", correction: "So critical was the bug that we released a hotfix.", cause_ru: "перед существительным нужен артикль (a)"}, transformations: [authored]}
  - {id: chunk.inversion-emphasis.only-by-testing-did-we, type: chunk, title: "Only by ___ did we ___", cefr: B2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только путём ..., мы ...", frame_of: grammar.inversion.emphasis, carries: [structure:inversion], slot_hint_ru: "метод + результат", examples: ["Only by simulating the load did we find the bottleneck.", "Only by code review did we catch the race condition."], contrast: {frame: "We ___ only by ___", note_ru: "нормальный порядок слов"}, trap: {learner_form: "Only by testing we did found the issue.", correction: "Only by testing did we find the issue.", cause_ru: "инверсия: did + we, и базовая форма (find, не found)"}, transformations: [authored]}
