  - {id: chunk.quantifiers-basic.all-of-the, type: chunk, title: "all of the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "все из … (всё известное множество)", frame_of: grammar.quantifiers.basic, carries: [article:definite-second-mention, structure:quantifier], slot_hint_ru: "существительное", examples: ["All of the data must be backed up daily.", "We reviewed all of the test results."], contrast: {frame: "all", note_ru: "all of the для всех элементов известного множества"}, trap: {learner_form: "all of data", correction: "all of the data", cause_ru: "после all of обязательно нужен the перед существительным"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.not-many, type: chunk, title: "not many ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "не много … (немного)", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "счётное существительное", examples: ["We have not many options left.", "Not many users have this issue."], contrast: {frame: "few", note_ru: "not many синоним к few (отрицание many)"}, trap: {learner_form: "not much options", correction: "not many options", cause_ru: "для счётных используется many, не much"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.not-much, type: chunk, title: "not much ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "не много … (неисчисляемое)", frame_of: grammar.quantifiers.basic, carries: [article:zero-uncountable, structure:quantifier], slot_hint_ru: "неисчисляемое существительное", examples: ["There is not much time before the deadline.", "We do not have not much experience with this."], contrast: {frame: "little", note_ru: "not much синоним к little"}, trap: {learner_form: "not many information", correction: "not much information", cause_ru: "для неисчисляемых используется much, не many"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.a-number-of, type: chunk, title: "a number of ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ряд … (формальное)", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "счётное существительное", examples: ["A number of issues were reported this week.", "We have a number of options to consider."], contrast: {frame: "a few", note_ru: "a number of более формально"}, trap: {learner_form: "a number issue", correction: "a number of issues", cause_ru: "нужно 'of' и множественное число"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.zero-users, type: chunk, title: "no ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ноль, никакие-то …", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "счётное существительное", examples: ["There are no users online right now.", "We received no complaints about the service."], contrast: {frame: "any", note_ru: "no означает полное отсутствие"}, trap: {learner_form: "There is no users", correction: "There are no users.", cause_ru: "no требует множественного числа и are"}, transformations: [authored]}
