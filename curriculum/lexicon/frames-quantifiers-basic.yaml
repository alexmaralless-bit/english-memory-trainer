# Frames for grammar.quantifiers.basic (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.quantifiers-basic.a-few, type: chunk, title: "a few ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "несколько … (счётное)", frame_of: grammar.quantifiers.basic, carries: [article:fixed-expression, structure:quantifier], slot_hint_ru: "счётное существительное во множественном числе", examples: ["We have a few open tickets to close.", "I need a few minutes to finish this task."], contrast: {frame: "a little", note_ru: "a few для счётных, a little для неисчисляемых"}, trap: {learner_form: "a little files", correction: "a few files", cause_ru: "перед счётным существительным используется few, не little"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.a-little, type: chunk, title: "a little ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "немного … (неисчисляемое)", frame_of: grammar.quantifiers.basic, carries: [article:fixed-expression, structure:quantifier], slot_hint_ru: "неисчисляемое существительное", examples: ["We have a little time before the deadline.", "The project needs a little more work."], contrast: {frame: "a few", note_ru: "a little для неисчисляемых, a few для счётных"}, trap: {learner_form: "a few information", correction: "a little information", cause_ru: "перед неисчисляемым существительным используется little, не few"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.some-tasks, type: chunk, title: "some ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "какие-то, некоторые …", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "существительное во множественном числе", examples: ["Some tasks are harder than others.", "We fixed some bugs in the latest version."], contrast: {frame: "any", note_ru: "some в утвердительных, any в вопросах и отрицаниях"}, trap: {learner_form: "Do you have some tasks?", correction: "Do you have any tasks?", cause_ru: "в вопросах используется any, не some"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.some-data, type: chunk, title: "some ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "какие-то … (неисчисляемое)", frame_of: grammar.quantifiers.basic, carries: [article:zero-uncountable, structure:quantifier], slot_hint_ru: "неисчисляемое существительное", examples: ["We lost some data in the system crash.", "I need some information about this issue."], contrast: {frame: "any", note_ru: "some в утвердительных, any в вопросах"}, trap: {learner_form: "Do you have some feedback?", correction: "Do you have any feedback?", cause_ru: "в вопросах используется any"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.any-files, type: chunk, title: "any ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "какие-нибудь … (вопрос/отрицание)", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "счётное существительное", examples: ["Do you have any files from yesterday?", "I do not have any errors in my code."], contrast: {frame: "some", note_ru: "any в вопросах и отрицаниях, some в утвердительных"}, trap: {learner_form: "Do you have some files?", correction: "Do you have any files?", cause_ru: "в вопросах используется any, не some"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.many-files, type: chunk, title: "many ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "много … (счётное)", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "счётное существительное во множественном числе", examples: ["There are too many files in this folder.", "How many users accessed the system today?"], contrast: {frame: "much", note_ru: "many для счётных, much для неисчисляемых"}, trap: {learner_form: "much files", correction: "many files", cause_ru: "перед счётным существительным используется many, не much"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.much-data, type: chunk, title: "much ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "много … (неисчисляемое)", frame_of: grammar.quantifiers.basic, carries: [article:zero-uncountable, structure:quantifier], slot_hint_ru: "неисчисляемое существительное", examples: ["There is not much data available yet.", "How much information do you need?"], contrast: {frame: "many", note_ru: "much для неисчисляемых, many для счётных"}, trap: {learner_form: "much tasks", correction: "many tasks", cause_ru: "перед счётным существительным используется many"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.all-records, type: chunk, title: "all ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "все …", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "существительное", examples: ["All records must be checked before export.", "We processed all data from the database."], contrast: {frame: "none", note_ru: "all — все, none — ни один"}, trap: {learner_form: "All record need review", correction: "All records need review.", cause_ru: "после all нужно множественное число"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.no-errors, type: chunk, title: "no ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "никаких … (отрицание)", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "существительное", examples: ["There are no errors in the latest build.", "We found no issues during testing."], contrast: {frame: "not any", note_ru: "no одним словом; not any — два слова"}, trap: {learner_form: "We have not any errors", correction: "We have no errors.", cause_ru: "no более прямо, чем not any"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.a-lot-of, type: chunk, title: "a lot of ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "много … (фиксированное выражение)", frame_of: grammar.quantifiers.basic, carries: [article:fixed-expression, structure:quantifier], slot_hint_ru: "существительное", examples: ["We have a lot of work to do before Friday.", "This system stores a lot of data."], contrast: {frame: "much", note_ru: "a lot of часто звучит более естественно, чем much"}, trap: {learner_form: "We have much work", correction: "We have a lot of work.", cause_ru: "a lot of звучит более естественно в утвердительных предложениях"}, transformations: [authored]}
