  - {id: chunk.quantifiers-basic.too-much-data, type: chunk, title: "too much ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, data], meaning_ru: "слишком много … (неисчисляемое)", frame_of: grammar.quantifiers.basic, carries: [article:zero-uncountable, structure:quantifier], slot_hint_ru: "неисчисляемое существительное", examples: ["There is too much data to process in one day.", "We have too much information to organize."], contrast: {frame: "too many", note_ru: "too much для неисчисляемых"}, trap: {learner_form: "too much tasks", correction: "too many tasks", cause_ru: "для счётных существительных используется many"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.some-of-the, type: chunk, title: "some of the ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "некоторые из … (известное множество)", frame_of: grammar.quantifiers.basic, carries: [article:definite-second-mention, structure:quantifier], slot_hint_ru: "существительное", examples: ["Some of the files are corrupted.", "Some of the team members attended the meeting."], contrast: {frame: "some", note_ru: "some of the когда говорим о части известного множества"}, trap: {learner_form: "some the files", correction: "some of the files", cause_ru: "нужно 'of' между some и the"}, transformations: [authored]}
