  - {id: chunk.quantifiers-basic.most-users, type: chunk, title: "most ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "большинство …", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "существительное", examples: ["Most users prefer the new interface.", "Most of our clients use this feature."], contrast: {frame: "some", note_ru: "most означает большинство; some — некоторые"}, trap: {learner_form: "Most of users prefer", correction: "Most users prefer.", cause_ru: "можно сказать 'most users' без 'of'"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.several-systems, type: chunk, title: "several ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "несколько … (больше, чем a few)", frame_of: grammar.quantifiers.basic, carries: [article:zero-plural, structure:quantifier], slot_hint_ru: "существительное во множественном числе", examples: ["We manage several systems for different clients.", "Several users reported this bug yesterday."], contrast: {frame: "a few", note_ru: "several больше, чем a few"}, trap: {learner_form: "several system was updated", correction: "Several systems were updated.", cause_ru: "после several нужно множественное число и are"}, transformations: [authored]}
  - {id: chunk.quantifiers-basic.enough-time, type: chunk, title: "enough ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "достаточно … (enough идёт после существительного)", frame_of: grammar.quantifiers.basic, carries: [article:zero-uncountable, structure:quantifier], slot_hint_ru: "существительное", examples: ["We do not have enough time for this task.", "Do we have enough resources?"], contrast: {frame: "___ enough", note_ru: "enough ставится после существительного, не перед ним"}, trap: {learner_form: "enough time", correction: "We do not have enough time.", cause_ru: "enough ставится после существительного"}, transformations: [authored]}
