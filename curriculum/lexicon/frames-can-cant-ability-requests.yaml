# Frames for grammar.can-cant.ability-requests (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.can-cant-ability-requests.can-you-help, type: chunk, title: "Can you ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "можешь ли ты ...?", frame_of: grammar.can-cant.ability-requests, carries: [structure:question-do], slot_hint_ru: "глагол в базовой форме", examples: ["Can you check the error log?", "Can you help me find the ticket?"], contrast: {frame: "Do you can ___?", note_ru: "can не нужен вспомогательный глагол do в вопросе"}, trap: {learner_form: "Do you can help me?", correction: "Can you help me?", cause_ru: "can уже модальный глагол, do не требуется"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.i-can-send, type: chunk, title: "I can ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я могу ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal], slot_hint_ru: "глагол в базовой форме", examples: ["I can send you the report by tomorrow.", "I can access the system from here."], contrast: {frame: "I can to ___", note_ru: "после can идёт базовая форма без to"}, trap: {learner_form: "I can to send the file.", correction: "I can send the file.", cause_ru: "в русском языке инфинитив требует частицы, в английском модальный глагол требует базовой формы"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.i-cant-join, type: chunk, title: "I can't ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я не могу ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "глагол в базовой форме", examples: ["I can't join the call right now.", "I can't work on this today."], contrast: {frame: "I cannot attend", note_ru: "can't и cannot — оба варианта правильные, can't чаще в письме"}, trap: {learner_form: "I can't to come.", correction: "I can't come.", cause_ru: "модальный глагол, не инфинитив"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.can-they-access, type: chunk, title: "Can they ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они могут ...?", frame_of: grammar.can-cant.ability-requests, carries: [structure:question-do], slot_hint_ru: "глагол в базовой форме", examples: ["Can they see the shared folder?", "Can they modify the document?"], contrast: {frame: "Do they can ___?", note_ru: "can не требует do в вопросе"}, trap: {learner_form: "Do they can edit the file?", correction: "Can they edit the file?", cause_ru: "can — модальный глагол, вспомогательный глагол не нужен"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.cant-see, type: chunk, title: "I can't see ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я не могу видеть ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "существительное объекта", examples: ["I can't see the attachment.", "I can't see the option in the menu."], contrast: {frame: "I don't see ___", note_ru: "can't see выражает невозможность видеть, don't see — просто констатация факта"}, trap: {learner_form: "I can't to see it.", correction: "I can't see it.", cause_ru: "после модального глагола базовая форма без to"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.everyone-can, type: chunk, title: "Everyone can ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "каждый может ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal], slot_hint_ru: "глагол в базовой форме", examples: ["Everyone can use the shared space.", "Everyone can download the file."], contrast: {frame: "All can ___", note_ru: "everyone употребляется с глаголом в 3-м лице, all требует больше контекста"}, trap: {learner_form: "Everyone can to access.", correction: "Everyone can access.", cause_ru: "базовая форма без to после can"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.she-cant-make, type: chunk, title: "She can't make ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она не может сделать ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "существительное или инфинитивная фраза", examples: ["She can't make the meeting tomorrow.", "She can't make it work without the new tool."], contrast: {frame: "She doesn't make ___", note_ru: "can't make выражает невозможность, doesn't make выражает обычное отсутствие действия"}, trap: {learner_form: "She can't making the call.", correction: "She can't make the call.", cause_ru: "после модального глагола базовая форма, не герундий"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.could-you-wait, type: chunk, title: "Could you ___?", cefr: A1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, requests], meaning_ru: "не могли бы вы ...?", frame_of: grammar.can-cant.ability-requests, carries: [structure:question-do, structure:modal], slot_hint_ru: "глагол в базовой форме", examples: ["Could you wait a moment?", "Could you send this to the team?"], contrast: {frame: "Can you ___?", note_ru: "could более вежливо, чем can"}, trap: {learner_form: "Could you to send?", correction: "Could you send?", cause_ru: "could — модальный глагол, требует базовую форму"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.you-cant-do, type: chunk, title: "You can't do ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "вы не можете сделать ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "существительное или инфинитивная фраза", examples: ["You can't do that without a password.", "You can't do the export on this device."], contrast: {frame: "You don't do ___", note_ru: "can't do выражает невозможность, don't do выражает отсутствие обычного действия"}, trap: {learner_form: "You can't doing that.", correction: "You can't do that.", cause_ru: "после can базовая форма, не герундий"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.we-can-fix, type: chunk, title: "We can fix ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы можем исправить ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal], slot_hint_ru: "существительное проблемы", examples: ["We can fix this issue tomorrow.", "We can fix it by adding a backup."], contrast: {frame: "We will fix ___", note_ru: "can fix выражает способность, will fix просто будущее действие"}, trap: {learner_form: "We can to fix it.", correction: "We can fix it.", cause_ru: "модальный глагол требует базовую форму"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.cant-start, type: chunk, title: "I can't start ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я не могу начать ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "существительное или инфинитивная фраза", examples: ["I can't start the process without your approval.", "I can't start work on this until Friday."], contrast: {frame: "I don't start ___", note_ru: "can't start выражает невозможность начать, don't start выражает обычное отсутствие начала"}, trap: {learner_form: "I can't starting the service.", correction: "I can't start the service.", cause_ru: "базовая форма без -ing после can't"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.who-can-help, type: chunk, title: "Who can ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "кто может ...?", frame_of: grammar.can-cant.ability-requests, carries: [structure:question-wh], slot_hint_ru: "глагол в базовой форме", examples: ["Who can review this code?", "Who can attend the call?"], contrast: {frame: "Who is able to ___?", note_ru: "can более естественно в устной речи и письме"}, trap: {learner_form: "Who can to attend?", correction: "Who can attend?", cause_ru: "базовая форма без to после can"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.what-cant-they, type: chunk, title: "What can't they ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "что они не могут ...?", frame_of: grammar.can-cant.ability-requests, carries: [structure:question-wh, structure:negative, structure:modal], slot_hint_ru: "глагол в базовой форме", examples: ["What can't they see in the report?", "What can't they access from home?"], contrast: {frame: "What don't they ___?", note_ru: "can't выражает неспособность, don't — обычное отсутствие действия (привычку)"}, trap: {learner_form: "What can't they doing?", correction: "What can't they do?", cause_ru: "базовая форма после can't"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.he-can-work, type: chunk, title: "He can work ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он может работать ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal], slot_hint_ru: "наречие места или времени", examples: ["He can work from home on Mondays.", "He can work on the project next week."], contrast: {frame: "He works ___", note_ru: "can work выражает способность, works выражает обычное действие"}, trap: {learner_form: "He can to work there.", correction: "He can work there.", cause_ru: "базовая форма без to"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.cant-open, type: chunk, title: "I can't open ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, troubleshooting], meaning_ru: "я не могу открыть ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "существительное файла или приложения", examples: ["I can't open the spreadsheet on my device.", "I can't open the attachment in this email."], contrast: {frame: "The file won't open", note_ru: "I can't open выражает мою неспособность, won't open выражает проблему с файлом"}, trap: {learner_form: "I can't opening it.", correction: "I can't open it.", cause_ru: "базовая форма после can't, не герундий"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.they-cant-modify, type: chunk, title: "They can't modify ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, data], meaning_ru: "они не могут изменить ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "существительное документа или данных", examples: ["They can't modify the settings without admin rights.", "They can't modify the record in the system."], contrast: {frame: "They don't modify ___", note_ru: "can't modify выражает невозможность, don't modify выражает что они обычно не делают"}, trap: {learner_form: "They can't to modify it.", correction: "They can't modify it.", cause_ru: "базовая форма без to"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.it-cant-run, type: chunk, title: "It can't run ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, troubleshooting], meaning_ru: "это не может работать ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "наречие или предложная фраза", examples: ["It can't run on older devices.", "It can't run without an internet connection."], contrast: {frame: "It doesn't run ___", note_ru: "can't run выражает техническую невозможность, doesn't run выражает отсутствие действия"}, trap: {learner_form: "It can't running.", correction: "It can't run.", cause_ru: "базовая форма после can't"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.can-i-ask, type: chunk, title: "Can I ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [communication, requests], meaning_ru: "я могу ли ...?", frame_of: grammar.can-cant.ability-requests, carries: [structure:question-do], slot_hint_ru: "глагол в базовой форме", examples: ["Can I ask a quick question about this?", "Can I suggest something to improve it?"], contrast: {frame: "May I ___?", note_ru: "can I более прямо, may I более вежливо"}, trap: {learner_form: "Do I can ask?", correction: "Can I ask?", cause_ru: "can уже модальный глагол"}, transformations: [authored]}
  - {id: chunk.can-cant-ability-requests.we-cant-proceed, type: chunk, title: "We can't proceed ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы не можем продолжить ...", frame_of: grammar.can-cant.ability-requests, carries: [structure:modal, structure:negative], slot_hint_ru: "наречие или предложная фраза причины", examples: ["We can't proceed without the client's approval.", "We can't proceed until we get the data."], contrast: {frame: "We don't proceed ___", note_ru: "can't proceed выражает невозможность, don't proceed выражает что обычно не делают"}, trap: {learner_form: "We can't to proceed.", correction: "We can't proceed.", cause_ru: "модальный глагол требует базовую форму"}, transformations: [authored]}
