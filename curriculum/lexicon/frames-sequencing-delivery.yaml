# Frames for grammar.sequencing.delivery (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.sequencing-delivery.first-then, type: chunk, title: "First ___, then we ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "сначала ___, потом мы ___", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие + действие (test / deploy)", examples: ["First we test, then we deploy the update.", "First we review the code, then we merge it."], contrast: {frame: "Then we test, then we deploy.", note_ru: "multiple 'then' в русском стиле выглядит неестественно; 'first...then' более естественно"}, trap: {learner_form: "First we test then deploy.", correction: "First we test, then we deploy.", cause_ru: "нужна запятая перед 'then' в этой конструкции"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.once-we-finish, type: chunk, title: "Once we finish ___, we'll ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "как только мы закончим ___, мы ___", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (testing / reviewing)", examples: ["Once we finish testing, we'll release the feature.", "Once we finish the review, we'll send the update."], contrast: {frame: "After we finish testing, we'll release.", note_ru: "'once' выражает условие завершения; 'after' более нейтрально указывает на последовательность"}, trap: {learner_form: "Once we will finish, we deploy.", correction: "Once we finish, we'll deploy.", cause_ru: "в придаточном с 'once' используется present simple, не will"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.after-approval, type: chunk, title: "After approval, the team ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "после одобрения команда ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (sends / deploys)", examples: ["After approval, the team sends the update.", "After approval, the team starts the deployment."], contrast: {frame: "The team sends the update after approval.", note_ru: "'after approval' в начале предложения выделяет порядок; в конце — более естественный порядок"}, trap: {learner_form: "After approval sends the team update.", correction: "After approval, the team sends the update.", cause_ru: "нужна запятая после вступительной фразы; normal SVO порядок"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.before-we-deploy, type: chunk, title: "Before we deploy, we must ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "перед развертыванием мы должны ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing, structure:modal], slot_hint_ru: "действие (test / review)", examples: ["Before we deploy, we must test all features.", "Before we release, we must verify the changes."], contrast: {frame: "We must test all features before we deploy.", note_ru: "'before we deploy' в начале — выделяет предшествующее действие"}, trap: {learner_form: "Before we deploy must test.", correction: "Before we deploy, we must test.", cause_ru: "нужна запятая; полное предложение со своим подлежащим и глаголом"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.the-next-step-is, type: chunk, title: "The next step is to ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "следующий шаг — ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "инфинитив (test / review / deploy)", examples: ["The next step is to test the changes.", "The next step is to send the update to the client."], contrast: {frame: "We will test the changes next.", note_ru: "'the next step is to' выделяет порядок действий; will — просто будущее"}, trap: {learner_form: "The next step is testing.", correction: "The next step is to test.", cause_ru: "'is to' конструкция требует инфинитива 'to + verb', не герундия"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.following-that, type: chunk, title: "Following that, we ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "вслед за тем мы ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (update / notify)", examples: ["Following that, we update the documentation.", "Following that, we notify the stakeholders."], contrast: {frame: "Then we update the documentation.", note_ru: "'following that' более формальный связующий элемент; 'then' более разговорный"}, trap: {learner_form: "Following that we update.", correction: "Following that, we update.", cause_ru: "нужна запятая после вступительного элемента"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.meanwhile, type: chunk, title: "Meanwhile, we can ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "тем временем мы можем ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (start / prepare)", examples: ["Meanwhile, we can prepare the release notes.", "Meanwhile, we can review the next ticket."], contrast: {frame: "At the same time, we can prepare.", note_ru: "'meanwhile' для одновременного действия; более естественно чем 'at the same time'"}, trap: {learner_form: "Meanwhile we prepare.", correction: "Meanwhile, we can prepare.", cause_ru: "нужна запятая после вступительного элемента; часто 'can' выражает возможность"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.initially-we-test, type: chunk, title: "Initially, we test ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "изначально мы тестируем ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "объект (on staging / locally)", examples: ["Initially, we test on staging.", "Initially, we test all edge cases."], contrast: {frame: "First, we test on staging.", note_ru: "'initially' и 'first' похожи; 'initially' — в начале процесса, 'first' — первый из нескольких шагов"}, trap: {learner_form: "Initially we test.", correction: "Initially, we test on staging.", cause_ru: "нужна запятая; обычно дополняется location или object"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.in-the-meantime, type: chunk, title: "In the meantime, ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в это время ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (update / prepare)", examples: ["In the meantime, the team updates the documentation.", "In the meantime, we prepare the release announcement."], contrast: {frame: "Meanwhile, the team updates.", note_ru: "'in the meantime' и 'meanwhile' синонимичны; 'in the meantime' более формальное"}, trap: {learner_form: "In the meantime update docs.", correction: "In the meantime, the team updates the documentation.", cause_ru: "нужна запятая; полное предложение с подлежащим и глаголом"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.finally, type: chunk, title: "Finally, we ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "наконец мы ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (deploy / release)", examples: ["Finally, we deploy to production.", "Finally, we announce the launch."], contrast: {frame: "At the end, we deploy.", note_ru: "'finally' для итогового действия в последовательности; 'at the end' указывает на момент времени"}, trap: {learner_form: "Finally we deploy.", correction: "Finally, we deploy to production.", cause_ru: "нужна запятая после вступительного элемента; часто дополняется локацией"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.as-a-result, type: chunk, title: "As a result, ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "в результате ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "следствие (the update / the system)", examples: ["As a result, the update reaches the users.", "As a result, the deployment completes successfully."], contrast: {frame: "So the update reaches the users.", note_ru: "'as a result' для логического следствия в последовательности; 'so' более простое"}, trap: {learner_form: "As a result update reaches.", correction: "As a result, the update reaches the users.", cause_ru: "нужна запятая; полное предложение с подлежащим"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.subsequently, type: chunk, title: "Subsequently, the team ___", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "впоследствии команда ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (monitors / analyzes)", examples: ["Subsequently, the team monitors the system.", "Subsequently, the team analyzes the feedback."], contrast: {frame: "Later, the team monitors.", note_ru: "'subsequently' — в следующий момент в последовательности; 'later' просто указывает на время"}, trap: {learner_form: "Subsequently team monitors.", correction: "Subsequently, the team monitors the system.", cause_ru: "нужна запятая; нужно полное подлежащее с артиклем"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.on-completion, type: chunk, title: "On completion, we ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "по завершении мы ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (notify / archive)", examples: ["On completion, we notify all stakeholders.", "On completion, we archive the old version."], contrast: {frame: "When we complete, we notify.", note_ru: "'on completion' — формальный переход, 'when we complete' — условный"}, trap: {learner_form: "On completion notify.", correction: "On completion, we notify all stakeholders.", cause_ru: "нужна запятая; полное подлежащее"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.during-this-time, type: chunk, title: "During this time, ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в это время ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие", examples: ["During this time, we monitor all metrics.", "During this time, the system runs smoothly."], contrast: {frame: "While this happens, we monitor.", note_ru: "'during this time' — параллельное действие, 'while' — условие"}, trap: {learner_form: "During this time monitor metrics.", correction: "During this time, we monitor all metrics.", cause_ru: "нужна запятая; полное предложение"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.the-process-starts-with, type: chunk, title: "The process starts with ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "процесс начинается с ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (-ing форма) или существительное (testing / a review)", examples: ["The process starts with testing on staging.", "The process starts with a code review."], contrast: {frame: "We start by testing.", note_ru: "'the process starts with' выделяет структуру; 'we start by' — действие субъекта"}, trap: {learner_form: "The process starts to test.", correction: "The process starts with testing.", cause_ru: "'starts with' + -ing форма, не 'to'"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.at-each-stage, type: chunk, title: "At each stage, we ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "на каждом этапе мы ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (verify / check)", examples: ["At each stage, we verify the results.", "At each stage, we document our progress."], contrast: {frame: "In every stage, we verify.", note_ru: "'at each stage' — правильный способ, 'in every' менее естественно"}, trap: {learner_form: "At each stage verify.", correction: "At each stage, we verify the results.", cause_ru: "нужна запятая; полное предложение"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.when-ready, type: chunk, title: "When ready, we ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "когда готово, мы ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "действие (proceed / deploy)", examples: ["When ready, we proceed to the next phase.", "When ready, we deploy to production."], contrast: {frame: "When we are ready, we deploy.", note_ru: "'when ready' — сокращенная форма, 'when we are ready' — полная"}, trap: {learner_form: "When ready deploy.", correction: "When ready, we deploy to production.", cause_ru: "нужна запятая; полное предложение с подлежащим"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.what-happens-next, type: chunk, title: "What happens next?", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "что происходит дальше?", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing, structure:question-do], examples: ["What happens next? We should plan the rollout.", "What happens next in the process?"], contrast: {frame: "What's next?", note_ru: "'what happens next' — полный вопрос, 'what's next' — сокращенный, более разговорный"}, trap: {learner_form: "What happen next?", correction: "What happens next?", cause_ru: "третье лицо единственного числа требует -s в present simple"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.we-need-to-sequence-our-steps, type: chunk, title: "We need to sequence our steps", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "нам нужно упорядочить наши шаги", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], examples: ["We need to sequence our steps clearly.", "We need to sequence our steps properly."], contrast: {frame: "We must plan our steps carefully.", note_ru: "'sequence' — особенно выделяет порядок, 'plan' — более общее"}, trap: {learner_form: "We need sequence our steps.", correction: "We need to sequence our steps.", cause_ru: "'need to' требует инфинитива 'to'"}, transformations: [authored]}
  - {id: chunk.sequencing-delivery.so-the-order-is, type: chunk, title: "So the order is ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "итак, порядок такой ...", frame_of: grammar.sequencing.delivery, carries: [structure:sequencing], slot_hint_ru: "список (test, review, deploy)", examples: ["So the order is test, review, then deploy.", "So the order is development, testing, then release."], contrast: {frame: "The order must be...", note_ru: "'so the order is' более разговорное, 'the order must be' более формальное"}, trap: {learner_form: "So the order is test, review, deploy.", correction: "So the order is test, review, then deploy.", cause_ru: "'then' перед последним элементом в последовательности усиливает структуру"}, transformations: [authored]}
