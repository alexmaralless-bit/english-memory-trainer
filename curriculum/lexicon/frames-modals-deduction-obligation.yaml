# Frames for grammar.modals.deduction-obligation (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.modals-deduction-obligation.must-be-deduction, type: chunk, title: "It must be ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это, вероятно, ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "прилагательное или существительное (expired, the issue, cached)", examples: ["It must be a caching issue; nothing else changed recently.", "The issue must be in the configuration file."], contrast: {frame: "The token is expired.", note_ru: "must be выражает дедукцию; is просто констатирует факт"}, trap: {learner_form: "The token it must be expired.", correction: "The token must be expired.", cause_ru: "не добавляем местоимение it после must"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.cant-be-deduction, type: chunk, title: "It can't be ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это не может быть ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal, tense:modal-perfect], slot_hint_ru: "прилагательное или существительное (the database, a timeout, correct)", examples: ["It can't be the database; the service is up and responding.", "The error can't be from the old code; we deployed the fix yesterday."], contrast: {frame: "It is not the database.", note_ru: "can't be выражает логическую невозможность; is not просто отрицает факт"}, trap: {learner_form: "It can't be the database it.", correction: "It can't be the database.", cause_ru: "не добавляем it в конце"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.might-be-that, type: chunk, title: "It might be that ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "может быть, что ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "полное предложение (the config is wrong, we missed a case)", examples: ["It might be that the configuration was never updated.", "It might be that the user disabled the feature."], contrast: {frame: "The configuration might be wrong.", note_ru: "It might be that вводит предложение; обе формы верны"}, trap: {learner_form: "It might be that the config it was wrong.", correction: "It might be that the configuration was wrong.", cause_ru: "не добавляем it; что уже часть придаточного"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.should-obligation, type: chunk, title: "You should ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вам следует ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (check, review, update)", examples: ["You should review the pull request before merging.", "We should test this change in staging first."], contrast: {frame: "You must review the pull request.", note_ru: "should is less strong than must; должен может быть сильнее или слабее"}, trap: {learner_form: "You should to review the pull request.", correction: "You should review the pull request.", cause_ru: "модальный глагол не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.must-obligation, type: chunk, title: "You must ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы должны обязательно ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (complete, attend, confirm)", examples: ["You must complete the security training before accessing the system.", "All users must change their password immediately."], contrast: {frame: "You should complete the training.", note_ru: "must обязательно, should рекомендуется"}, trap: {learner_form: "You must to complete the training.", correction: "You must complete the training.", cause_ru: "must не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.should-have, type: chunk, title: "You should have ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вам следовало бы ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal, tense:modal-perfect], slot_hint_ru: "третья форма глагола (tested, checked, confirmed)", examples: ["You should have tested the fallback case before deployment.", "We should have updated the documentation earlier."], contrast: {frame: "You should test the fallback case.", note_ru: "should have = прошлое; should = настоящее/будущее"}, trap: {learner_form: "You should have test the fallback.", correction: "You should have tested the fallback.", cause_ru: "after have нужна третья форма (tested), не base form (test)"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.must-have, type: chunk, title: "We must have ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы, наверное/вероятно, ... (вывод о прошлом)", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal, tense:modal-perfect], slot_hint_ru: "третья форма глагола (made, cached, missed)", examples: ["We must have made an error in the previous step.", "The system must have cached the old value."], contrast: {frame: "We made an error.", note_ru: "must have = дедукция о прошлом; made = констатация факта"}, trap: {learner_form: "We must have make an error.", correction: "We must have made an error.", cause_ru: "после have нужна третья форма (made)"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.may-explain-why, type: chunk, title: "That may explain why ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это может объяснить, почему ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "полное предложение (the test is slow, the user is confused)", examples: ["That may explain why the performance degraded overnight.", "This might explain why the import failed twice."], contrast: {frame: "That explains why the performance degraded.", note_ru: "may explain = возможная причина; explains = подтвержденная причина"}, trap: {learner_form: "That may to explain why the test is slow.", correction: "That may explain why the test is slow.", cause_ru: "may не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.do-not-have-to, type: chunk, title: "You do not have to ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы не обязаны ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (attend, sign, approve)", examples: ["You do not have to attend every meeting.", "The team does not have to wait for approval."], contrast: {frame: "You must not attend.", note_ru: "do not have to = нет обязательства; must not = запрещено"}, trap: {learner_form: "You must not attend the meeting.", correction: "You do not have to attend the meeting.", cause_ru: "в русском нет различия, но в английском: must not = forbidden, do not have to = no obligation"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.must-not-prohibition, type: chunk, title: "You must not ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вам запрещено ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (skip, bypass, ignore)", examples: ["You must not skip the security check before deployment.", "Users must not share their credentials with anyone."], contrast: {frame: "You do not have to bypass security.", note_ru: "must not = явный запрет; do not have to = отсутствие обязательства"}, trap: {learner_form: "You must not to skip the check.", correction: "You must not skip the security check.", cause_ru: "must не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.could-be-possibility, type: chunk, title: "It could be ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это может быть ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "прилагательное или существительное (a race condition, incorrect, a malfunction)", examples: ["It could be a race condition that only happens under high load.", "The issue could be in the error handling."], contrast: {frame: "It might be a race condition.", note_ru: "could и might оба выражают возможность; сходны по значению"}, trap: {learner_form: "It could be a race condition it.", correction: "It could be a race condition.", cause_ru: "не добавляем it в конце"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.might-have, type: chunk, title: "It might have ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "может быть, ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal, tense:modal-perfect], slot_hint_ru: "третья форма глагола (been, occurred, happened)", examples: ["It might have been a timing issue.", "The error might have occurred during the migration."], contrast: {frame: "It might be a timing issue.", note_ru: "might have = прошлое; might be = настоящее"}, trap: {learner_form: "It might have been a timing issue it.", correction: "It might have been a timing issue.", cause_ru: "не добавляем it"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.can-ability, type: chunk, title: "The system can ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "система может ..., способна ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (process, store, handle)", examples: ["The system can process up to 10,000 requests per second.", "This database can store terabytes of data."], contrast: {frame: "The system is able to process requests.", note_ru: "can более распространено и короче"}, trap: {learner_form: "The system can to process requests.", correction: "The system can process requests.", cause_ru: "can не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.could-have-past, type: chunk, title: "We could have ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы могли бы ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal, tense:modal-perfect], slot_hint_ru: "третья форма глагола (done, prevented, improved)", examples: ["We could have prevented this issue by running the full test suite.", "They could have improved the response time with caching."], contrast: {frame: "We did prevent this issue.", note_ru: "could have = условное прошлое; did = действительное прошлое"}, trap: {learner_form: "We could have prevent this issue.", correction: "We could have prevented this issue.", cause_ru: "после have нужна третья форма (prevented)"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.ought-to, type: chunk, title: "You ought to ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "вам следует ..., вы должны ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (verify, document, monitor)", examples: ["You ought to verify the data before importing.", "The team ought to document the API changes."], contrast: {frame: "You should verify the data.", note_ru: "ought to более формально; should более распространено"}, trap: {learner_form: "You ought to verify the data it.", correction: "You ought to verify the data.", cause_ru: "не добавляем it"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.may-permission, type: chunk, title: "You may ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "вы можете ... (разрешение)", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (proceed, exit, continue)", examples: ["You may proceed with the deployment once all tests pass.", "Users may exit the application at any time."], contrast: {frame: "You can proceed with the deployment.", note_ru: "may более формально; can более распространено"}, trap: {learner_form: "You may to proceed with deployment.", correction: "You may proceed with the deployment.", cause_ru: "may не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.shall-obligation, type: chunk, title: "The system shall ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "система должна ... (в требованиях)", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (validate, log, timeout)", examples: ["The system shall validate input before processing.", "The server shall log all authentication attempts."], contrast: {frame: "The system will validate input.", note_ru: "shall в требованиях = обязательно; будет = просто факт"}, trap: {learner_form: "The system shall to validate input.", correction: "The system shall validate input.", cause_ru: "shall не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.cannot-be-logical, type: chunk, title: "That cannot be ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это не может быть ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "прилагательное (correct, complete, empty)", examples: ["That cannot be correct; the numbers don't match.", "The cache cannot be empty if requests are succeeding."], contrast: {frame: "That is not correct.", note_ru: "cannot быть = логическая невозможность; is not = просто отрицание"}, trap: {learner_form: "That cannot be correct it.", correction: "That cannot be correct.", cause_ru: "не добавляем it"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.should-not, type: chunk, title: "You should not ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вам не следует ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (modify, ignore, bypass)", examples: ["You should not modify the production config directly.", "We should not ignore these test failures."], contrast: {frame: "You must not modify the config.", note_ru: "should not = рекомендуется не; must not = запрещено"}, trap: {learner_form: "You should not to modify the config.", correction: "You should not modify the config.", cause_ru: "should не требует to"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.must-have-been, type: chunk, title: "The error must have been ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ошибка, должно быть, была ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal, tense:modal-perfect, tense:passive], slot_hint_ru: "прилагательное (silent, intermittent, introduced)", examples: ["The error must have been silent because no alerts fired.", "The bug must have been introduced in the latest build."], contrast: {frame: "The error was silent.", note_ru: "must have been = дедукция; was = констатация факта"}, trap: {learner_form: "The error must have been silent it.", correction: "The error must have been silent.", cause_ru: "не добавляем it"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.cannot-have, type: chunk, title: "We cannot have ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы не можем допустить, чтобы ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal, structure:negative], slot_hint_ru: "существительное или глаголная форма (data loss, this happening)", examples: ["We cannot have data loss in production.", "The team cannot have downtime during the migration window."], contrast: {frame: "It cannot have happened without a warning first.", note_ru: "cannot have + существительное — отказ допустить в настоящем; cannot have + третья форма — логическая невозможность о прошлом"}, trap: {learner_form: "We cannot have the data loss.", correction: "We cannot have data loss.", cause_ru: "data loss без артикля в generic контексте"}, transformations: [authored]}
  - {id: chunk.modals-deduction-obligation.might-not, type: chunk, title: "It might not ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это может не ...", frame_of: grammar.modals.deduction-obligation, carries: [structure:modal], slot_hint_ru: "глагол (work, help, matter)", examples: ["It might not work with older browsers.", "This solution might not address the root cause."], contrast: {frame: "It will not work.", note_ru: "might not = возможность отсутствия; will not = уверенность в отсутствии"}, trap: {learner_form: "It might not to work with older browsers.", correction: "It might not work with older browsers.", cause_ru: "might не требует to"}, transformations: [authored]}
