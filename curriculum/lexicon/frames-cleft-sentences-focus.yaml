# Frames for grammar.cleft-sentences.focus (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.cleft-sentences-focus.it-was-the-token, type: chunk, title: "It was the ___ that ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это был именно ..., который ...", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "существительное + предикат", examples: ["It was the expired token that caused the repeated failures.", "It was the missing migration that broke the deployment pipeline."], contrast: {frame: "The ___ caused ___", note_ru: "прямой порядок, без акцента"}, trap: {learner_form: "It was the expired token which caused the failures.", correction: "It was the expired token that caused the failures.", cause_ru: "в cleft-конструкции It was X that … стандартно используется that; which здесь звучит неестественно"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.what-we-need-is, type: chunk, title: "What we need is ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "то, что нам нужно, это …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "то, что требуется", examples: ["What we need is a stable export format.", "What the system requires is better error logging."], contrast: {frame: "We need ___", note_ru: "прямой порядок, менее акцентирован"}, trap: {learner_form: "What we need it is a stable format.", correction: "What we need is a stable format.", cause_ru: "не нужно повторять объект (it); 'what' уже служит объектом"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.the-reason-failure-is, type: chunk, title: "The reason for the failure is ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "причина сбоя в том, что …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "причина или объяснение", examples: ["The reason for the failure is insufficient memory allocation.", "The reason the tests fail is a corrupted test database."], contrast: {frame: "The failure happened because ___", note_ru: "менее фокусированная формулировка"}, trap: {learner_form: "The reason of the failure is low memory.", correction: "The reason for the failure is low memory.", cause_ru: "'reason for', не 'reason of'"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.all-we-did-was, type: chunk, title: "All we did was ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "всё, что мы сделали, это просто …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "простое действие или решение", examples: ["All we did was add a single index to the query.", "All they needed was to restart the service."], contrast: {frame: "We only ___", note_ru: "менее фокусирует внимание на простоте действия"}, trap: {learner_form: "All we did was updating the configuration.", correction: "All we did was update the configuration.", cause_ru: "используется базовая форма (update), не герундий (updating)"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.it-is-the-logging, type: chunk, title: "It is the logging that ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "это именно логирование, которое ...", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "существительное + сказуемое", examples: ["It is the logging that makes debugging possible.", "It is the cache strategy that determines performance."], contrast: {frame: "Logging makes debugging possible.", note_ru: "прямой порядок, без акцента"}, trap: {learner_form: "It is the logging which enables debugging.", correction: "It is the logging that enables debugging.", cause_ru: "в фокусирующих предложениях чаще используется 'that' после things"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.what-users-need, type: chunk, title: "What users need is ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "то, что нужно пользователям, это …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "требование или возможность", examples: ["What users need is an intuitive interface.", "What the team requires is clear documentation."], contrast: {frame: "Users need ___", note_ru: "прямая формулировка, менее акцентирована"}, trap: {learner_form: "What users need it is simplicity.", correction: "What users need is simplicity.", cause_ru: "не нужно повторять объект (it)"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.it-was-the-timeout, type: chunk, title: "It was the timeout that ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это был именно timeout, который ...", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "существительное + действие", examples: ["It was the timeout that prevented the connection from establishing.", "It was the timeout that caused the second outage."], contrast: {frame: "The timeout prevented ___", note_ru: "прямой порядок, менее акцентирован"}, trap: {learner_form: "It was the timeout who caused the problem.", correction: "It was the timeout that caused the problem.", cause_ru: "who — для людей, that — для предметов и людей, which — только для предметов"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.what-matters-most-is, type: chunk, title: "What matters most is ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "самое важное, это …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "приоритет или ценность", examples: ["What matters most is data integrity.", "What's crucial is maintaining system availability."], contrast: {frame: "The most important thing is ___", note_ru: "более длинная и менее элегантная формулировка"}, trap: {learner_form: "What matters most to us it is reliability.", correction: "What matters most is reliability.", cause_ru: "не нужно повторять объект (it)"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.the-issue-was-that, type: chunk, title: "The issue was that ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "проблема была в том, что …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "описание проблемы", examples: ["The issue was that the backup was incomplete.", "The problem was that we ignored the warning in the logs."], contrast: {frame: "We had ___, and that was the problem.", note_ru: "менее фокусирующая формулировка"}, trap: {learner_form: "The issue was is that we misconfigured it.", correction: "The issue was that we misconfigured it.", cause_ru: "not 'was is'; только одно вспомогательное глагол"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.it-is-the-design-who, type: chunk, title: "It is the design that determines ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "это архитектура, которая определяет …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "существительное + следствие", examples: ["It is the design that determines the system's scalability.", "It is the architecture that limits our options."], contrast: {frame: "The design determines ___", note_ru: "прямой порядок, без акцента"}, trap: {learner_form: "It is the design who limits our scalability.", correction: "It is the design that limits our scalability.", cause_ru: "'that' используется для things, не 'who'"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.what-we-changed-was, type: chunk, title: "What we changed was ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "то, что мы изменили, это …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "изменение или решение", examples: ["What we changed was the retry strategy.", "What the team modified was the deployment schedule."], contrast: {frame: "We changed ___", note_ru: "прямой порядок, менее акцентирован"}, trap: {learner_form: "What we changed it is the strategy.", correction: "What we changed is the strategy.", cause_ru: "не нужно повторять объект (it)"}, transformations: [authored]}
  - {id: chunk.cleft-sentences-focus.the-reason-people-left, type: chunk, title: "The reason people left was ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "причина, по которой люди ушли, была …", frame_of: grammar.cleft-sentences.focus, carries: [structure:cleft], slot_hint_ru: "объяснение или причина", examples: ["The reason people left was the constant interruptions.", "The reason the project failed was poor planning."], contrast: {frame: "People left because ___", note_ru: "менее структурирована фокусировка"}, trap: {learner_form: "The reason people left it was the meetings.", correction: "The reason people left was the meetings.", cause_ru: "не нужно повторять объект (it)"}, transformations: [authored]}
