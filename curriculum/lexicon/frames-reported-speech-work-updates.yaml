# Frames for grammar.reported-speech.work-updates (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.reported-speech-work-updates.said-that-would, type: chunk, title: "He said that ___ would ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "он сказал, что ... будет ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее (the team, it) + будущее действие", examples: ["He said that the fix would be ready by Thursday.", "She said that the server would need a restart."], contrast: {frame: "He said, 'The fix will be ready by Thursday.'", note_ru: "прямая речь не сдвигает времена; здесь reported speech со сдвигом"}, trap: {learner_form: "He said that the fix will be ready.", correction: "He said that the fix would be ready.", cause_ru: "will → would при сдвиге времён (будущее в прошедшем), это не conditional"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.told-us-had, type: chunk, title: "They told us the ___ had ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "они сказали нам, что ... был ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "существительное (status, system) + прошедшее действие", examples: ["They told us the system had crashed twice that morning.", "The admin told us the deployment had failed during testing."], contrast: {frame: "They said that the system crashed twice that morning.", note_ru: "имеет значение, когда рассказывают; если давно рассказывали о прошлом, часто used perfect tense"}, trap: {learner_form: "They told us the system has crashed twice.", correction: "They told us the system had crashed twice.", cause_ru: "в reported speech present perfect становится past perfect (had + v3)"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.asked-whether-had, type: chunk, title: "She asked whether ___ had ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "она спросила, был ли ... ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее (we, you) + прошедшее действие", examples: ["She asked whether we had tested the edge case.", "The client asked whether the vendor had confirmed the timeline."], contrast: {frame: "She asked, 'Did you test the edge case?'", note_ru: "в прямой речи обратный порядок слов (Did you...); в reported speech обычный порядок (whether you had...)"}, trap: {learner_form: "She asked whether had we tested the edge case.", correction: "She asked whether we had tested the edge case.", cause_ru: "в reported speech нет инверсии; порядок подлежащего и глагола обычный"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.mentioned-needed, type: chunk, title: "The client mentioned that ___ needed ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "клиент упомянул, что ... нужен ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее + существительное в объектном падеже", examples: ["The client mentioned that the team needed more documentation.", "He mentioned that the system needed optimization."], contrast: {frame: "The client said that the team needed more documentation.", note_ru: "mentioned и said похожи; mentioned часто вводит менее явное утверждение"}, trap: {learner_form: "The client mentioned that the team need more documentation.", correction: "The client mentioned that the team needed more documentation.", cause_ru: "сдвиг времени: present (need) становится past (needed) в reported speech"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.told-me-was, type: chunk, title: "They told me the ___ was ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "они мне сказали, что ... был ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "существительное + характеристика или статус", examples: ["They told me the deadline was non-negotiable.", "The manager told me the priority was higher than expected."], contrast: {frame: "He said to me the deadline was non-negotiable.", note_ru: "told me предпочтительнее, чем said to me в reported speech"}, trap: {learner_form: "They told me the deadline is non-negotiable.", correction: "They told me the deadline was non-negotiable.", cause_ru: "сдвиг времени: present (is) становится past (was)"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.was-told-had-been, type: chunk, title: "I was told that ___ had been ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мне сказали, что ... был ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech, tense:passive], slot_hint_ru: "существительное + прошедшее состояние", examples: ["I was told that the refund had been processed by accounting.", "We were told that the migration had been postponed indefinitely."], contrast: {frame: "They said the refund had been processed by accounting.", note_ru: "passive позволяет скрыть агента; I was told + passive это дважды passive, но естественно в work English"}, trap: {learner_form: "I was told that the refund has been processed.", correction: "I was told that the refund had been processed.", cause_ru: "в reported speech present perfect становится past perfect"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.agreed-would, type: chunk, title: "We agreed that ___ would ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication, meetings], meaning_ru: "мы согласились, что ... будет ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее + будущее действие", examples: ["We agreed that the release would happen on Friday.", "They agreed that the vendor would handle the support."], contrast: {frame: "We said the release would happen on Friday.", note_ru: "agreed that предполагает более глубокое согласие, чем просто said"}, trap: {learner_form: "We agreed that the release will happen on Friday.", correction: "We agreed that the release would happen on Friday.", cause_ru: "will → would при сдвиге времён (будущее в прошедшем), это не conditional"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.asked-if-were, type: chunk, title: "The reviewer asked if ___ were ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "рецензент спросил, есть ли ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее (tests, requirements) + характеристика", examples: ["The reviewer asked if the tests were complete.", "He asked if the requirements were documented."], contrast: {frame: "The reviewer asked, 'Are the tests complete?'", note_ru: "в прямой речи: Are; в reported speech: if/whether + were (не are)"}, trap: {learner_form: "The reviewer asked if the tests are complete.", correction: "The reviewer asked if the tests were complete.", cause_ru: "сдвиг времени: present (are) становится past (were) в reported speech"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.stated-must, type: chunk, title: "She stated that ___ must ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "она заявила, что ... должны ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее (the team, we) + обязательное действие", examples: ["She stated that we must complete the checklist before launch.", "The policy stated that users must change their password quarterly."], contrast: {frame: "She said that we must complete the checklist before launch.", note_ru: "stated более формально, чем said"}, trap: {learner_form: "She stated that we must to complete the checklist.", correction: "She stated that we must complete the checklist.", cause_ru: "модальный глагол must не требует to"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.wondered-might, type: chunk, title: "I wondered whether ___ might ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я задавался вопросом, может ли ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее + возможное действие", examples: ["I wondered whether the outage might affect the backup system.", "We wondered whether the fix might resolve both issues."], contrast: {frame: "I thought whether the outage might affect the backup system.", note_ru: "wondered whether более точно передает выраженный вопрос, чем thought whether"}, trap: {learner_form: "I wondered whether the outage can affect the backup system.", correction: "I wondered whether the outage might affect the backup system.", cause_ru: "в контексте неопределённого прошлого might точнее, чем can"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.notified-was, type: chunk, title: "The vendor notified us that ___ was ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "поставщик уведомил нас, что ... был ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "существительное + характеристика или статус", examples: ["The vendor notified us that the service was unavailable during maintenance.", "They notified the team that the deadline was shifted to next month."], contrast: {frame: "The vendor said that the service was unavailable during maintenance.", note_ru: "notified более формально и предполагает официальное сообщение"}, trap: {learner_form: "The vendor notified us that the service is unavailable.", correction: "The vendor notified us that the service was unavailable.", cause_ru: "сдвиг времени: present (is) становится past (was)"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.repeated-should, type: chunk, title: "He repeated that ___ should ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он повторил, что ... должны ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "подлежащее + рекомендуемое действие", examples: ["He repeated that we should review the code before committing.", "The manager repeated that everyone should attend the training session."], contrast: {frame: "He said that we should review the code before committing.", note_ru: "repeated подчёркивает, что это сказано несколько раз"}, trap: {learner_form: "He repeated that we should to review the code.", correction: "He repeated that we should review the code.", cause_ru: "модальный глагол should не требует to"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.asked-when-would, type: chunk, title: "They asked when the ___ would ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они спросили, когда ... будет ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "существительное + будущее действие", examples: ["They asked when the rollout would begin.", "The client asked when the report would be available."], contrast: {frame: "They asked, 'When will the rollout begin?'", note_ru: "when остаётся тем же; меняется порядок слов (без инверсии will) и will → would"}, trap: {learner_form: "They asked when the rollout will begin.", correction: "They asked when the rollout would begin.", cause_ru: "сдвиг времени: will → would в reported speech"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.pointed-out-had, type: chunk, title: "The tester pointed out that ___ had ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "тестировщик указал, что ... было ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech], slot_hint_ru: "существительное + прошедшее действие", examples: ["The tester pointed out that an edge case had been missed.", "She pointed out that the error message had not been updated."], contrast: {frame: "The tester said that an edge case had been missed.", note_ru: "pointed out более точно передает критическую обратную связь"}, trap: {learner_form: "The tester pointed out that an edge case was missing.", correction: "The tester pointed out that an edge case had been missed.", cause_ru: "perfect tense более естественен для завершённого действия в прошлом"}, transformations: [authored]}
  - {id: chunk.reported-speech-work-updates.claimed-had-been, type: chunk, title: "The vendor claimed that ___ had been ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "поставщик утверждал, что ... был ...", frame_of: grammar.reported-speech.work-updates, carries: [tense:reported-speech, tense:passive], slot_hint_ru: "существительное + пассивное прошедшее действие", examples: ["The vendor claimed that the patch had been tested thoroughly.", "They claimed that the migration had been completed on schedule."], contrast: {frame: "The vendor said that the patch had been tested thoroughly.", note_ru: "claimed предполагает скептицизм говорящего; said более нейтрально"}, trap: {learner_form: "The vendor claimed that the patch has been tested.", correction: "The vendor claimed that the patch had been tested.", cause_ru: "present perfect становится past perfect в reported speech"}, transformations: [authored]}
