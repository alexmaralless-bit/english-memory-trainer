# Frames for grammar.future-time-expressions (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.future-time-expressions.next-week, type: chunk, title: "next week", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "на следующей неделе", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["The sprint starts next week on Monday.", "We'll meet next week to discuss the roadmap."], contrast: {frame: "the next week", note_ru: "без артикля и без in"}, trap: {learner_form: "in the next week", correction: "next week", cause_ru: "излишнее in перед конкретным днём"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.next-month, type: chunk, title: "next month", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "в следующем месяце", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["The vendor will respond next month with results.", "I'm on vacation next month in August."], contrast: {frame: "in the next month", note_ru: "без in перед next"}, trap: {learner_form: "in next month", correction: "next month", cause_ru: "next — самостоятельный маркер времени, без предлога"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.tomorrow, type: chunk, title: "tomorrow", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "завтра", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["The code review is scheduled for tomorrow morning.", "We'll fix the bug and deploy it tomorrow."], contrast: {frame: "the tomorrow", note_ru: "tomorrow никогда не требует артикля"}, trap: {learner_form: "on the tomorrow", correction: "tomorrow", cause_ru: "путаница с on + конкретный день недели"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.by-friday, type: chunk, title: "by Friday", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "до пятницы (deadline)", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["I'll send the report by Friday afternoon.", "The team will deploy the update by Friday night."], contrast: {frame: "before Friday", note_ru: "before исключает саму пятницу; by включает её как крайний срок"}, trap: {learner_form: "until Friday", correction: "by Friday", cause_ru: "Russian до может означать обе идеи; by — точнее для deadline"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.by-end-of-week, type: chunk, title: "by the end of the week", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к концу недели", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:fixed-expression], examples: ["The results will be ready by the end of the week.", "I need the data by the end of the week for review."], contrast: {frame: "before the end of the week", note_ru: "before — «раньше»; by — «не позже» (дедлайн)"}, trap: {learner_form: "at the end of the week", correction: "by the end of the week", cause_ru: "at — точка во времени; by — дедлайн (не позже этого момента)"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.by-end-of-month, type: chunk, title: "by the end of the month", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к концу месяца", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:fixed-expression], examples: ["All tickets must be closed by the end of the month.", "We'll complete the migration by the end of the month."], contrast: {frame: "before the end of the month", note_ru: "before — «раньше»; by — «не позже» (дедлайн)"}, trap: {learner_form: "in the end of the month", correction: "by the end of the month", cause_ru: "by используется именно для дедлайна, а не in"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.in-two-weeks, type: chunk, title: "in two weeks", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "через две недели", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["The client will decide in two weeks from today.", "Let's schedule a follow-up meeting in two weeks."], contrast: {frame: "two weeks from now", note_ru: "in two weeks и two weeks from now значат одно и то же — «через две недели», но строятся по-разному"}, trap: {learner_form: "after two weeks", correction: "in two weeks", cause_ru: "in отсчитывается от сейчас; after — от другого момента, не от «сейчас»"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.in-a-month, type: chunk, title: "in a month", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "через месяц", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:indefinite-first-mention], examples: ["The test results will arrive in a month.", "We'll start the beta testing in a month."], contrast: {frame: "in one month", note_ru: "a month и one month значат одно и то же"}, trap: {learner_form: "in the month", correction: "in a month", cause_ru: "перед числительным the не нужен, здесь ставится a"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.in-couple-days, type: chunk, title: "in a couple of days", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, everyday-life], meaning_ru: "в течение пары дней", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:indefinite-first-mention], examples: ["I'll fix that bug in a couple of days for sure.", "You'll get your access credentials in a couple of days."], contrast: {frame: "in a few days", note_ru: "couple — обычно «два», few — «три-четыре»"}, trap: {learner_form: "in couple of days", correction: "in a couple of days", cause_ru: "перед couple нужен артикль a: a couple of days"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.tomorrow-morning, type: chunk, title: "tomorrow morning", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "завтра с утра", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["The standup meeting is tomorrow morning at 9 AM.", "I'll call you tomorrow morning before the meeting."], contrast: {frame: "in the morning tomorrow", note_ru: "tomorrow morning — стандартный порядок; in the morning tomorrow — неестественно"}, trap: {learner_form: "tomorrow in the morning", correction: "tomorrow morning", cause_ru: "tomorrow morning — фиксированное сочетание без предлога in"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.on-friday, type: chunk, title: "on Friday", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "в пятницу", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["The code review starts on Friday afternoon.", "We'll have the demo on Friday at 3 PM."], contrast: {frame: "this Friday", note_ru: "on Friday — конкретный день недели; this Friday — ближайшая пятница"}, trap: {learner_form: "in Friday", correction: "on Friday", cause_ru: "on используется для дней недели; in — для месяцев и годов"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.next-monday, type: chunk, title: "next Monday", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "в следующий понедельник", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["We'll start the new project next Monday morning.", "The launch is scheduled for next Monday evening."], contrast: {frame: "on Monday", note_ru: "next Monday используется без on; on Monday — когда день недели уже ясен из контекста"}, trap: {learner_form: "on next Monday", correction: "next Monday", cause_ru: "next — ukazatель vremeni; on ne nuzhen"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.in-afternoon, type: chunk, title: "in the afternoon", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "во второй половине дня", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:fixed-expression], examples: ["The team meeting is scheduled in the afternoon tomorrow.", "I'll send the update in the afternoon for review."], contrast: {frame: "this afternoon", note_ru: "in the afternoon — общее время суток; this afternoon — ближайший день"}, trap: {learner_form: "at the afternoon", correction: "in the afternoon", cause_ru: "in используется для частей дня (in the morning/afternoon/evening), at — для точного времени"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.on-weekend, type: chunk, title: "on the weekend", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "на выходные", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:definite-shared-context], examples: ["The backup runs automatically on the weekend morning.", "We'll do maintenance work on the weekend."], contrast: {frame: "over the weekend", note_ru: "on the weekend — конкретное действие в выходные; over the weekend — в течение всех выходных"}, trap: {learner_form: "in the weekend", correction: "on the weekend", cause_ru: "с weekend в американском английском используется on, не in"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.next-quarter, type: chunk, title: "next quarter", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "в следующем квартале", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["We'll hire more developers next quarter.", "The feature release is planned for next quarter."], contrast: {frame: "in the next quarter", note_ru: "next quarter — без предлога; in the next quarter — тоже верно, более формально"}, trap: {learner_form: "in next quarter", correction: "next quarter", cause_ru: "next — самостоятельный маркер времени, без предлога"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.this-friday, type: chunk, title: "this Friday", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "в эту пятницу", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, structure:demonstrative], examples: ["The deployment is happening this Friday evening.", "Let's meet this Friday afternoon for a quick sync."], contrast: {frame: "this coming Friday", note_ru: "this Friday — без on; this coming Friday — более явный вариант для ближайшей пятницы"}, trap: {learner_form: "on this Friday", correction: "this Friday", cause_ru: "с указательным this предлог on не нужен"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.by-noon, type: chunk, title: "by noon", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к полудню", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["I'll have the report ready by noon tomorrow.", "The approval should come by noon at the latest."], contrast: {frame: "before noon", note_ru: "before — «раньше» (без уточнения дедлайна); by — «не позже» (дедлайн)"}, trap: {learner_form: "until noon", correction: "by noon", cause_ru: "by используется именно для дедлайна, конкретного крайнего срока"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.in-few-days, type: chunk, title: "in a few days", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "через несколько дней", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:indefinite-first-mention], examples: ["The issue will be fixed in a few days by our team.", "We'll get feedback from the client in a few days."], contrast: {frame: "in a couple of days", note_ru: "few — обычно «три-четыре», couple — «два»"}, trap: {learner_form: "in few days", correction: "in a few days", cause_ru: "перед few нужен артикль a: a few days"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.by-end-day, type: chunk, title: "by end of day", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к концу рабочего дня", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["I need the spreadsheet by end of day please.", "The decision will come by end of day tomorrow."], contrast: {frame: "at the end of the day", note_ru: "by end of day — сжатая деловая идиома без артиклей; at the end of the day — полная форма с артиклем"}, trap: {learner_form: "at end of day", correction: "by end of day", cause_ru: "by используется именно для дедлайна"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.tomorrow-at-time, type: chunk, title: "tomorrow at ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "завтра в (время)", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], slot_hint_ru: "час (2 PM, 10:30)", examples: ["The standup call is tomorrow at 2 PM sharp.", "We'll start the review tomorrow at 9:00 AM."], contrast: {frame: "tomorrow in ___", note_ru: "at — точное время; in — часть дня"}, trap: {learner_form: "tomorrow in 2 PM", correction: "tomorrow at 2 PM", cause_ru: "at ставится перед точным временем (at 2 PM), не in"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.on-monday-date, type: chunk, title: "on Monday, ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "в понедельник (с датой)", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], slot_hint_ru: "дата или время", examples: ["The planning meeting is on Monday, the 15th.", "We'll launch on Monday, 9 a.m. sharp."], contrast: {frame: "this Monday, ___", note_ru: "on Monday — без the; this Monday — ближайший понедельник с указательным словом"}, trap: {learner_form: "on the Monday", correction: "on Monday", cause_ru: "день недели ставится без артикля the"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.next-year, type: chunk, title: "next year", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "в следующем году", frame_of: grammar.future-time-expressions, carries: [structure:time-marker], examples: ["The new platform launch is scheduled for next year.", "We'll start the expansion project next year."], contrast: {frame: "the following year", note_ru: "next year — без предлога; the following year — более формальный синоним"}, trap: {learner_form: "in next year", correction: "next year", cause_ru: "next — самостоятельный маркер времени, без предлога"}, transformations: [authored]}
  - {id: chunk.future-time-expressions.in-hour, type: chunk, title: "in an hour", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [planning, work], meaning_ru: "через час", frame_of: grammar.future-time-expressions, carries: [structure:time-marker, article:indefinite-first-mention], examples: ["The server will restart automatically in an hour.", "I'll call you back in an hour from now."], contrast: {frame: "an hour from now", note_ru: "in an hour и an hour from now значат одно и то же"}, trap: {learner_form: "after an hour", correction: "in an hour", cause_ru: "in — стандартный предлог для будущего времени, отсчитанного от текущего момента"}, transformations: [authored]}
