# Frames for grammar.third-conditional.retrospective (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.third-conditional-retrospective.if-had-would-have, type: chunk, title: "If we had ___, we would have ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы мы …, мы бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3], slot_hint_ru: "глагол третьей формы + результат", examples: ["If we had tested the code, we would have caught the bug.", "If I had called earlier, I would have finished on time."], contrast: {frame: "If we had ___, we would ___ now", note_ru: "это смешанный условный (результат в настоящем), а не третий"}, trap: {learner_form: "If we would have tested, we would have caught.", correction: "If we had tested, we would have caught.", cause_ru: "в условии не может быть would have, только had"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.had-we-inversion, type: chunk, title: "Had we ___, we would have ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы мы …, мы бы … (инверсия)", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:inversion], slot_hint_ru: "глагол третьей формы + результат", examples: ["Had we reviewed the requirements, we would have avoided the refactor.", "Had she confirmed the numbers, she would have saved time."], contrast: {frame: "If we had ___, we would have ___", note_ru: "инверсия создает более формальный стиль"}, trap: {learner_form: "Had we reviewed, we would catch.", correction: "Had we reviewed, we would have caught.", cause_ru: "в результате нужно would have"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.it-would-have-if, type: chunk, title: "It would have ___ if ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Это бы … если бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3], slot_hint_ru: "глагол третьей формы + условие", examples: ["It would have succeeded if the certificate had been renewed.", "The meeting would have been shorter if everyone had read the agenda."], contrast: {frame: "It would be ___ if ___", note_ru: "это второй условный для текущих ситуаций"}, trap: {learner_form: "It would have been worse if we have told them.", correction: "It would have been worse if we had told them.", cause_ru: "в условии нужна Past Perfect"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.would-not-have, type: chunk, title: "We would not have ___ if ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы не бы … если бы … (отрицание)", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:negative], slot_hint_ru: "глагол третьей формы + условие", examples: ["We would not have lost data if backups had been running.", "They would not have complained if we had communicated earlier."], contrast: {frame: "We had not ___", note_ru: "это просто прошлый факт, не условный"}, trap: {learner_form: "We would not have lost if we tested.", correction: "We would not have lost if we had tested.", cause_ru: "в условии нужна Past Perfect"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.might-have-if, type: chunk, title: "She might have ___ if ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Она могла бы … если бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:modal], slot_hint_ru: "глагол третьей формы + условие", examples: ["She might have noticed the error if she had reviewed the logs.", "The project might have been approved if stakeholders had seen the ROI."], contrast: {frame: "She would have ___ if ___", note_ru: "might выражает возможность, would — определенность"}, trap: {learner_form: "She might have noticed if she reviewed.", correction: "She might have noticed if she had reviewed.", cause_ru: "условие требует Past Perfect"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.could-have-if, type: chunk, title: "They could have ___ if ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Они смогли бы … если бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:modal], slot_hint_ru: "глагол третьей формы + условие", examples: ["They could have fixed the outage faster if they had access to the logs.", "We could have reduced costs if we had planned the migration earlier."], contrast: {frame: "They would have ___", note_ru: "could выражает способность"}, trap: {learner_form: "We could have done it if we knew.", correction: "We could have done it if we had known.", cause_ru: "даже с could нужна Past Perfect в условии"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.if-not-past-perfect, type: chunk, title: "If we had not ___, ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы мы не …, то … (отрицание в условии)", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:negative], slot_hint_ru: "глагол третьей формы + результат", examples: ["If we had not rolled back the version, the incident would have lasted longer.", "If he had not noticed the typo, the email would have gone out."], contrast: {frame: "If we did not ___, ___", note_ru: "Past Simple в if-части — это второй условный (гипотеза в настоящем) или повторяющееся прошлое, а не третий (нет had + V3)"}, trap: {learner_form: "If the backup had not failed, we would restore.", correction: "If the backup had not failed, we would have restored.", cause_ru: "результат тоже в прошлом — нужно would have + причастие (would have restored), а не просто would"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.if-only-had, type: chunk, title: "If only we had ___!", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "Если бы только мы …! (сожаление)", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3], examples: ["If only we had known about the deadline extension!", "If only she had answered the phone earlier."], contrast: {frame: "I wish we had ___", note_ru: "wish + Past Perfect для сожаления"}, trap: {learner_form: "If only we would have tested.", correction: "If only we had tested.", cause_ru: "после if only не может быть would have"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.otherwise-would-have, type: chunk, title: "___, otherwise we would have ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "…, иначе мы бы … (вывод)", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3], examples: ["The alert didn't fire, otherwise we would have resolved it in minutes.", "He ignored the warning, otherwise we would have prepared differently."], contrast: {frame: "Otherwise we will ___", note_ru: "иначе для будущих последствий"}, trap: {learner_form: "Otherwise we would caught the issue.", correction: "Otherwise we would have caught the issue.", cause_ru: "нужно would have, не would"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.had-not-inversion, type: chunk, title: "Had we not ___, ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы не … (инверсия)", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:inversion, structure:negative], slot_hint_ru: "глагол третьей формы + результат", examples: ["Had the engineer not spotted the anomaly, the outage would have cascaded.", "Had we not received the extension, the project would have failed."], contrast: {frame: "If we had not ___", note_ru: "то же значение, но более формально благодаря инверсии"}, trap: {learner_form: "Had not we tested, we would miss.", correction: "Had we not tested, we would have missed.", cause_ru: "subject идет после had, отрицание перед: had + subject + not"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.could-not-have, type: chunk, title: "We could not have ___ if ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Мы не могли бы … если бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:modal, structure:negative], slot_hint_ru: "глагол третьей формы + условие", examples: ["We could not have handled the load if we had not added the cache layer.", "They could not have completed it if they had missed that meeting."], contrast: {frame: "We would not have ___", note_ru: "could not подчёркивает невозможность (сильнее, чем would not)"}, trap: {learner_form: "We could not have done it if we didn't test.", correction: "We could not have done it if we hadn't tested.", cause_ru: "отрицание в условии требует hadn't"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.would-have-been-if, type: chunk, title: "It would have been ___ if ___", cefr: B2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Это бы было …, если бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3], slot_hint_ru: "прилагательное/существительное + условие", examples: ["It would have been much worse if nobody had tested the changes.", "The feedback would have been positive if we had addressed the UI issues."], contrast: {frame: "It would have ___", note_ru: "would have been для состояния"}, trap: {learner_form: "It would have been failed if we test.", correction: "It would have been a failure if we had tested.", cause_ru: "также condition needs Past Perfect"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.but-for-would-have, type: chunk, title: "But for the ___, we would have ___", cefr: B2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "Если бы не …, мы бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3], slot_hint_ru: "существительное + результат", examples: ["But for the delay, we would have shipped on schedule.", "But for her intervention, the team would have abandoned the project."], contrast: {frame: "Without the ___", note_ru: "without менее формально, чем but for"}, trap: {learner_form: "But for the delay, we ship on schedule.", correction: "But for the delay, we would have shipped on schedule.", cause_ru: "нужно would have, не Present Simple"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.might-not-have-if, type: chunk, title: "The service might not have ___ if ___", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Сервис не мог бы … если бы …", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:modal, structure:negative], slot_hint_ru: "глагол третьей формы + условие", examples: ["The service might not have crashed if load balancing had been enabled.", "The data might not have been lost if daily backups had been scheduled."], contrast: {frame: "The service would not have ___", note_ru: "might not — осторожное предположение; would not — уверенное утверждение"}, trap: {learner_form: "The service might not crashed if load balancing had been enabled.", correction: "The service might not have crashed if load balancing had been enabled.", cause_ru: "нужна modal perfect форма (might not have + причастие)"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.would-have-done-if, type: chunk, title: "What would we have done if ___?", cefr: B2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Что бы мы делали, если бы …?", frame_of: grammar.third-conditional.retrospective, carries: [tense:conditional-3, structure:question-wh], examples: ["What would we have done if the main server had failed?", "What would she have done if the budget had been cut?"], contrast: {frame: "What would we do if ___?", note_ru: "это второй условный"}, trap: {learner_form: "What would we have done if the server fail?", correction: "What would we have done if the server had failed?", cause_ru: "условие требует Past Perfect"}, transformations: [authored]}
  - {id: chunk.third-conditional-retrospective.should-have-if, type: chunk, title: "We should have ___ if ___", cefr: B2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "Нам следовало бы …, если бы … (obligation)", frame_of: grammar.third-conditional.retrospective, carries: [tense:modal-perfect], slot_hint_ru: "глагол третьей формы + условие", examples: ["We should have escalated the issue if we had detected it earlier.", "They should have prepared better if they had known the scale."], contrast: {frame: "We should ___", note_ru: "это нынешнее обязательство"}, trap: {learner_form: "We should have escalate if we detected.", correction: "We should have escalated if we had detected.", cause_ru: "обе части требуют соответствующих форм Perfect"}, transformations: [authored]}
