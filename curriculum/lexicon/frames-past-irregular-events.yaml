# Frames for grammar.past-irregular-events (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.past-irregular-events.the-error-began, type: chunk, title: "The error began ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Ошибка началась …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "2-я форма began (3-я — begun)", examples: ["The error began after the update.", "The problem began during the night shift."], contrast: {frame: "The error started ___", note_ru: "Started и began означают одно и то же, но began звучит чуть более формально"}, trap: {learner_form: "The error begined after the update.", correction: "The error began after the update.", cause_ru: "Begin — неправильный глагол; прошлое — began, не begined"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-found, type: chunk, title: "We found the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы обнаружили …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "find — неправильный, прошлое found", examples: ["We found the missing file in the archive.", "We found the bug in the old code."], contrast: {frame: "We looked for the ___", note_ru: "Looked for означает 'искали', found означает 'нашли' — разные идеи"}, trap: {learner_form: "We finded the missing file.", correction: "We found the missing file.", cause_ru: "Find — неправильный; не finded, а found"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-ran-into, type: chunk, title: "We ran into a ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы столкнулись с …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "run into = неожиданно встретить проблему", examples: ["We ran into a performance issue with the database.", "We ran into an unexpected error during testing."], contrast: {frame: "We had a ___", note_ru: "Had a проблема — более общее; ran into подчёркивает неожиданность"}, trap: {learner_form: "We runned into a performance issue.", correction: "We ran into a performance issue.", cause_ru: "Run — неправильный глагол; прошлое ran, не runned"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.it-took-hours, type: chunk, title: "It took ___ hours to ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Это заняло … часов, чтобы …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "take — неправильный (took), выражение времени", examples: ["It took three hours to restore the system.", "It took eight hours to fix the issue."], contrast: {frame: "We spent ___ hours ___-ing", note_ru: "Took ударяет на необходимое время; spent означает, что мы потратили время"}, trap: {learner_form: "It taked three hours to restore.", correction: "It took three hours to restore the system.", cause_ru: "Take — неправильный; прошлое took, не taked"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-went-to, type: chunk, title: "We went to ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы пошли в/к …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "go — неправильный (went), направление", examples: ["We went to the server room to check the equipment.", "We went to the backup office when the power failed."], contrast: {frame: "We came to ___", note_ru: "Went указывает на движение туда; came указывает на приход в текущее место"}, trap: {learner_form: "We goed to the server room.", correction: "We went to the server room.", cause_ru: "Go — очень неправильный; went (не goed), gone"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.he-brought-the, type: chunk, title: "He brought the ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Он принёс/привёз …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "bring — неправильный (brought), транспортировка", examples: ["He brought the backup hardware from the storage.", "He brought the laptop for troubleshooting."], contrast: {frame: "He took the ___", note_ru: "Brought = привёз сюда; took = забрал отсюда"}, trap: {learner_form: "He broughed the backup hardware.", correction: "He brought the backup hardware.", cause_ru: "Bring — неправильный; brought, не broughed или bringed"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.they-saw, type: chunk, title: "They saw the ___ on the ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Они увидели … на/в …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "see — неправильный (saw), visually noticed", examples: ["They saw the error on the monitor.", "They saw the alert in the console."], contrast: {frame: "They looked at the ___", note_ru: "Saw = заметили случайно; looked at = намеренно посмотрели"}, trap: {learner_form: "They seed the error on the monitor.", correction: "They saw the error on the monitor.", cause_ru: "See — неправильный; saw (not seed или see в прошлом)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.i-had-to, type: chunk, title: "I had to ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мне пришлось …, я должен был …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "had to = прошлая необходимость/обязанность", examples: ["I had to restart the service manually.", "I had to contact the vendor for support."], contrast: {frame: "I have to ___", note_ru: "Have to = текущая необходимость; had to = прошлая"}, trap: {learner_form: "I have to restart the service yesterday.", correction: "I had to restart the service yesterday.", cause_ru: "Yesterday требует прошлого времени (had, не have); had — это Past Simple от have"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.the-screen-went, type: chunk, title: "The screen went ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Экран стал … (went black, went dark)", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "go + состояние (went black, went down)", examples: ["The screen went black during the update.", "The server went offline at midnight."], contrast: {frame: "The screen became ___", note_ru: "Went + adjective = sudden change; became = более formal or gradual"}, trap: {learner_form: "The screen go black during the update.", correction: "The screen went black during the update.", cause_ru: "Нужно прошлое время (went) с 'during the update', не present (go)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-built, type: chunk, title: "We built the ___ to ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы создали/построили …, чтобы …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "build — неправильный (built), creation", examples: ["We built the workaround to keep operations running.", "We built the monitoring script to catch similar issues."], contrast: {frame: "We created the ___", note_ru: "Built = построили нечто сложное; created = создали (может быть проще)"}, trap: {learner_form: "We builded the workaround.", correction: "We built the workaround.", cause_ru: "Build — неправильный; built (not builded)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.they-made, type: chunk, title: "They made the ___ call", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Они приняли решение …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "решение (make a decision, make a call)", examples: ["They made the final call to roll back the deployment.", "They made the decision to escalate to the vendor."], contrast: {frame: "They made the ___", note_ru: "Мейк может быть много типов действий; в контексте decision/call это стандартное выражение"}, trap: {learner_form: "They maked the call to roll back.", correction: "They made the call to roll back the deployment.", cause_ru: "Make — неправильный; made (not maked)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.the-issue-came-from, type: chunk, title: "The issue came from the ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Проблема пришла из …, произошла из-за …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "come from = источник, происхождение", examples: ["The issue came from the corrupted database file.", "The error came from the third-party library update."], contrast: {frame: "The issue was from the ___", note_ru: "Was from звучит неправильно для происхождения; came from — правильный вариант"}, trap: {learner_form: "The issue comed from a corrupted file.", correction: "The issue came from a corrupted database file.", cause_ru: "Come — неправильный; came (not comed)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-lost, type: chunk, title: "We lost ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы потеряли …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "lose — неправильный (lost), потеря", examples: ["We lost the connection to the database.", "We lost two hours of transaction data."], contrast: {frame: "We didn't have the ___", note_ru: "We lost подчёркивает unintended loss; didn't have может быть planned unavailability"}, trap: {learner_form: "We losed the connection.", correction: "We lost the connection to the database.", cause_ru: "Lose — неправильный; lost (not losed или lose в прошлом)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-fell-behind, type: chunk, title: "We fell behind on the ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы отстали с … (в графике)", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "fall behind = отстать в расписании", examples: ["We fell behind on the deployment timeline.", "We fell behind on the testing schedule."], contrast: {frame: "We were behind on the ___", note_ru: "Were behind = текущее состояние; fell behind = что произошло (event)"}, trap: {learner_form: "We falled behind on the timeline.", correction: "We fell behind on the deployment timeline.", cause_ru: "Fall — неправильный; fell (not falled)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.the-backup-gave, type: chunk, title: "The backup gave us the ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Backup дал нам …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "give = provide (неправильный gave)", examples: ["The backup gave us the data from last night.", "The copy gave us a working version to test."], contrast: {frame: "We got the ___ from the backup", note_ru: "Gave us ударяет на источник; got подчёркивает получение"}, trap: {learner_form: "The backup gived us the data.", correction: "The backup gave us the data from last night.", cause_ru: "Give — неправильный; gave (not gived)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.he-caught, type: chunk, title: "He caught the ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Он перехватил/обнаружил …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "catch = discover/intercept (неправильный caught)", examples: ["He caught the error before it reached production.", "He caught the suspicious activity in the logs."], contrast: {frame: "He found the ___", note_ru: "Caught подчёркивает быстроту обнаружения; found = более general discovery"}, trap: {learner_form: "He catched the error.", correction: "He caught the error before it reached production.", cause_ru: "Catch — неправильный; caught (not catched)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-spent-time, type: chunk, title: "We spent ___ time on ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы потратили … времени на …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "spend — неправильный (spent)", examples: ["We spent a lot of time on the investigation.", "We spent most of the day troubleshooting the issue."], contrast: {frame: "It took ___ time", note_ru: "Spent указывает на мой усилия; took указывает на необходимое время"}, trap: {learner_form: "We spended two hours on the investigation.", correction: "We spent two hours on the investigation.", cause_ru: "Spend — неправильный; spent (not spended)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.she-sent-the, type: chunk, title: "She sent the ___ to ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Она отправила … кому-то", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "send — неправильный (sent)", examples: ["She sent the report to the team lead.", "She sent the logs to the vendor for analysis."], contrast: {frame: "She emailed the ___", note_ru: "Sent = общее отправление; emailed = конкретно через email"}, trap: {learner_form: "She sended the report.", correction: "She sent the report to the team lead.", cause_ru: "Send — неправильный; sent (not sended)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.they-chose, type: chunk, title: "They chose to ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Они решили … (выбрали)", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "choose — неправильный (chose), deliberate decision", examples: ["They chose to revert the changes immediately.", "They chose to contact the support team first."], contrast: {frame: "They decided to ___", note_ru: "Chose = выбрали вариант; decided = приняли решение (может быть без альтернатив)"}, trap: {learner_form: "They choosed to revert the changes.", correction: "They chose to revert the changes immediately.", cause_ru: "Choose — неправильный; chose (not choosed)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-got-an, type: chunk, title: "We got an ___ yesterday", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Вчера мы получили …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "get — неправильный (got), receive или obtain", examples: ["We got an alert about the database issue yesterday.", "We got an error message from the system."], contrast: {frame: "We have gotten ___", note_ru: "Got = Past Simple; gotten = Present Perfect (американский вариант)"}, trap: {learner_form: "We go an alert yesterday.", correction: "We got an alert about the database issue yesterday.", cause_ru: "Yesterday требует Past Simple (got), не Present (go)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.the-system-broke, type: chunk, title: "The system broke ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "Система сломалась …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "break — неправильный (broke)", examples: ["The system broke during the maintenance window.", "The service broke unexpectedly at noon."], contrast: {frame: "The system crashed", note_ru: "Broke = физический отказ; crashed = внезапный отказ (может быть программное обеспечение)"}, trap: {learner_form: "The system braked during maintenance.", correction: "The system broke during the maintenance window.", cause_ru: "Break (сломать) — неправильный (broke); brake (педаль) — это другое слово"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.i-understood-that, type: chunk, title: "I understood that the ___ was ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Я понял, что …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "understand — неправильный (understood)", examples: ["I understood that the issue was critical.", "I understood that we needed external help."], contrast: {frame: "I realized that ___", note_ru: "Understood = я понял; realized = я осознал (может быть более sudden)"}, trap: {learner_form: "I understanded that the issue was critical.", correction: "I understood that the issue was critical.", cause_ru: "Understand — неправильный; understood (not understanded)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-drew-a, type: chunk, title: "We drew up a ___ to ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы составили план, чтобы …", frame_of: grammar.past-irregular-events, carries: [tense:past-simple], slot_hint_ru: "draw up = составить (неправильный drew)", examples: ["We drew up a recovery plan to get systems back online.", "We drew up a timeline to address all the issues."], contrast: {frame: "We created the ___", note_ru: "Drew up подчёркивает formal preparation; created более general"}, trap: {learner_form: "We drawed a recovery plan.", correction: "We drew up a recovery plan to get systems back online.", cause_ru: "Draw — неправильный; drew (not drawed)"}, transformations: [authored]}
  - {id: chunk.past-irregular-events.we-had-built, type: chunk, title: "We had built a ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "Мы уже построили … (перед другим прошлым событием)", frame_of: grammar.past-irregular-events, carries: [tense:past-perfect], slot_hint_ru: "had built = Past Perfect (более раннее действие)", examples: ["We had built a monitoring system before the crash happened.", "We had built the backup before the failure occurred."], contrast: {frame: "We built a ___", note_ru: "We had built = было ДО другого события; we built = простое прошлое"}, trap: {learner_form: "We had build a monitoring system.", correction: "We had built a monitoring system before the crash.", cause_ru: "После had нужна третья форма (built), не база (build)"}, transformations: [authored]}
