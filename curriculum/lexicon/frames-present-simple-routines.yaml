# Frames for grammar.present-simple.routines (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.present-simple-routines.i-work, type: chunk, title: "I work ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "я работаю …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "место, проект, область", examples: ["I work in the platform team.", "I work from home most days."], contrast: {frame: "I'm working ___", note_ru: "I'm working = сейчас занят, I work = обычное дело"}, trap: {learner_form: "I working in the team.", correction: "I work in the team.", cause_ru: "Present Simple без is = обычный факт, не текущее действие"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.he-works, type: chunk, title: "He works ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "он работает …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "место или область", examples: ["He works on the data pipeline.", "She works with our vendors."], contrast: {frame: "He's working ___", note_ru: "сейчас = Present Continuous, обычно = Present Simple"}, trap: {learner_form: "He work in this department.", correction: "He works in this department.", cause_ru: "он/она требует -s в Present Simple"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.we-check, type: chunk, title: "We check ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы проверяем …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "объект (отчеты, логи, багцы)", examples: ["We check the logs every morning.", "We check if all tests passed."], contrast: {frame: "We're checking ___", note_ru: "обычное дело vs текущее действие"}, trap: {learner_form: "We checks the data daily.", correction: "We check the data daily.", cause_ru: "мы = не третье лицо, -s не нужна"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.i-dont-work, type: chunk, title: "I don't work ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "я не работаю …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:negative], slot_hint_ru: "день недели или часы", examples: ["I don't work on weekends.", "I don't work with that database."], contrast: {frame: "I don't have ___", note_ru: "don't + инфинитив, а не третья форма"}, trap: {learner_form: "I no work on Monday.", correction: "I don't work on Monday.", cause_ru: "русский 'не' — нужен do-support в англ."}, transformations: [authored]}
  - {id: chunk.present-simple-routines.she-doesnt-handle, type: chunk, title: "She doesn't handle ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она не занимается …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:negative], examples: ["She doesn't handle the deployment process.", "He doesn't attend every meeting."], contrast: {frame: "She doesn't have ___", note_ru: "does + not + инфинитив для третьего лица"}, trap: {learner_form: "She doesn't works on weekends.", correction: "She doesn't work on weekends.", cause_ru: "does уже несет -s, основной глагол = инфинитив"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.they-deploy, type: chunk, title: "They deploy ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "они развертывают …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "что или когда", examples: ["They deploy to staging every Friday.", "They deploy new code after testing."], contrast: {frame: "He deploys ___", note_ru: "they = без -s, he = с -s"}, trap: {learner_form: "They deploys the update.", correction: "They deploy the update.", cause_ru: "множественное число не требует -s"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.every-day, type: chunk, title: "I ___ every day", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я ___ каждый день", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:time-marker], slot_hint_ru: "глагол (проверяю, встречаюсь, проверяю)", examples: ["I review the tickets every day.", "I check email every day at nine."], contrast: {frame: "I ___ yesterday", note_ru: "every day = обычно, yesterday = один раз в прошлом"}, trap: {learner_form: "I am checking reports every day.", correction: "I check reports every day.", cause_ru: "every day = обычное дело, не текущее действие"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.once-a-week, type: chunk, title: "We meet once a week", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "мы встречаемся раз в неделю", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:time-marker], examples: ["We meet once a week to sync.", "The team meets once a week on Tuesdays."], trap: {learner_form: "We are meeting once a week.", correction: "We meet once a week.", cause_ru: "регулярный факт требует Present Simple, не Continuous"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.on-mondays, type: chunk, title: "We ___ on Mondays", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "мы ___ по понедельникам", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:time-marker], slot_hint_ru: "глагол (встречаемся, обсуждаем)", examples: ["We start our week on Mondays.", "They review the metrics on Mondays."], contrast: {frame: "We will ___ on Monday", note_ru: "on Monday = обычный факт, will = один раз в будущем"}, trap: {learner_form: "We are starting on Monday.", correction: "We start on Monday.", cause_ru: "регулярный день недели = Present Simple"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.in-the-morning, type: chunk, title: "I ___ in the morning", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я ___ по утрам", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:time-marker], slot_hint_ru: "глагол (читаю, проверяю, встречаюсь)", examples: ["I check new messages in the morning.", "She reviews the logs in the morning."], trap: {learner_form: "I am reviewing reports in the morning.", correction: "I review reports in the morning.", cause_ru: "in the morning = регулярная привычка"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.first-thing, type: chunk, title: "First thing, I ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "первым делом я …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "глагол (читаю, проверяю, встречаюсь)", examples: ["First thing, I grab coffee and read the tickets.", "First thing, he checks the server status."], transformations: [authored]}
  - {id: chunk.present-simple-routines.at-the-end, type: chunk, title: "At the end of the day, I ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "в конце рабочего дня я …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "глагол (пишу, проверяю, встречаюсь)", examples: ["At the end of the day, I send a summary.", "At the end of the day, she logs the bugs she found."], transformations: [authored]}
  - {id: chunk.present-simple-routines.my-routine, type: chunk, title: "My routine is to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "моя привычка — …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "инфинитив", examples: ["My routine is to start with urgent tickets.", "My routine is to test new features immediately."], transformations: [authored]}
  - {id: chunk.present-simple-routines.usually, type: chunk, title: "I usually ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я обычно …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:frequency-adverb], slot_hint_ru: "глагол", examples: ["I usually start by checking the queue.", "He usually handles urgent requests first."], contrast: {frame: "I usually am ___", note_ru: "before action = usually + verb, before adjective = usually am но это редко звучит"}, trap: {learner_form: "I usually am working on reports.", correction: "I usually work on reports.", cause_ru: "usually + простое действие, не continuous"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.always, type: chunk, title: "He always ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он всегда …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:frequency-adverb], slot_hint_ru: "глагол", examples: ["He always finishes his updates on time.", "She always documents her changes."], trap: {learner_form: "He always is late.", correction: "He is always late.", cause_ru: "с be = after is, не before"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.rarely-miss, type: chunk, title: "I rarely miss ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "я редко пропускаю …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:frequency-adverb], slot_hint_ru: "событие или встречу", examples: ["I rarely miss the stand-up meeting.", "He rarely misses a deadline."], transformations: [authored]}
  - {id: chunk.present-simple-routines.often-spend, type: chunk, title: "I often spend ___ on ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я часто трачу … на …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:frequency-adverb], slot_hint_ru: "время и деятельность", examples: ["I often spend two hours on reviews.", "She often spends time helping teammates."], transformations: [authored]}
  - {id: chunk.present-simple-routines.sometimes-need, type: chunk, title: "I sometimes need to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "мне иногда нужно …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:frequency-adverb], slot_hint_ru: "инфинитив", examples: ["I sometimes need to work late on urgent.", "He sometimes needs to jump on an urgent bug."], transformations: [authored]}
  - {id: chunk.present-simple-routines.never-skip, type: chunk, title: "We never skip ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы никогда не пропускаем …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple, structure:frequency-adverb, structure:negative], slot_hint_ru: "событие", examples: ["We never skip the final test round.", "They never skip the code review step."], transformations: [authored]}
  - {id: chunk.present-simple-routines.handle-all, type: chunk, title: "I handle all ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я занимаюсь всеми …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "множественное число (запросы, проблемы)", examples: ["I handle all client requests.", "She handles all the documentation."], trap: {learner_form: "I am handling all requests.", correction: "I handle all requests.", cause_ru: "обычная работа = Present Simple"}, transformations: [authored]}
  - {id: chunk.present-simple-routines.begin-with, type: chunk, title: "I begin with ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "я начинаю с …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "действие или объект", examples: ["I begin with the most urgent tickets.", "He begins with a coffee and a quick scan."], transformations: [authored]}
  - {id: chunk.present-simple-routines.spend-time, type: chunk, title: "We spend time ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "мы тратим время на …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "действие или место", examples: ["We spend time in meetings and reviews.", "They spend time testing in staging."], transformations: [authored]}
  - {id: chunk.present-simple-routines.run-tests, type: chunk, title: "We run tests ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы запускаем тесты …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "когда (ежедневно, перед выкатом)", examples: ["We run tests before every deployment.", "They run tests multiple times a day."], transformations: [authored]}
  - {id: chunk.present-simple-routines.fix-bugs, type: chunk, title: "I fix bugs ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я исправляю ошибки …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "когда или как часто", examples: ["I fix bugs as soon as they are reported.", "She fixes bugs during the sprint."], transformations: [authored]}
  - {id: chunk.present-simple-routines.meet-with, type: chunk, title: "I meet with ___ ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "я встречаюсь с … …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "кто и когда", examples: ["I meet with the team every Thursday.", "She meets with clients on Mondays."], transformations: [authored]}
  - {id: chunk.present-simple-routines.coordinate, type: chunk, title: "I coordinate ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "я координирую …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "объект (проекты, релизы, команды)", examples: ["I coordinate all releases across teams.", "He coordinates between our internal teams."], transformations: [authored]}
  - {id: chunk.present-simple-routines.update-status, type: chunk, title: "I update the status ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я обновляю статус …", frame_of: grammar.present-simple.routines, carries: [tense:present-simple], slot_hint_ru: "когда (ежедневно, по запросу)", examples: ["I update the status daily.", "She updates the status before meetings."], transformations: [authored]}
