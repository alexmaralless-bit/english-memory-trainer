# Frames for grammar.basic-questions.clarification (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.basic-questions-clarification.what-does-mean, type: chunk, title: "What does ___ mean?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "что означает ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:question-do], slot_hint_ru: "существительное или фраза", examples: ["What does this label mean in this context?", "What does the error code mean?"], contrast: {frame: "You mean what?", note_ru: "вопрос должен начинаться с вопросительного слова в нормальном порядке"}, trap: {learner_form: "What means this label?", correction: "What does this label mean?", cause_ru: "нужен вспомогательный глагол does с инверсией"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.do-you-mean, type: chunk, title: "Do you mean ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы имеете в виду ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-do], slot_hint_ru: "существительное или придаточное предложение", examples: ["Do you mean the old version of the file?", "Do you mean the file from last week?"], contrast: {frame: "You mean ___?", note_ru: "вопрос требует инверсии do + you"}, trap: {learner_form: "You mean the old file?", correction: "Do you mean the old file?", cause_ru: "в письме нужна инверсия do"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.where-is, type: chunk, title: "Where is ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "где находится ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:question-be], slot_hint_ru: "существительное", examples: ["Where is the latest file or version?", "Where is the documentation file stored?"], contrast: {frame: "Where ___?", note_ru: "wh-вопрос с be не требует do"}, trap: {learner_form: "Where the report is?", correction: "Where is the report?", cause_ru: "в вопросе с where нужна инверсия: is перед подлежащим, а не прямой порядок слов"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.who-is, type: chunk, title: "Who is ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "кто это ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:question-be], slot_hint_ru: "существительное роли", examples: ["Who is the main client on this project?", "Who is the project lead here?"], contrast: {frame: "Who are ___?", note_ru: "who is — вопрос об одном человеке, who are — о нескольких"}, trap: {learner_form: "This is who?", correction: "Who is this?", cause_ru: "вопрос начинается с вопросительного слова"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.what-is, type: chunk, title: "What is ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "что это ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:question-be], slot_hint_ru: "существительное", examples: ["What is this status code exactly?", "What is the exact deadline for this?"], contrast: {frame: "Is this ___?", note_ru: "what is — открытый вопрос с ответом-словом; is this — вопрос да/нет"}, trap: {learner_form: "This is what?", correction: "What is this?", cause_ru: "инверсия и вопросительное слово в начале"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.which-one, type: chunk, title: "Which one ___?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "какой из них ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh], slot_hint_ru: "глагол в базовой форме", examples: ["Which one do you need for this?", "Which one should I update now?"], contrast: {frame: "Which file?", note_ru: "which one требует вспомогательный глагол do/should"}, trap: {learner_form: "Which one you need?", correction: "Which one do you need?", cause_ru: "нужна инверсия с do"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.when-do-we, type: chunk, title: "When do we ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "когда мы ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:question-do], slot_hint_ru: "глагол в базовой форме", examples: ["When do we start the meeting exactly?", "When do we get the results back?"], contrast: {frame: "We start when?", note_ru: "вопрос начинается с when и требует инверсию"}, trap: {learner_form: "When we start?", correction: "When do we start?", cause_ru: "нужна инверсия do + we"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.how-do-you, type: chunk, title: "How do you ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "как вы ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:question-do], slot_hint_ru: "глагол в базовой форме", examples: ["How do you access this feature here?", "How do you run the test suite?"], contrast: {frame: "You do how?", note_ru: "вопрос начинается с how и требует инверсию"}, trap: {learner_form: "You do this how?", correction: "How do you do this?", cause_ru: "инверсия how + do + you"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.why-is, type: chunk, title: "Why is ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "почему это ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:question-be], slot_hint_ru: "существительное", examples: ["Why is it not working after the update?", "Why is the deadline set to Thursday?"], contrast: {frame: "What's the reason ___?", note_ru: "why is — прямой вопрос с why в начале; what's the reason — более формальная альтернатива"}, trap: {learner_form: "It is why?", correction: "Why is it?", cause_ru: "инверсия why + is"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.is-it, type: chunk, title: "Is it ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-be], slot_hint_ru: "существительное или прилагательное", examples: ["Is it the latest version available?", "Is it ready for review?"], contrast: {frame: "It is ___?", note_ru: "вопрос требует инверсию is it"}, trap: {learner_form: "It is ready?", correction: "Is it ready?", cause_ru: "инверсия is + it для вопроса"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.are-you, type: chunk, title: "Are you ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-be], slot_hint_ru: "прилагательное или фраза", examples: ["Are you sure about the dates exactly?", "Are you available tomorrow morning?"], contrast: {frame: "You are ___?", note_ru: "вопрос требует инверсию are you"}, trap: {learner_form: "You are sure?", correction: "Are you sure?", cause_ru: "инверсия are + you для вопроса"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.can-you-clarify, type: chunk, title: "Can you clarify ___?", cefr: A1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "не можете ли вы уточнить ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-do, structure:modal], slot_hint_ru: "существительное", examples: ["Can you clarify the exact requirements here?", "Can you clarify what you mean?"], contrast: {frame: "Clarify ___?", note_ru: "can you clarify более вежливо, чем imperative"}, trap: {learner_form: "Can you to clarify?", correction: "Can you clarify?", cause_ru: "модальный глагол can требует базовую форму"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.does-this-mean, type: chunk, title: "Does this mean ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это означает, что ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-do], slot_hint_ru: "придаточное предложение", examples: ["Does this mean we need to update the code?", "Does this mean the project is delayed?"], contrast: {frame: "This means ___?", note_ru: "вопрос требует инверсию does this"}, trap: {learner_form: "This does mean...?", correction: "Does this mean...?", cause_ru: "инверсия does + this в вопросе"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.what-about, type: chunk, title: "What about ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "а как насчёт ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh], slot_hint_ru: "существительное", examples: ["What about the test data for this?", "What about the old files then?"], contrast: {frame: "About what?", note_ru: "what about — фиксированная фраза для уточнения"}, trap: {learner_form: "What about of the file?", correction: "What about the file?", cause_ru: "what about + существительное, без of"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.do-they, type: chunk, title: "Do they ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-do], slot_hint_ru: "глагол в базовой форме", examples: ["Do they have access to the server here?", "Do they need to approve it?"], contrast: {frame: "They ___?", note_ru: "вопрос требует do в начале"}, trap: {learner_form: "They have access?", correction: "Do they have access?", cause_ru: "инверсия do + they для вопроса"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.does-he-know, type: chunk, title: "Does he know ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он знает ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-do], slot_hint_ru: "объект или clause", examples: ["Does he know the exact deadline?", "Does he know we need the update?"], contrast: {frame: "He knows ___?", note_ru: "вопрос требует инверсию does he"}, trap: {learner_form: "He knows the deadline?", correction: "Does he know the deadline?", cause_ru: "инверсия does + he для вопроса"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.what-should-i, type: chunk, title: "What should I ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "что мне ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh, structure:modal], slot_hint_ru: "глагол в базовой форме", examples: ["What should I do next here?", "What should I send you first?"], contrast: {frame: "I should do what?", note_ru: "вопрос начинается с what should"}, trap: {learner_form: "I should to do what?", correction: "What should I do?", cause_ru: "should требует базовую форму"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.how-long, type: chunk, title: "How long ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "как долго ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh], slot_hint_ru: "глагол в вопросе", examples: ["How long does it take in total?", "How long will it take to fix?"], contrast: {frame: "It takes how long?", note_ru: "вопрос начинается с how long"}, trap: {learner_form: "How long takes it?", correction: "How long does it take?", cause_ru: "инверсия how long + does + it"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.which-file, type: chunk, title: "Which file ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "какой файл ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-wh], slot_hint_ru: "глагол в вопросе", examples: ["Which file do you need for it?", "Which file should I send?"], contrast: {frame: "Which file?", note_ru: "which file + глагол для полного вопроса"}, trap: {learner_form: "Which file you need?", correction: "Which file do you need?", cause_ru: "инверсия do + you"}, transformations: [authored]}
  - {id: chunk.basic-questions-clarification.did-you-mean, type: chunk, title: "Did you mean ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "вы имели в виду ...?", frame_of: grammar.basic-questions.clarification, carries: [structure:question-do], slot_hint_ru: "существительное или clause", examples: ["Did you mean the version from Tuesday?", "Did you mean we need to restart?"], contrast: {frame: "You meant ___?", note_ru: "past did + you для вопроса о прошлом"}, trap: {learner_form: "You meant the old file?", correction: "Did you mean the old file?", cause_ru: "инверсия did + you для прошлого вопроса"}, transformations: [authored]}
