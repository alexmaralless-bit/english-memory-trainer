# Frames for grammar.reference-cohesion (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.reference-cohesion.this-approach, type: chunk, title: "This approach ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "этот подход …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "предикат", examples: ["This approach allows teams to iterate without risk of data loss.", "This approach has reduced our deployment time by fifty percent."], contrast: {frame: "The approach ___", note_ru: "this — указует на только что упомянутое; the — может быть и новым предметом речи"}, trap: {learner_form: "This approach allows teams iterating...", correction: "This approach allows teams to iterate...", cause_ru: "allow + infinitive (не allow + gerund в этом смысле)"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.the-former-latter, type: chunk, title: "The former ___, the latter ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "первый …, второй …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "предикаты", examples: ["The former reduces complexity, the latter improves performance.", "The former is cheaper to implement, the latter offers better scalability."], contrast: {frame: "The first ___, the second ___", note_ru: "former/latter — более formal и literary, нежели first/second"}, trap: {learner_form: "The former one reduces complexity...", correction: "The former reduces complexity...", cause_ru: "'former' и 'latter' — уже contain the idea of 'one', не нужно добавлять 'one'"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.such-approaches, type: chunk, title: "Such ___ are ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "такие … есть …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "существительное + предикат", examples: ["Such errors are often the result of incomplete testing.", "Such patterns are common in legacy codebases."], contrast: {frame: "___ are ___", note_ru: "such добавляет связь с предыдущим текстом"}, trap: {learner_form: "Such errors like incomplete testing occur frequently.", correction: "Such errors occur frequently.", cause_ru: "'such' уже указывает на конкретный тип; не добавляем 'like' с примером после него"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.the-same-applies, type: chunk, title: "The same applies to ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "то же самое применимо к …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "существительное или существительная фраза", examples: ["The same applies to the second batch of deployments.", "The same applies to queries involving multiple tables."], contrast: {frame: "This also applies to ___", note_ru: "'The same applies' более concise и formal"}, trap: {learner_form: "The same applies for edge-case situations.", correction: "The same applies to edge-case situations.", cause_ru: "apply to (не apply for в этом контексте)"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.in-this-respect, type: chunk, title: "In this respect, ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "в этом отношении …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["In this respect, the documentation proved invaluable to the new team.", "In this respect, the vendor's approach differs significantly from our strategy."], contrast: {frame: "In this way, ___", note_ru: "'In this respect' уже более precise, указывает на определённый аспект"}, trap: {learner_form: "In this respect it is different...", correction: "In this respect, it is different...", cause_ru: "нужна запятая после 'In this respect'"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.as-mentioned-above, type: chunk, title: "As mentioned above, ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "как было упомянуто выше …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["As mentioned above, the costs exceeded the initial budget.", "As mentioned above, the system requires manual failover under certain conditions."], contrast: {frame: "As I said, ___", note_ru: "As mentioned above more formal и written, не ссылается на конкретного говорящего"}, trap: {learner_form: "As mentioned above that the costs exceeded...", correction: "As mentioned above, the costs exceeded...", cause_ru: "не нужно that после as mentioned above — just comma"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.the-evidence-for-this, type: chunk, title: "The evidence for this ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "свидетельства этого …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "глагол + объект", examples: ["The evidence for this comes from the quarterly reports.", "The evidence for this suggests a systematic pattern."], contrast: {frame: "The reason for this ___", note_ru: "'the evidence for this' указывает на доказательства уже упомянутого утверждения; 'the reason for this' объясняет причину уже упомянутого результата"}, trap: {learner_form: "The evidence for this comes from the reports above.", correction: "The evidence for this comes from the reports.", cause_ru: "не нужно усилять через 'above', уже ясно из контекста"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.this-distinction, type: chunk, title: "This distinction ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "это различие … это разграничение …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "глагол + объект", examples: ["This distinction matters for our testing strategy.", "This distinction is critical when assigning permissions."], contrast: {frame: "The distinction ___", note_ru: "this указывает на только что упомянутое; the более neutral"}, trap: {learner_form: "This distinction between X and Y is important...", correction: "This distinction is important.", cause_ru: "избегай повтора, когда различие уже понятно из контекста"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.these-findings, type: chunk, title: "These findings ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "эти выводы / находки …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "предикат", examples: ["These findings challenge the assumption that the cache is reliable.", "These findings have significant implications for our roadmap."], contrast: {frame: "The results ___", note_ru: "findings — более precisely refers to discoveries; results — более general"}, trap: {learner_form: "These findings shows that...", correction: "These findings show that...", cause_ru: "findings — множественное число (findings show, не findings shows)"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.that-is-to-say, type: chunk, title: "That is to say, ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "то есть … другими словами …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "переформулировка предыдущего", examples: ["That is to say, the recovery time depends on replication lag.", "That is to say, we need to prioritize automation before scaling."], contrast: {frame: "In other words, ___", note_ru: "'that is to say' чуть более формально; 'in other words' чуть менее формально"}, trap: {learner_form: "That is to say the recovery...", correction: "That is to say, the recovery...", cause_ru: "нужна запятая после 'That is to say'"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.the-point-is-that, type: chunk, title: "The point is that ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "суть в том, что …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["The point is that manual processes introduce variability.", "The point is that we must address the root cause, not the symptom."], contrast: {frame: "The fact is that ___", note_ru: "'the point is that' подчёркивает суть; 'the fact is that' подчёркивает неприятный, но верный факт"}, trap: {learner_form: "The point is to that...", correction: "The point is that...", cause_ru: "point is that (не point is to that)"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.by-this-i-mean, type: chunk, title: "By this I mean ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, communication], meaning_ru: "под этим я имею в виду …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение или существительная фраза", examples: ["By this I mean the system must handle peak load without degradation.", "By this I mean we should invest in our team before expanding capacity."], contrast: {frame: "What I mean is ___", note_ru: "by this I mean чуть более формально, чем what I mean is"}, trap: {learner_form: "By this I am meaning...", correction: "By this I mean...", cause_ru: "mean (простое настоящее), не am meaning"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.such-a-scenario, type: chunk, title: "Such a scenario ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "такой сценарий …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "предикат", examples: ["Such a scenario would require immediate rollback procedures.", "Such a scenario is unlikely but must be prepared for."], contrast: {frame: "A scenario like that ___", note_ru: "'Such a scenario' — более formal"}, trap: {learner_form: "Such a scenario that occurs when conditions align.", correction: "Such a scenario occurs when conditions align.", cause_ru: "'such a scenario' уже полностью определяет предмет; лишнее 'that' после него не нужно"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.exactly-this-is-why, type: chunk, title: "Exactly this is why ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "именно по этой причине …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["Exactly this is why we maintain multiple replicas.", "Exactly this is why testing under load is essential."], contrast: {frame: "This is why ___", note_ru: "'Exactly this is why' — более emphatic"}, trap: {learner_form: "Exactly this why...", correction: "Exactly this is why...", cause_ru: "exactly this is (не exactly this почему)"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.a-consequence-of-this, type: chunk, title: "A consequence of this ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "следствие этого … вывод из этого …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "глагол + объект", examples: ["A consequence of this is slower query performance under load.", "A consequence of this was the need to redesign the API."], contrast: {frame: "As a result, ___", note_ru: "'A consequence of this' — более noun-based и formal"}, trap: {learner_form: "A consequence of this is that slower query performance.", correction: "A consequence of this is slower query performance.", cause_ru: "перед существительной фразой после is не нужно that — 'is that X' используется только перед целым предложением"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.all-this-means, type: chunk, title: "All this means ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "всё это означает …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "существительная фраза или предложение", examples: ["All this means we need a different architecture for the next phase.", "All this means greater coordination costs in the short term."], contrast: {frame: "This means ___", note_ru: "'all this means' подчёркивает, что вывод делается из всего предыдущего контекста, а не из одной детали"}, trap: {learner_form: "All this means to us that we need a different architecture.", correction: "All this means we need a different architecture.", cause_ru: "не нужно 'to us' и 'that'; это усложняет фразу"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.it-follows-that, type: chunk, title: "It follows that ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "отсюда следует, что …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["It follows that the recovery procedure must be automated.", "It follows that manual processes will not scale beyond current capacity."], contrast: {frame: "Therefore, ___", note_ru: "'It follows that' — более logical и formal; 'therefore' — более direct"}, trap: {learner_form: "It follows to that...", correction: "It follows that...", cause_ru: "follows that (не follows to that)"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.from-this-perspective, type: chunk, title: "From this perspective, ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "с этой точки зрения …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["From this perspective, the investment in tooling pays for itself.", "From this perspective, the delay was unfortunate but manageable."], contrast: {frame: "From this angle, ___", note_ru: "'from this perspective' более формально и интеллектуально; 'from this angle' чуть более разговорно"}, trap: {learner_form: "From this perspective in the view, the investment pays off.", correction: "From this perspective, the investment pays off.", cause_ru: "не усложняй; 'from this perspective' само по себе достаточно"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.in-the-latter-case, type: chunk, title: "In the latter case, ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "в последнем случае …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["In the latter case, the system requires a full restart.", "In the latter case, we must escalate to the vendor."], contrast: {frame: "In that case, ___", note_ru: "'in the latter case' точно указывает на второй из двух упомянутых вариантов"}, trap: {learner_form: "In the latter case that we must escalate.", correction: "In the latter case, we must escalate.", cause_ru: "не нужно 'that' здесь; нужна запятая и подлежащее"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.these-considerations, type: chunk, title: "These considerations ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "эти соображения … эти факторы …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "предикат", examples: ["These considerations led us to delay the migration by two sprints.", "These considerations support a hybrid approach."], contrast: {frame: "These factors ___", note_ru: "'considerations' более абстрактно и интеллектуально; 'factors' более нейтрально"}, trap: {learner_form: "These considerations shows...", correction: "These considerations show...", cause_ru: "considerations — множественное число (show, не shows)"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.such-is-the-case, type: chunk, title: "Such is the case with ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "такова ситуация с … то же самое и с …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "существительное или существительная фраза", examples: ["Such is the case with legacy systems that lack monitoring.", "Such is the case with team members who lack domain knowledge."], contrast: {frame: "The same is true of ___", note_ru: "'Such is the case with' — more literary и formal"}, trap: {learner_form: "Such is the case for ___", correction: "Such is the case with ___", cause_ru: "with (не for) в этом выражении"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.the-reverse-is-true, type: chunk, title: "The reverse is true for ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "обратное верно для … наоборот …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "существительное или существительная фраза", examples: ["The reverse is true for systems with ample storage capacity.", "The reverse is true for teams with senior expertise."], contrast: {frame: "The opposite is true for ___", note_ru: "'the reverse' чуть более формально; 'the opposite' чуть более разговорно"}, trap: {learner_form: "The reverse is true about ___", correction: "The reverse is true for ___", cause_ru: "for (не about) в этом контексте"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.notably, type: chunk, title: "Notably, ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "примечательно, что …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["Notably, the error did not appear in the test environment.", "Notably, the senior members of the team disagreed with this direction."], contrast: {frame: "Importantly, ___", note_ru: "'notably' подчёркивает нечто неожиданное или примечательное; 'importantly' подчёркивает значимость"}, trap: {learner_form: "Notably that ___", correction: "Notably, ___", cause_ru: "не нужно 'that' здесь; достаточно запятой"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.to-summarize, type: chunk, title: "To summarize, ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "подводя итог … в резюме …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["To summarize, the approach addresses both performance and reliability.", "To summarize, we recommend a phased rollout with checkpoints."], contrast: {frame: "In summary, ___", note_ru: "'to summarize' — глагольная форма; 'in summary' — именная фраза; обе формальны, но 'to summarize' звучит чуть более действенно"}, trap: {learner_form: "To summarize, that the approach...", correction: "To summarize, the approach...", cause_ru: "не нужно 'that' здесь; не используй embedded clause"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.this-connection, type: chunk, title: "This connection ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "эта связь … эта закономерность …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "предикат", examples: ["This connection between deployment speed and code quality is often overlooked.", "This connection became clear after reviewing the logs."], contrast: {frame: "The link ___", note_ru: "'connection' более абстрактно; 'link' более конкретно"}, trap: {learner_form: "This connection shows to us that...", correction: "This connection shows that...", cause_ru: "не нужно 'to us'; это лишнее"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.the-latter-point, type: chunk, title: "The latter point ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "последний пункт … вторая мысль …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "предикат", examples: ["The latter point deserves careful attention from the leadership.", "The latter point is not widely understood in the industry."], contrast: {frame: "The second point ___", note_ru: "'the latter point' точно указывает на второй из двух упомянутых пунктов; 'the second point' более общее"}, trap: {learner_form: "The latter point that we made...", correction: "The latter point ___", cause_ru: "не нужно добавлять 'that we made'; уже ясно из контекста"}, transformations: [authored]}
  - {id: chunk.reference-cohesion.in-summary, type: chunk, title: "In summary, ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "в резюме … в общем …", frame_of: grammar.reference-cohesion, carries: [structure:reference], slot_hint_ru: "полное предложение", examples: ["In summary, the two strategies offer complementary benefits.", "In summary, the recovery procedure succeeded within the target window."], contrast: {frame: "In conclusion, ___", note_ru: "'in summary' подводит итог сказанному; 'in conclusion' отмечает завершающее высказывание перед концом"}, trap: {learner_form: "In summary that the approach...", correction: "In summary, the approach...", cause_ru: "не нужно 'that' после 'in summary'"}, transformations: [authored]}
