  - id: nawl@1.2
    role: academic-English core membership (selection and provenance for P.4e)
    exact_version: "1.2 (April 2023), NAWL_12_lemmatized_for_teaching.csv"
    url: https://www.newgeneralservicelist.com/s/NAWL_12_lemmatized_for_teaching.csv
    retrieved_at: 2026-07-22T03:34:27Z
    sha256: 1790b0fa22c5815ebf5a9a15c9363c03a6e906c77bf217f99033734f1459137b
    license: CC BY-SA 4.0
    attribution: "New Academic Word List by Browne, C., Culligan, B., and Phillips, J."
    notices:
      - "CC BY-SA 4.0 requires attribution, licence notice, indication of changes and ShareAlike on Adapted Material upon distribution."
      - "Membership only is used; definitions, examples and the source table are not reproduced."
