# Versioned score -> band thresholds. Bands are neutral corpus frequency, never
# pedagogical priority (that is curriculum_priority_band).
frequency_thresholds:
  version: 1
  scale: "wordfreq Zipf, log10 occurrences per billion words"
  bands:
    - {band: very_high, min_zipf: 5.5}
    - {band: high, min_zipf: 4.5}
    - {band: mid, min_zipf: 3.5}
    - {band: low, min_zipf: 2.5}
    - {band: rare, min_zipf: null}   # everything below `low`
  rounding: "frequency_score is the Zipf value rounded to 2 decimals, ROUND_HALF_EVEN"

# Coverage rule, enforced by the tool. See the P.4b report for the evidence.
coverage_policy:
  covered_types: [word, lexeme, abbreviation]
  rule: >-
    Only single-token units receive frequency_score / frequency_band. wordfreq
    returns a value for multi-token input, but that value is composed from token
    frequencies under an independence assumption and is NOT an observed phrase
    frequency: reversing the word order leaves it unchanged, and a nonsense
    string of common words outscores a real mid-frequency word. Assigning it to
    chunks and phrasal verbs would fabricate corpus data.
  lexeme_rule: >-
    A lexeme's frequency is the sum of the probabilities of all its surface
    forms (flattening list-valued slots such as be -> past: [was, were]),
    converted back to Zipf. Marked with the lemma-form-sum transformation.
  uncovered: >-
    chunk, phrasal-verb, informal_chunk, multi-word word entries, and any unit
    absent from the corpus keep no frequency fields at all. Absence is the
    honest signal; policies keyed on frequency_band must define a fallback.
