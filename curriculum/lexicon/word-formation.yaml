# Affix-derived vocabulary for the word-formation track (P.4d, PD-2026-07-21).
# Each item carries `formation` -- the generating link "affix + base -> word"
# that the word-formation topics teach as a recognition pattern. Bases are real
# English words; no fake derivations. Frequencies are intentionally absent: no
# corpus pass has been run for these items, and invented numbers are worse than
# none (frequency fields without source_refs fail validation by design).
