# Frames for grammar.nominalization-information-flow (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.nominalization-information-flow.the-introduction-of, type: chunk, title: "The introduction of ___ led to ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "внедрение … привело к …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "существительное + результат", examples: ["The introduction of cloud storage led to cost reduction.", "The introduction of the new policy led to confusion among employees."], contrast: {frame: "When we introduced ___", note_ru: "clause варианта более живой, nominalization варианта более формален и фокусируется на эффекте"}, trap: {learner_form: "The introduce of cloud storage led to cost reduction.", correction: "The introduction of cloud storage led to cost reduction.", cause_ru: "introduce → introduction (noun form), не переводим глагол как прилагательное"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-failure-to, type: chunk, title: "The failure to ___ resulted in ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "неспособность …, невозможность … привела к …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "базовая форма глагола + результат", examples: ["The failure to back up data resulted in loss.", "The failure to notify users resulted in negative press."], contrast: {frame: "Because we failed to ___", note_ru: "clause более прямой и показывает ответственность агента, nominalization более абстрактна"}, trap: {learner_form: "The fail to notify resulted in negative press.", correction: "The failure to notify resulted in negative press.", cause_ru: "fail → failure (noun), не используй глагольную форму"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.an-analysis-of-shows, type: chunk, title: "An analysis of the ___ shows ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, data, reporting], meaning_ru: "анализ … показывает …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:indefinite-first-mention, article:definite-second-mention], slot_hint_ru: "существительное + вывод", examples: ["An analysis of the data shows three distinct patterns.", "An analysis of the survey responses shows strong customer satisfaction."], contrast: {frame: "If we analyze the ___", note_ru: "clause более персональна и интерактивна, nominalization объективнее"}, trap: {learner_form: "An analyze of the data shows patterns.", correction: "An analysis of the data shows patterns.", cause_ru: "analyze → analysis (noun), используй номинализацию"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-lack-of-explains, type: chunk, title: "The lack of ___ explains ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "недостаток … объясняет …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "существительное + явление", examples: ["The lack of documentation explains user confusion.", "The lack of resources explains project delays."], contrast: {frame: "Because there is no ___", note_ru: "clause варианта более персональна и примитивна, nominalization более научна"}, trap: {learner_form: "The lacking of documentation explains user confusion.", correction: "The lack of documentation explains user confusion.", cause_ru: "формы 'lacking of' не существует; нужно существительное lack"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.this-increase-in-reflects, type: chunk, title: "This increase in ___ reflects ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, data, reporting], meaning_ru: "это увеличение … отражает …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "метрика + интерпретация", examples: ["This increase in response time reflects the growing database size.", "This increase in customer complaints reflects delayed shipments."], contrast: {frame: "Because response time increased", note_ru: "clause более причинная, nominalization показывает связь между явлениями"}, trap: {learner_form: "This increase in respond time reflects the database.", correction: "This increase in response time reflects the database.", cause_ru: "respond → response (существительное, не глагольная форма)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-reduction-of-enabled, type: chunk, title: "The reduction of ___ enabled ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "сокращение … позволило …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "явление + результат", examples: ["The reduction of costs enabled faster scaling.", "The reduction of steps enabled focus on strategic work."], contrast: {frame: "By reducing ___", note_ru: "clause форма показывает действие, nominalization форма показывает результат абстрактнее"}, trap: {learner_form: "The reduce of costs enabled scaling.", correction: "The reduction of costs enabled scaling.", cause_ru: "reduce → reduction (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-shift-to-reflected, type: chunk, title: "The shift to ___ reflected ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "переход на … отразил …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "новое направление + причина", examples: ["The shift to remote work reflected the need for flexibility.", "The shift to microservices reflected our commitment to scalability."], contrast: {frame: "When we shifted to ___", note_ru: "clause более личная, nominalization более объективна"}, trap: {learner_form: "The shifting to remote work reflected flexibility.", correction: "The shift to remote work reflected flexibility.", cause_ru: "используй существительное shift, а не герундий shifting"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-expansion-of-required, type: chunk, title: "The expansion of ___ required ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "расширение … требовало …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "область + ресурс или действие", examples: ["The expansion of our team required additional training.", "The expansion of the guest list required a bigger venue."], contrast: {frame: "To expand ___", note_ru: "infinitive clause более практична, nominalization более аналитична"}, trap: {learner_form: "The expanding of the team required resources.", correction: "The expansion of the team required resources.", cause_ru: "expanding → expansion (используй номинализированную форму)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-removal-of-prevented, type: chunk, title: "The removal of ___ prevented ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "удаление … предотвратило …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "препятствие + результат", examples: ["The removal of deprecated code prevented conflicts.", "The removal of old permissions prevented unauthorized access."], contrast: {frame: "By removing ___", note_ru: "clause показывает процесс, nominalization показывает результат"}, trap: {learner_form: "The remove of code prevented conflicts.", correction: "The removal of code prevented conflicts.", cause_ru: "remove → removal (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-discovery-of-opened, type: chunk, title: "The discovery of ___ opened ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "открытие … открыло …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "находка + возможность", examples: ["The discovery of a vulnerability opened questions about security.", "The discovery of the root cause opened a path forward."], contrast: {frame: "Once we discovered ___", note_ru: "clause показывает последовательность действий, nominalization абстрактнее описывает связь"}, trap: {learner_form: "The discover of the vulnerability opened questions.", correction: "The discovery of the vulnerability opened questions.", cause_ru: "discover → discovery (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-adoption-of-demonstrated, type: chunk, title: "The adoption of ___ demonstrated ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "принятие … продемонстрировало …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "инициатива + результат или ценность", examples: ["The adoption of the framework demonstrated commitment to innovation.", "The adoption of agile practices demonstrated improved delivery times."], contrast: {frame: "When we adopted ___", note_ru: "clause более персональна, nominalization более формальна и объективна"}, trap: {learner_form: "The adopt of the framework demonstrated commitment.", correction: "The adoption of the framework demonstrated commitment.", cause_ru: "adopt → adoption (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-decline-of-concerned, type: chunk, title: "The decline of ___ concerned ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, data], meaning_ru: "спад … беспокоил …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "метрика + заинтересованное лицо", examples: ["The decline of user engagement concerned management.", "The decline of test coverage concerned the QA team."], contrast: {frame: "Because user engagement declined", note_ru: "clause более прямая причина, nominalization более фокусируется на реакцию"}, trap: {learner_form: "The declining of user engagement concerned management.", correction: "The decline of user engagement concerned management.", cause_ru: "используй существительное decline, не герундий"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-improvement-in-validates, type: chunk, title: "The improvement in ___ validates ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, data, reporting], meaning_ru: "улучшение в … подтверждает …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "метрика + гипотеза или подход", examples: ["The improvement in response times validates our optimization strategy.", "The improvement in error rates validates the new testing approach."], contrast: {frame: "Since we improved ___", note_ru: "clause личнее и показывает процесс, nominalization показывает связь между явлениями"}, trap: {learner_form: "The improve in response time validates the strategy.", correction: "The improvement in response time validates the strategy.", cause_ru: "improve → improvement (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.our-success-in-stemmed, type: chunk, title: "Our success in ___ stemmed from ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "наш успех в … произошёл из-за …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "область + источник успеха", examples: ["Our success in meeting the deadline stemmed from communication.", "Our success in retention stemmed from user-centered design."], contrast: {frame: "We succeeded in ___", note_ru: "clause прямой, nominalization показывает результат через его источник"}, trap: {learner_form: "Our succeed in meeting the deadline stemmed from communication.", correction: "Our success in meeting the deadline stemmed from communication.", cause_ru: "succeed → success (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-difficulty-in-arose, type: chunk, title: "The difficulty in ___ arose from ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, troubleshooting], meaning_ru: "сложность в … возникла из-за …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "задача + причина", examples: ["The difficulty in debugging arose from insufficient logging.", "The difficulty in estimating arose from unclear requirements."], contrast: {frame: "It was difficult to ___", note_ru: "clause использует адъектив, nominalization показывает источник трудности"}, trap: {learner_form: "The difficult in debugging arose from logging.", correction: "The difficulty in debugging arose from logging.", cause_ru: "difficult → difficulty (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-exception-was-that, type: chunk, title: "The exception was that ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "исключением было то, что …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "альтернативное описание", examples: ["The exception was that the legacy database needed a workaround.", "The exception was that grandma still preferred a paper map."], contrast: {frame: "Except for ___", note_ru: "prepositional phrase более компактна, clause с 'exception' более явно структурирует контраст"}, trap: {learner_form: "The exception was when we used workaround.", correction: "The exception was that the legacy system required a workaround.", cause_ru: "используй that-clause, а не when; опиши исключение явно"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-benefit-of-was-that, type: chunk, title: "The benefit of ___ was that ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "преимущество … было то, что …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "инициатива + результат", examples: ["The benefit of async processing was that peak loads were handled.", "The benefit of code reviews was that defects were caught early."], contrast: {frame: "The advantage is ___", note_ru: "advantage более нейтрален, benefit более подчёркивает положительный результат"}, trap: {learner_form: "The benefit of async processing was when loads were handled.", correction: "The benefit of async processing was that loads were handled.", cause_ru: "после 'the benefit ... was' нужен that-clause, а не when-clause"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-reason-for-was, type: chunk, title: "The reason for ___ was ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [reporting, academic], meaning_ru: "причина … была …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "событие + причина", examples: ["The reason for the delay was a missing dependency that we discovered late.", "The reason for the redesign was user feedback indicating confusion at this step."], contrast: {frame: "We ___ because ___", note_ru: "clause более прямая, nominalization более объективна и формальна"}, trap: {learner_form: "The reason for delay was a missing dependency.", correction: "The reason for the delay was a missing dependency.", cause_ru: "добавь артикль the перед delay — событие уже известно из контекста"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-consequence-of-was, type: chunk, title: "The consequence of ___ was ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "следствие … было …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:of-phrase], slot_hint_ru: "действие + результат", examples: ["The consequence of the server migration was unexpected compatibility issues.", "The consequence of removing that validation was that invalid records entered the database."], contrast: {frame: "As a result of ___", note_ru: "prepositional phrase более компактна, nominalization более формальна"}, trap: {learner_form: "The consequence of migration was unexpected issues.", correction: "The consequence of the migration was unexpected issues.", cause_ru: "добавь артикль the перед migration — событие уже известно из контекста"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.this-shift-demonstrates, type: chunk, title: "This shift demonstrates ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "этот сдвиг демонстрирует …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "значение или тренд", examples: ["This shift demonstrates the industry's commitment to sustainability.", "This shift demonstrates that automation now saves time across the organization."], contrast: {frame: "This shows ___", note_ru: "shift как nominalization более специфична и показывает перемену, shows более нейтрален"}, trap: {learner_form: "This shifting demonstrates the commitment.", correction: "This shift demonstrates the commitment.", cause_ru: "используй существительное shift, а не герундий"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-solution-involved, type: chunk, title: "The solution involved ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [troubleshooting, reporting], meaning_ru: "решение включало …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization, article:definite-second-mention], slot_hint_ru: "подход или действие", examples: ["The solution involved reindexing the database to improve performance.", "The solution involved creating automated checks to catch errors earlier."], contrast: {frame: "To solve this ___", note_ru: "clause infinitive, nominalization focus на результате как на объекте"}, trap: {learner_form: "The solving involved reindexing the data.", correction: "The solution involved reindexing the data.", cause_ru: "solving → solution (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-challenge-was-that, type: chunk, title: "The challenge was that ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "вызов был в том, что …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "конкретное препятствие", examples: ["The challenge was that legacy systems could not integrate.", "The challenge was that user needs changed faster than iteration."], contrast: {frame: "Challenging was ___", note_ru: "adjective более личная оценка, nominalization structure более объективна"}, trap: {learner_form: "The challenge was when systems could not integrate.", correction: "The challenge was that systems could not integrate.", cause_ru: "используй that-clause, не when-clause"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-requirement-that, type: chunk, title: "The requirement that ___ meant ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "требование, что … означало …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "условие + следствие", examples: ["The requirement that data be encrypted meant redesigning caching.", "The requirement that reviewers approve changes meant slower releases."], contrast: {frame: "Because we required ___", note_ru: "clause более личная, nominalization более объективна и нейтральна"}, trap: {learner_form: "The requirement what data remain encrypted meant redesign.", correction: "The requirement that data remain encrypted meant redesign.", cause_ru: "используй that (не what) в этом придаточном"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.our-decision-to-reflected, type: chunk, title: "Our decision to ___ reflected ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, academic], meaning_ru: "наше решение … отразило …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "действие + причина или ценность", examples: ["Our decision to refactor reflected a commitment to maintainability.", "Our decision to pivot reflected user feedback and market needs."], contrast: {frame: "We decided to ___ because ___", note_ru: "clause более личная и причинная, nominalization показывает решение как отражение ценностей"}, trap: {learner_form: "Our deciding to refactor reflected commitment.", correction: "Our decision to refactor reflected commitment.", cause_ru: "deciding → decision (форма существительного)"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.the-proposal-for-was, type: chunk, title: "The proposal for ___ was ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "предложение о … было …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "инициатива + оценка или судьба", examples: ["The proposal for migrating to the cloud was rejected.", "The proposal for a redesign was accepted with modifications."], contrast: {frame: "The proposal to ___", note_ru: "to + infinitive более лаконичен, но предпочтение может быть свойственно автору"}, trap: {learner_form: "The proposal for migrate to cloud was rejected.", correction: "The proposal for migrating to cloud was rejected.", cause_ru: "используй герундий (migrating), а не базовую форму"}, transformations: [authored]}
  - {id: chunk.nominalization-information-flow.this-observation-suggests, type: chunk, title: "This observation suggests ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, data], meaning_ru: "это наблюдение предполагает …", frame_of: grammar.nominalization-information-flow, carries: [structure:nominalization], slot_hint_ru: "вывод или гипотеза", examples: ["This observation suggests that performance degrades under concurrent load.", "This observation suggests a need for better monitoring infrastructure."], contrast: {frame: "We observed that ___", note_ru: "clause показывает процесс наблюдения, nominalization focus на результате как факт"}, trap: {learner_form: "This observing suggests that performance degrades.", correction: "This observation suggests that performance degrades.", cause_ru: "observing → observation (форма существительного)"}, transformations: [authored]}
