# Frames for grammar.syntactic-ambiguity-control (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.syntactic-ambiguity-control.that-vs-which, type: chunk, title: "___ that ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, study], meaning_ru: "… который … (определительный)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:relative-clause], slot_hint_ru: "существительное + ограничивающее предложение", examples: ["We reviewed the report that contained outdated figures.", "The client wants solutions that solve immediate issues."], contrast: {frame: "the ___ which ___", note_ru: "that — ограничивающее; which — пояснительное"}, trap: {learner_form: "the report which contained outdated data is out of date", correction: "the report that contained outdated data is out of date", cause_ru: "which в ограничивающих предложениях обычно неправильно (нужно that)"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.only-scope, type: chunk, title: "Only ___ may not ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "только … не может … (область действия only)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:quantifier], examples: ["Only managers may not export records worldwide.", "Only legacy API may not handle batches."], contrast: {frame: "___ may only not ___", note_ru: "только перед subj или modal"}, trap: {learner_form: "Managers only may not export records.", correction: "Only managers may not export records.", cause_ru: "only должно стоять перед словом, которое оно ограничивает (перед managers), не после подлежащего"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.which-non-restrictive, type: chunk, title: "___, which ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, study], meaning_ru: "… которое … (пояснительное, не ограничивающее)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:relative-clause], slot_hint_ru: "пояснение всего предложения или субъекта", examples: ["The team deployed the fix, which solved the issue.", "The vendor's response was delayed, which triggered escalation."], contrast: {frame: "The team deployed the fix that solved the issue.", note_ru: "which (с запятой) vs that — пояснение vs ограничение"}, trap: {learner_form: "The fix which was deployed, it solved it.", correction: "The fix, which was deployed, solved it.", cause_ru: "не повторяем местоимение после который-clause"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.either-or, type: chunk, title: "Either ___ or ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, planning], meaning_ru: "либо … либо …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:connector], slot_hint_ru: "параллельные конструкции", examples: ["Either the schema changed or the optimizer failed.", "Either we adopt now or defer to next quarter."], contrast: {frame: "___ or ___", note_ru: "Either … or подчёркивает исключающую альтернативу"}, trap: {learner_form: "Either we adopt the standard or defer.", correction: "Either we adopt or defer the standard.", cause_ru: "параллелизм в структуре"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.both-and, type: chunk, title: "both the ___ and the ___", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "и … и … (оба)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:connector], slot_hint_ru: "параллельные конструкции с артиклями", examples: ["Both the primary and the secondary indexes need maintenance.", "Both the client and the server require updates."], contrast: {frame: "both ___ and ___", note_ru: "с артиклями — точнее; без — риск неоднозначности"}, trap: {learner_form: "Both the index and cache needs updating.", correction: "Both indexes need updating.", cause_ru: "both … and требует согласования множественного числа"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.respectively, type: chunk, title: "___ respectively", cefr: C2, curriculum_priority_band: CORE, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "… соответственно", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:reference], slot_hint_ru: "два сопоставляемых списка перед respectively", examples: ["Primary and secondary servers process reads and writes, respectively.", "Teams A, B, and C completed phases 1, 2, 3, respectively."], contrast: {frame: "___, in turn, ___", note_ru: "respectively — формальнее для списков; in turn — мягче"}, trap: {learner_form: "The servers process read, write respectively.", correction: "Servers process reads and writes, respectively.", cause_ru: "respectively стоит в конце и требует параллельной структуры"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.the-latter, type: chunk, title: "the former ___, the latter ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "первый … последний …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:reference], slot_hint_ru: "явная ссылка на две предыдущие сущности", examples: ["We considered rollback or compensation; the former was riskier, the latter was preferred.", "Legacy and modern platforms differ; the former is simpler, the latter is stricter."], contrast: {frame: "the second ___ and the first ___", note_ru: "latter/former — более литературные и сжатые"}, trap: {learner_form: "the latter system which the client prefers", correction: "the latter, which the client prefers", cause_ru: "latter уже указывает на предмет; не добавляем существительное"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.not-only, type: chunk, title: "not only ___ but also ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "не только … но и …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:connector], examples: ["The fix not only resolved the issue but also improved performance.", "Refactoring not only reduced complexity but also maintainability."], contrast: {frame: "___ both ___ and ___", note_ru: "not only … but also — более литературно"}, trap: {learner_form: "not only resolved the issue and improved performance", correction: "not only resolved the issue but also improved performance", cause_ru: "параллельная структура после not only … but also (не and)"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.with-attachment, type: chunk, title: "the ___ with ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "… с … (уточнение признака или инструмента)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:relative-clause], slot_hint_ru: "существительное + признак или инструмент", examples: ["We reviewed the report with outdated figures, not the current one.", "The vendor provided the solution with the highest ratings."], contrast: {frame: "the ___ that has ___", note_ru: "with — компактнее; that has — явнее"}, trap: {learner_form: "the report with containing outdated figures", correction: "the report with outdated figures", cause_ru: "не добавляем глагол после предлога with"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.only-not, type: chunk, title: "only ___ not ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "только … а не … (уточнение области действия only)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:quantifier], examples: ["Only the primary database, not replicas, requires manual failover.", "Only technical staff, not managers, can approve deployment."], contrast: {frame: "not ___ but ___", note_ru: "only … not — подчёркивает исключение"}, trap: {learner_form: "Only not replicas, the primary requires manual failover.", correction: "Only the primary, not replicas, requires manual failover.", cause_ru: "порядок: only + то, что ограничивается, затем not + исключение"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.that-clause, type: chunk, title: "___ that ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "… который …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:relative-clause], slot_hint_ru: "существительное + ограничивающее придаточное", examples: ["The policy that emerged from review differs from original.", "The update that we deployed last week fixed bugs."], contrast: {frame: "the ___; it ___", note_ru: "that — компактнее; it — двумя предложениями"}, trap: {learner_form: "The policy that it emerged from review", correction: "The policy that emerged from review", cause_ru: "не повторяем подлежащее в относительном предложении"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.dangling-participle, type: chunk, title: "___, the team ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: semi_opaque, domains: [academic, study], meaning_ru: "… причастие … (избежать висящего причастия)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:participle-clause], slot_hint_ru: "причастие + главное предложение", examples: ["Having reviewed all proposals, the team selected a vendor.", "Considering constraints, the team chose postponement."], contrast: {frame: "After we reviewed, the team ___", note_ru: "причастие — компактнее; после — явнее"}, trap: {learner_form: "Having reviewed, the vendor was selected.", correction: "Having reviewed, the team selected.", cause_ru: "субъект причастия должен совпадать с субъектом главного"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.as-intended, type: chunk, title: "___ as ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "…, как и …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:ellipsis], slot_hint_ru: "глагол + предикатив", examples: ["The system performs as expected under normal load.", "The deployment proceeded as planned without issues."], contrast: {frame: "exactly as ___", note_ru: "as — нейтрально; exactly as — сильнее"}, trap: {learner_form: "as we are expecting", correction: "as expected", cause_ru: "после as используем причастие (expected), а не личную форму глагола (are expecting)"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.passive-agent, type: chunk, title: "was ___ by ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "был … (пассив с явным агентом)", frame_of: grammar.syntactic-ambiguity-control, carries: [tense:passive], slot_hint_ru: "причастие + by-фраза", examples: ["The decision was made by the board, not vendors.", "The update was approved by security before deployment."], contrast: {frame: "was ___", note_ru: "с by — явнее; без — неоднозначнее"}, trap: {learner_form: "was made by board", correction: "was made by the board", cause_ru: "нужен артикль the перед board — конкретный, известный орган"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.all-except, type: chunk, title: "all ___ except ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "все … кроме …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:quantifier], examples: ["All teams except QA completed deliverables on time.", "All updates except the final patch have been tested."], contrast: {frame: "___, but not ___", note_ru: "all except — охватывает всё множество"}, trap: {learner_form: "All teams except QA is ready.", correction: "All teams except QA are ready.", cause_ru: "подлежащее — all teams (множественное число), поэтому нужен глагол are, а не is"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.each-of, type: chunk, title: "each of the ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "каждый из …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:quantifier], slot_hint_ru: "of the + множественное число", examples: ["Each of the three metrics improved significantly.", "Each of the databases requires separate indexing."], contrast: {frame: "every ___", note_ru: "each of the — более формально; every — более прямо"}, trap: {learner_form: "Each of the metrics have different values.", correction: "Each of the metrics has different values.", cause_ru: "подлежащее — each (единственное число), поэтому has, а не have, хотя рядом стоит существительное во множественном числе"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.neither-nor, type: chunk, title: "neither ___ nor ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "ни … ни …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:connector], examples: ["Neither the legacy nor the new platform supports that workflow.", "Neither the frontend nor the backend logged the error."], contrast: {frame: "not ___ and not ___", note_ru: "neither … nor — более литературно"}, trap: {learner_form: "Neither the system or the platform", correction: "Neither the system nor the platform", cause_ru: "neither требует nor, не or"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.antecedent, type: chunk, title: "the ___ ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "определённый артикль + существительное (явный антецедент)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:reference], examples: ["The client requested a revision. The request was urgent.", "The framework evolved over three years. The changes improved reliability."], contrast: {frame: "It ___", note_ru: "the + существительное — явнее; it — требует контекста"}, trap: {learner_form: "A client requested a revision. A request was urgent.", correction: "A client requested a revision. The request was urgent.", cause_ru: "при повторном упоминании того же request нужен the (уже известный предмет), не a"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.coordinate-parallel, type: chunk, title: "___ and ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "… и … (координация подобных конструкций)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:connector], examples: ["The team prioritizes speed and correctness equally.", "We need database schema and query optimization."], contrast: {frame: "___, and also ___", note_ru: "параллельная структура — без также"}, trap: {learner_form: "The team prioritizes to speed and correctness", correction: "The team prioritizes speed and correctness", cause_ru: "параллельная структура: существительное и существительное"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.who-vs-that, type: chunk, title: "The ___ who ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, study], meaning_ru: "… который … (лицо)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:relative-clause], examples: ["The developer who implemented the fix was on call.", "The vendor who provided solutions offers good support."], contrast: {frame: "The ___ that ___", note_ru: "who для лиц; that — универсально"}, trap: {learner_form: "The developer that implemented the fix was on call.", correction: "The developer who implemented the fix was on call.", cause_ru: "who для лиц (в этом стиле предпочтительнее that)"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.scope-placement, type: chunk, title: "only at ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, planning], meaning_ru: "только в …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:quantifier], slot_hint_ru: "наречие + место/время", examples: ["The issue manifests only at peak load.", "Legacy code persists only at the edges of the system."], contrast: {frame: "at ___ only", note_ru: "only в начало — как правило; only в конце — редко"}, trap: {learner_form: "only at peak load the issue happens", correction: "only at peak load does the issue happen", cause_ru: "инверсия после only в начале предложения (does the issue happen)"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.sequencing, type: chunk, title: "After ___, the ___", cefr: C2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [academic, planning], meaning_ru: "после … подлежащее …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:reference], examples: ["After deployment, the metrics improved significantly.", "After review, the team proposed alternatives."], contrast: {frame: "After ___. Then the ___ ___", note_ru: "одно предложение — более компактно"}, trap: {learner_form: "After the deployment, it showed improvement.", correction: "After the deployment, the metrics improved.", cause_ru: "явный субъект (the metrics) яснее, чем местоимение it"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.restrict-only, type: chunk, title: "only those ___ that ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: semi_opaque, domains: [academic, planning], meaning_ru: "только те … которые … (ограничивающее придаточное с only)", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:quantifier, structure:relative-clause], examples: ["We accept only those proposals that meet criteria.", "Only those users that signed the agreement proceed."], contrast: {frame: "only the ___ that ___", note_ru: "those подчёркивает выбор"}, trap: {learner_form: "only those proposals that meeting criteria", correction: "only those proposals that meet criteria", cause_ru: "that в ограничивающем придаточном требует правильной формы глагола (meet, не meeting)"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.such-result, type: chunk, title: "such ___ that ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: semi_opaque, domains: [academic, reporting], meaning_ru: "такой … что …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:connector], examples: ["We found such a clean solution that both parties were satisfied.", "The delay was such a problem that the whole team panicked."], contrast: {frame: "a ___ so ___", note_ru: "such that — с существительным; so — с прилагательным"}, trap: {learner_form: "such a bug that making it fail", correction: "such a bug that it fails", cause_ru: "не смешиваем формы глагола в обеих частях"}, transformations: [authored]}
  - {id: chunk.syntactic-ambiguity-control.instead-of, type: chunk, title: "instead of ___, ___", cefr: C2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, planning], meaning_ru: "вместо …, …", frame_of: grammar.syntactic-ambiguity-control, carries: [structure:connector], examples: ["Instead of adopting the standard, we created a custom solution.", "Instead of escalating to the vendor, we resolved it internally."], contrast: {frame: "___ rather than ___", note_ru: "instead of — предлог; rather than — альтернатива"}, trap: {learner_form: "Instead of to adopt the standard", correction: "Instead of adopting the standard", cause_ru: "после instead of используем герундий, не инфинитив"}, transformations: [authored]}
