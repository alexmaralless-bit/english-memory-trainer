# Frames for grammar.will.basic-decisions (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.will-basic-decisions.ill-do-it, type: chunk, title: "I'll ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я это …, я буду …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "действие или промежуточный объект", examples: ["I'll send the file now.", "I'll handle the issue immediately."], contrast: {frame: "I'm going to ___", note_ru: "I'll выражает спонтанное решение в момент речи; I'm going to предварительный план"}, trap: {learner_form: "I will sends the file.", correction: "I'll send the file.", cause_ru: "после will инфинитив без to"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.well-help, type: chunk, title: "We'll ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы …, мы будем …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "совместное действие или помощь", examples: ["We'll help with the setup.", "We'll support you throughout the process."], contrast: {frame: "We're going to ___", note_ru: "We'll для решения сейчас; We're going to для плана заранее"}, trap: {learner_form: "We will to help you.", correction: "We'll help you.", cause_ru: "will + инфинитив, не to + инфинитив"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.hell-review, type: chunk, title: "He'll ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "действие третьего лица", examples: ["He'll review the contract by tomorrow.", "He'll provide feedback on your design."], contrast: {frame: "He's going to ___", note_ru: "He'll для мгновенного решения; He's going to для намеченного плана"}, trap: {learner_form: "He will checks the code.", correction: "He'll check the code.", cause_ru: "will + инфинитив без to, не третья форма"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.shell-confirm, type: chunk, title: "She'll ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "действие женского лица", examples: ["She'll confirm the details later.", "She'll coordinate with the team."], contrast: {frame: "She's going to ___", note_ru: "She'll решение здесь и сейчас; She's going to заранее спланировано"}, trap: {learner_form: "She will to send the update.", correction: "She'll send the update.", cause_ru: "will нужен инфинитив, she'll краткая форма"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.theyll-work, type: chunk, title: "They'll ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "действие третьих лиц", examples: ["They'll implement the changes next week.", "They'll ensure all tests pass."], contrast: {frame: "They're going to ___", note_ru: "They'll для спонтанного; They're going to для спланированного"}, trap: {learner_form: "They will calling us back.", correction: "They'll call us back.", cause_ru: "will + инфинитив, не герундий с -ing"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.wont-be, type: chunk, title: "I won't ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я не …, я не буду …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will, structure:negative], slot_hint_ru: "действие, которого не будет", examples: ["I won't forget about this.", "I won't leave without saving."], contrast: {frame: "I'm not going to ___", note_ru: "I won't отмена спонтанного решения; I'm not going to отмена плана"}, trap: {learner_form: "I won't calling you back.", correction: "I won't call you back.", cause_ru: "won't + инфинитив, не герундий"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.will-you, type: chunk, title: "Will you ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "ты …?", frame_of: grammar.will.basic-decisions, carries: [tense:future-will, structure:question-do], slot_hint_ru: "действие, запрос помощи", examples: ["Will you send the report?", "Will you join the meeting tomorrow?"], contrast: {frame: "Are you going to ___?", note_ru: "Will you? — спонтанный запрос; Are you going to? — вопрос о плане"}, trap: {learner_form: "Will you to help me?", correction: "Will you help me?", cause_ru: "Will + инфинитив, не to + инфинитив"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.will-she, type: chunk, title: "Will she ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она …?", frame_of: grammar.will.basic-decisions, carries: [tense:future-will, structure:question-do], slot_hint_ru: "действие, о котором спрашиваем", examples: ["Will she attend the standup?", "Will she approve the budget?"], contrast: {frame: "Is she going to ___?", note_ru: "Will she? о спонтанном; Is she going to? о плане"}, trap: {learner_form: "Will she to participate?", correction: "Will she participate?", cause_ru: "Will + subject + инфинитив, не to + инфинитив"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.ill-get-it-done, type: chunk, title: "I'll get it done by ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я это сделаю к …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will, structure:time-marker], slot_hint_ru: "временной маркер, дедлайн", examples: ["I'll get it done by Friday.", "I'll get it done by the end of the day."], contrast: {frame: "I'm going to do it by ___", note_ru: "I'll get it done by — срочное обещание; I'm going to — спланированное"}, trap: {learner_form: "I'll get it done by tomorrow's evening.", correction: "I'll get it done by tomorrow evening.", cause_ru: "by + временной маркер, не possessive form"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.ill-let-you-know, type: chunk, title: "I'll let you know once ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я дам тебе знать как только …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will, structure:time-marker], slot_hint_ru: "событие, после которого сообщу", examples: ["I'll let you know once I hear back.", "I'll let you know once the tests pass."], contrast: {frame: "I'll tell you when ___", note_ru: "let you know once — более предвосхищающее; tell you when — просто информирование"}, trap: {learner_form: "I'll let you know once I will hear back.", correction: "I'll let you know once I hear back.", cause_ru: "в придаточном времени после once нужен Present Simple, не Future"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.ill-check, type: chunk, title: "I'll check ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я проверю …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "то, что проверю", examples: ["I'll check the database for any missing records.", "I'll check with the team tomorrow morning."], contrast: {frame: "I'm going to check ___", note_ru: "I'll check — спонтанное решение; I'm going to check — спланировано"}, trap: {learner_form: "I'll check the system now, okay?", correction: "I'll check the system now.", cause_ru: "I'll check простое утверждение, не требует вежливости в конце"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.ill-send, type: chunk, title: "I'll send ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я отправлю …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "что отправлю", examples: ["I'll send the link tomorrow.", "I'll send you the updated version."], contrast: {frame: "I'm going to send ___", note_ru: "I'll send — мгновенное решение; I'm going to send — уже спланировано"}, trap: {learner_form: "I'll send the document later, alright?", correction: "I'll send the document later.", cause_ru: "I'll send достаточно вежливо сам по себе"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.ill-call, type: chunk, title: "I'll call ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я позвоню …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "кому позвоню или время", examples: ["I'll call you back later.", "I'll call the vendor tomorrow morning."], contrast: {frame: "I'm going to call ___", note_ru: "I'll call — срочное решение; I'm going to call — заранее решено"}, trap: {learner_form: "I'll call you back, alright?", correction: "I'll call you back.", cause_ru: "I'll достаточно вежливо и убедительно"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.promise-i-will, type: chunk, title: "I promise I'll ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, communication], meaning_ru: "я обещаю, что …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "действие, которое обещаю", examples: ["I promise I'll finish on time.", "I promise I'll keep it confidential."], contrast: {frame: "I'll definitely ___", note_ru: "I promise I'll — сильное обещание; I'll definitely — уверенность"}, trap: {learner_form: "I promise I will to deliver.", correction: "I promise I'll deliver.", cause_ru: "I'll краткая форма, не will to"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.right-away, type: chunk, title: "I'll ___ right away", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я сейчас же …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "срочное действие", examples: ["I'll fix it right away.", "I'll update the docs right away."], contrast: {frame: "I'll ___ later", note_ru: "right away — срочно; later — с отсрочкой"}, trap: {learner_form: "I'll fixing it right away.", correction: "I'll fix it right away.", cause_ru: "I'll + инфинитив, не герундий"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.definitely-will, type: chunk, title: "I definitely will ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, communication], meaning_ru: "я точно …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "уверенное действие", examples: ["I definitely will be there.", "I definitely will help you out."], contrast: {frame: "I'll definitely ___", note_ru: "I definitely will — после will наречие; I'll definitely — наречие внутри"}, trap: {learner_form: "I definitely will to help.", correction: "I definitely will help.", cause_ru: "I will + инфинитив, не to инфинитив"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.will-take-care, type: chunk, title: "I'll take care of ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я позабочусь о …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "то, о чём позабочусь", examples: ["I'll take care of the backups.", "I'll take care of the scheduling."], contrast: {frame: "I'm going to handle ___", note_ru: "take care of — более личное; handle — более формально"}, trap: {learner_form: "I'll take care about the issue.", correction: "I'll take care of the issue.", cause_ru: "take care of, не take care about"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.wont-take-long, type: chunk, title: "It won't take long", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это не займёт много времени", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], examples: ["It won't take long to fix.", "It won't take long if everyone helps."], contrast: {frame: "It will be quick.", note_ru: "It won't take long — об времени выполнения; It will be quick — о скорости"}, trap: {learner_form: "It won't take longer.", correction: "It won't take long.", cause_ru: "take long это идиома, не take longer в этом контексте"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.youll-see, type: chunk, title: "You'll see ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, communication], meaning_ru: "ты увидишь …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "то, что будет видно позже", examples: ["You'll see how easy it is.", "You'll see the benefits soon."], contrast: {frame: "You'll understand ___", note_ru: "You'll see подчеркивает визуальный результат; understand когнитивный"}, trap: {learner_form: "You'll see, it working fine.", correction: "You'll see, it will work fine.", cause_ru: "после you'll see может быть фраза с will"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.what-will-you, type: chunk, title: "What will you ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "что ты …?", frame_of: grammar.will.basic-decisions, carries: [tense:future-will, structure:question-wh], slot_hint_ru: "действие, о котором спрашиваем", examples: ["What will you do next after the call?", "What will you recommend to the stakeholders?"], contrast: {frame: "What are you going to ___?", note_ru: "What will you? — открытый вопрос; What are you going to? — о плане"}, trap: {learner_form: "What will you to do?", correction: "What will you do?", cause_ru: "What + will + subject + инфинитив, не to инфинитив"}, transformations: [authored]}
  - {id: chunk.will-basic-decisions.will-do-everything, type: chunk, title: "I'll do everything ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я сделаю всё …", frame_of: grammar.will.basic-decisions, carries: [tense:future-will], slot_hint_ru: "условие или направление", examples: ["I'll do everything I can to help.", "I'll do everything possible to succeed."], contrast: {frame: "I'll try to ___", note_ru: "I'll do everything подчёркивает твёрдое обещание; I'll try звучит мягче, без гарантии результата"}, trap: {learner_form: "I'll do everything I can for helping.", correction: "I'll do everything I can to help.", cause_ru: "do everything I can + инфинитив с to"}, transformations: [authored]}
