  - {id: chunk.present-continuous-status.just-finishing, type: chunk, title: "I'm just finishing ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я как раз заканчиваю …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "что заканчиваю", examples: ["I'm just finishing the code review.", "I'm just finishing the deployment checklist."], contrast: {frame: "I just finished", note_ru: "заканчиваю прямо сейчас vs уже закончил(а), важен результат"}, trap: {learner_form: "I finishing the task.", correction: "I'm finishing the task.", cause_ru: "need be even с just"}, transformations: [authored]}
