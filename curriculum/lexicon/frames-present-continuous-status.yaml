  - {id: chunk.present-continuous-status.im-fixing, type: chunk, title: "I'm fixing ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я сейчас исправляю …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "то, что нужно исправить", examples: ["I'm fixing the error in the code.", "I'm fixing the connection issue now."], contrast: {frame: "I fix", note_ru: "исправляю прямо сейчас vs занимаюсь починкой как обычным делом"}, trap: {learner_form: "I fix the bug right now.", correction: "I'm fixing the bug right now.", cause_ru: "right now = текущий момент, требует continuous"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.im-updating, type: chunk, title: "I'm updating ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я сейчас обновляю …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "что обновляется", examples: ["I'm updating the documentation now.", "I'm updating the database with new entries."], contrast: {frame: "I update", note_ru: "обновляю прямо сейчас vs делаю регулярные обновления"}, trap: {learner_form: "I update it today.", correction: "I'm updating it today.", cause_ru: "today может быть период; если сейчас = continuous"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.im-checking, type: chunk, title: "I'm checking ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я сейчас проверяю …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "объект проверки", examples: ["I'm checking the logs right now.", "I'm checking the data for errors."], contrast: {frame: "I check", note_ru: "проверяю прямо сейчас vs проверяю по привычному порядку"}, trap: {learner_form: "I check the server now.", correction: "I'm checking the server now.", cause_ru: "now = current action, требует be + -ing"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.were-testing, type: chunk, title: "We're testing ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы сейчас тестируем …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "что тестируется", examples: ["We're testing the new release today.", "We're testing different approaches in parallel."], contrast: {frame: "We test", note_ru: "тестируем прямо сейчас vs тестируем в рамках обычного процесса"}, trap: {learner_form: "We testing the system.", correction: "We're testing the system.", cause_ru: "пропуск are перед -ing"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.were-waiting-on, type: chunk, title: "We're waiting on", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы сейчас ждём …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "на что ждём", examples: ["We're waiting on the vendor response.", "We're waiting on the approval from management."], contrast: {frame: "We wait for", note_ru: "waiting on и waiting for близки по смыслу; on звучит чуть более разговорно"}, trap: {learner_form: "We wait the response.", correction: "We're waiting on the response.", cause_ru: "wait требует for или on"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.hes-working-on, type: chunk, title: "He's working on", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "он сейчас работает над", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "задача", examples: ["He's working on the backend logic.", "He's working on the deployment script."], contrast: {frame: "He works on", note_ru: "работает над этим прямо сейчас vs это его обычная обязанность"}, trap: {learner_form: "He is work on it.", correction: "He's working on it.", cause_ru: "work требует -ing после be"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.shes-reviewing, type: chunk, title: "She's reviewing ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "она сейчас проверяет …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "объект", examples: ["She's reviewing the proposal right now.", "She's reviewing the pull request changes."], contrast: {frame: "She reviews", note_ru: "проверяет прямо сейчас vs проверяет в рамках обычной работы"}, trap: {learner_form: "She review the doc.", correction: "She's reviewing the doc.", cause_ru: "форма глагола и be перед -ing"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.theyre-updating, type: chunk, title: "They're updating ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "они сейчас обновляют …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "что обновляется", examples: ["They're updating the system right now.", "They're updating the process next week."], contrast: {frame: "They update", note_ru: "обновляют прямо сейчас vs делают регулярные обновления"}, trap: {learner_form: "They updating the software.", correction: "They're updating the software.", cause_ru: "пропуск are перед -ing для they"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.im-not-working, type: chunk, title: "I'm not working on", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я сейчас не работаю над", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "чего не делаю", examples: ["I'm not working on that today.", "I'm not working on the old system anymore."], contrast: {frame: "I don't work on", note_ru: "сейчас не работаю над этим vs обычно этим не занимаюсь"}, trap: {learner_form: "I not working on it.", correction: "I'm not working on it.", cause_ru: "need be для отрицания continuous"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.arent-you-working, type: chunk, title: "Aren't you working on ___?", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ты не работаешь над …?", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous, structure:question-be], slot_hint_ru: "задача", examples: ["Aren't you working on the payment module?", "Aren't you working on that bug today?"], contrast: {frame: "Don't you work on?", note_ru: "вопрос про текущее действие (continuous) vs вопрос про привычку (simple)"}, trap: {learner_form: "You not working on it?", correction: "Aren't you working on it?", cause_ru: "question порядок с be + -ing"}, transformations: [authored]}
