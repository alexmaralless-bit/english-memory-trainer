  - {id: chunk.present-continuous-status.im-trying-to, type: chunk, title: "I'm trying to ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я пытаюсь …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "инфинитив", examples: ["I'm trying to fix the issue.", "I'm trying to understand the requirements."], contrast: {frame: "I try to", note_ru: "пытаюсь прямо сейчас vs пытаюсь как обычно, по привычке"}, trap: {learner_form: "I try to understand.", correction: "I'm trying to understand.", cause_ru: "текущее усилие = continuous"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.shes-not-available, type: chunk, title: "She's not available; she's ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она недоступна; она …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "-ing глагол", examples: ["She's not available; she's in a meeting.", "She's not available; she's working on the deadline."], contrast: {frame: "She's unavailable", note_ru: "continuous объясняет, чем именно она занята прямо сейчас"}, trap: {learner_form: "She is not available she works.", correction: "She's not available; she's working on it.", cause_ru: "need proper connection и continuous"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.are-they-still, type: chunk, title: "Are they still ___?", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "они всё ещё …?", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous, structure:question-be], slot_hint_ru: "-ing глагол", examples: ["Are they still testing the module?", "Are they still working on it today?"], contrast: {frame: "Do they still work?", note_ru: "вопрос про текущее действие (continuous) vs вопрос про факт (simple)"}, trap: {learner_form: "They still working?", correction: "Are they still working?", cause_ru: "question порядок с be + -ing"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.im-having-trouble, type: chunk, title: "I'm having trouble ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "у меня проблемы с …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "с чем проблемы", examples: ["I'm having trouble with the setup.", "I'm having trouble understanding the requirement."], contrast: {frame: "I have trouble", note_ru: "I'm having — про конкретную проблему прямо сейчас"}, trap: {learner_form: "I have trouble now.", correction: "I'm having trouble.", cause_ru: "having more natural для текущей проблемы"}, transformations: [authored]}
