# Frames for grammar.present-continuous.status (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.present-continuous-status.im-working-on, type: chunk, title: "I'm working on", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я сейчас работаю над", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "задача или объект", examples: ["I'm working on the payment system.", "I'm working on fixing the critical bug."], contrast: {frame: "I work on", note_ru: "I'm working on — делаю это прямо сейчас; I work on — обычно занимаюсь этим (рутина)"}, trap: {learner_form: "I working on the task.", correction: "I'm working on the task.", cause_ru: "пропуск am перед -ing"}, transformations: [authored]}
  - {id: chunk.present-continuous-status.im-testing, type: chunk, title: "I'm testing ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я сейчас тестирую …", frame_of: grammar.present-continuous.status, carries: [tense:present-continuous], slot_hint_ru: "объект тестирования", examples: ["I'm testing the new flow.", "I'm testing the API response."], contrast: {frame: "I test", note_ru: "тестирую прямо сейчас vs тестирую как обычное, привычное дело"}, trap: {learner_form: "I test it now.", correction: "I'm testing it now.", cause_ru: "временное действие требует continuous"}, transformations: [authored]}
