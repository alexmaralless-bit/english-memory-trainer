# Frames for grammar.past-time-sequencing (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.past-time-sequencing.first, type: chunk, title: "First, ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "во-первых, сначала …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "прошедшее простое, действие", examples: ["First, I opened the ticket.", "First, we checked the backup."], contrast: {frame: "Then ___", note_ru: "First указывает на начало последовательности, Then — на следующее действие"}, trap: {learner_form: "First, I opens the ticket.", correction: "First, I opened the ticket.", cause_ru: "после простого прошедшего глагол не может иметь -s"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.then, type: chunk, title: "Then ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "потом, затем …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "прошедшее простое, второе действие", examples: ["Then I called support and explained the issue.", "Then we restarted the entire system quickly."], contrast: {frame: "First ___", note_ru: "Then отмечает следующее событие в цепи; First начинает последовательность"}, trap: {learner_form: "Then we restart the app.", correction: "Then we restarted the app.", cause_ru: "если действие произошло в прошлом, нужна форма простого прошедшего"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.after-that, type: chunk, title: "After that, ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "после того …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:time-marker], slot_hint_ru: "прошедшее простое, третье действие", examples: ["After that, I sent the report.", "After that, we tested the fix."], contrast: {frame: "Before that ___", note_ru: "After that показывает движение вперёд во времени; Before that — назад"}, trap: {learner_form: "After that, I send the report.", correction: "After that, I sent the report.", cause_ru: "After that даёт контекст прошедшего времени; нужен Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.as-soon-as, type: chunk, title: "As soon as ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "как только …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:connector], slot_hint_ru: "когда произошло условие", examples: ["As soon as the deploy finished, we got alerts.", "As soon as I logged in, the app crashed."], contrast: {frame: "When ___", note_ru: "As soon as подчёркивает срочность и связь причины и результата; When просто указывает на время"}, trap: {learner_form: "As soon as we will finish, we reported it.", correction: "As soon as we finished, we reported it.", cause_ru: "в придаточном времени после as soon as нужен Past Simple, не Future"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.by-the-time, type: chunk, title: "By the time ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "к тому времени как …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:time-marker], slot_hint_ru: "когда, при каких условиях", examples: ["By the time I arrived, the team had already fixed it.", "By the time the update deployed, we were testing the old version."], contrast: {frame: "When ___", note_ru: "By the time подчёркивает, что одно действие закончилось к моменту другого; When просто указывает на момент"}, trap: {learner_form: "By the time I arrived, they fix it.", correction: "By the time I arrived, they had fixed it.", cause_ru: "by the time требует прошедшего совершённого времени для первого действия"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.earlier-that-day, type: chunk, title: "Earlier that day, ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "раньше в этот день …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:time-marker], slot_hint_ru: "действие, произошедшее ранее", examples: ["Earlier that day, I had reviewed the pull requests.", "Earlier that day, they deployed to staging."], contrast: {frame: "That day ___", note_ru: "Earlier that day указывает на более ранний момент; That day — на общее время"}, trap: {learner_form: "Earlier that day, I review the code.", correction: "Earlier that day, I reviewed the code.", cause_ru: "earlier that day указывает на прошедшее; нужен Past Simple или Present Perfect"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.once-we, type: chunk, title: "Once we ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "как только мы …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:connector], slot_hint_ru: "условие или временная граница", examples: ["Once we deployed, the error stopped.", "Once I restarted it, the connection worked."], contrast: {frame: "When we ___", note_ru: "Once подчёркивает точный момент смены; When более нейтрально"}, trap: {learner_form: "Once we will deploy, the fix starts.", correction: "Once we deployed, the fix started.", cause_ru: "после once в придаточном нужен Past Simple, не будущее время"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.meanwhile, type: chunk, title: "Meanwhile, ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "тем временем …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:connector], slot_hint_ru: "то, что происходило параллельно", examples: ["Meanwhile, the support team handled the tickets.", "Meanwhile, I updated the documentation."], contrast: {frame: "At the same time ___", note_ru: "Meanwhile имеет нарративный оттенок; At the same time более литерально"}, trap: {learner_form: "Meanwhile, the server is down.", correction: "Meanwhile, the server went down.", cause_ru: "meanwhile в контексте прошедшего рассказа требует Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.before-i, type: chunk, title: "Before I ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "до того как я …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:connector], slot_hint_ru: "действие, которое произошло позже", examples: ["Before I could react, the alert fired.", "Before we deployed, we ran the tests."], contrast: {frame: "After I ___", note_ru: "Before указывает на предшествующее действие; After на последующее"}, trap: {learner_form: "Before I can react, the error appears.", correction: "Before I could react, the error appeared.", cause_ru: "перед before нужно прошедшее время глагола, не настоящее"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.right-after, type: chunk, title: "Right after ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "сразу же после …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:time-marker], slot_hint_ru: "действие или событие", examples: ["Right after the call, I sent the notes.", "Right after lunch, we got the error report."], contrast: {frame: "After a while ___", note_ru: "Right after подчёркивает срочность; After a while указывает на промежуток времени"}, trap: {learner_form: "Right after we restart, it works.", correction: "Right after we restarted, it worked.", cause_ru: "right after требует Past Simple для обоих действий"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.next, type: chunk, title: "Next, ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "затем …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "следующее действие в хронологии", examples: ["Next, I documented the issue.", "Next, the team reviewed the changes."], contrast: {frame: "First ___", note_ru: "Next указывает на продолжение; First на начало"}, trap: {learner_form: "Next, I document the problem.", correction: "Next, I documented the problem.", cause_ru: "в повествовании о прошедших событиях нужен Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.shortly-after, type: chunk, title: "Shortly after ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "вскоре после …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:time-marker], slot_hint_ru: "событие или действие", examples: ["Shortly after we pushed the code, we noticed the regression.", "Shortly after the outage started, the team joined the call."], contrast: {frame: "Long after ___", note_ru: "Shortly after указывает на близкий промежуток времени"}, trap: {learner_form: "Shortly after we deploy, the error appears.", correction: "Shortly after we deployed, the error appeared.", cause_ru: "after требует Past Simple для события, которое случилось перед ним"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.in-the-end, type: chunk, title: "In the end, ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "в конце концов …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "финальный результат или действие", examples: ["In the end, we reverted the change.", "In the end, the client was satisfied."], contrast: {frame: "At the end ___", note_ru: "In the end означает результат; At the end означает пространственное местоположение"}, trap: {learner_form: "In the end, we solve the problem.", correction: "In the end, we solved the problem.", cause_ru: "in the end в рассказе о прошедших событиях требует Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.eventually, type: chunk, title: "Eventually, ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "в итоге, в конце концов …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "финальное действие или состояние", examples: ["Eventually, the tickets got resolved.", "Eventually, they found the root cause."], contrast: {frame: "At first ___", note_ru: "Eventually показывает результат после времени; At first показывает начальное состояние"}, trap: {learner_form: "Eventually, the issue disappears.", correction: "Eventually, the issue disappeared.", cause_ru: "eventually в повествовании требует Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.finally, type: chunk, title: "Finally, ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "наконец, в конце …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "последнее действие в последовательности", examples: ["Finally, I sent the status update to the team.", "Finally, the deployment to production succeeded."], contrast: {frame: "At last ___", note_ru: "Finally завершает последовательность действий; At last подчёркивает облегчение"}, trap: {learner_form: "Finally, I send the email.", correction: "Finally, I sent the email.", cause_ru: "finally в контексте Past Simple требует согласования времён"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.until-that-point, type: chunk, title: "Until that point, ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "до того момента …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:time-marker], slot_hint_ru: "то, что было до определённого события", examples: ["Until that point, everything was working.", "Until that point, we had no alerts."], contrast: {frame: "After that point ___", note_ru: "Until that point показывает то, что было до; After показывает то, что было после"}, trap: {learner_form: "Until that point, the system works fine.", correction: "Until that point, the system worked fine.", cause_ru: "until that point требует Past Simple или Past Perfect для действий до определённого момента"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.so-then, type: chunk, title: "So then ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "итак, затем …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:connector], slot_hint_ru: "действие, вытекающее из предыдущего", examples: ["So then we escalated to the vendor.", "So then I opened a new ticket."], contrast: {frame: "After that ___", note_ru: "So then подчёркивает логическую связь; After that просто временную"}, trap: {learner_form: "So then we escalate the issue.", correction: "So then we escalated the issue.", cause_ru: "so then в прошедшем контексте требует Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.what-happened-next, type: chunk, title: "What happened next? ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "что произошло дальше? …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:question-do], slot_hint_ru: "следующее событие в цепи", examples: ["What happened next? We got a call from the client.", "What happened next? The system went down."], contrast: {frame: "What will happen? ___", note_ru: "What happened next спрашивает о прошедшем; What will happen о будущем"}, trap: {learner_form: "What happened next? We gets a new alert.", correction: "What happened next? We got a new alert.", cause_ru: "после What happened (прошедшее), следующее действие тоже в Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.once-i-did, type: chunk, title: "Once I ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "как только я …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing, structure:connector], slot_hint_ru: "первое действие", examples: ["Once I cleared the cache, it loaded fast.", "Once I restarted the service, the error stopped."], contrast: {frame: "When I ___", note_ru: "Once подчёркивает точку в цепи событий; When просто указывает на время"}, trap: {learner_form: "Once I clear the cache, it works.", correction: "Once I cleared the cache, it worked.", cause_ru: "после once в придаточном нужен Past Simple для исторического повествования"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.the-moment-we, type: chunk, title: "The moment we ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "в тот момент когда мы …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "действие в критический момент", examples: ["The moment we hit deploy, the metrics tanked.", "The moment they opened the link, the page crashed."], contrast: {frame: "When we ___", note_ru: "The moment we подчёркивает точность момента; When менее конкретно"}, trap: {learner_form: "The moment we deploy, alerts fire.", correction: "The moment we deployed, alerts fired.", cause_ru: "the moment требует согласования времён; оба глагола в Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.i-immediately, type: chunk, title: "I immediately ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я немедленно …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple], slot_hint_ru: "действие, выполненное срочно", examples: ["I immediately notified the team.", "I immediately checked the logs."], contrast: {frame: "I later ___", note_ru: "Immediately подчёркивает срочность; Later указывает на отсрочку"}, trap: {learner_form: "I immediately notify the team.", correction: "I immediately notified the team.", cause_ru: "immediately в контексте прошедшего требует Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.minutes-later, type: chunk, title: "Minutes later, ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "несколько минут спустя …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "что произошло через несколько минут", examples: ["Minutes later, we got confirmation.", "Minutes later, the second error appeared."], contrast: {frame: "Right then ___", note_ru: "Minutes later указывает на прошедший промежуток времени"}, trap: {learner_form: "Minutes later, we receive the response.", correction: "Minutes later, we received the response.", cause_ru: "minutes later указывает на прошедшее; нужен Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.and-then, type: chunk, title: "And then ___", cefr: A1, curriculum_priority_band: CORE, register: casual, transparency: transparent, domains: [work, reporting], meaning_ru: "а потом …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "следующее действие", examples: ["And then we noticed the bug in production.", "And then the client complained."], contrast: {frame: "Then ___", note_ru: "And then имеет более разговорный тон; Then более формально"}, trap: {learner_form: "And then we see the error.", correction: "And then we saw the error.", cause_ru: "and then в рассказе о прошедшем требует Past Simple"}, transformations: [authored]}
  - {id: chunk.past-time-sequencing.next-thing, type: chunk, title: "The next thing ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "дальше …", frame_of: grammar.past-time-sequencing, carries: [tense:past-simple, structure:sequencing], slot_hint_ru: "следующее событие или действие", examples: ["The next thing I knew, the alerts fired.", "The next thing that happened was a cascade failure."], contrast: {frame: "Then ___", note_ru: "the next thing подчёркивает неожиданность момента; then звучит проще и нейтральнее"}, trap: {learner_form: "The next thing we do is check the logs.", correction: "The next thing we did was check the logs.", cause_ru: "the next thing указывает на прошедшее; нужен Past Simple"}, transformations: [authored]}
