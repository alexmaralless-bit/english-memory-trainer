# Frames for the nine article topics (automaticity layer, 2026-09-22). Own text.
# frame_of values: grammar.articles.identity, grammar.articles.second-mention,
# grammar.articles.zero-plural-uncountable, grammar.articles.fixed-time-expressions,
# grammar.articles.institutional-places, grammar.articles.the-unique-superlative-ordinal,
# grammar.articles.generic-statements, grammar.articles.proper-nouns-geography,
# grammar.articles.abstract-and-of-phrases.
lexical_items:

  # --- grammar.articles.identity (A1): a/an on first mention, roles, a/an by sound ---
  - {id: chunk.articles-identity.im-a, type: chunk, title: "I'm a ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я … (профессия/роль)", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], slot_hint_ru: "название профессии или роли в единственном числе", examples: ["I'm a project manager on the new mobile app.", "I'm a big fan of long walks on the weekend."], contrast: {frame: "I'm the ___", note_ru: "the — когда роль уникальна и уже известна собеседнику, a — когда просто называешь профессию"}, trap: {learner_form: "I'm project manager.", correction: "I'm a project manager.", cause_ru: "в русском перед названием профессии артикль не нужен"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-identity.im-an, type: chunk, title: "I'm an ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я … (профессия/роль, начинается с гласного звука)", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention, article:a-an-sound], slot_hint_ru: "профессия или роль, первый звук — гласный", examples: ["I'm an engineer on the backend team.", "I'm an early riser, so mornings work best."], contrast: {frame: "I'm a ___", note_ru: "an перед гласным звуком (an engineer), a перед согласным (a developer)"}, trap: {learner_form: "I'm a engineer.", correction: "I'm an engineer.", cause_ru: "выбор a/an путают по букве, а не по первому звуку слова"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-identity.shes-a, type: chunk, title: "She's a ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она … (профессия/роль)", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["She's a designer, so ask her about the layout.", "She's a morning person and gets up at six."], contrast: {frame: "She's the ___", note_ru: "the, если роль в компании одна и уже известна собеседнику"}, trap: {learner_form: "She's designer.", correction: "She's a designer.", cause_ru: "перенос русской конструкции без глагола-связки и без артикля"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-identity.hes-an, type: chunk, title: "He's an ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он … (профессия/роль, гласный звук)", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention, article:a-an-sound], examples: ["He's an analyst in the finance department.", "He's an honest guy, so trust his estimate."], contrast: {frame: "He's a ___", note_ru: "honest начинается с немой h, поэтому нужен an, хотя буква согласная"}, trap: {learner_form: "He's a honest guy.", correction: "He's an honest guy.", cause_ru: "буква h считается согласной, но звук в honest не произносится"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-identity.we-need-a, type: chunk, title: "We need a ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "нам нужен/нужна …", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["We need a volunteer to test the new build.", "We need a bigger table for family dinner."], contrast: {frame: "We need the ___", note_ru: "the, если нужен конкретный, уже упомянутый предмет, а не любой подходящий"}, trap: {learner_form: "We need volunteer.", correction: "We need a volunteer.", cause_ru: "пропуск артикля перед исчисляемым существительным в единственном числе"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-identity.i-have-a-question, type: chunk, title: "I have a question", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "у меня есть вопрос", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["I have a question about the new deployment schedule.", "I have a question before we leave for the trip."], contrast: {frame: "I have the question", note_ru: "the — только если вопрос уже известен собеседнику (the question we discussed); при первом упоминании — a"}, trap: {learner_form: "I have question.", correction: "I have a question.", cause_ru: "исчисляемое существительное в единственном числе требует артикль, даже если в русском он не нужен"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.lets-schedule-a-call, type: chunk, title: "Let's schedule a call", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "давайте назначим звонок", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["Let's schedule a call for Thursday afternoon.", "Let's schedule a call before the trip so we can plan."], contrast: {frame: "Let's schedule the call", note_ru: "the, если звонок уже обсуждался и обе стороны знают, какой именно"}, trap: {learner_form: "Let's schedule call.", correction: "Let's schedule a call.", cause_ru: "пропуск артикля перед исчисляемым существительным в единственном числе"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.i-found-a-bug, type: chunk, title: "I found a bug", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я нашёл баг", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["I found a bug in the payment form.", "I found a bug right before the weekend trip."], contrast: {frame: "I found the bug", note_ru: "the, если речь о том самом баге, который все искали"}, trap: {learner_form: "I found bug.", correction: "I found a bug.", cause_ru: "пропуск артикля перед исчисляемым существительным при первом упоминании"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.i-opened-a-ticket, type: chunk, title: "I opened a ticket", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я завёл тикет", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["I opened a ticket for the login issue.", "I opened a ticket right after the store closed."], contrast: {frame: "I opened the ticket", note_ru: "the, если возвращаешься к уже известному, ранее упомянутому тикету"}, trap: {learner_form: "I opened the ticket for this new problem.", correction: "I opened a ticket for this new problem.", cause_ru: "the ставят на первом упоминании по привычке выделять важное слово"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.thats-an-easy-fix, type: chunk, title: "That's an easy fix", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это легко исправить (досл. это лёгкое исправление)", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention, article:a-an-sound], examples: ["That's an easy fix, so I'll do it now.", "That's an easy fix for a loose door handle."], contrast: {frame: "That's a hard fix", note_ru: "a перед согласным звуком hard, an перед гласным звуком easy"}, trap: {learner_form: "That's a easy fix.", correction: "That's an easy fix.", cause_ru: "выбор артикля по первой букве, а не по первому звуку"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.its-a-small-team, type: chunk, title: "It's a small team", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "это небольшая команда", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["It's a small team, so everyone knows each other.", "It's a small team of five people at the shelter."], contrast: {frame: "It's the smallest team", note_ru: "the + superlative smallest выделяет команду среди всех остальных"}, trap: {learner_form: "It's small team.", correction: "It's a small team.", cause_ru: "пропуск артикля перед исчисляемым существительным в единственном числе"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.she-sent-an-email, type: chunk, title: "She sent an email", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "она отправила письмо", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention, article:a-an-sound], examples: ["She sent an email about the schedule change.", "She sent an email right after dinner."], contrast: {frame: "She sent the email", note_ru: "the, если письмо уже упоминалось раньше в разговоре"}, trap: {learner_form: "She sent a email.", correction: "She sent an email.", cause_ru: "email начинается с гласного звука, а/an путают по букве"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.i-need-an-hour, type: chunk, title: "I need an hour", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мне нужен час", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention, article:a-an-sound], examples: ["I need an hour to finish the report.", "I need an hour before we head to the party."], contrast: {frame: "I need a minute", note_ru: "hour начинается с немой h и гласного звука, поэтому an, а не a"}, trap: {learner_form: "I need a hour.", correction: "I need an hour.", cause_ru: "буква h считается согласной, но в hour она не произносится"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-identity.it-was-a-long-day, type: chunk, title: "It was a long day", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "это был длинный день", frame_of: grammar.articles.identity, carries: [article:indefinite-first-mention], examples: ["It was a long day, but the release went fine.", "It was a long day at the beach with the kids."], contrast: {frame: "It was the longest day", note_ru: "the + superlative longest выделяет день среди других, a — просто описание"}, trap: {learner_form: "It was long day.", correction: "It was a long day.", cause_ru: "пропуск артикля перед исчисляемым существительным day в единственном числе"}, transformations: [authored], tier: 1}

  # --- grammar.articles.second-mention (A1): a -> the on second mention; the for shared context ---
  - {id: chunk.articles-second-mention.i-opened-a-x-the-x, type: chunk, title: "I opened a ___. The ___ is closed now.", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я завёл …, теперь он/она/оно закрыт(а)", frame_of: grammar.articles.second-mention, carries: [article:indefinite-first-mention, article:definite-second-mention], slot_hint_ru: "одно и то же существительное в обоих пропусках", examples: ["I opened a ticket for the printer. The ticket is closed now.", "I opened a tab for the recipe. The tab is closed now."], contrast: {frame: "I opened a ___. A ___ is closed now.", note_ru: "во второй фразе уже нужен the: слушатель знает, о каком именно предмете речь"}, trap: {learner_form: "I opened a ticket. A ticket is closed now.", correction: "I opened a ticket. The ticket is closed now.", cause_ru: "при повторном упоминании того же предмета артикль a не повторяют, меняют на the"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.i-found-a-x-the-x, type: chunk, title: "I found a ___. The ___ was empty.", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "я нашёл …, он/она/оно был(а) пустой(-ым)", frame_of: grammar.articles.second-mention, carries: [article:indefinite-first-mention, article:definite-second-mention], examples: ["I found a box in the storage room. The box was empty.", "I found a bottle on the trail. The bottle was empty."], contrast: {frame: "I found the ___ first.", note_ru: "the на первом упоминании звучит так, будто предмет уже был известен собеседнику"}, trap: {learner_form: "I found a box. A box was empty.", correction: "I found a box. The box was empty.", cause_ru: "второе упоминание того же предмета требует the, а не повтор a"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.we-hired-a-x-the-x, type: chunk, title: "We hired a ___. The ___ starts on Monday.", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "мы наняли …, он/она начинает в понедельник", frame_of: grammar.articles.second-mention, carries: [article:indefinite-first-mention, article:definite-second-mention], examples: ["We hired a contractor for the kitchen. The contractor starts on Monday.", "We hired a tutor for our son. The tutor starts on Monday."], contrast: {frame: "We hired the ___ from last time.", note_ru: "the, если это тот же самый человек, что и раньше, а не новый"}, trap: {learner_form: "We hired a contractor. A contractor starts on Monday.", correction: "We hired a contractor. The contractor starts on Monday.", cause_ru: "повторное упоминание того же человека требует the вместо a"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.i-ordered-a-x-the-x, type: chunk, title: "I ordered a ___. The ___ arrived today.", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "я заказал …, он/она/оно пришёл(шла/шло) сегодня", frame_of: grammar.articles.second-mention, carries: [article:indefinite-first-mention, article:definite-second-mention], examples: ["I ordered a monitor for the new desk. The monitor arrived today.", "I ordered a jacket for the trip. The jacket arrived today."], contrast: {frame: "I ordered the ___ again.", note_ru: "the again указывает на тот же товар, который заказывали раньше"}, trap: {learner_form: "I ordered a monitor. A monitor arrived today.", correction: "I ordered a monitor. The monitor arrived today.", cause_ru: "повтор a на втором упоминании вместо перехода на the"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.theres-a-x-the-x-kitchen, type: chunk, title: "There's a ___ in the kitchen. The ___ needs charging.", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [home, everyday-life], meaning_ru: "на кухне есть …, его/её надо зарядить", frame_of: grammar.articles.second-mention, carries: [article:indefinite-first-mention, article:definite-second-mention, structure:there-is], examples: ["There's a tablet in the kitchen. The tablet needs charging.", "There's a speaker in the kitchen. The speaker needs charging."], contrast: {frame: "The ___ is in the kitchen.", note_ru: "there's a вводит новый предмет, the уже подразумевает, что собеседник о нём знает"}, trap: {learner_form: "There's a tablet in the kitchen. A tablet needs charging.", correction: "There's a tablet in the kitchen. The tablet needs charging.", cause_ru: "после ввода предмета через there's a второе упоминание требует the"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.the-x-we-discussed, type: chunk, title: "the ___ we discussed", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "…, который мы обсуждали", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context, structure:relative-clause], examples: ["Let's go with the plan we discussed on Friday.", "I still like the restaurant we discussed last week."], contrast: {frame: "a ___ we could discuss", note_ru: "the, потому что оба собеседника уже знают, о каком предмете речь"}, trap: {learner_form: "Let's go with a plan we discussed.", correction: "Let's go with the plan we discussed.", cause_ru: "предмет уже назван и известен обеим сторонам, поэтому нужен the, а не a"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.the-x-i-mentioned, type: chunk, title: "the ___ I mentioned", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "…, о котором/которой я упоминал(а)", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context, structure:relative-clause], examples: ["Here's the article I mentioned in the meeting.", "This is the café I mentioned during our walk."], contrast: {frame: "an ___ I could mention", note_ru: "the, потому что слушатель уже знает, о каком предмете речь из прошлого разговора"}, trap: {learner_form: "Here's an article I mentioned.", correction: "Here's the article I mentioned.", cause_ru: "фраза I mentioned сигнализирует про уже известный предмет, поэтому нужен the"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.can-you-send-the-x-again, type: chunk, title: "Can you send me the ___ again?", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "можешь прислать мне … ещё раз?", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context, structure:question-do], examples: ["Can you send me the invoice again? I lost the file.", "Can you send me the recipe again? I deleted it by mistake."], contrast: {frame: "Can you send me a ___?", note_ru: "a, если просишь любой подходящий файл впервые; the — если это тот самый файл, что уже присылали"}, trap: {learner_form: "Can you send me a invoice again?", correction: "Can you send me the invoice again?", cause_ru: "again указывает на конкретный, уже известный предмет, поэтому нужен the, а не a"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.i-already-told-you-about-the-x, type: chunk, title: "I already told you about the ___.", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я уже рассказывал(а) тебе про …", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context], examples: ["I already told you about the vendor issue.", "I already told you about the neighbor's dog."], contrast: {frame: "I already told you about a ___.", note_ru: "the, потому что already указывает, что предмет уже был назван раньше"}, trap: {learner_form: "I already told you about a vendor issue.", correction: "I already told you about the vendor issue.", cause_ru: "already сигнализирует про уже известную тему, поэтому the, а не a"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.wheres-the-x-i-gave-you, type: chunk, title: "Where's the ___ I gave you?", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work, requests], meaning_ru: "где …, который я тебе дал(а)?", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context, structure:question-wh], examples: ["Where's the badge I gave you?", "So, where's the umbrella I gave you?"], contrast: {frame: "Where's a ___ I could give you?", note_ru: "the, потому что I gave you указывает на конкретный, уже известный предмет"}, trap: {learner_form: "Where's a badge I gave you?", correction: "Where's the badge I gave you?", cause_ru: "фраза I gave you требует the, так как предмет уже определён"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-second-mention.the-one-i-mentioned-earlier, type: chunk, title: "the one I mentioned earlier", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: semi_opaque, domains: [work, communication], meaning_ru: "тот самый, о котором я упоминал(а) раньше", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context], examples: ["Let's use the one I mentioned earlier, not a new template.", "I'll bring the one I mentioned earlier to the picnic."], contrast: {frame: "a new one", note_ru: "the one указывает на уже известный конкретный предмет, a new one — на другой, ещё не упомянутый"}, trap: {learner_form: "Let's use a one I mentioned earlier.", correction: "Let's use the one I mentioned earlier.", cause_ru: "one как замена существительного не берёт a после the: устойчивая связка the one"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-second-mention.the-same-one-as-before, type: chunk, title: "the same one as before", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: semi_opaque, domains: [work, everyday-life], meaning_ru: "тот же самый, что и раньше", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context], examples: ["I ordered the same one as before, just in a bigger size.", "She booked the same one as before for our anniversary dinner."], contrast: {frame: "a different one", note_ru: "the same one указывает на уже известный, ранее выбранный вариант"}, trap: {learner_form: "I ordered a same one as before.", correction: "I ordered the same one as before.", cause_ru: "same всегда идёт с the, а не с a, потому что указывает на уже известный предмет"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-second-mention.back-to-the-x, type: chunk, title: "back to the ___", cefr: A1, curriculum_priority_band: USEFUL, register: casual, transparency: semi_opaque, domains: [work, communication], meaning_ru: "возвращаясь к …", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context], slot_hint_ru: "тема, которая уже упоминалась в разговоре", examples: ["Back to the schedule question, can we push it a day?", "Back to the party plan, should we order more pizza?"], contrast: {frame: "back to a ___", note_ru: "the, потому что тема уже была поднята раньше в этом же разговоре"}, trap: {learner_form: "Back to a schedule question,", correction: "Back to the schedule question,", cause_ru: "возврат к уже названной теме требует the, а не a"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-second-mention.as-i-mentioned-the-x-is-ready, type: chunk, title: "As I mentioned, the ___ is ready.", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "как я упоминал(а), … готов(а)", frame_of: grammar.articles.second-mention, carries: [article:definite-shared-context], examples: ["As I mentioned, the build is ready.", "As I mentioned, the cake is ready."], contrast: {frame: "As I mentioned, a ___ is ready.", note_ru: "the после as I mentioned, потому что предмет уже называли раньше"}, trap: {learner_form: "As I mentioned, a build is ready.", correction: "As I mentioned, the build is ready.", cause_ru: "фраза as I mentioned требует the, так как предмет уже был назван"}, transformations: [authored], tier: 2}
