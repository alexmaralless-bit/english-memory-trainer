  - {id: chunk.articles-institutional-places.get-home, type: chunk, title: "get home", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: semi_opaque, domains: [everyday-life, home], meaning_ru: "добраться домой", frame_of: grammar.articles.institutional-places, carries: [article:institutional], examples: ["I usually get home around seven.", "We got home late after the concert."], contrast: {frame: "get to the airport", note_ru: "get home — устойчивое выражение без предлога to и без артикля; get to + обычное место требует to the"}, trap: {learner_form: "I usually get to the home around seven.", correction: "I usually get home around seven.", cause_ru: "устойчивое выражение get home не берёт предлог to и артикль the"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-institutional-places.i-need-to-stop-by-the-x, type: chunk, title: "I need to stop by the ___", cefr: A2, curriculum_priority_band: HIGH, register: casual, transparency: transparent, domains: [everyday-life, planning], meaning_ru: "мне нужно заскочить в …", frame_of: grammar.articles.institutional-places, carries: [article:definite-shared-context], slot_hint_ru: "конкретное, уже известное место (аптека, магазин, банк)", examples: ["I need to stop by the pharmacy after work.", "I need to stop by the bakery before the party."], contrast: {frame: "I need to stop by ___", note_ru: "the нужен, потому что речь о конкретном, известном месте, а не о любом подходящем"}, trap: {learner_form: "I need to stop by pharmacy after work.", correction: "I need to stop by the pharmacy after work.", cause_ru: "конкретное известное место (аптека, магазин) требует артикль the"}, transformations: [authored], tier: 2}

  # --- grammar.articles.the-unique-superlative-ordinal (A2): superlatives, ordinals, same/only/next/last, unique referents ---
  - {id: chunk.articles-the-unique-superlative-ordinal.the-first-time, type: chunk, title: "the first time", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "в первый раз", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal], examples: ["This is the first time I've used this tool.", "This is the first time we've hosted Thanksgiving."], contrast: {frame: "a first attempt", note_ru: "the first time — единственный, конкретный момент в опыте, с the; a first attempt — просто одна из нескольких попыток, не единственная"}, trap: {learner_form: "This is a first time I've used this tool.", correction: "This is the first time I've used this tool.", cause_ru: "порядковые числительные (first, second, next, last) требуют the, а не a"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-only-x, type: chunk, title: "the only ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "единственный …", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal], examples: ["She's the only tester on the team right now.", "He's the only person who remembers her birthday."], contrast: {frame: "an only child", note_ru: "only в значении «единственный из набора» идёт с the; исключение — устойчивое an only child (единственный ребёнок в семье)"}, trap: {learner_form: "She's an only tester on the team.", correction: "She's the only tester on the team.", cause_ru: "перед only нужен the, а не a/an, так как only подразумевает единственность"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-same-x, type: chunk, title: "the same ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "тот же самый …", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal], examples: ["We hit the same bug again this morning.", "We ordered the same pizza as last time."], contrast: {frame: "a similar ___", note_ru: "the same ___ указывает на уже известный, тот же самый вариант; a similar ___ — просто похожий, но другой"}, trap: {learner_form: "We hit a same bug again.", correction: "We hit the same bug again.", cause_ru: "same всегда требует the, артикль a перед ним невозможен"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-best-way-to-x, type: chunk, title: "the best way to ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "лучший способ …", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal, structure:superlative], examples: ["This is the best way to fix the leak.", "This is the best way to save on groceries."], contrast: {frame: "one of the best ways to ___", note_ru: "the best way to ___ называет единственный лучший способ; one of the best ways to ___ — один из нескольких хороших вариантов"}, trap: {learner_form: "This is a best way to fix the leak.", correction: "This is the best way to fix the leak.", cause_ru: "перед превосходной степенью (best, worst, biggest) нужен the, а не a"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-next-step, type: chunk, title: "the next step", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "следующий шаг", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal], examples: ["The next step is to notify the client.", "The next step is to book the flights."], contrast: {frame: "a further step", note_ru: "the next step — конкретный, единственный следующий шаг по порядку; a further step — просто ещё один из возможных шагов"}, trap: {learner_form: "A next step is to notify the client.", correction: "The next step is to notify the client.", cause_ru: "next по порядку требует the, а не a, потому что указывает на единственный следующий шаг"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-last-time, type: chunk, title: "the last time", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "последний раз, в прошлый раз", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal], examples: ["The last time we deployed, everything broke.", "The last time we went camping, it rained."], contrast: {frame: "a last resort", note_ru: "the last time — конкретный, единственный прошлый случай, с the; a last resort — обобщённое понятие «крайняя мера», не единственный конкретный момент"}, trap: {learner_form: "A last time we deployed, it broke.", correction: "The last time we deployed, it broke.", cause_ru: "last требует the, а не a, так как называет единственный последний случай"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-biggest-issue, type: chunk, title: "the biggest issue", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "самая большая проблема", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal, structure:superlative], examples: ["The biggest issue is the outdated database.", "The biggest issue is finding parking downtown."], contrast: {frame: "one of the biggest issues", note_ru: "the biggest issue называет единственную, самую большую проблему; one of the biggest issues — одна из нескольких крупных проблем"}, trap: {learner_form: "A biggest issue is the outdated database.", correction: "The biggest issue is the outdated database.", cause_ru: "перед превосходной степенью нужен the, а не a"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-ceo, type: chunk, title: "the CEO", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "генеральный директор", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:definite-shared-context], examples: ["The CEO announced the news this morning.", "The CEO also volunteers at the shelter."], contrast: {frame: "a CEO", note_ru: "the CEO — единственный в компании, значит the; a CEO звучит так, будто их несколько"}, trap: {learner_form: "A CEO announced the news this morning.", correction: "The CEO announced the news this morning.", cause_ru: "в компании только один CEO, поэтому нужен the, а не a"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-internet, type: chunk, title: "the internet", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology, everyday-life], meaning_ru: "интернет", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:definite-shared-context], examples: ["I found the answer on the internet.", "The internet was down for an hour last night."], contrast: {frame: "no internet", note_ru: "the internet — уникальный объект, всегда с the; в устойчивых фразах вроде no internet / high-speed internet артикль не нужен"}, trap: {learner_form: "I found the answer on internet.", correction: "I found the answer on the internet.", cause_ru: "internet как уникальный объект требует артикль the, его нельзя пропускать"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-sun, type: chunk, title: "the sun", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [everyday-life, travel], meaning_ru: "солнце", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:definite-shared-context], examples: ["The sun was already up when we left.", "The sun feels great after a long winter."], contrast: {frame: "a distant sun", note_ru: "the sun — наше конкретное солнце, единственное для землян; a distant sun используется в астрономии, когда речь о звёздах вообще"}, trap: {learner_form: "A sun was already up when we left.", correction: "The sun was already up when we left.", cause_ru: "sun как уникальный объект требует the, а не a"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-fastest-way-to-x, type: chunk, title: "the fastest way to ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, travel], meaning_ru: "самый быстрый способ …", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal, structure:superlative], examples: ["The fastest way to fix this is to restart it.", "The fastest way to the airport is the highway."], contrast: {frame: "one of the fastest ways to ___", note_ru: "the fastest way to ___ называет единственный самый быстрый способ; one of the fastest ways to ___ — один из нескольких быстрых вариантов"}, trap: {learner_form: "A fastest way to fix this is to restart it.", correction: "The fastest way to fix this is to restart it.", cause_ru: "перед превосходной степенью нужен the, а не a"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-second-option, type: chunk, title: "the second option", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "второй вариант", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal], examples: ["The second option costs less than the first.", "The second option has a bigger backyard."], contrast: {frame: "a second option", note_ru: "порядковые числительные (second, third) в контексте выбора обычно идут с the"}, trap: {learner_form: "A second option costs less than the first.", correction: "The second option costs less than the first.", cause_ru: "порядковое числительное второй по счёту из известного набора требует the"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-third-attempt, type: chunk, title: "the third attempt", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "третья попытка", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal], examples: ["The third attempt finally passed all the tests.", "The third attempt at the recipe turned out great."], contrast: {frame: "a third attempt", note_ru: "порядковое числительное third обычно идёт с the, когда попытки уже пронумерованы"}, trap: {learner_form: "A third attempt finally passed all the tests.", correction: "The third attempt finally passed all the tests.", cause_ru: "порядковое числительное third из уже известной серии требует the"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-most-important-thing, type: chunk, title: "the most important thing", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "самое важное", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:superlative-ordinal, structure:superlative], examples: ["The most important thing is to stay calm.", "The most important thing is spending time together."], contrast: {frame: "a most important thing", note_ru: "превосходная степень most important всегда идёт с the, а не с a"}, trap: {learner_form: "A most important thing is to stay calm.", correction: "The most important thing is to stay calm.", cause_ru: "перед превосходной степенью нужен the, а не a"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-whole-team, type: chunk, title: "the whole team", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "вся команда целиком", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:definite-shared-context], examples: ["The whole team worked late on Friday.", "The whole team came to the barbecue."], contrast: {frame: "a whole team", note_ru: "whole указывает на уже известную, конкретную группу целиком, поэтому нужен the"}, trap: {learner_form: "A whole team worked late on Friday.", correction: "The whole team worked late on Friday.", cause_ru: "whole требует the, потому что говорит о конкретной, уже известной группе целиком"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-the-unique-superlative-ordinal.the-weather, type: chunk, title: "the weather", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [everyday-life, travel], meaning_ru: "погода", frame_of: grammar.articles.the-unique-superlative-ordinal, carries: [article:definite-shared-context], examples: ["The weather was perfect for the hike.", "The weather ruined our picnic plans."], contrast: {frame: "a weather report", note_ru: "weather в значении «погода прямо сейчас» — уникальное явление, с the; в a weather report артикль относится к report, а не к weather"}, trap: {learner_form: "Weather was perfect for the hike.", correction: "The weather was perfect for the hike.", cause_ru: "weather как уникальное явление в конкретный момент требует the, его нельзя пропускать"}, transformations: [authored], tier: 1}

  # --- grammar.articles.generic-statements (B1): generic reference in technical writing (zero plural, a + singular, the + singular) ---
  - {id: chunk.articles-generic-statements.x-need-x, type: chunk, title: "___ need ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "… (класс, без артикля) нуждаются в …", frame_of: grammar.articles.generic-statements, carries: [article:generic], slot_hint_ru: "первый пропуск — существительное во мн.ч. без артикля (Users, Developers), второй — что им нужно", examples: ["Users need clear error messages on every screen.", "New parents need more sleep than they think."], contrast: {frame: "The ___ need ___", note_ru: "the появляется, только если речь о конкретной, уже упомянутой группе, а не о классе людей в целом"}, trap: {learner_form: "The users need clear error messages.", correction: "Users need clear error messages.", cause_ru: "обобщённое утверждение о классе людей не требует the"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-generic-statements.a-x-should-always-x, type: chunk, title: "A ___ should always ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "… (любой представитель класса) всегда должен …", frame_of: grammar.articles.generic-statements, carries: [article:generic], slot_hint_ru: "единственное число, обобщённый представитель класса", examples: ["A good manager should always give clear feedback.", "A responsible pet owner should always clean up after their dog."], contrast: {frame: "The ___ should always ___", note_ru: "the уместен для конкретного, уже упомянутого представителя, а не для класса в целом"}, trap: {learner_form: "Manager should always give clear feedback.", correction: "A manager should always give clear feedback.", cause_ru: "обобщённое единственное число требует артикль a, его нельзя пропускать"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-generic-statements.the-x-has-changed-how-we-x, type: chunk, title: "The ___ has changed how we ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [technology, academic], meaning_ru: "… (изобретение/класс объектов) изменил(о) то, как мы …", frame_of: grammar.articles.generic-statements, carries: [article:generic], slot_hint_ru: "класс изобретений или технологий в единственном числе с the", examples: ["The smartphone has changed how we take photos.", "The washing machine has changed how we do chores."], contrast: {frame: "A ___ has changed how we ___", note_ru: "the уместен, когда говоришь об изобретении как о классе в целом, а не про один экземпляр"}, trap: {learner_form: "Smartphone has changed how we take photos.", correction: "The smartphone has changed how we take photos.", cause_ru: "обобщение про класс изобретений требует the перед существительным в единственном числе"}, transformations: [authored], tier: 2}
  - {id: chunk.articles-generic-statements.developers-usually-test-locally-first, type: chunk, title: "Developers usually test locally first", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [technology, work], meaning_ru: "разработчики обычно сначала тестируют локально", frame_of: grammar.articles.generic-statements, carries: [article:generic, tense:present-simple], examples: ["Developers usually test locally first before opening a pull request.", "Developers usually test locally first, even for small fixes."], contrast: {frame: "The developers usually test locally first", note_ru: "the developers — про конкретную, уже известную команду; developers без артикля — про разработчиков вообще"}, trap: {learner_form: "The developers usually test locally first.", correction: "Developers usually test locally first.", cause_ru: "обобщённое утверждение про разработчиков вообще не требует the"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-generic-statements.managers-often-approve-requests-quickly, type: chunk, title: "Managers often approve requests quickly", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "менеджеры часто быстро одобряют запросы", frame_of: grammar.articles.generic-statements, carries: [article:generic, tense:present-simple], examples: ["Managers often approve requests quickly during busy weeks.", "Managers often approve requests quickly right before the holidays."], contrast: {frame: "The managers often approve requests quickly", note_ru: "the managers — про конкретную группу; managers без артикля — обобщение про менеджеров вообще"}, trap: {learner_form: "The managers often approve requests quickly.", correction: "Managers often approve requests quickly.", cause_ru: "обобщённое утверждение про менеджеров вообще не требует the"}, transformations: [authored], tier: 1}
  - {id: chunk.articles-generic-statements.a-good-leader-listens-first, type: chunk, title: "A good leader listens first", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "хороший руководитель сначала слушает", frame_of: grammar.articles.generic-statements, carries: [article:generic, tense:present-simple], examples: ["A good leader listens first before making a decision.", "A good leader listens first, even during a family argument."], contrast: {frame: "Good leader listens first", note_ru: "перед обобщённым единственным числом нужен артикль a, его нельзя пропускать"}, trap: {learner_form: "Good leader listens first before deciding.", correction: "A good leader listens first before deciding.", cause_ru: "обобщённое единственное число (a good leader) требует артикль a"}, transformations: [authored], tier: 1}
