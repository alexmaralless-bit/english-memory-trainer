# Frames for grammar.passive.basic-process (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.passive-basic-process.file-is-stored, type: chunk, title: "The file is stored in the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "файл хранится в …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "место (shared folder, archive, database)", examples: ["The file is stored in the shared folder with the other reports.", "The file is stored in the archive when it is no longer needed."], contrast: {frame: "The file stores in the ___", note_ru: "is stored (passive) — действие выполняется над файлом, а не файл что-то делает"}, trap: {learner_form: "The file stored in the shared folder.", correction: "The file is stored in the shared folder.", cause_ru: "нужен is перед stored (третья форма)"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.request-is-checked, type: chunk, title: "The request is checked before ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "запрос проверяется перед …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "событие (approval, processing, deployment)", examples: ["The request is checked before approval by the team.", "The request is checked before it goes to production."], contrast: {frame: "The request checks before", note_ru: "is checked (passive) — кто-то проверяет запрос, не запрос что-то делает"}, trap: {learner_form: "The request checked before approval.", correction: "The request is checked before approval.", cause_ru: "нужен is перед checked"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.data-is-processed, type: chunk, title: "The data is processed by the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "данные обрабатываются …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "исполнитель (system, worker, script)", examples: ["The data is processed by the export script every night.", "The data is processed by the system in batches."], contrast: {frame: "The system processes the data", note_ru: "active: система обрабатывает; passive: данные обрабатываются системой"}, trap: {learner_form: "The data processed by the system.", correction: "The data is processed by the system.", cause_ru: "нужен is перед третьей формой (processed)"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.updates-are-applied, type: chunk, title: "Updates are applied to the ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "обновления применяются к …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "система или целевой объект (system, database, configuration)", examples: ["Updates are applied to the system every Tuesday morning.", "Updates are applied to the configuration files automatically."], contrast: {frame: "We apply updates to", note_ru: "active: мы применяем; passive: обновления применяются (процесс важнее, чем то, кто)"}, trap: {learner_form: "Updates apply to the system.", correction: "Updates are applied to the system.", cause_ru: "нужен are перед applied"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.error-is-logged, type: chunk, title: "The error is logged in the ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ошибка записывается в …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "место (log file, database, alert system)", examples: ["The error is logged in the system every time it occurs.", "The error is logged in the event tracker with a timestamp."], contrast: {frame: "We log the error in", note_ru: "active: мы записываем; passive: ошибка записывается (сам процесс логирования важнее)"}, trap: {learner_form: "The error logged in the file.", correction: "The error is logged in the file.", cause_ru: "нужен is перед logged"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.code-is-reviewed, type: chunk, title: "The code is reviewed by ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "код проверяется …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "кто (at least two reviewers, the lead)", examples: ["The code is reviewed by at least two team members before merge.", "The code is reviewed by the lead before it goes to staging."], contrast: {frame: "Two reviewers review the code", note_ru: "active: рецензенты рецензируют; passive: код рецензируется (процесс важнее)"}, trap: {learner_form: "The code reviewed by two people.", correction: "The code is reviewed by two people.", cause_ru: "нужен is перед reviewed"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.backup-is-created, type: chunk, title: "The backup is created ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "резервная копия создаётся …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "когда или где (daily, before each deploy, in the cloud)", examples: ["The backup is created daily at midnight to prevent data loss.", "The backup is created before every major update."], contrast: {frame: "We create the backup", note_ru: "active: мы создаём; passive: резервная копия создаётся (процесс важнее)"}, trap: {learner_form: "The backup created every day.", correction: "The backup is created every day.", cause_ru: "нужен is перед created"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.notification-is-sent, type: chunk, title: "A notification is sent to ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "уведомление отправляется …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "кому (the team, all users, the admin)", examples: ["A notification is sent to the team when the process finishes.", "A notification is sent to users if their action failed."], contrast: {frame: "The system sends a notification", note_ru: "active: система отправляет; passive: уведомление отправляется (сам процесс рассылки главное)"}, trap: {learner_form: "A notification sent when the job completes.", correction: "A notification is sent when the job completes.", cause_ru: "нужен is перед sent"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.ticket-is-assigned, type: chunk, title: "The ticket is assigned to ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "задача назначена …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "кому (the support team, the lead, a developer)", examples: ["The ticket is assigned to the support team immediately.", "The ticket is assigned to the developer by the project lead."], contrast: {frame: "The lead assigns the ticket", note_ru: "active: руководитель назначает; passive: задача назначена (процесс назначения важнее)"}, trap: {learner_form: "The ticket assigned to the team.", correction: "The ticket is assigned to the team.", cause_ru: "нужен is перед assigned"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.configuration-is-updated, type: chunk, title: "The configuration is updated ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "конфигурация обновляется …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "когда (after each release, weekly, manually)", examples: ["The configuration is updated after each release to apply new settings.", "The configuration is updated manually by the administrator."], contrast: {frame: "The admin updates the configuration", note_ru: "active: админ обновляет; passive: конфигурация обновляется (сам процесс обновления главное)"}, trap: {learner_form: "The configuration updated every week.", correction: "The configuration is updated every week.", cause_ru: "нужен is перед updated"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.tests-are-run, type: chunk, title: "The tests are run before ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "тесты запускаются перед …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "событие (deployment, merge, release)", examples: ["The tests are run before every deployment to catch bugs early.", "The tests are run before the code is merged to main."], contrast: {frame: "We run the tests before", note_ru: "active: мы запускаем; passive: тесты запускаются (сам процесс запуска важнее)"}, trap: {learner_form: "The tests run before deployment.", correction: "The tests are run before deployment.", cause_ru: "нужен are перед run"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.issue-is-resolved, type: chunk, title: "The issue is resolved by ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "проблема решается …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "кто (restarting the service, applying the patch, rolling back)", examples: ["The issue is resolved by restarting the service once a week.", "The issue is resolved by the patch that was released last Monday."], contrast: {frame: "We resolve the issue", note_ru: "active: мы решаем; passive: проблема решается (результат и процесс главное, не кто)"}, trap: {learner_form: "The issue resolved by the patch.", correction: "The issue is resolved by the patch.", cause_ru: "нужен is перед resolved"}, transformations: [authored]}
  - {id: chunk.passive-basic-process.access-is-granted, type: chunk, title: "Access is granted to ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "доступ предоставляется …", frame_of: grammar.passive.basic-process, carries: [tense:passive], slot_hint_ru: "кому (team members, external users, contractors)", examples: ["Access is granted to team members who complete the security training.", "Access is granted to the vendor after the contract is signed."], contrast: {frame: "We grant access to", note_ru: "active: мы даём доступ; passive: доступ даётся (процесс предоставления важнее, чем кто дает)"}, trap: {learner_form: "Access granted when the form is submitted.", correction: "Access is granted when the form is submitted.", cause_ru: "нужен is перед granted"}, transformations: [authored]}
