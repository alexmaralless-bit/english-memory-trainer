# Work frames (type: chunk) for A1-A2, grouped by curriculum module (P.4a-bis).
#
# A work frame is a ready multi-word opening that the learner drops into a real
# message and completes with their own content. Grammar patterns that already
# have their own Topic (there is/are, have finished, better than, if ... then,
# must have) are NOT chunks and were removed in P.4a-bis: carrying them twice
# would create two independent scoring targets for one skill.
#
# Module grouping in the comments is authoring guidance. The authoritative
# item -> Topic mapping is Topic.lexicon (P.2); _suggested-topic-links.yaml
# stays advisory.
lexical_items:

