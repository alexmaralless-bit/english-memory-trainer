# Frames for grammar.frequency-adverbs (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.frequency-adverbs.always, type: chunk, title: "I always ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я всегда …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "глагол (проверяю, читаю)", examples: ["I always check the code twice.", "I always start with the urgent tickets."], contrast: {frame: "I always am ___", note_ru: "с be = put after, not before (I am always careful)"}, trap: {learner_form: "I always am late.", correction: "I am always late.", cause_ru: "с be-глаголом always идет ПОСЛЕ be"}, transformations: [authored]}
  - {id: chunk.frequency-adverbs.usually, type: chunk, title: "He usually ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он обычно …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "глагол", examples: ["He usually finishes by five.", "She usually reviews the changes first."], contrast: {frame: "Usually he ___", note_ru: "adverb в начале = emphasize, in middle = natural"}, trap: {learner_form: "Usually I am working.", correction: "I usually work.", cause_ru: "usually = перед простым глаголом, не перед continuous"}, transformations: [authored]}
  - {id: chunk.frequency-adverbs.often, type: chunk, title: "We often ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы часто …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "глагол (встречаемся, работаем)", examples: ["We often meet to discuss updates.", "We often find issues during testing."], trap: {learner_form: "We often are discussing.", correction: "We often discuss.", cause_ru: "often = перед действием, не перед continuous"}, transformations: [authored]}
  - {id: chunk.frequency-adverbs.sometimes, type: chunk, title: "I sometimes ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я иногда …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "глагол (забываю, опаздываю)", examples: ["I sometimes forget to update tickets.", "I sometimes work late on projects."], contrast: {frame: "Sometimes I ___", note_ru: "в середине предложения — стандартно, в начале — для акцента"}, trap: {learner_form: "Sometimes I am working late.", correction: "I sometimes work late.", cause_ru: "sometimes = перед простым глаголом"}, transformations: [authored]}
  - {id: chunk.frequency-adverbs.rarely, type: chunk, title: "He rarely ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "он редко …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "глагол (ошибается, опаздывает)", examples: ["He rarely makes mistakes in code.", "She rarely takes a break during rush."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.never, type: chunk, title: "I never ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я никогда не …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb, structure:negative], slot_hint_ru: "глагол (пропускаю, забываю)", examples: ["I never miss the stand-up meeting.", "I never skip the test step."], contrast: {frame: "I never go home before ___", note_ru: "never = перед глаголом, не нужен не дополнительный"}, trap: {learner_form: "I never not work on weekends.", correction: "I never work on weekends.", cause_ru: "never уже отрицание, extra not не нужна"}, transformations: [authored]}
  - {id: chunk.frequency-adverbs.always-is, type: chunk, title: "This is always ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это всегда …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "прилагательное", examples: ["This is always the first step.", "The meeting is always on time."], contrast: {frame: "I always do ___", note_ru: "с be после, с глаголом перед"}, trap: {learner_form: "Always this is important.", correction: "This is always important.", cause_ru: "always = перед глаголом или после be, не в начале предложения"}, transformations: [authored]}
  - {id: chunk.frequency-adverbs.usually-happens, type: chunk, title: "That usually happens ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это обычно происходит …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "когда", examples: ["That usually happens on Mondays.", "That usually happens after the review."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.often-forget, type: chunk, title: "People often forget to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "люди часто забывают …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "инфинитив", examples: ["People often forget to update the ticket.", "They often forget to test in staging."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.rarely-see, type: chunk, title: "We rarely see ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы редко видим …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "что", examples: ["We rarely see that error now.", "They rarely see bugs after our review."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.never-ask, type: chunk, title: "I never ask about ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я никогда не спрашиваю о …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb, structure:negative], slot_hint_ru: "тема", examples: ["I never ask about salary.", "I never ask for help with that."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.always-do-first, type: chunk, title: "I always do ___ first", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я всегда делаю … в первую очередь", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "действие", examples: ["I always do the tests first.", "She always does the backup first."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.usually-takes, type: chunk, title: "It usually takes ___ to ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "обычно требуется … на …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "время и действие", examples: ["It usually takes an hour to run all tests.", "It usually takes two days to review."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.often-the-issue, type: chunk, title: "Often the issue is ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "часто проблема в том, что …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "что", examples: ["Often the issue is a missing import.", "Often the problem is a config file."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.sometimes-the-best, type: chunk, title: "Sometimes the best approach is to ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "иногда лучший подход — это …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "инфинитив", examples: ["Sometimes the best approach is to wait.", "Sometimes the best thing is to ask."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.rarely-get-it, type: chunk, title: "We rarely get it right the first time", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы редко делаем это правильно с первой попытки", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], examples: ["We rarely get it right the first time.", "She rarely gets it right without feedback."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.never-work-alone, type: chunk, title: "I never work alone on ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я никогда не работаю один над …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb, structure:negative], slot_hint_ru: "объект (проекты, критические изменения)", examples: ["I never work alone on critical changes.", "They never work alone on a deployment."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.always-involve, type: chunk, title: "We always involve ___ in ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "мы всегда привлекаем … к …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "кого и что", examples: ["We always involve the client in reviews.", "They always involve QA in testing."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.usually-get, type: chunk, title: "We usually get ___ done by ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы обычно завершаем … к …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "действие и время", examples: ["We usually get the tests done by noon.", "We usually get reviews done by Friday."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.often-discover, type: chunk, title: "We often discover ___ when ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы часто обнаруживаем … когда …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "что и когда", examples: ["We often discover bugs when we deploy.", "We often discover issues during testing."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.rarely-change, type: chunk, title: "We rarely change ___ once ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы редко меняем … как только …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "объект и условие", examples: ["We rarely change the plan once it starts.", "We rarely change the date once we commit."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.never-deploy-friday, type: chunk, title: "We never deploy on Friday", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы никогда не развертываем в пятницу", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb, structure:negative], examples: ["We never deploy on Friday afternoon.", "They never deploy changes on Friday."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.sometimes-need-help, type: chunk, title: "I sometimes need help with ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "мне иногда нужна помощь с …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "что", examples: ["I sometimes need help with the data exports.", "He sometimes needs help with the configuration."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.always-on-time, type: chunk, title: "The meeting is always on time", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "встреча всегда вовремя", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], examples: ["Fortunately, the meeting is always on time.", "Everyone agrees the meeting is always on time."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.often-late, type: chunk, title: "Deployments are often late", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "развертывания часто опаздывают", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], examples: ["Unfortunately, deployments are often late this quarter.", "Historically, deployments are often late during the holidays."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.usually-ready, type: chunk, title: "I'm usually ready by ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я обычно готов к …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "время", examples: ["I'm usually ready by nine.", "She's usually ready by lunch."], transformations: [authored]}
  - {id: chunk.frequency-adverbs.rarely-disagree, type: chunk, title: "We rarely disagree on ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы редко не согласны относительно …", frame_of: grammar.frequency-adverbs, carries: [structure:frequency-adverb], slot_hint_ru: "что", examples: ["We rarely disagree on the approach.", "They rarely disagree on priorities."], transformations: [authored]}
