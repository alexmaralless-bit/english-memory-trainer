  - {id: chunk.prepositions-time.at-start-of-week, type: chunk, title: "at the start of the week", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в начале недели", frame_of: grammar.prepositions.time, carries: [structure:preposition-time, article:fixed-expression], examples: ["The planning meeting happens at the start of the week.", "We'll discuss the roadmap at the start of the week."], contrast: {frame: "at the beginning of the week", note_ru: "start и beginning близки по значению, оба варианта естественны"}, trap: {learner_form: "in the start of the week", correction: "at the start of the week", cause_ru: "at — используется для точных моментов времени, the перед start нельзя пропускать"}, transformations: [authored]}
  - {id: chunk.prepositions-time.on-time, type: chunk, title: "on time", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "вовремя, пунктуально", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["Please arrive at the meeting on time tomorrow morning.", "The deployment went on time without any delays."], contrast: {frame: "in time", note_ru: "on time — точно по расписанию; in time — успеть до какого-то срока"}, trap: {learner_form: "at time", correction: "on time", cause_ru: "устойчивое выражение on time не берёт другой предлог"}, transformations: [authored]}
  - {id: chunk.prepositions-time.on-weekend, type: chunk, title: "on the weekend", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "на выходные", frame_of: grammar.prepositions.time, carries: [structure:preposition-time, article:definite-shared-context], examples: ["The backup runs on the weekend every Saturday morning.", "We'll do maintenance work on the weekend."], contrast: {frame: "at the weekend", note_ru: "on the weekend — американский вариант; at the weekend — британский"}, trap: {learner_form: "in the weekend", correction: "on the weekend", cause_ru: "on — используется с днями недели и выходными в американском варианте"}, transformations: [authored]}
