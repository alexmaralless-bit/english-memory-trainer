  - {id: chunk.prepositions-time.on-monday, type: chunk, title: "on Monday", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "в понедельник", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["The planning review is on Monday morning at 10.", "We meet on Monday to discuss the weekly roadmap."], contrast: {frame: "on Mondays", note_ru: "on Monday — конкретный понедельник; on Mondays — по понедельникам, регулярно"}, trap: {learner_form: "in Monday", correction: "on Monday", cause_ru: "on — для дней недели; in — для месяцев и годов"}, transformations: [authored]}
  - {id: chunk.prepositions-time.on-date, type: chunk, title: "on the ___th", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "на (дата)", frame_of: grammar.prepositions.time, carries: [structure:preposition-time, article:definite-shared-context], slot_hint_ru: "порядковое числительное (15th, 21st)", examples: ["The project deadline is on the 15th of this month.", "We'll launch the update on the 20th in the morning."], contrast: {frame: "on 15", note_ru: "on the 15th — с the; on 15 без the звучит неестественно в этом контексте"}, trap: {learner_form: "in the 15th", correction: "on the 15th", cause_ru: "on — перед датами; in — перед месяцами"}, transformations: [authored]}
  - {id: chunk.prepositions-time.in-morning, type: chunk, title: "in the morning", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "с утра", frame_of: grammar.prepositions.time, carries: [structure:preposition-time, article:fixed-expression], examples: ["The standup meeting is in the morning at 9 AM.", "I'll call you in the morning to confirm the details."], contrast: {frame: "at 9 AM", note_ru: "in the morning называет часть дня; at + точное время (at 9 AM) называет конкретный момент"}, trap: {learner_form: "at the morning", correction: "in the morning", cause_ru: "in — используется с частями дня (morning, afternoon, evening)"}, transformations: [authored]}
  - {id: chunk.prepositions-time.in-afternoon, type: chunk, title: "in the afternoon", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "во второй половине дня", frame_of: grammar.prepositions.time, carries: [structure:preposition-time, article:fixed-expression], examples: ["The team meeting is scheduled in the afternoon tomorrow.", "We'll review the results in the afternoon with everyone."], contrast: {frame: "in the evening", note_ru: "afternoon — примерно до 18:00; evening — после 18:00"}, trap: {learner_form: "at the afternoon", correction: "in the afternoon", cause_ru: "in — используется с частями дня (morning, afternoon, evening)"}, transformations: [authored]}
  - {id: chunk.prepositions-time.in-evening, type: chunk, title: "in the evening", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "вечером", frame_of: grammar.prepositions.time, carries: [structure:preposition-time, article:fixed-expression], examples: ["The team dinner is planned in the evening after work.", "Let's talk about this in the evening when I'm free."], contrast: {frame: "at night", note_ru: "evening — примерно 18:00-22:00; night — после 22:00 (и at, а не in)"}, trap: {learner_form: "at the evening", correction: "in the evening", cause_ru: "in — используется с частями дня (morning, afternoon, evening)"}, transformations: [authored]}
  - {id: chunk.prepositions-time.in-january, type: chunk, title: "in January", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в январе", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["The budget planning happens in January every year.", "We'll meet in January to review annual goals."], contrast: {frame: "on Monday", note_ru: "in — для месяцев; on — для дней недели"}, trap: {learner_form: "on January", correction: "in January", cause_ru: "in — для месяцев; on — для дней недели"}, transformations: [authored]}
  - {id: chunk.prepositions-time.in-spring, type: chunk, title: "in spring", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "весной", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["We'll launch the new feature in spring of this year.", "The conference will take place in spring next year."], contrast: {frame: "in the fall", note_ru: "in — для времён года; сезон всегда с in, не on"}, trap: {learner_form: "on spring", correction: "in spring", cause_ru: "in — используется для протяжённых периодов времени (месяцы, сезоны, годы)"}, transformations: [authored]}
  - {id: chunk.prepositions-time.in-2025, type: chunk, title: "in 2025", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в 2025 году", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["The pilot program will run in 2025 for one year.", "We plan to launch the new system in 2025."], contrast: {frame: "in January", note_ru: "in — для годов, месяцев и сезонов; on — для дней"}, trap: {learner_form: "on 2025", correction: "in 2025", cause_ru: "in — используется для годов, месяцев и сезонов"}, transformations: [authored]}
