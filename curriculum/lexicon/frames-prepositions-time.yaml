  - {id: chunk.prepositions-time.on-friday-morning, type: chunk, title: "on Friday morning", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "в пятницу утром", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["The demo is scheduled on Friday morning at 10 AM.", "Let's meet on Friday morning to review the code."], contrast: {frame: "on Friday afternoon", note_ru: "on Friday morning — без the перед названием дня"}, trap: {learner_form: "at Friday morning", correction: "on Friday morning", cause_ru: "on — для дней недели; at — для точного времени"}, transformations: [authored]}
