# Frames for grammar.prepositions.time (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.prepositions-time.at-oclock, type: chunk, title: "at ___ o'clock", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "в (время) часов", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], slot_hint_ru: "час (9, 10, 2)", examples: ["The standup is at 9 o'clock every morning.", "The call starts at 10 o'clock sharp tomorrow."], contrast: {frame: "at 9", note_ru: "at ___ o'clock и at 9 — оба варианта верны, o'clock просто уточняет, что время ровно круглое"}, trap: {learner_form: "on 9 o'clock", correction: "at 9 o'clock", cause_ru: "on — для дней недели; at — для точного времени"}, transformations: [authored]}
  - {id: chunk.prepositions-time.at-noon, type: chunk, title: "at noon", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "в полдень", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["Let's meet at noon for a quick sync meeting.", "The backup process runs at noon every day."], contrast: {frame: "at 12 o'clock", note_ru: "at noon звучит естественнее в речи; at 12 o'clock точнее называет час"}, trap: {learner_form: "in noon", correction: "at noon", cause_ru: "at + точное время (noon, midnight); in + часть дня (morning, evening)"}, transformations: [authored]}
