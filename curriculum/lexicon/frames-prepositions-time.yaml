  - {id: chunk.prepositions-time.on-tuesday, type: chunk, title: "on Tuesday", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "во вторник", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["The standup is on Tuesday at 10 AM every week.", "We review the metrics on Tuesday afternoon always."], contrast: {frame: "on Tuesdays", note_ru: "on Tuesday — конкретный вторник; on Tuesdays — по вторникам, регулярно"}, trap: {learner_form: "in Tuesday", correction: "on Tuesday", cause_ru: "on — для дней недели; in — для месяцев и годов"}, transformations: [authored]}
  - {id: chunk.prepositions-time.at-lunchtime, type: chunk, title: "at lunchtime", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, meetings], meaning_ru: "во время обеда", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], examples: ["Let's sync at lunchtime to discuss the updates.", "I'll call you at lunchtime when I'm free."], contrast: {frame: "at lunch", note_ru: "at lunchtime уточняет именно время обеда; at lunch тоже верно и употребляется не реже"}, trap: {learner_form: "in lunchtime", correction: "at lunchtime", cause_ru: "at — используется для конкретного момента времени, как lunchtime"}, transformations: [authored]}
  - {id: chunk.prepositions-time.in-minutes, type: chunk, title: "in ___ minutes", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "через (число) минут", frame_of: grammar.prepositions.time, carries: [structure:preposition-time], slot_hint_ru: "число минут (5, 10, 15)", examples: ["The meeting starts in 5 minutes so please hurry up.", "I'll be ready in 10 minutes for the presentation."], contrast: {frame: "after ___ minutes", note_ru: "in ___ minutes отсчитывает от текущего момента; after ___ minutes отсчитывает от другого, ранее упомянутого момента"}, trap: {learner_form: "after 5 minutes", correction: "in 5 minutes", cause_ru: "in — стандартный предлог для будущего момента через указанный промежуток"}, transformations: [authored]}
