# Frames for grammar.future-forms.planning (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.future-forms-planning.im-going-to-review, type: chunk, title: "I'm going to review the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "я собираюсь проверить ...", frame_of: grammar.future-forms.planning, carries: [tense:future-going-to], slot_hint_ru: "существительное (план, документ, отчет)", examples: ["I'm going to review the plan tomorrow morning.", "I'm going to review the test results after lunch."], contrast: {frame: "I will review the plan.", note_ru: "will — решение принято в момент говорения, going to — уже запланировано"}, trap: {learner_form: "I going to review the plan.", correction: "I'm going to review the plan.", cause_ru: "нужна форма be (am/is/are) перед going"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.we-are-going-to-test, type: chunk, title: "We are going to test the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы собираемся протестировать ...", frame_of: grammar.future-forms.planning, carries: [tense:future-going-to], slot_hint_ru: "объект (фича, форма, интеграция)", examples: ["We are going to test the new feature on Friday.", "We are going to test the integration next week."], contrast: {frame: "We will test the feature.", note_ru: "will — решение в момент, going to — уже заранее запланировано"}, trap: {learner_form: "We going to test the new system.", correction: "We are going to test the new system.", cause_ru: "обязателен глагол be перед going to"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.im-going-to-send, type: chunk, title: "I'm going to send the ___ today", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "я собираюсь отправить ... сегодня", frame_of: grammar.future-forms.planning, carries: [tense:future-going-to], slot_hint_ru: "объект (отчет, письмо, файл)", examples: ["I'm going to send the report today.", "I'm going to send the feedback form today."], contrast: {frame: "I will send it now.", note_ru: "will для непосредственного решения, going to для запланированного"}, trap: {learner_form: "I'm going send the attachment.", correction: "I'm going to send the attachment.", cause_ru: "нужно 'to' перед инфинитивом в going to"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.ill-handle-this-now, type: chunk, title: "I'll handle this now", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work], meaning_ru: "я разберусь с этим прямо сейчас", frame_of: grammar.future-forms.planning, carries: [tense:future-will], examples: ["I'll handle this now and send you the results.", "I'll look into it right away."], contrast: {frame: "I'm going to handle this.", note_ru: "will — спонтанное решение, going to — план, принятый ранее"}, trap: {learner_form: "I will to handle this.", correction: "I'll handle this.", cause_ru: "после will идет инфинитив без 'to'"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.ill-answer-the-client, type: chunk, title: "I'll answer the client ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я ответу клиенту ...", frame_of: grammar.future-forms.planning, carries: [tense:future-will], slot_hint_ru: "время (now, in an hour, today)", examples: ["I'll answer the client now.", "I'll answer the client in the next hour."], contrast: {frame: "I'm going to answer the client.", note_ru: "will — решение в момент говорения, going to — предыдущий план"}, trap: {learner_form: "I answer the client now.", correction: "I'll answer the client now.", cause_ru: "future требует will или be going to, не present simple"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.well-release-by-friday, type: chunk, title: "We'll release by ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы выпустим (версию) к ...", frame_of: grammar.future-forms.planning, carries: [tense:future-will], slot_hint_ru: "день или дата (Friday, end of week)", examples: ["We'll release by Friday if testing goes well.", "We'll release the next version by the end of the week."], contrast: {frame: "We are going to release by Friday.", note_ru: "will — решение/обещание, going to — запланированное действие"}, trap: {learner_form: "We will release on Friday.", correction: "We'll release by Friday.", cause_ru: "'by' обозначает deadline, 'on' обозначает день недели"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.are-you-planning-to, type: chunk, title: "Are you planning to ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "ты планируешь ...?", frame_of: grammar.future-forms.planning, carries: [tense:future-going-to], slot_hint_ru: "инфинитив глагола (review, test, deploy)", examples: ["Are you planning to review the changes?", "Are you planning to attend the meeting?"], contrast: {frame: "Will you review the changes?", note_ru: "going to в вопросе о плане, will для предложения или просьбы"}, trap: {learner_form: "Are you plan to review?", correction: "Are you planning to review?", cause_ru: "'planning to' — фраза для выражения плана"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.theyre-aiming-to-launch, type: chunk, title: "They're aiming to launch ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "они стремятся запустить ...", frame_of: grammar.future-forms.planning, carries: [tense:future-going-to], slot_hint_ru: "объект (feature, product, version)", examples: ["They're aiming to launch in Q3.", "They're aiming to launch the new version next month."], contrast: {frame: "They will launch.", note_ru: "aiming to — выражение намерения, will — факт будущего"}, trap: {learner_form: "They aiming to launch.", correction: "They're aiming to launch.", cause_ru: "'are aiming' — глагол be + глагол в -ing форме"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.when-will-you-finish, type: chunk, title: "When will you finish?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "когда ты закончишь?", frame_of: grammar.future-forms.planning, carries: [tense:future-will, structure:question-do], examples: ["When will you finish? I need an estimate.", "When will you be back from lunch?"], contrast: {frame: "When are you going to finish?", note_ru: "will в вопросе о сроке, going to для вопроса о плане"}, trap: {learner_form: "When you will finish?", correction: "When will you finish?", cause_ru: "в вопросе с будущим временем will идет сразу после вопросного слова"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.well-need-to-extend-the-timeline, type: chunk, title: "We'll need to extend the timeline", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "нам нужно будет продлить сроки", frame_of: grammar.future-forms.planning, carries: [tense:future-will], examples: ["We'll need to extend the timeline.", "We'll need to adjust the plan."], contrast: {frame: "We are going to extend.", note_ru: "will — необходимость/вероятность в будущем, going to — план"}, trap: {learner_form: "We need to extend the timeline.", correction: "We'll need to extend the timeline.", cause_ru: "'will need' выражает будущую необходимость, не настоящую"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.if-it-fails-we-will-call, type: chunk, title: "If it fails, we will call the ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "если это не сработает, мы позовем ...", frame_of: grammar.future-forms.planning, carries: [tense:future-will, tense:conditional-1], slot_hint_ru: "существительное (vendor, support)", examples: ["If it fails, we will call the vendor.", "If it happens, we will escalate."], contrast: {frame: "If it fails, we're calling the vendor.", note_ru: "present continuous for immediate future в условном предложении"}, trap: {learner_form: "If it fails, we will call the vendor will help.", correction: "If it fails, we will call the vendor.", cause_ru: "в условном предложении только одна future форма в main clause"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.we-might-need-more-resources, type: chunk, title: "We might need more ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "нам может потребоваться больше ...", frame_of: grammar.future-forms.planning, carries: [structure:modal], slot_hint_ru: "существительное (resources, time, people)", examples: ["We might need more resources.", "We might need more time for testing."], contrast: {frame: "We will need more resources.", note_ru: "might выражает возможность, will выражает определенность"}, trap: {learner_form: "We might will need.", correction: "We might need.", cause_ru: "после модального глагола 'might' идет инфинитив без 'will'"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.the-meeting-is-tomorrow, type: chunk, title: "The meeting is tomorrow", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "встреча (запланирована) завтра", frame_of: grammar.future-forms.planning, carries: [tense:present-simple], examples: ["The meeting is tomorrow at ten.", "The meeting is tomorrow, not today."], contrast: {frame: "The meeting will be tomorrow.", note_ru: "present simple/continuous для заранее запланированного события (как билет на самолет)"}, trap: {learner_form: "The meeting is happening tomorrow.", correction: "The meeting is tomorrow.", cause_ru: "'is' достаточно для запланированного события, 'happening' избыточно"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.were-meeting-on-friday, type: chunk, title: "We're meeting on Friday", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы встречаемся в пятницу", frame_of: grammar.future-forms.planning, carries: [tense:present-continuous], examples: ["We're meeting on Friday at 3 PM.", "We're deploying on Thursday evening."], contrast: {frame: "We will meet on Friday.", note_ru: "present continuous для заранее организованной встречи, will для последующего решения"}, trap: {learner_form: "We meeting on Friday.", correction: "We're meeting on Friday.", cause_ru: "present continuous требует be (are) + verb-ing"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.ill-call-you-back, type: chunk, title: "I'll call you back ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я тебе перезвоню ...", frame_of: grammar.future-forms.planning, carries: [tense:future-will], slot_hint_ru: "время (soon, in five minutes, later)", examples: ["I'll call you back soon.", "I'll call you back in five minutes."], contrast: {frame: "I'm calling you back now.", note_ru: "will для будущего обещания, present continuous для немедленного действия"}, trap: {learner_form: "I call you back later.", correction: "I'll call you back later.", cause_ru: "простое настоящее время не используется для будущего без контекста расписания"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.hes-probably-going-to-refuse, type: chunk, title: "He's probably going to refuse", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work], meaning_ru: "он, вероятно, откажется", frame_of: grammar.future-forms.planning, carries: [tense:future-going-to], examples: ["He's probably going to refuse.", "They're likely going to delay the release."], contrast: {frame: "He will probably refuse.", note_ru: "оба варианта верны; 'is going to' — чуть более личное предположение, 'will' — чуть более объективное"}, trap: {learner_form: "He probably is going to refuse.", correction: "He's probably going to refuse.", cause_ru: "наречие модальности обычно идет перед основным глаголом"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.ill-sort-it-out, type: chunk, title: "I'll sort it out", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work], meaning_ru: "я разберусь с этим", frame_of: grammar.future-forms.planning, carries: [tense:future-will], examples: ["I'll sort it out and get back to you.", "I'll figure it out by then."], contrast: {frame: "I'm going to sort it out.", note_ru: "will для спонтанного обещания, going to для запланированного действия"}, trap: {learner_form: "I sort it out.", correction: "I'll sort it out.", cause_ru: "present simple не выражает будущее без специального контекста (timetable, schedule)"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.well-get-it-done-by-friday, type: chunk, title: "We'll get it done by Friday", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы сделаем это к пятнице", frame_of: grammar.future-forms.planning, carries: [tense:future-will], examples: ["We'll get it done by Friday.", "We'll finish the testing by next Wednesday."], contrast: {frame: "We are going to get it done.", note_ru: "will для обещания результата в deadline, going to для плана"}, trap: {learner_form: "We will to get it done.", correction: "We'll get it done by Friday.", cause_ru: "get + past participle (done) — это фразовая конструкция"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.when-does-the-feature-launch, type: chunk, title: "When does the feature launch?", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "когда выходит фича?", frame_of: grammar.future-forms.planning, carries: [tense:present-simple], examples: ["When does the feature launch?", "When does the feature launch exactly?"], contrast: {frame: "When will the feature launch?", note_ru: "present simple для расписания/графика, will для непредсказуемого будущего"}, trap: {learner_form: "When will the feature launches?", correction: "When will the feature launch?", cause_ru: "после will используется инфинитив (launch без -s)"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.maybe-ill-skip-this-meeting, type: chunk, title: "Maybe I'll skip this meeting", cefr: A2, curriculum_priority_band: USEFUL, register: casual, transparency: transparent, domains: [work], meaning_ru: "может быть, я пропущу эту встречу", frame_of: grammar.future-forms.planning, carries: [tense:future-will], examples: ["Maybe I'll skip this meeting.", "Maybe I'll take a break after this."], contrast: {frame: "I might skip this meeting.", note_ru: "both correct; 'maybe I will' для быстрого решения, 'might' для возможности"}, trap: {learner_form: "Maybe I skip this meeting.", correction: "Maybe I'll skip this meeting.", cause_ru: "наречие 'maybe' не меняет структуру future tense"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.thats-the-plan-for-now, type: chunk, title: "That's the plan for now", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "вот план на данный момент", frame_of: grammar.future-forms.planning, carries: [tense:present-simple], examples: ["That's the plan for now and we'll adjust if needed.", "That's our aim for this sprint."], contrast: {frame: "That's what we will do.", note_ru: "'the plan' прямо выражает intention, will более общее"}, trap: {learner_form: "This is plan for now.", correction: "That's the plan for now.", cause_ru: "'that's' = 'that is', нужен артикль 'the' перед 'plan'"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.we-should-test-first, type: chunk, title: "We should test first", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "нам нужно сначала протестировать", frame_of: grammar.future-forms.planning, carries: [structure:modal], examples: ["We should test first before we deploy anything.", "We should review the changes before deploying them."], contrast: {frame: "We will test first.", note_ru: "'should' для совета/рекомендации, 'will' для факта плана"}, trap: {learner_form: "We should to test.", correction: "We should test.", cause_ru: "после модального глагола 'should' идет инфинитив без 'to'"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.ill-let-you-know-once, type: chunk, title: "I'll let you know once ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я дам тебе знать как только ...", frame_of: grammar.future-forms.planning, carries: [tense:future-will], slot_hint_ru: "условие (I hear back, we finish, the results arrive)", examples: ["I'll let you know once I hear back.", "I'll let you know once the results arrive."], contrast: {frame: "I'm letting you know when...", note_ru: "will для будущего обещания, present continuous редко используется здесь"}, trap: {learner_form: "I let you know once...", correction: "I'll let you know once...", cause_ru: "future time context требует will или be going to"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.do-you-want-me-to-start-now, type: chunk, title: "Do you want me to start now?", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, requests], meaning_ru: "ты хочешь, чтобы я начал сейчас?", frame_of: grammar.future-forms.planning, carries: [structure:question-do], examples: ["Do you want me to start now?", "Do you want me to send the report today?"], contrast: {frame: "Should I start now?", note_ru: "'Do you want...' для предложения, 'should' для совета"}, trap: {learner_form: "You want me start?", correction: "Do you want me to start?", cause_ru: "'want' требует инфинитива с 'to'"}, transformations: [authored]}
  - {id: chunk.future-forms-planning.its-not-happening-until-next-month, type: chunk, title: "It's not happening until next month", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это не будет происходить до следующего месяца", frame_of: grammar.future-forms.planning, carries: [tense:present-continuous], examples: ["It's not happening until next month.", "The launch isn't happening until Q4."], contrast: {frame: "It won't happen until...", note_ru: "оба варианта допустимы; present continuous подчёркивает договорённость"}, trap: {learner_form: "It's happening until next month.", correction: "It's not happening until next month.", cause_ru: "negative требует 'not happening' или 'won't happen'"}, transformations: [authored]}
