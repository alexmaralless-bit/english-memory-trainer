  - {id: chunk.past-simple-events.we-made-the-decision, type: chunk, title: "We made the decision ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "мы приняли решение ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["We made the decision yesterday.", "They made the decision after the meeting."], contrast: {frame: "We have made the decision", note_ru: "have made = только что решили; made = решили в конкретный момент"}, trap: {learner_form: "We make the decision yesterday.", correction: "We made the decision yesterday.", cause_ru: "неправильный глагол; прошлое = made, не make"}, transformations: [authored]}
