  - {id: chunk.past-simple-events.we-got-the-approval, type: chunk, title: "We got the approval ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, organization], meaning_ru: "мы получили одобрение ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["We got the approval yesterday.", "They got the approval after the review."], contrast: {frame: "We have gotten the approval", note_ru: "have gotten = только что получили; got = получили в конкретный момент"}, trap: {learner_form: "We get the approval yesterday.", correction: "We got the approval yesterday.", cause_ru: "неправильный глагол; прошлое = got, не get"}, transformations: [authored]}
  - {id: chunk.past-simple-events.the-data-arrived, type: chunk, title: "The data arrived ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "данные пришли ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["The data arrived this morning.", "The data arrived shortly after the transfer completed."], contrast: {frame: "The data has arrived", note_ru: "has arrived = только что прибыли; arrived = прибыли в определённый момент"}, trap: {learner_form: "The data arrive yesterday.", correction: "The data arrived yesterday.", cause_ru: "третье лицо в past simple требует -ed"}, transformations: [authored]}
  - {id: chunk.past-simple-events.i-took-a-backup, type: chunk, title: "I took a backup ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "я сделал(а) резервную копию ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["I took a backup before the update.", "She took a backup just in case."], contrast: {frame: "I have taken a backup", note_ru: "have taken = только что сделал копию; took = сделал в конкретный момент"}, trap: {learner_form: "I take a backup yesterday.", correction: "I took a backup yesterday.", cause_ru: "неправильный глагол; прошлое = took, не take"}, transformations: [authored]}
  - {id: chunk.past-simple-events.we-left-the-office, type: chunk, title: "We left the office ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work], meaning_ru: "мы покинули офис ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["We left the office early yesterday.", "They left the office after the team standup."], contrast: {frame: "We have left the office", note_ru: "have left = уже ушли (могут быть в пути); left = ушли в конкретный момент прошлого"}, trap: {learner_form: "We leave the office yesterday.", correction: "We left the office yesterday.", cause_ru: "неправильный глагол; прошлое = left, не leave"}, transformations: [authored]}
  - {id: chunk.past-simple-events.the-server-ran-out, type: chunk, title: "The server ran out of ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "сервер исчерпал ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple], slot_hint_ru: "что кончилось (memory, space, connections)", examples: ["The server ran out of memory yesterday.", "It ran out of disk space during the import."], contrast: {frame: "The server runs out of", note_ru: "runs out = кончается сейчас; ran out = кончилось в прошлом"}, trap: {learner_form: "The server run out of memory.", correction: "The server ran out of memory.", cause_ru: "неправильный глагол; прошлое = ran, не run"}, transformations: [authored]}
  - {id: chunk.past-simple-events.the-process-took, type: chunk, title: "The process took ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work], meaning_ru: "процесс занял ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple], slot_hint_ru: "сколько времени", examples: ["The process took three hours.", "The process took two extra days."], contrast: {frame: "The process takes", note_ru: "takes = занимает обычно; took = занял в этот раз"}, trap: {learner_form: "The process take two hours.", correction: "The process took two hours.", cause_ru: "неправильный глагол; прошлое = took, не take"}, transformations: [authored]}
  - {id: chunk.past-simple-events.i-told-the-team, type: chunk, title: "I told the team ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я сказал(а) команде ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple], slot_hint_ru: "что сказал", examples: ["I told the team about the delay.", "She told the team to wait for confirmation."], contrast: {frame: "I have told the team", note_ru: "have told = недавно сказал; told = сказал в конкретный момент"}, trap: {learner_form: "I tell the team yesterday.", correction: "I told the team yesterday.", cause_ru: "неправильный глагол; прошлое = told, не tell"}, transformations: [authored]}
  - {id: chunk.past-simple-events.we-ran-the-test, type: chunk, title: "We ran the test ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы запустили тест ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["We ran the test this afternoon.", "They ran the test before release."], contrast: {frame: "We run the test", note_ru: "run = запускаем обычно; ran = запустили в этот раз"}, trap: {learner_form: "We run the test yesterday.", correction: "We ran the test yesterday.", cause_ru: "неправильный глагол; прошлое = ran, не run"}, transformations: [authored]}
