# Frames for grammar.past-simple.events (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.past-simple-events.the-service-stopped, type: chunk, title: "The service stopped ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "сервис остановился ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "время", examples: ["The service stopped yesterday at ten.", "The service stopped right after the deployment."], contrast: {frame: "The service is stopping", note_ru: "is stopping = происходит сейчас; stopped = завершено в прошлом"}, trap: {learner_form: "The service stops yesterday.", correction: "The service stopped yesterday.", cause_ru: "базовая форма глагола; нужна вторая форма"}, transformations: [authored]}
  - {id: chunk.past-simple-events.we-fixed-it-by, type: chunk, title: "We fixed it by ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы исправили это через ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple], slot_hint_ru: "способ или инструмент", examples: ["We fixed it by restarting the system.", "We fixed it by restoring from a backup."], contrast: {frame: "We have fixed it by", note_ru: "have fixed = только что готово; fixed = уже завершено в прошлом"}, trap: {learner_form: "We fix it by restarting.", correction: "We fixed it by restarting.", cause_ru: "нужна вторая форма для прошлого события"}, transformations: [authored]}
  - {id: chunk.past-simple-events.i-sent-the, type: chunk, title: "I sent the ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я отправил(а) ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple], slot_hint_ru: "объект (отчёт, сообщение, ссылка)", examples: ["I sent the report to the client.", "She sent the update before lunch."], contrast: {frame: "I've sent the ___", note_ru: "I've sent = только что отправил (нет конкретного времени); I sent = отправил в конкретный момент прошлого"}, trap: {learner_form: "I have sent the report yesterday.", correction: "I sent the report yesterday.", cause_ru: "с конкретным временем yesterday не используется present perfect"}, transformations: [authored]}
  - {id: chunk.past-simple-events.we-solved-the-problem, type: chunk, title: "We solved the problem ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "мы решили проблему ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "время", examples: ["We solved the problem this morning.", "They solved the problem right before the demo."], contrast: {frame: "We are solving the problem", note_ru: "are solving = в процессе сейчас; solved = завершено в прошлом"}, trap: {learner_form: "We solve the problem yesterday.", correction: "We solved the problem yesterday.", cause_ru: "с маркером прошлого времени нужна вторая форма глагола"}, transformations: [authored]}
  - {id: chunk.past-simple-events.the-error-occurred, type: chunk, title: "The error occurred ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "ошибка произошла ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда (when, after, before)", examples: ["The error occurred after the update.", "The error occurred right before the release."], contrast: {frame: "The error is occurring", note_ru: "is occurring = происходит сейчас; occurred = произошло в прошлом"}, trap: {learner_form: "The error occur last night.", correction: "The error occurred last night.", cause_ru: "третье лицо в past simple требует -ed или неправильной формы"}, transformations: [authored]}
  - {id: chunk.past-simple-events.it-worked-fine-until, type: chunk, title: "It worked fine until ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "это работало нормально до ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "момент времени или событие", examples: ["It worked fine until yesterday.", "It worked fine until the outage last night."], contrast: {frame: "It has worked fine until now", note_ru: "has worked = до сих пор работает; worked = перестало работать в прошлом"}, trap: {learner_form: "It work fine until the update.", correction: "It worked fine until the update.", cause_ru: "третье лицо единственное в past simple требует changed form"}, transformations: [authored]}
  - {id: chunk.past-simple-events.we-received-the-report, type: chunk, title: "We received the ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "мы получили ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple], slot_hint_ru: "что получили", examples: ["We received the data file this morning.", "They received the message after lunch."], contrast: {frame: "We have received the", note_ru: "have received = только что получили, результат важен; received = получили в конкретный момент"}, trap: {learner_form: "We receive the report yesterday.", correction: "We received the report yesterday.", cause_ru: "с маркером времени нужна вторая форма"}, transformations: [authored]}
  - {id: chunk.past-simple-events.the-ticket-was-closed, type: chunk, title: "The ticket was closed ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "тикет был закрыт ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["The ticket was closed yesterday.", "The ticket was closed shortly after the call."], contrast: {frame: "The ticket is closed", note_ru: "is closed = в данный момент закрыт; was closed = закрыли в прошлом"}, trap: {learner_form: "The ticket close yesterday.", correction: "The ticket was closed yesterday.", cause_ru: "пассив в past simple: was + третья форма"}, transformations: [authored]}
  - {id: chunk.past-simple-events.we-deployed-the-update, type: chunk, title: "We deployed the update ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы развернули обновление ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["We deployed the update last Friday.", "They deployed the update right before the holiday."], contrast: {frame: "We have deployed the update", note_ru: "have deployed = только что развернули; deployed = развернули в определённый момент"}, trap: {learner_form: "We deploy the update yesterday.", correction: "We deployed the update yesterday.", cause_ru: "с маркером времени нужна вторая форма глагола"}, transformations: [authored]}
  - {id: chunk.past-simple-events.i-checked-the-logs, type: chunk, title: "I checked the logs ___", cefr: A1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я проверил(а) логи ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда или зачем", examples: ["I checked the logs this morning.", "She checked the logs to find the error."], contrast: {frame: "I have checked the logs", note_ru: "have checked = недавно проверил; checked = проверил в конкретный момент"}, trap: {learner_form: "I check the logs yesterday.", correction: "I checked the logs yesterday.", cause_ru: "с маркером прошлого времени нужна вторая форма"}, transformations: [authored]}
  - {id: chunk.past-simple-events.the-system-crashed, type: chunk, title: "The system crashed ___", cefr: A1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "система рухнула ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["The system crashed at midnight.", "The system crashed again during the migration."], contrast: {frame: "The system is crashing", note_ru: "is crashing = падает сейчас; crashed = упала в прошлом"}, trap: {learner_form: "The system crash yesterday.", correction: "The system crashed yesterday.", cause_ru: "третье лицо в past simple требует -ed или неправильной формы"}, transformations: [authored]}
  - {id: chunk.past-simple-events.we-began-the-migration, type: chunk, title: "We began the migration ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "мы начали миграцию ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["We began the migration last month.", "They began the migration earlier than planned."], contrast: {frame: "We have begun the migration", note_ru: "have begun = только что начали; began = начали в конкретный момент прошлого"}, trap: {learner_form: "We begin the migration yesterday.", correction: "We began the migration yesterday.", cause_ru: "неправильный глагол; прошлое время = began, не begin"}, transformations: [authored]}
  - {id: chunk.past-simple-events.the-test-passed, type: chunk, title: "The test passed ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "тест прошёл ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple, structure:time-marker], slot_hint_ru: "когда", examples: ["The test passed on the first try.", "The tests passed after the fix was applied."], contrast: {frame: "The test is passing", note_ru: "is passing = проходит сейчас; passed = прошёл в прошлом"}, trap: {learner_form: "The test pass last time.", correction: "The test passed last time.", cause_ru: "третье лицо в past simple требует измененной формы"}, transformations: [authored]}
  - {id: chunk.past-simple-events.i-found-the-bug, type: chunk, title: "I found the bug ___", cefr: A1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "я нашёл(а) баг ...", frame_of: grammar.past-simple.events, carries: [tense:past-simple], slot_hint_ru: "когда или где", examples: ["I found the bug while testing.", "She found the bug in the database query."], contrast: {frame: "I have found the bug", note_ru: "have found = только что нашёл, важен результат; found = нашёл в конкретный момент"}, trap: {learner_form: "I find the bug yesterday.", correction: "I found the bug yesterday.", cause_ru: "неправильный глагол; прошлое = found, не find"}, transformations: [authored]}
