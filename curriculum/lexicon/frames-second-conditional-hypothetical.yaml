# Frames for grammar.second-conditional.hypothetical (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.second-conditional-hypothetical.if-had-would, type: chunk, title: "If we had ___, we would ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "если бы у нас было …, мы бы …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2, structure:sequencing], slot_hint_ru: "отсутствующее условие / результат", examples: ["If we had more time, we would review all the code changes.", "If I had a car, I would drive to the office instead of taking the train."], contrast: {frame: "If we have more time, we will review all the code changes.", note_ru: "первый условный: реальное условие, вероятный результат"}, trap: {learner_form: "If we would have more time, we would review the code.", correction: "If we had more time, we would review all the code changes.", cause_ru: "в if-части нельзя писать would; нужна простая форма Past Simple"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.if-i-were-id, type: chunk, title: "If I were you, I'd ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "если бы я был на твоём месте, я бы …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "действие", examples: ["If I were you, I'd ask the client for clarification before proceeding.", "If I were you, I'd take some time off after this project ends."], contrast: {frame: "If you are worried, you will feel better if you ask for clarification.", note_ru: "не гипотеза; настоящее и будущее, не условное"}, trap: {learner_form: "If I was you, I would ask the client for clarification.", correction: "If I were you, I'd ask the client for clarification before proceeding.", cause_ru: "с I/he/she/it во втором условном пишется were, не was; I'd = I would"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.it-would-be-if, type: chunk, title: "It would be ___ if ___", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "было бы …, если бы …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "прилагательное или существительное / гипотетическое условие", examples: ["It would be perfect if the deployment happened during the night.", "It would be risky if we changed the database structure without proper testing."], contrast: {frame: "It is perfect if the deployment happens during the night.", note_ru: "не гипотеза; реальное условие и следствие"}, trap: {learner_form: "It would be perfect if the deployment will happen during the night.", correction: "It would be perfect if the deployment happened during the night.", cause_ru: "в if-части второго условного нужен Past Simple (happened), не will happen"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.what-would-you-do-if, type: chunk, title: "What would you do if ___?", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "что бы ты делал/делала, если бы …?", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2, structure:question-wh], slot_hint_ru: "гипотетическое условие", examples: ["What would you do if the server crashed during the migration?", "What would you do if your team suddenly had one week less to complete the project?"], contrast: {frame: "What do you do if the server crashes during the migration?", note_ru: "настоящее и реальное; вопрос о привычной реакции"}, trap: {learner_form: "What would you do if the server would crash during the migration?", correction: "What would you do if the server crashed during the migration?", cause_ru: "в if-части нельзя писать would; только Past Simple"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.we-would-if, type: chunk, title: "We would ___ if ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы бы …, если бы …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "действие / гипотетическое условие", examples: ["We would switch to the new platform if the migration costs were lower.", "We would hire more developers if the budget allowed it."], contrast: {frame: "We will switch to the new platform if the migration costs are lower.", note_ru: "первый условный: реальное условие, возможный результат в будущем"}, trap: {learner_form: "We would switch if the migration costs would be lower.", correction: "We would switch to the new platform if the migration costs were lower.", cause_ru: "в if-части нельзя писать would; нужен Past Simple (were)"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.would-you-if, type: chunk, title: "Would you ___ if ___?", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ты бы …, если бы …?", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2, structure:question-do], slot_hint_ru: "действие / гипотетическое условие", examples: ["Would you accept the offer if they increased the salary?", "Would you move to a different city if your company relocated there?"], contrast: {frame: "Will you accept the offer if they increase the salary?", note_ru: "первый условный: реально возможный сценарий"}, trap: {learner_form: "Would you accept if they would increase the salary?", correction: "Would you accept the offer if they increased the salary?", cause_ru: "в if-части нельзя писать would; только Past Simple"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.if-she-were, type: chunk, title: "If she were ___, ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "если бы она была …, …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "описание / следствие", examples: ["If she were here, she would handle this conflict better.", "If the client were more experienced, we wouldn't need to explain everything."], contrast: {frame: "She is here and she handles this conflict well.", note_ru: "констатация факта; не гипотеза"}, trap: {learner_form: "If she was here, she would handle this conflict.", correction: "If she were here, she would handle this conflict better.", cause_ru: "формально нужен were (subjunctive); was встречается в разговорной речи, но в письме лучше were"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.in-that-case-would, type: chunk, title: "In that case, I would ___", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "в этом случае я бы …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "действие в гипотетическом сценарии", examples: ["In that case, I would escalate the issue to management.", "In that case, I would recommend waiting another quarter before rolling out the update."], contrast: {frame: "In that case, I will escalate the issue to management.", note_ru: "реальный случай; будущее действие, не гипотетическое"}, trap: {learner_form: "In that case, I would recommending waiting another quarter.", correction: "In that case, I would recommend waiting another quarter before rolling out the update.", cause_ru: "после would нужен инфинитив без to (recommend), не gerund"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.if-not-for, type: chunk, title: "If not for ___, I would ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "если бы не …, я бы …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "помеха / то, что я бы делал", examples: ["If not for the tight deadline, I would have suggested a different approach.", "If not for your help, we would have missed the target entirely."], contrast: {frame: "Because of the tight deadline, I suggested a different approach.", note_ru: "реальное объяснение в прошлом"}, trap: {learner_form: "If not for the tight deadline, I would suggest a different approach.", correction: "If not for the tight deadline, I would have suggested a different approach.", cause_ru: "обычно If not for относится к прошлому; нужен would have + третья форма (третий условный)"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.suppose-would, type: chunk, title: "Suppose ___, what would ___?", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "предположим, …, что бы …?", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "гипотетическое событие / следствие", examples: ["Suppose we had only two weeks, what would we prioritize?", "Suppose the vendor doubled their prices, what would we do?"], contrast: {frame: "If we have two weeks, what will we prioritize?", note_ru: "первый условный; реально возможный сценарий"}, trap: {learner_form: "Suppose we would have only two weeks, what would we prioritize?", correction: "Suppose we had only two weeks, what would we prioritize?", cause_ru: "в условной части нельзя писать would; только Past Simple"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.assuming-would, type: chunk, title: "Assuming ___, we would ___", cefr: B1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "если предположить, что …, мы бы …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2], slot_hint_ru: "гипотетическое условие / следствие", examples: ["Assuming the budget were larger, we would build a more robust system.", "Assuming our team size were doubled, we would complete the migration in half the time."], contrast: {frame: "The budget is small, so we build a minimal system.", note_ru: "реальный факт, а не гипотеза"}, trap: {learner_form: "Assuming the budget was larger, we would build more robust system.", correction: "Assuming the budget were larger, we would build a more robust system.", cause_ru: "с it/budget во втором условном нужен were, не was; и нужен артикль a перед прилагательным"}, transformations: [authored]}
  - {id: chunk.second-conditional-hypothetical.i-wouldnt-unless, type: chunk, title: "I wouldn't ___ unless ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я не …, если бы не …", frame_of: grammar.second-conditional.hypothetical, carries: [tense:conditional-2, structure:negative], slot_hint_ru: "отрицаемое действие / условие", examples: ["I wouldn't recommend that solution unless we had tested it thoroughly.", "I wouldn't trust the backup unless I had verified it myself."], contrast: {frame: "I won't recommend that solution unless we test it.", note_ru: "первый условный; реально возможный сценарий в будущем"}, trap: {learner_form: "I wouldn't recommend unless we would have tested it.", correction: "I wouldn't recommend that solution unless we had tested it thoroughly.", cause_ru: "в unless-части нельзя писать would have; нужен Past Perfect (had tested)"}, transformations: [authored]}
