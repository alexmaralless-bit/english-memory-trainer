# Frames for grammar.present-perfect.result (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.present-perfect-result.ive-already, type: chunk, title: "I've already ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я уже …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], slot_hint_ru: "третья форма глагола + объект", examples: ["I've already sent the report to the client.", "I've already restarted the router twice."], contrast: {frame: "I ___ yesterday", note_ru: "если есть законченное время (yesterday, last week) → Past Simple"}, trap: {learner_form: "I have already send the report.", correction: "I've already sent the report.", cause_ru: "после have нужна третья форма, не базовая"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.weve-just, type: chunk, title: "We've just ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы только что …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], slot_hint_ru: "третья форма глагола", examples: ["We've just finished the deployment to production.", "We've just received the final confirmation from the client."], contrast: {frame: "We ___ a moment ago", note_ru: "оба указывают на недавние события, но just — в Present Perfect"}, trap: {learner_form: "We just finished the deployment.", correction: "We've just finished the deployment.", cause_ru: "need auxiliary have для Present Perfect, даже с just"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.have-you-yet, type: chunk, title: "Have you ___?", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ты уже …?", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:question-do], slot_hint_ru: "третья форма глагола", examples: ["Have you reviewed the changes yet?", "Have you tested the new feature?"], contrast: {frame: "Did you ___?", note_ru: "Did спрашивает о законченном событии, Have you спрашивает о результате, который важен сейчас"}, trap: {learner_form: "Have you reviewed yet the changes?", correction: "Have you reviewed the changes yet?", cause_ru: "yet идёт в конце, после объекта"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.the-has-been, type: chunk, title: "The ___ has been ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… был/а/о …", frame_of: grammar.present-perfect.result, carries: [tense:passive, tense:present-perfect], slot_hint_ru: "существительное + третья форма глагола", examples: ["The issue has been fixed.", "The data has been verified."], contrast: {frame: "The ___ was ___", note_ru: "was ___ed — Past Simple passive, тогда как has been ___ed показывает результат, который важен сейчас"}, trap: {learner_form: "The issue has fixed.", correction: "The issue has been fixed.", cause_ru: "пассив требует been + третья форма, не just третья форма"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.so-far-weve, type: chunk, title: "So far we've ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "до сих пор мы …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:time-marker], slot_hint_ru: "третья форма глагола", examples: ["So far we've tested five scenarios.", "So far we've not found any major issues."], contrast: {frame: "Until now, we ___ed", note_ru: "оба указывают на период до сейчас, но Present Perfect подчёркивает результат"}, trap: {learner_form: "So far we tested five scenarios.", correction: "So far we've tested five scenarios.", cause_ru: "so far требует Present Perfect, не Past Simple"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.thats-the-first-time, type: chunk, title: "That's the first time I've ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "это первый раз, когда я …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], slot_hint_ru: "третья форма глагола", examples: ["That's the first time I've led a major project.", "That's the first time I've used this tool."], contrast: {frame: "It is the first time I ___", note_ru: "оба выражают первый раз в жизни, Present Perfect стандартен"}, trap: {learner_form: "That's the first time I lead a major project.", correction: "That's the first time I've led a major project.", cause_ru: "после first time требуется Present Perfect, не Present Simple"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.ive-never, type: chunk, title: "I've never ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, everyday-life], meaning_ru: "я никогда не …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:negative], slot_hint_ru: "третья форма глагола", examples: ["I've never seen that error before.", "I've never worked with that language."], contrast: {frame: "I didn't ___", note_ru: "didn't указывает на конкретное прошлое время, I've never указывает на жизненный опыт"}, trap: {learner_form: "I never saw that error before.", correction: "I've never seen that error before.", cause_ru: "never в контексте жизненного опыта требует Present Perfect"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.havent-yet, type: chunk, title: "I haven't ___ yet", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "я ещё не …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:negative], slot_hint_ru: "третья форма глагола", examples: ["I haven't finished the documentation yet.", "I haven't found the bug yet."], contrast: {frame: "I didn't ___ yet", note_ru: "didn't yet неграмотно; используй havent yet или Past Simple без yet"}, trap: {learner_form: "I have not finish the report yet.", correction: "I haven't finished the report yet.", cause_ru: "после haven't нужна третья форма, не базовая форма"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.have-you-ever, type: chunk, title: "Have you ever ___?", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "ты когда-нибудь …?", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:question-do], slot_hint_ru: "третья форма глагола", examples: ["Have you ever deployed to production?", "Have you ever encountered this issue?"], contrast: {frame: "Did you ever ___?", note_ru: "Have you ever спрашивает о жизненном опыте в целом, Did ever спрашивает о конкретном времени"}, trap: {learner_form: "Did you ever deployed to production?", correction: "Have you ever deployed to production?", cause_ru: "с ever используй Present Perfect, не Past Simple"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.its-been-since, type: chunk, title: "It's been ___ since ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "прошло … с тех пор как …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], slot_hint_ru: "период времени + глагольное событие", examples: ["It's been two weeks since we started the migration.", "It's been three days since I discovered the issue."], contrast: {frame: "___ has passed since ___", note_ru: "оба описывают продолжительность, но Present Perfect Continuous с since — стандарт"}, trap: {learner_form: "It is two weeks since we started.", correction: "It's been two weeks since we started.", cause_ru: "с since и периодом времени используй Perfect Continuous"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.we-have-just-started, type: chunk, title: "We have just started", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "мы только что начали", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], examples: ["We have just started the maintenance window.", "We have just completed the initial phase."], contrast: {frame: "We've just started", note_ru: "have just = we've just, но have — более формален"}, trap: {learner_form: "We have just start the maintenance.", correction: "We have just started the maintenance.", cause_ru: "третья форма глагола после have, не базовая"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.the-team-has-completed, type: chunk, title: "The team has completed", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "команда завершила", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], examples: ["The team has completed the testing phase.", "The team has completed the documentation."], contrast: {frame: "The team completed", note_ru: "The team completed — когда указано законченное время; the team has completed — результат важен сейчас"}, trap: {learner_form: "The team has complete the testing.", correction: "The team has completed the testing.", cause_ru: "третья форма глагола, а не базовая форма"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.we-havent-had, type: chunk, title: "We haven't had ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "у нас не было …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:negative], slot_hint_ru: "существительное", examples: ["We haven't had any issues so far.", "We haven't had a single complaint."], contrast: {frame: "We didn't have ___", note_ru: "didn't have указывает на конкретное прошлое время, haven't had указывает на период до сейчас"}, trap: {learner_form: "We have not have any issues.", correction: "We haven't had any issues.", cause_ru: "have + had, не have + have"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.has-anyone, type: chunk, title: "Has anyone ___?", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "кто-нибудь …?", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:question-do], slot_hint_ru: "третья форма глагола", examples: ["Has anyone noticed the performance drop?", "Has anyone seen the updated requirements?"], contrast: {frame: "Did anyone ___?", note_ru: "Has anyone спрашивает об опыте в целом, Did anyone спрашивает о конкретном событии"}, trap: {learner_form: "Did anyone saw the updated requirements?", correction: "Has anyone seen the updated requirements?", cause_ru: "с anyone в Present Perfect используй видовую форму (been, seen, done)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.report-has-shown, type: chunk, title: "The report has shown", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, data], meaning_ru: "доклад показал", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], examples: ["The report has shown a 15% improvement.", "The report has shown three critical issues."], contrast: {frame: "The report showed", note_ru: "has shown указывает на результат, который актуален сейчас, showed указывает на прошлое событие"}, trap: {learner_form: "The report has show a 15% improvement.", correction: "The report has shown a 15% improvement.", cause_ru: "третья форма глагола показано (shown), не базовая (show)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.client-hasnt-responded, type: chunk, title: "The client hasn't ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "клиент не …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:negative], slot_hint_ru: "третья форма глагола", examples: ["The client hasn't responded to our inquiry.", "The client hasn't confirmed the request."], contrast: {frame: "The client didn't ___", note_ru: "hasn't responded указывает на период до сейчас, didn't respond указывает на конкретное время"}, trap: {learner_form: "The client has not respond to our inquiry.", correction: "The client hasn't responded to our inquiry.", cause_ru: "третья форма (responded), не базовая (respond)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.i-have-learned, type: chunk, title: "I have learned", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, study], meaning_ru: "я узнал, я научился", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], examples: ["I have learned a lot from this project.", "I have learned how to use the new framework."], contrast: {frame: "I learned", note_ru: "I learned + время → Past Simple, I have learned без времени → Present Perfect с результатом"}, trap: {learner_form: "I have learn a lot from this project.", correction: "I have learned a lot from this project.", cause_ru: "третья форма (learned), не базовая (learn)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.weve-discovered, type: chunk, title: "We've discovered", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы обнаружили", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], examples: ["We've discovered a memory leak in the system.", "We've discovered new performance insights."], contrast: {frame: "We discovered", note_ru: "discovered — Past Simple для события, we've discovered — Present Perfect для результата"}, trap: {learner_form: "We have discover a memory leak.", correction: "We've discovered a memory leak.", cause_ru: "третья форма (discovered), не базовая (discover)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.no-one-has, type: chunk, title: "No one has ___", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "никто не …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:negative], slot_hint_ru: "третья форма глагола", examples: ["No one has flagged this issue.", "No one has seen the new feature yet."], contrast: {frame: "Nobody ___", note_ru: "No one has указывает на состояние до сейчас, Nobody просто констатирует факт"}, trap: {learner_form: "No one has flag this issue.", correction: "No one has flagged this issue.", cause_ru: "третья форма (flagged), не базовая (flag)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.the-code-has-passed, type: chunk, title: "The code has passed", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, technology], meaning_ru: "код прошёл (проверку, тест)", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], examples: ["The code has passed all tests.", "The code has passed the security review."], contrast: {frame: "The code passed", note_ru: "has passed — результат актуален, passed + время → конкретное прошлое событие"}, trap: {learner_form: "The code has pass all tests.", correction: "The code has passed all tests.", cause_ru: "третья форма (passed), не базовая (pass)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.ive-asked, type: chunk, title: "I've asked", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, communication], meaning_ru: "я попросил, я спросил", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect], examples: ["I've asked the vendor for clarification.", "I've asked the team to review the proposal."], contrast: {frame: "I asked", note_ru: "I asked + время → Past Simple, I've asked без времени → Present Perfect с актуальным результатом"}, trap: {learner_form: "I have ask the vendor for clarification.", correction: "I've asked the vendor for clarification.", cause_ru: "третья форма (asked), не базовая (ask)"}, transformations: [authored]}
  - {id: chunk.present-perfect-result.we-havent-seen, type: chunk, title: "We haven't seen ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "мы не видели …", frame_of: grammar.present-perfect.result, carries: [tense:present-perfect, structure:negative], slot_hint_ru: "существительное", examples: ["We haven't seen any regression in the logs.", "We haven't seen similar issues before."], contrast: {frame: "We didn't see ___", note_ru: "haven't seen указывает на жизненный опыт, didn't see указывает на конкретное время"}, trap: {learner_form: "We have not see any regression.", correction: "We haven't seen any regression.", cause_ru: "третья форма (seen), не базовая (see)"}, transformations: [authored]}
