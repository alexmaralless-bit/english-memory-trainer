# Frames for grammar.passive.expanded-process (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.passive-expanded-process.has-been-completed, type: chunk, title: "The ___ has been completed", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… уже завершён(а)", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:present-perfect], slot_hint_ru: "объект (задача, отчёт и т.п.)", examples: ["The report has been completed by the finance team.", "The infrastructure upgrade has been completed this quarter."], contrast: {frame: "The finance team has completed the report.", note_ru: "активный залог; фокус на том, кто действует"}, trap: {learner_form: "The report has been completed the finance team.", correction: "The report has been completed by the finance team.", cause_ru: "в пассиве нужен by перед агентом"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.is-being-tested, type: chunk, title: "___ is being tested", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… сейчас тестируется, идёт процесс тестирования …", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:present-continuous], slot_hint_ru: "объект (система, приложение и т.п.)", examples: ["The system is being migrated right now.", "The new feature is being tested by the QA team."], contrast: {frame: "The system is migrated.", note_ru: "простой пассив; нет указания на то, что это идёт сейчас"}, trap: {learner_form: "The system is being migrate right now.", correction: "The system is being migrated right now.", cause_ru: "в пассиве Present Continuous нужна третья форма (migrated)"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.will-be-published, type: chunk, title: "The ___ will be published", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… будет опубликована/опубликован", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:future-will], slot_hint_ru: "объект (версия, документ и т.п.)", examples: ["The release will be published once all tests pass.", "The documentation will be updated next week."], contrast: {frame: "We will publish the release once all tests pass.", note_ru: "активный залог; фокус на том, кто действует"}, trap: {learner_form: "The release will be publish when tests pass.", correction: "The release will be published once all tests pass.", cause_ru: "в пассиве нужна третья форма (published), не инфинитив"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.needs-to-be-fixed, type: chunk, title: "The ___ needs to be fixed", cefr: B1, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… нужно/требуется исправить/отремонтировать", frame_of: grammar.passive.expanded-process, carries: [tense:passive, structure:modal], slot_hint_ru: "объект (ошибка, проблема и т.п.)", examples: ["The bug needs to be fixed before the release.", "These issues need to be fixed before the launch."], contrast: {frame: "We need to fix the bug before the release.", note_ru: "активный залог; говорим о том, что нам нужно делать"}, trap: {learner_form: "The bug needs to be fix before the release.", correction: "The bug needs to be fixed before the release.", cause_ru: "после be в пассиве нужна третья форма (fixed)"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.can-be-resolved, type: chunk, title: "The ___ can be resolved", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, troubleshooting], meaning_ru: "… может быть решена/решён", frame_of: grammar.passive.expanded-process, carries: [tense:passive, structure:modal], slot_hint_ru: "объект (проблема, вопрос и т.п.)", examples: ["The issue can be resolved via a software patch.", "The data loss can be prevented with proper backups."], contrast: {frame: "You can resolve the issue via a software patch.", note_ru: "активный залог; фокус на агенте"}, trap: {learner_form: "The issue can resolved via a patch.", correction: "The issue can be resolved via a software patch.", cause_ru: "в пассиве с модальным глаголом нужны be + третья форма"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.had-been-archived, type: chunk, title: "The old ___ had been archived", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "старые … уже были архивированы", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:past-perfect], slot_hint_ru: "объект (файлы, записи и т.п.)", examples: ["The backup had been completed when the crash occurred.", "The old records had been archived before the migration began."], contrast: {frame: "We had archived the old records before the migration.", note_ru: "активный залог"}, trap: {learner_form: "The old records had been archive before migration.", correction: "The old records had been archived before the migration began.", cause_ru: "в пассиве Past Perfect нужна третья форма (archived)"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.was-being-reviewed, type: chunk, title: "The ___ was being reviewed", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… был/была в процессе проверки", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:past-continuous], slot_hint_ru: "объект (код, документ и т.п.)", examples: ["The code was being reviewed when the deadline was extended.", "The pull request was being reviewed when the reviewer went on leave."], contrast: {frame: "We were reviewing the code when the deadline was extended.", note_ru: "активный залог; фокус на том, кто действует"}, trap: {learner_form: "The code was being review when deadline extended.", correction: "The code was being reviewed when the deadline was extended.", cause_ru: "в пассиве Past Continuous нужна третья форма (reviewed)"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.should-be-signed, type: chunk, title: "The ___ should be signed", cefr: B1, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… следует подписать", frame_of: grammar.passive.expanded-process, carries: [tense:passive, structure:modal], slot_hint_ru: "объект (контракт, документ и т.п.)", examples: ["The contract should be signed before the end of the month.", "The security audit should be completed before production deployment."], contrast: {frame: "We should sign the contract before the month ends.", note_ru: "активный залог"}, trap: {learner_form: "The contract should be sign before end of month.", correction: "The contract should be signed before the end of the month.", cause_ru: "после should be нужна третья форма (signed)"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.may-be-postponed, type: chunk, title: "The ___ may be postponed", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "… может быть отложена/отложен", frame_of: grammar.passive.expanded-process, carries: [tense:passive, structure:modal], slot_hint_ru: "объект (встреча, релиз и т.п.)", examples: ["The feature may be released if all bugs are fixed.", "The meeting may be postponed if the stakeholder can't attend."], contrast: {frame: "We may release the feature if all bugs are fixed.", note_ru: "активный залог; говорим о нашем возможном действии"}, trap: {learner_form: "The feature may release if all bugs fixed.", correction: "The feature may be released if all bugs are fixed.", cause_ru: "после may нужны be + третья форма"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.must-have-been-deleted, type: chunk, title: "The ___ must have been deleted", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "… должно быть, был/была удалена/удалён", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:modal-perfect], slot_hint_ru: "объект (файл, данные и т.п.)", examples: ["The script must have been corrupted by the malware.", "The file must have been deleted by mistake."], contrast: {frame: "Someone must have deleted the file by mistake.", note_ru: "активный залог; говорим о том, что кто-то, вероятно, сделал"}, trap: {learner_form: "The file must have been delete by mistake.", correction: "The file must have been deleted by mistake.", cause_ru: "в пассиве Past Perfect нужна третья форма (deleted)"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.been-given-new-tool, type: chunk, title: "We've been given a new ___", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, reporting], meaning_ru: "нам дали новый/новую …", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:present-perfect], slot_hint_ru: "объект (инструмент, возможность и т.п.)", examples: ["We've been given a new tool to test the database.", "The team has been given additional resources for this project."], contrast: {frame: "The manager gave us a new tool for the project.", note_ru: "активный залог; фокус на том, кто дал"}, trap: {learner_form: "We've been given new tool to test database.", correction: "We've been given a new tool to test the database.", cause_ru: "в пассиве Present Perfect нужны артикль и полная конструкция"}, transformations: [authored]}
  - {id: chunk.passive-expanded-process.was-scheduled-to-complete, type: chunk, title: "It was scheduled to be completed", cefr: B1, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "было запланировано, что это будет завершено", frame_of: grammar.passive.expanded-process, carries: [tense:passive, tense:past-simple], examples: ["It was scheduled to be completed by Friday, but the release slipped.", "The whole migration was scheduled to be completed by Friday, according to the plan."], contrast: {frame: "We scheduled the deployment to be completed by Friday.", note_ru: "активный залог; фокус на том, кто планировал"}, trap: {learner_form: "It was scheduled to be complete by Friday.", correction: "It was scheduled to be completed by Friday.", cause_ru: "после be в инфинитиве нужна третья форма (completed)"}, transformations: [authored]}
