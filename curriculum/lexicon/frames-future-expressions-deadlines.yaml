# Frames for grammar.future-expressions.deadlines (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.future-expressions-deadlines.by-friday, type: chunk, title: "by Friday", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к пятнице (deadline)", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["We need to finish by Friday.", "The report is due by Friday morning."], contrast: {frame: "until Friday", note_ru: "'by' — крайний срок (сделать до этого момента), 'until' — длительность (делать вплоть до этого момента)"}, trap: {learner_form: "We will finish on Friday.", correction: "We will finish by Friday.", cause_ru: "'by Friday' обозначает крайний срок, 'on Friday' — конкретный день"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.until-friday, type: chunk, title: "until Friday", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "до пятницы (continuing)", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["The system will be down until Friday.", "We're testing until Friday night."], contrast: {frame: "by Friday", note_ru: "'until' — действие длится до этого момента, 'by' — завершение к этому моменту"}, trap: {learner_form: "We test till Friday.", correction: "We're testing until Friday.", cause_ru: "'till' разговорный, 'until' более формальный; нужна future или present continuous"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.the-delivery-date-is, type: chunk, title: "The delivery date is ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "дата доставки — ...", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker, article:definite-second-mention], slot_hint_ru: "день недели или дата (next Tuesday, the 15th)", examples: ["The delivery date is next Tuesday.", "The delivery date is the end of the month."], contrast: {frame: "We will deliver on Tuesday.", note_ru: "'the date is' — утверждение даты, 'will deliver' — действие с датой"}, trap: {learner_form: "The delivery is Friday.", correction: "The delivery date is Friday.", cause_ru: "нужно 'date' в этой конструкции"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.well-finish-by-the-end-of-the-week, type: chunk, title: "We'll finish by the end of the week", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы закончим к концу недели", frame_of: grammar.future-expressions.deadlines, carries: [tense:future-will, structure:time-marker, article:fixed-expression], examples: ["We'll finish by the end of the week.", "We'll deliver by the end of the month."], contrast: {frame: "We'll work until the end of the week.", note_ru: "'finish by' — завершение к deadline, 'work until' — действие до этого времени"}, trap: {learner_form: "We finish until the end of week.", correction: "We'll finish by the end of the week.", cause_ru: "'by' с 'finish' (completion), 'until' с глаголами процесса; нужен артикль 'the'"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.within-three-days, type: chunk, title: "within ___ days", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в течение ___ дней", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], slot_hint_ru: "число (two, three, five)", examples: ["We can fix it within two days.", "The package will arrive within three days."], contrast: {frame: "in two days", note_ru: "'within' — не позже чем за, 'in' — ровно через такой период"}, trap: {learner_form: "We will send it in three days.", correction: "We will send it within three days.", cause_ru: "'within' для deadline с запасом, 'in' для конкретного момента будущего"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.in-the-next-week, type: chunk, title: "in the next ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в течение следующих ...", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker, article:definite-second-mention], slot_hint_ru: "период (week, month, few days)", examples: ["We will review the results in the next week.", "The update will be available in the next few days."], contrast: {frame: "next week", note_ru: "'in the next week' — период, 'next week' — конкретная неделя"}, trap: {learner_form: "We will finish next week.", correction: "We will finish in the next week.", cause_ru: "'in the next' подразумевает потом в этом периоде, 'next' просто указывает на неделю"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.no-later-than-friday, type: chunk, title: "no later than ___", cefr: A2, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "не позднее ...", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], slot_hint_ru: "день или дата", examples: ["We need the report no later than Friday.", "Delivery is expected no later than next Tuesday."], contrast: {frame: "by Friday", note_ru: "both обозначают deadline; 'no later than' более формальное"}, trap: {learner_form: "No later Friday.", correction: "No later than Friday.", cause_ru: "нужно 'than' в этой конструкции"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.due-on-monday, type: chunk, title: "due on ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "срок — ...", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], slot_hint_ru: "день недели или дата", examples: ["The assignment is due on Monday.", "Your feedback is due on the 15th."], contrast: {frame: "due by Monday", note_ru: "'due on' — конкретный день, 'due by' — deadline (до этого дня)"}, trap: {learner_form: "The report due Monday.", correction: "The report is due on Monday.", cause_ru: "'due' требует глагола 'is' в этой конструкции"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.by-tomorrow-morning, type: chunk, title: "by tomorrow morning", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к завтрашнему утру", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["We need the results by tomorrow morning.", "Can you send it by tomorrow morning?"], contrast: {frame: "tomorrow morning", note_ru: "'by tomorrow morning' — deadline к этому времени, 'tomorrow morning' — время действия"}, trap: {learner_form: "By the tomorrow morning.", correction: "By tomorrow morning.", cause_ru: "артикль 'the' не нужен перед 'tomorrow'"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.in-three-weeks, type: chunk, title: "in ___ weeks", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "через ___ недель", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], slot_hint_ru: "число (two, three, four)", examples: ["The next release will be in three weeks.", "We'll see the results in two weeks."], contrast: {frame: "in two weeks from now", note_ru: "'in X weeks' — простой способ указать период, 'from now' — более явный отсчет"}, trap: {learner_form: "We will meet in Friday.", correction: "We will meet on Friday.", cause_ru: "'in' — для периодов/длительности, 'on' — для дня недели"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.by-the-end-of-today, type: chunk, title: "by the end of today", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к концу сегодня", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker, article:fixed-expression], examples: ["We'll send the update by the end of today.", "Please confirm by the end of today."], contrast: {frame: "by tonight", note_ru: "both выражают deadline; 'by the end of the day' более формальное"}, trap: {learner_form: "By end today.", correction: "By the end of today.", cause_ru: "нужны артикли 'the' в этой фиксированной выражении"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.well-deliver-in-two-days, type: chunk, title: "We'll deliver in ___ days", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "мы доставим через ___ дней", frame_of: grammar.future-expressions.deadlines, carries: [tense:future-will, structure:time-marker], slot_hint_ru: "число (two, three, four)", examples: ["We'll deliver in two days.", "The product will arrive in five days."], contrast: {frame: "We'll deliver by Monday.", note_ru: "'in X days' — конкретный период, 'by Monday' — específic deadline"}, trap: {learner_form: "We deliver in two days.", correction: "We'll deliver in two days.", cause_ru: "future context требует will"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.when-is-the-deadline, type: chunk, title: "When is the deadline?", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "когда срок?", frame_of: grammar.future-expressions.deadlines, carries: [structure:question-be], examples: ["When is the deadline? We need to plan.", "When is the deadline for the submission?"], contrast: {frame: "When should we finish?", note_ru: "'when is the deadline' — спрашиваем время, 'when should we finish' — спрашиваем требование"}, trap: {learner_form: "When the deadline?", correction: "When is the deadline?", cause_ru: "нужен глагол 'is'"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.its-due-next-monday, type: chunk, title: "It's due next Monday", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это срок на следующий понедельник", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["It's due next Monday at noon.", "The project is due next Monday."], contrast: {frame: "It's due by next Monday.", note_ru: "'due Monday' — конкретный день, 'due by Monday' — deadline к этому дню"}, trap: {learner_form: "It due Monday.", correction: "It's due next Monday.", cause_ru: "нужна связка 'is'; часто нужно 'next' для будущих дней недели"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.by-next-month, type: chunk, title: "by next month", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к следующему месяцу", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["The documentation will be ready by next month.", "We'll complete testing by next month."], contrast: {frame: "next month", note_ru: "'by next month' — deadline, 'next month' — период времени"}, trap: {learner_form: "We finish to next month.", correction: "We'll finish by next month.", cause_ru: "нужен 'by' с deadline, не 'to'"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.within-the-next-few-hours, type: chunk, title: "within the next ___ hours", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "в течение следующих ___ часов", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker, article:definite-second-mention], slot_hint_ru: "число (few, two, three)", examples: ["I'll call you within the next two hours.", "We'll send the link within the next few hours."], contrast: {frame: "in the next two hours", note_ru: "'within the next' — не позже чем, 'in the next' — просто период"}, trap: {learner_form: "I'll call you in few hours.", correction: "I'll call you within the next few hours.", cause_ru: "'within the next' требует 'the' перед периодом"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.the-deadline-is-tuesday, type: chunk, title: "The deadline is ___", cefr: A2, curriculum_priority_band: CORE, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "крайний срок — ...", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker, article:definite-second-mention], slot_hint_ru: "день недели или дата (Tuesday, the 20th)", examples: ["The deadline is Tuesday for the project.", "The deadline is next Friday morning."], contrast: {frame: "We must finish by Tuesday.", note_ru: "'deadline is' — утверждение даты, 'finish by' — обязательство действия"}, trap: {learner_form: "The deadline are Tuesday.", correction: "The deadline is Tuesday.", cause_ru: "'deadline' — существительное в единственном числе, требует 'is'"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.before-the-meeting, type: chunk, title: "before the meeting", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "до встречи", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker, article:definite-second-mention], examples: ["Please send the notes before the meeting.", "Finish the update before the meeting tomorrow."], contrast: {frame: "by the time of the meeting", note_ru: "'before' — точнее и короче, 'by the time' — более явное выражение deadline"}, trap: {learner_form: "Before meeting send notes.", correction: "Send the notes before the meeting.", cause_ru: "нужна нормальный порядок слов и артикль перед 'meeting'"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.in-two-weeks-from-now, type: chunk, title: "in ___ weeks from now", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "через ___ недель (считая от сейчас)", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], slot_hint_ru: "число (two, three, four)", examples: ["The project starts in two weeks from now.", "We'll have the results in three weeks from now."], contrast: {frame: "in two weeks", note_ru: "'in two weeks from now' — более явный отсчет, 'in two weeks' — просто период"}, trap: {learner_form: "In two weeks we start.", correction: "We'll start in two weeks from now.", cause_ru: "future context требует будущего времени"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.this-needs-to-be-done-by-thursday, type: chunk, title: "This needs to be done by ___", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "это нужно сделать к ...", frame_of: grammar.future-expressions.deadlines, carries: [tense:future-will, structure:time-marker], slot_hint_ru: "день (Thursday, Friday)", examples: ["This needs to be done by Thursday.", "This must be finished by next Friday."], contrast: {frame: "This should be done by Thursday.", note_ru: "'needs to be' выражает необходимость, 'should' — мягкий совет"}, trap: {learner_form: "This needs do by Thursday.", correction: "This needs to be done by Thursday.", cause_ru: "'needs to be done' — пассивная конструкция с инфинитивом"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.by-end-of-business, type: chunk, title: "by end of business", cefr: A2, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, planning], meaning_ru: "к концу рабочего дня (формально)", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["Submit the form by end of business.", "Deliver the report by end of business today."], contrast: {frame: "by 5 PM", note_ru: "'end of business' более стандартный деловой term, '5 PM' более точное время"}, trap: {learner_form: "By end business send it.", correction: "Send it by end of business.", cause_ru: "'end of business' — fixed expression с 'of', нужен 'of', нужен глагол в предложении"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.starting-next-week, type: chunk, title: "starting next week", cefr: A2, curriculum_priority_band: HIGH, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "начиная со следующей недели", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["Starting next week, we'll work on the new feature.", "Starting next Monday, the office will be closed."], contrast: {frame: "from next week", note_ru: "'starting' и 'from' похожи; 'starting' часто со следующей точкой отсчета"}, trap: {learner_form: "Starting from next week we work.", correction: "Starting next week, we'll work on it.", cause_ru: "'starting next week' уже выражает начало периода; нужно future время для действия"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.by-friday-at-the-latest, type: chunk, title: "by Friday at the latest", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "к пятнице самое позднее", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], examples: ["We'll finish by Friday at the latest.", "The shipment will arrive by Friday at the latest."], contrast: {frame: "by Friday", note_ru: "'at the latest' усиливает, что это максимум времени, которое можно потратить"}, trap: {learner_form: "By Friday latest.", correction: "By Friday at the latest.", cause_ru: "нужна полная фраза 'at the latest'"}, transformations: [authored]}
  - {id: chunk.future-expressions-deadlines.in-approximately-two-weeks, type: chunk, title: "in approximately ___ weeks", cefr: A2, curriculum_priority_band: USEFUL, register: neutral, transparency: transparent, domains: [work, planning], meaning_ru: "примерно через ___ недель", frame_of: grammar.future-expressions.deadlines, carries: [structure:time-marker], slot_hint_ru: "число (two, three, four)", examples: ["Results will be ready in approximately two weeks.", "The product launches in approximately three weeks."], contrast: {frame: "in about two weeks", note_ru: "'approximately' и 'about' синонимичны; 'approximately' более формальное"}, trap: {learner_form: "In two weeks approximately.", correction: "In approximately two weeks.", cause_ru: "'approximately' идет перед числом в этой конструкции"}, transformations: [authored]}
