# Frames for grammar.inversion.formal-emphasis (automaticity layer, 2026-09-22). Own text.
lexical_items:
  - {id: chunk.inversion-formal-emphasis.only-when, type: chunk, title: "Only when ___ should ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только когда … должно …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "условие + тема предложения", examples: ["Only when the recovery test passes should the migration proceed.", "Only when she confirms the budget should we approve the purchase order."], contrast: {frame: "We should only proceed when ___", note_ru: "инверсия более формально и более выделяет условие"}, trap: {learner_form: "Only when the recovery test passes, the migration should proceed.", correction: "Only when the recovery test passes should the migration proceed.", cause_ru: "с 'only when' в начале нужна инверсия (should proceed), не normal word order"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.not-only-did, type: chunk, title: "Not only did ___, but ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "не только … но и …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "инверсия с past/present + дополнение", examples: ["Not only did the change increase latency, but it also removed a diagnostic signal.", "Not only did the vendor miss the deadline, but the deliverables were incomplete."], contrast: {frame: "The change not only increased latency but also removed ___", note_ru: "не только структура с инверсией более формальна, но и подчёркивает оба результата"}, trap: {learner_form: "Not only the change increased latency...", correction: "Not only did the change increase latency...", cause_ru: "'Not only' требует инверсии (did the change), а не normal word order"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.should-the, type: chunk, title: "Should ___, please ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, communication], meaning_ru: "если бы …, пожалуйста …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "условие + просьба", examples: ["Should the system fail to recover, please initiate the manual fallback.", "Should you have any questions, please contact the help desk."], contrast: {frame: "If ___, please ___", note_ru: "should вместо if — более formal и literary"}, trap: {learner_form: "Should the system fail to recover, initiate the manual fallback.", correction: "Should the system fail to recover, please initiate the manual fallback.", cause_ru: "инверсия после 'Should' уже верна (Should the system...), но не хватает please — вежливой формы в формальной инструкции"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.were-it-not-for, type: chunk, title: "Were it not for ___, ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "если бы не …, …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "условие с were + главное предложение", examples: ["Were it not for the cache, the response time would double.", "Were it not for his experience, we would have faced serious delays."], contrast: {frame: "If it were not for ___, ___", note_ru: "were it not for — более compact и formal, чем 'if it were not for'"}, trap: {learner_form: "Was it not for the cache...", correction: "Were it not for the cache...", cause_ru: "в conditional без if нужно were (не was), даже с 'it'"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.had-we-known, type: chunk, title: "Had we known that ___, we would ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "если бы мы знали, что …, мы бы …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "past perfect + условный результат", examples: ["Had we known that the vendor would default, we would have switched earlier.", "Had we known that the flight was canceled, we would have left earlier."], contrast: {frame: "If we had known ___, we would ___", note_ru: "had we known — инверсия более формальна, чем if we had known"}, trap: {learner_form: "Had we knew that...", correction: "Had we known that...", cause_ru: "после had нужна third form (known), не простое время (knew)"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.under-no-circumstances, type: chunk, title: "Under no circumstances should ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "ни в коем случае не следует …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "тема + should", examples: ["Under no circumstances should production data be exported without encryption.", "Under no circumstances should we bypass the review process for security patches."], contrast: {frame: "We should never ___", note_ru: "under no circumstances более categorical и formal"}, trap: {learner_form: "Under no circumstances the data should be exported...", correction: "Under no circumstances should the data be exported...", cause_ru: "'Under no circumstances' требует инверсии (should be exported), а не обычного порядка слов"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.nowhere-is-this-more, type: chunk, title: "Nowhere is this more evident than in ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [academic, reporting], meaning_ru: "нигде это не проявляется так ярко, как в …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "место или область", examples: ["Nowhere is this more evident than in the metrics from last quarter.", "Nowhere is this more evident than in her attention to detail."], contrast: {frame: "This is most evident in ___", note_ru: "'Nowhere is' инверсия подчёркивает контраст и более формальна"}, trap: {learner_form: "Nowhere this is more evident than...", correction: "Nowhere is this more evident than...", cause_ru: "после 'nowhere' в начале предложения — инверсия: 'is this' (не 'this is')"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.in-no-way-can, type: chunk, title: "In no way can ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "никоим образом … не может …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "тема + глагол", examples: ["In no way can the current architecture support the projected load.", "In no way can we compromise on data integrity for speed."], contrast: {frame: "We cannot ___", note_ru: "'In no way can' инверсия более emphatic и formal"}, trap: {learner_form: "In no way the current architecture can support...", correction: "In no way can the current architecture support...", cause_ru: "после 'in no way' в начале предложения нужна инверсия — can перед подлежащим (can the architecture)"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.only-by, type: chunk, title: "Only by ___ can we ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только если / только посредством … мы можем …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "способ + глагол", examples: ["Only by adding redundancy can we achieve the recovery target.", "Only by automating the tests can we reduce the deployment cycle."], contrast: {frame: "We can only ___ by ___", note_ru: "'Only by' инверсия подчёркивает необходимость и более formal"}, trap: {learner_form: "Only by adding redundancy we can achieve...", correction: "Only by adding redundancy can we achieve...", cause_ru: "после 'only by ...' требуется инверсия — can перед подлежащим (can we)"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.neither-nor-should, type: chunk, title: "Neither should ___, nor should ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "не должны ни …, ни …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "подлежащее + глагол в обеих частях", examples: ["Neither should we ignore the warning, nor should we delay the patch.", "Neither should you skip breakfast, nor should you skip lunch."], contrast: {frame: "We should not ___, and we should not ___ either", note_ru: "инверсия после neither/nor формальнее и подчёркивает параллельность двух запретов"}, trap: {learner_form: "Neither we should ignore the warning, nor we should delay the patch.", correction: "Neither should we ignore the warning, nor should we delay the patch.", cause_ru: "после neither и nor в начале предложения нужна инверсия (should we), а не обычный порядок слов"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.only-if-then, type: chunk, title: "Only if ___ can ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только если … может …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "условие + результат", examples: ["Only if the test passes can we proceed to staging.", "Only if both parents agree can the trip happen."], contrast: {frame: "If ___, we can ___", note_ru: "'only if... can' — инверсия подчёркивает строгость единственного условия; обычный порядок нейтральнее"}, trap: {learner_form: "Only if the test passes we can proceed.", correction: "Only if the test passes can we proceed.", cause_ru: "после 'only if' в начале предложения требуется инверсия (can we), а не обычный порядок слов"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.scarcely-had, type: chunk, title: "Scarcely had ___ when ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "едва …, как …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "past perfect + событие", examples: ["Scarcely had the system started when the first error appeared.", "Scarcely had the meeting begun when the network went down."], contrast: {frame: "As soon as ___, ___", note_ru: "'Scarcely had' инверсия более literary и formal, подчёркивает неожиданность"}, trap: {learner_form: "Scarcely the system had started when...", correction: "Scarcely had the system started when...", cause_ru: "инверсия: 'Scarcely had (вспомогательный глагол) subject (подлежащее)'"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.seldom-have-we, type: chunk, title: "Seldom have we seen such ___", cefr: C1, curriculum_priority_band: HIGH, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "редко мы видели такой …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "существительное (объект)", examples: ["Seldom have we seen such rapid improvement in system reliability.", "Seldom have we seen such a warm welcome from strangers."], contrast: {frame: "We have seldom seen ___", note_ru: "'Seldom have we' инверсия более emphatic и formal"}, trap: {learner_form: "Seldom we have seen...", correction: "Seldom have we seen...", cause_ru: "инверсия после 'seldom': 'have we' (не 'we have')"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.barely-had, type: chunk, title: "Barely had ___ when ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "едва …, как …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "past perfect + последующее событие", examples: ["Barely had we deployed the fix when a second issue was reported.", "Barely had the training finished when the system crashed."], contrast: {frame: "As soon as ___", note_ru: "'Barely had' инверсия подчёркивает неудачный timing и более formal"}, trap: {learner_form: "Barely we had deployed...", correction: "Barely had we deployed...", cause_ru: "инверсия: 'Barely had (вспомогательный) subject'"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.not-until, type: chunk, title: "Not until ___ did ___", cefr: C1, curriculum_priority_band: CORE, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "только после …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "время + событие", examples: ["Not until the audit was complete did we understand the full scope.", "Not until the logs were reviewed did anyone realize the pattern."], contrast: {frame: "___ did not ___ until ___", note_ru: "'Not until' инверсия более formal и литературно"}, trap: {learner_form: "Not until the audit was complete we understood...", correction: "Not until the audit was complete did we understand...", cause_ru: "инверсия после 'not until': 'did we' (не 'we did')"}, transformations: [authored]}
  - {id: chunk.inversion-formal-emphasis.so-great-was, type: chunk, title: "So great was the ___", cefr: C1, curriculum_priority_band: USEFUL, register: formal, transparency: transparent, domains: [work, reporting], meaning_ru: "настолько велико было …", frame_of: grammar.inversion.formal-emphasis, carries: [structure:inversion], slot_hint_ru: "существительное (объект)", examples: ["So great was the impact that we had to revise the entire strategy.", "So great was the demand that we ran out of capacity in hours."], contrast: {frame: "The impact was so great that ___", note_ru: "'So great was' инверсия более literary и formal"}, trap: {learner_form: "So great the impact was...", correction: "So great was the impact...", cause_ru: "порядок слов с инверсией: 'So great was the [noun]' (не 'So great the [noun] was')"}, transformations: [authored]}
