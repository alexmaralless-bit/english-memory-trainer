topics:
  - id: grammar.third-conditional.retrospective
    cefr: B2
    track: grammar-engine
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Explain how a different past action could have changed a completed outcome by using the third conditional."
    advisory_prerequisites:
      strong: [grammar.second-conditional.hypothetical, grammar.past-perfect.sequence]
      soft: [written-production.cause-effect-explanation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [word.if, word.result, word.because]
    contexts: [incident-retrospective, missed-deadline-review]
    typical_errors:
      - "Using would in the if-clause (If we would have tested), mirroring Russian conditional symmetry."
      - "Replacing had + past participle with Past Simple because Russian does not mark the earlier counterfactual with a separate form."
      - "Describing a real past sequence instead of an unreal alternative and its imagined result."
    examples:
      - "If we had tested the migration earlier, we would have found the encoding fault."
      - "The delivery would not have failed if the address had been confirmed."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: grammar.mixed-conditionals.consequences
    cefr: B2
    track: grammar-engine
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Connect a past condition to a present consequence, or a persistent condition to a past outcome, with a mixed conditional."
    advisory_prerequisites:
      strong: [grammar.third-conditional.retrospective, grammar.second-conditional.hypothetical]
      soft: [grammar.present-perfect.duration]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [word.if, word.result, word.cause]
    contexts: [current-system-consequence, career-decision-reflection]
    typical_errors:
      - "Using the same time reference in both clauses when the condition is past but the consequence is present."
      - "Choosing would have in the result clause merely because the Russian sentence mentions the past."
      - "Mixing a factual present condition with a counterfactual result without signaling unreality."
    examples:
      - "If we had documented the workaround, the support team would know what to do now."
      - "If the service were easier to configure, we would have adopted it last year."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: reading.compare-source-claims
    cefr: B2
    track: reading
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Compare how two texts frame the same issue and identify where their claims, evidence, or assumptions differ."
    advisory_prerequisites:
      strong: [reading.connected-technical-explanation, reading.implied-online-stance]
      soft: [written-production.fact-inference]
    dimensions: [recognition, transfer]
    lexicon: [chunk.according-to, word.reason, word.result]
    contexts: [vendor-comparison, policy-briefing]
    typical_errors:
      - "Treating two texts as equivalent because they share vocabulary while overlooking different claims."
      - "Reporting each source separately instead of comparing the same issue across them."
      - "Reading a cautious English qualifier as firm agreement because Russian summaries often omit hedging."
    examples:
      - "The vendor says the delay was unavoidable, whereas the audit links it to late planning."
      - "Both notices permit refunds, but only the second defines what counts as a cancellation."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: written-production.technical-position-paper
    cefr: B2
    track: written-production-mediation
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Write a structured position on a technical decision with a clear claim, relevant evidence, and explicit trade-offs."
    advisory_prerequisites:
      strong: [written-production.reasoned-recommendation, written-production.system-overview]
      soft: [us-tech.tradeoff-summary]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.i-suggest, word.recommendation, word.impact]
    contexts: [architecture-decision, tool-adoption-proposal]
    typical_errors:
      - "Opening with background for too long and leaving the actual position implicit."
      - "Using categorical Russian-style claims without evidence or calibrated limits."
      - "Listing advantages and disadvantages without connecting them to the stated decision criteria."
    examples:
      - "I recommend retaining the queue because it isolates traffic spikes and limits data loss. Its added operational cost is justified for the payment path."
      - "The local model is cheaper to run, but it does not meet the accuracy requirement. We should therefore keep the hosted option for final classification."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: written-production.multi-source-synthesis
    cefr: B2
    track: written-production-mediation
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Synthesize compatible and conflicting information from multiple short texts without presenting the sources as a list."
    advisory_prerequisites:
      strong: [reading.compare-source-claims, written-production.paraphrase-summary]
      soft: [written-production.system-overview]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.summary, chunk.according-to, word.result]
    contexts: [research-summary, incident-evidence-synthesis]
    typical_errors:
      - "Writing one paragraph per source and never combining related findings."
      - "Copying source wording too closely instead of producing an independent paraphrase."
      - "Suppressing a genuine disagreement to make the Russian summary sound more definite."
    examples:
      - "The logs and customer reports both place the first failures after the release, but they disagree about which region was affected first."
      - "Across the three reviews, setup time is the consistent weakness; only the internal trial also identifies unstable exports."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: us-tech.architecture-tradeoff
    cefr: B2
    track: us-tech-english
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Argue for an architecture option by relating constraints, operational risks, maintainability, and expected value."
    advisory_prerequisites:
      strong: [us-tech.tradeoff-summary, us-tech.requirement-rationale]
      soft: [written-production.technical-position-paper]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-main-risk-is, word.option, word.impact]
    contexts: [design-review, platform-migration]
    typical_errors:
      - "Calling one architecture the best without naming the constraint that makes it preferable."
      - "Using the false friend actual to mean current when describing the present system."
      - "Treating maintainability, cost, and reliability as isolated lists rather than interacting trade-offs."
    examples:
      - "A managed queue reduces operational effort, but it increases vendor dependence and per-request cost."
      - "The modular design delays the first release; in return, it contains failures and makes later replacement cheaper."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: written-interaction.decision-challenge
    cefr: B2
    track: written-interaction
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Challenge a proposed decision in writing by testing its assumptions, evidence, and consequences while preserving collaboration."
    advisory_prerequisites:
      strong: [written-interaction.constructive-challenge, written-interaction.negotiating-scope]
      soft: [written-production.reasoned-recommendation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [informal.not-sure-i-agree, word.reason, word.option]
    contexts: [design-review-comment, planning-thread]
    typical_errors:
      - "Translating «я не согласен» as a bare I disagree without acknowledging the shared goal."
      - "Challenging the person or their competence instead of the decision's assumption."
      - "Raising a risk without proposing evidence, a test, or an alternative."
    examples:
      - "I share the goal of simplifying deployment, but the proposal assumes every client can upgrade at once. Could we test that assumption against the support data?"
      - "The faster option may work for this release; however, it leaves the recovery requirement unmet."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: grammar.passive.reporting-structures
    cefr: B2
    track: grammar-engine
    module: b2.2-advanced-grammar-and-style
    can_do: "Use passive reporting structures to present attributed claims while controlling distance and certainty."
    advisory_prerequisites:
      strong: [grammar.passive.expanded-process, grammar.reported-speech.work-updates]
      soft: [grammar.modals.deduction-obligation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [chunk.according-to, word.result, word.reason]
    contexts: [research-summary, incident-communication]
    typical_errors:
      - "Using It is said that without a real source, copying an impersonal Russian reporting pattern."
      - "Confusing He is believed to fix with He is believed to have fixed for a prior action."
      - "Using the passive structure to hide essential attribution rather than to calibrate distance."
    examples:
      - "The outage is believed to have started during the certificate rotation."
      - "It has been reported that the new filter reduces false alerts."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: grammar.inversion.emphasis
    cefr: B2
    track: grammar-engine
    module: b2.2-advanced-grammar-and-style
    can_do: "Use inversion after a restrictive or negative opening to emphasize an exceptional condition or outcome."
    advisory_prerequisites:
      strong: [grammar.basic-word-order, grammar.connectors.cause-contrast]
      soft: [grammar.past-perfect.sequence]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: []
    contexts: [formal-recommendation, incident-emphasis]
    typical_errors:
      - "Keeping normal statement order after Never or Only then because Russian does not require auxiliary inversion."
      - "Inverting the verb inside the subordinate clause after Only when instead of the main clause."
      - "Using formal inversion repeatedly in ordinary chat, creating an unnatural register."
    examples:
      - "Only after the rollback did the error rate return to normal."
      - "Rarely have we seen such a clear difference between the two models."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: grammar.modal-perfect.speculation
    cefr: B2
    track: grammar-engine
    module: b2.2-advanced-grammar-and-style
    can_do: "Evaluate possible, probable, and counterfactual explanations for a past event with modal perfect forms."
    advisory_prerequisites:
      strong: [grammar.modals.deduction-obligation, grammar.past-perfect.sequence]
      soft: [us-tech.incident-root-cause]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [word.reason, word.cause, word.result]
    contexts: [fault-investigation, missed-appointment-explanation]
    typical_errors:
      - "Using must have for an obligation in the past instead of a strong inference."
      - "Replacing might have failed with maybe it failed and losing the calibrated degree of certainty."
      - "Using could have not instead of could not have or might not have."
    examples:
      - "The worker may have retried the request before the lock expired."
      - "She cannot have received the notice because the address was incomplete."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: grammar.participle-clauses.compression
    cefr: B2
    track: grammar-engine
    module: b2.2-advanced-grammar-and-style
    can_do: "Compress related information with a participle clause while keeping its actor and time relationship unambiguous."
    advisory_prerequisites:
      strong: [grammar.relative-clauses.specification, grammar.past-participle.forms]
      soft: [grammar.passive.expanded-process]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [word.because, word.result]
    contexts: [technical-report, formal-process-description]
    typical_errors:
      - "Creating a dangling participle whose understood actor differs from the main-clause subject."
      - "Using an -ing clause for an earlier completed action when having + past participle is needed."
      - "Compressing too many relations and leaving cause, time, or contrast ambiguous."
    examples:
      - "Having verified the backup, the engineer started the migration."
      - "Running on a smaller instance, the service reaches its memory limit sooner."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: grammar.cleft-sentences.focus
    cefr: B2
    track: grammar-engine
    module: b2.2-advanced-grammar-and-style
    can_do: "Use a cleft sentence to place deliberate focus on the decisive person, condition, reason, or result."
    advisory_prerequisites:
      strong: [grammar.relative-clauses.specification, grammar.basic-word-order]
      soft: [grammar.inversion.emphasis]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [word.reason, word.result]
    contexts: [root-cause-emphasis, decision-clarification]
    typical_errors:
      - "Copying Russian free word order instead of building the full It was ... that structure."
      - "Using which after a person in a cleft when who or that is expected."
      - "Focusing information that is already obvious and making the sentence needlessly heavy."
    examples:
      - "It was the expired token that caused the repeated failures."
      - "What the client needs is a stable export format."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: word-formation.academic-nominalization
    cefr: B2
    track: word-formation
    module: b2.2-advanced-grammar-and-style
    can_do: "Recognize and form common nominalizations to package a process, result, or quality as a concept in formal writing."
    advisory_prerequisites:
      strong: [word-formation.quality-suffix, word-formation.agent-and-noun-suffix]
      soft: [written-production.technical-position-paper]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.requirement, word.improvement, word.agreement]
    contexts: [formal-report, research-summary]
    typical_errors:
      - "Adding -tion or -ment mechanically to a verb when English uses a different noun form."
      - "Overusing nominalizations under the influence of Russian official style and obscuring who acts."
      - "Using the noun where the sentence requires an adjective or verb."
    examples:
      - "The evaluation revealed a substantial improvement in response time."
      - "Implementation of the control requires approval from the security team."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: word-formation.prefix-stance
    cefr: B2
    track: word-formation
    module: b2.2-advanced-grammar-and-style
    can_do: "Infer how an unfamiliar formal word's prefix changes degree, relation, or evaluation in its sentence."
    advisory_prerequisites:
      strong: [word-formation.surpass-out, word-formation.degree-over-under]
      soft: [reading.compare-source-claims]
    dimensions: [recognition, transfer]
    lexicon: [word.overload, word.underestimate, word.overwrite]
    contexts: [academic-reading, technical-analysis]
    typical_errors:
      - "Assigning the same Russian translation to a prefix in every word regardless of context."
      - "Treating an apparent initial sequence as a prefix when the word is not productively derived."
      - "Inferring a negative stance from under- or over- without checking whether it marks degree instead."
    examples:
      - "The report may underestimate the maintenance cost."
      - "A semi-automated review combines scripted checks with human judgment."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: reading.argument-structure
    cefr: B2
    track: reading
    module: b2.3-research-and-documentation
    can_do: "Map a text's central claim, supporting reasons, evidence, counterpoint, and conclusion."
    advisory_prerequisites:
      strong: [reading.compare-source-claims, reading.main-idea-details]
      soft: [written-production.reasoned-recommendation]
    dimensions: [recognition, transfer]
    lexicon: [word.reason, word.result, word.because]
    contexts: [opinion-article, technical-proposal]
    typical_errors:
      - "Calling the topic the claim instead of identifying the position the author defends."
      - "Treating an illustrative example as independent evidence for a different conclusion."
      - "Missing an implicit Russian-to-English contrast marker and attaching a counterpoint to the wrong claim."
    examples:
      - "The proposal argues for staged deployment. Its main reason is that failures can be isolated before all users are affected."
      - "Although setup is slower, the author concludes that the control is worthwhile because recovery becomes predictable."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: reading.author-stance-bias
    cefr: B2
    track: reading
    module: b2.3-research-and-documentation
    can_do: "Identify an author's degree of commitment, evaluative stance, and relevant signs of bias in a connected text."
    advisory_prerequisites:
      strong: [reading.implied-online-stance, written-production.fact-inference]
      soft: [reading.compare-source-claims]
    dimensions: [recognition, transfer]
    lexicon: [word.agree, word.disagree, informal.not-sure-i-agree]
    contexts: [product-review, public-commentary]
    typical_errors:
      - "Reading probably or appears to as certainty because the qualifier has no prominent Russian equivalent."
      - "Equating a critical tone with factual inaccuracy without examining the evidence."
      - "Ignoring loaded adjectives that reveal evaluation while focusing only on explicit opinion phrases."
    examples:
      - "The reviewer calls the redesign 'supposedly simpler,' signaling doubt about the claim."
      - "The report cautiously supports the change but notes that the sample is unusually small."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: reading.evidence-quality
    cefr: B2
    track: reading
    module: b2.3-research-and-documentation
    can_do: "Judge whether cited evidence is relevant and sufficient for the specific claim a text makes."
    advisory_prerequisites:
      strong: [reading.argument-structure, reading.author-stance-bias]
      soft: [written-production.fact-inference]
    dimensions: [recognition, transfer]
    lexicon: [informal.do-you-have-a-source, word.reason, word.result]
    contexts: [consumer-claim-review, technical-proposal]
    typical_errors:
      - "Accepting a statistic as strong evidence without checking what population it describes."
      - "Treating correlation as proof of cause, a common shortcut in translated summaries."
      - "Rejecting relevant qualitative evidence merely because it is not numerical."
    examples:
      - "A survey of ten volunteers cannot support a claim about all customers."
      - "The benchmark is relevant to speed, but it does not test the reliability claim."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: written-production.executive-summary
    cefr: B2
    track: written-production-mediation
    module: b2.3-research-and-documentation
    can_do: "Write a concise executive summary that prioritizes purpose, material findings, implications, and the decision required."
    advisory_prerequisites:
      strong: [written-production.multi-source-synthesis, written-production.system-overview]
      soft: [reading.argument-structure]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.summary, chunk.the-main-risk-is, word.recommendation]
    contexts: [leadership-brief, project-decision]
    typical_errors:
      - "Retelling the document in chronological order instead of prioritizing decision-relevant findings."
      - "Using Russian bureaucratic openings that delay the purpose of the summary."
      - "Including detail without stating its implication or the decision requested."
    examples:
      - "The pilot met its accuracy target but doubled review time. We recommend a limited rollout while the workflow is simplified."
      - "The migration remains feasible for Friday; the main risk is an untested recovery path, so approval is needed for an additional rehearsal."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: us-tech.specification-rationale
    cefr: B2
    track: us-tech-english
    module: b2.3-research-and-documentation
    can_do: "Write a specification rationale that links requirements to evidence, constraints, rejected alternatives, and verification."
    advisory_prerequisites:
      strong: [us-tech.requirement-rationale, written-production.technical-position-paper]
      soft: [reading.evidence-quality]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-main-requirement-is, word.requirement, chunk.expected-result]
    contexts: [api-specification, security-control-design]
    typical_errors:
      - "Restating the requirement as its own justification instead of linking it to evidence or a constraint."
      - "Using actual for current and control for inspection under Russian false-friend influence."
      - "Naming a rejected alternative without explaining the criterion it failed."
    examples:
      - "Requests carry an idempotency key because mobile clients may retry after a timeout. Server-generated keys were rejected because they cannot identify the original attempt."
      - "The field is required so that every export can be traced to its policy version."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: written-interaction.negotiate-priorities
    cefr: B2
    track: written-interaction
    module: b2.4-professional-negotiation
    can_do: "Negotiate competing priorities in writing and make the resulting ownership, trade-off, and decision explicit."
