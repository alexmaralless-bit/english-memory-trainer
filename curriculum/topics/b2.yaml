      strong: [reading.compare-source-claims, written-production.paraphrase-summary]
      soft: [written-production.system-overview]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: []

  - id: us-tech.architecture-tradeoff
    cefr: B2
    track: us-tech-english
