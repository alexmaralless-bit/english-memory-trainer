topics:
  - id: grammar.third-conditional.retrospective
    cefr: B2
    track: grammar-engine
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Explain how a different past action could have changed a completed outcome by using the third conditional."
    advisory_prerequisites:
      strong: [grammar.second-conditional.hypothetical, grammar.past-perfect.sequence]
      soft: [written-production.cause-effect-explanation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: []

  - id: grammar.mixed-conditionals.consequences
    cefr: B2
    track: grammar-engine
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Connect a past condition to a present consequence, or a persistent condition to a past outcome, with a mixed conditional."
    advisory_prerequisites:
      strong: [grammar.third-conditional.retrospective, grammar.second-conditional.hypothetical]
      soft: [grammar.present-perfect.duration]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: []

  - id: reading.compare-source-claims
    cefr: B2
    track: reading
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Compare how two texts frame the same issue and identify where their claims, evidence, or assumptions differ."
    advisory_prerequisites:
      strong: [reading.connected-technical-explanation, reading.implied-online-stance]
      soft: [written-production.fact-inference]
    dimensions: [recognition, transfer]
    lexicon: []

  - id: written-production.technical-position-paper
    cefr: B2
    track: written-production-mediation
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Write a structured position on a technical decision with a clear claim, relevant evidence, and explicit trade-offs."
    advisory_prerequisites:
      strong: [written-production.reasoned-recommendation, written-production.system-overview]
      soft: [us-tech.tradeoff-summary]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: []

  - id: written-production.multi-source-synthesis
    cefr: B2
    track: written-production-mediation
    module: b2.1-technical-argumentation-and-synthesis
    can_do: "Synthesize compatible and conflicting information from multiple short texts without presenting the sources as a list."
