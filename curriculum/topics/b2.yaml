  - id: toefl-writing.integrated-synthesis
    cefr: B2
    track: toefl-reading-writing
    module: b2.7-toefl-synthesis-and-discussion
    can_do: "Use notes from multiple short texts to write an attributed synthesis organized by ideas rather than by source order."
    advisory_prerequisites:
      strong: [toefl-writing.source-note-taking, written-production.multi-source-synthesis]
      soft: [reading.compare-source-claims]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.according-to, word.summary, word.result]
    contexts: [integrated-writing, multi-source-response]
    typical_errors:
      - "Writing one source summary after another rather than organizing by shared issues."
      - "Blending source positions until the reader cannot tell who supports which claim."
      - "Adding unsupported personal opinion to a task that asks for source synthesis."
    examples:
      - "Both sources link the population decline to habitat loss, but they differ on timing. The field report identifies a recent acceleration, whereas the historical records show a slower century-long trend."
      - "The proposal predicts lower energy use, while the audit questions the assumed occupancy rate. Their disagreement therefore concerns the model's input rather than the value of efficiency itself."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: toefl-writing.thesis-position
    cefr: B2
    track: toefl-reading-writing
    module: b2.7-toefl-synthesis-and-discussion
    can_do: "Formulate a specific, defensible thesis that directly answers an academic prompt and controls the response that follows."
    advisory_prerequisites:
      strong: [toefl-writing.discussion-claim-reason, written-production.technical-position-paper]
      soft: [reading.argument-structure]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.reason, word.recommendation]
    contexts: [academic-essay, discussion-response]
    typical_errors:
      - "Writing a topic announcement such as I will discuss instead of a defensible position."
      - "Using an absolute thesis that the available example cannot reasonably support."
      - "Copying the Russian prompt structure and leaving the controlling reason unstated."
    examples:
      - "Universities should fund open digital textbooks for introductory courses because predictable access matters more than minor gains from frequent editions. This thesis states both the decision and its controlling reason."
      - "Remote work should remain optional rather than universal. Different tasks require different levels of coordination and quiet concentration."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: toefl-writing.argument-development
    cefr: B2
    track: toefl-reading-writing
    module: b2.7-toefl-synthesis-and-discussion
    can_do: "Develop an academic argument with relevant reasoning, a concrete example, and an explicit link back to the thesis."
    advisory_prerequisites:
      strong: [toefl-writing.thesis-position, reading.evidence-quality]
      soft: [written-production.counterargument-response]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.reason, word.because, word.result]
    contexts: [academic-essay, discussion-board]
    typical_errors:
      - "Moving from claim to example without explaining how the example proves the point."
      - "Using a memorized universal example about society that does not fit the prompt."
      - "Repeating the thesis in different words instead of adding a causal step or consequence."
    examples:
      - "Public libraries should lend basic tools as well as books because occasional users cannot justify buying them. In one neighborhood trial, residents completed small repairs while borrowing each tool only a few times."
      - "A short planning stage improves group work by exposing incompatible assumptions early. When our class defined each role before research began, duplicate work fell and the final report was more coherent."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: toefl-writing.cohesion
    cefr: B2
    track: toefl-reading-writing
    module: b2.7-toefl-synthesis-and-discussion
    can_do: "Create cohesion across an academic response with logical progression, accurate reference, and transitions that express real relationships."
    advisory_prerequisites:
      strong: [toefl-reading.paragraph-organization, written-production.multi-source-synthesis]
      soft: [grammar.connectors.cause-contrast]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.although, word.because, word.result]
    contexts: [academic-response, revision-task]
    typical_errors:
      - "Adding moreover or however mechanically where the logical relation does not match."
      - "Using this or it without a clear noun referent, especially after several possible Russian antecedents."
      - "Repeating the same noun in every sentence instead of using controlled reference and progression."
    examples:
      - "The city expanded the cycle network, but winter use remained low. This seasonal limit does not erase the safety gains reported during the rest of the year."
      - "Small classes permit frequent feedback. Because that feedback arrives while students are still drafting, they can revise their reasoning rather than only correct the final text."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: toefl-writing.academic-register
    cefr: B2
    track: toefl-reading-writing
    module: b2.7-toefl-synthesis-and-discussion
    can_do: "Maintain a clear academic register by controlling stance, precision, attribution, and unnecessary informality."
    advisory_prerequisites:
      strong: [reading.author-stance-bias, word-formation.academic-nominalization]
      soft: [everyday-online-informal.tone-repair]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.according-to, word.result, word.reason]
    contexts: [academic-essay, source-based-response]
    typical_errors:
      - "Using conversational fillers such as you know or a lot of in formal analysis."
      - "Replacing cautious source language with categorical Russian-style certainty."
      - "Overloading the response with nominalizations to imitate academic style and obscuring the action."
    examples:
      - "The findings suggest that later start times may improve attendance; they do not establish a universal effect. This wording preserves the study's limited claim."
      - "The policy created substantial administrative work, yet its effect on access remains uncertain. A precise verb and a calibrated conclusion keep the register formal without becoming inflated."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}

  - id: toefl-writing.discussion-response
    cefr: B2
    track: toefl-reading-writing
    module: b2.7-toefl-synthesis-and-discussion
    can_do: "Respond to another participant's academic viewpoint by extending, qualifying, or challenging it with an original supported contribution."
    advisory_prerequisites:
      strong: [toefl-writing.discussion-claim-reason, written-production.counterargument-response]
      soft: [written-interaction.decision-challenge]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.agree, word.disagree, informal.not-sure-i-agree]
    contexts: [discussion-board, peer-response]
    typical_errors:
      - "Writing I agree followed by a paraphrase of the previous post and no original contribution."
      - "Rejecting a peer's position in blunt translated language instead of delimiting the disagreement."
      - "Introducing an example that is interesting but unrelated to the shared academic question."
    examples:
      - "Mina is right that public transport reduces congestion, but reliability matters as much as route coverage. A bus that frequently misses its schedule cannot replace a private car for time-sensitive trips."
      - "I would qualify Tomas's claim that online courses always widen access. They remove travel barriers, yet students with unstable internet may face a new form of exclusion."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 75, independent_attempts: 2}, controlled_production: {active_threshold: 78, independent_attempts: 2}, spontaneous_production: {active_threshold: 78, independent_attempts: 2}, transfer: {active_threshold: 80, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 45, retention_confirmations: 2}}
