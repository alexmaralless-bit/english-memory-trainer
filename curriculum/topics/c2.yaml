topics:
  - id: grammar.marked-word-order.rhetoric
    cefr: C2
    track: grammar-engine
    module: c2.1-editorial-precision-and-audience-adaptation
    can_do: "Use marked word order for deliberate rhetorical emphasis while preserving clarity and avoiding accidental distortion."
    advisory_prerequisites:
      strong: [grammar.inversion.formal-emphasis, grammar.reference-cohesion]
      soft: [grammar.cleft-sentences.focus]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [word.rhetoric, chunk.marked-word-order-rhetoric.adjective-though-it, chunk.marked-word-order-rhetoric.among-the-most, chunk.marked-word-order-rhetoric.crucial-though-they-were, chunk.marked-word-order-rhetoric.direct-object-fronting, chunk.marked-word-order-rhetoric.into-this-came, chunk.marked-word-order-rhetoric.little-did-they, chunk.marked-word-order-rhetoric.never-before-had, chunk.marked-word-order-rhetoric.not-only-did, chunk.marked-word-order-rhetoric.nowhere-was-this, chunk.marked-word-order-rhetoric.only-then-did, chunk.marked-word-order-rhetoric.remarkable-as-it-was, chunk.marked-word-order-rhetoric.so-adjective-was, chunk.marked-word-order-rhetoric.such-was-that, chunk.marked-word-order-rhetoric.what-clause-was]
    contexts: [editorial-argument, executive-address]
    typical_errors:
      - "Moving a phrase to the front as in Russian prose without supplying the English structure that marks its relation."
      - "Using marked order so often that no element retains genuine rhetorical prominence."
      - "Allowing emphasis to suggest an unintended contrast or exclusion."
    examples:
      - "What the inquiry did not establish was whether the failure had been deliberate."
      - "Into this already fragile process came a requirement that no team had budgeted for."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 85, independent_attempts: 3}, controlled_production: {active_threshold: 88, independent_attempts: 3}, spontaneous_production: {active_threshold: 88, independent_attempts: 3}, transfer: {active_threshold: 90, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 90, retention_confirmations: 3}}

  - id: grammar.ellipsis-substitution
    cefr: C2
    track: grammar-engine
    module: c2.1-editorial-precision-and-audience-adaptation
    can_do: "Use ellipsis and substitution to remove needless repetition without making the omitted meaning or reference uncertain."
    advisory_prerequisites:
      strong: [grammar.reference-cohesion, grammar.relative-clauses.specification]
      soft: [written-production.style-revision]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.substitution, word.nominal, chunk.ellipsis-substitution.and-that, chunk.ellipsis-substitution.as-expected, chunk.ellipsis-substitution.be-so-too, chunk.ellipsis-substitution.but-not, chunk.ellipsis-substitution.can-have, chunk.ellipsis-substitution.can-one, chunk.ellipsis-substitution.did-it-work, chunk.ellipsis-substitution.do-so-instead, chunk.ellipsis-substitution.does-not-either, chunk.ellipsis-substitution.does-the, chunk.ellipsis-substitution.former-latter, chunk.ellipsis-substitution.had-not-yet, chunk.ellipsis-substitution.if-not, chunk.ellipsis-substitution.just-as, chunk.ellipsis-substitution.likewise, chunk.ellipsis-substitution.likewise-has, chunk.ellipsis-substitution.neither-can, chunk.ellipsis-substitution.nor-would, chunk.ellipsis-substitution.ones-plural, chunk.ellipsis-substitution.opposite-is-true, chunk.ellipsis-substitution.same-goes-for, chunk.ellipsis-substitution.so-did, chunk.ellipsis-substitution.so-have, chunk.ellipsis-substitution.so-will, chunk.ellipsis-substitution.some-others-dont, chunk.ellipsis-substitution.will-you, chunk.ellipsis-substitution.would-be-too, chunk.ellipsis-substitution.would-have-too]
    contexts: [formal-comparison, editorial-revision]
    typical_errors:
      - "Omitting a verb that English cannot recover merely because Russian permits a verbless parallel."
      - "Using one or do so when the substitute changes number, tense, or semantic content."
      - "Removing repeated terminology that was needed to distinguish two technical referents."
    examples:
      - "The first model predicts short-term demand; the second does not."
      - "Some regions adopted the standard in 2024, and the remaining regions did so a year later."
