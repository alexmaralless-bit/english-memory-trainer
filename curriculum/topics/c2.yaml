      soft: [reading.ambiguity-resolution]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.lexical, word.syntactic, word.nominal, chunk.syntactic-ambiguity-control.all-except, chunk.syntactic-ambiguity-control.antecedent, chunk.syntactic-ambiguity-control.as-intended, chunk.syntactic-ambiguity-control.both-and, chunk.syntactic-ambiguity-control.coordinate-parallel, chunk.syntactic-ambiguity-control.dangling-participle, chunk.syntactic-ambiguity-control.each-of, chunk.syntactic-ambiguity-control.either-or, chunk.syntactic-ambiguity-control.instead-of, chunk.syntactic-ambiguity-control.neither-nor, chunk.syntactic-ambiguity-control.not-only, chunk.syntactic-ambiguity-control.only-not, chunk.syntactic-ambiguity-control.only-scope, chunk.syntactic-ambiguity-control.passive-agent, chunk.syntactic-ambiguity-control.respectively, chunk.syntactic-ambiguity-control.restrict-only, chunk.syntactic-ambiguity-control.scope-placement, chunk.syntactic-ambiguity-control.sequencing, chunk.syntactic-ambiguity-control.such-result, chunk.syntactic-ambiguity-control.that-clause, chunk.syntactic-ambiguity-control.that-vs-which, chunk.syntactic-ambiguity-control.the-latter, chunk.syntactic-ambiguity-control.which-non-restrictive, chunk.syntactic-ambiguity-control.who-vs-that, chunk.syntactic-ambiguity-control.with-attachment]
