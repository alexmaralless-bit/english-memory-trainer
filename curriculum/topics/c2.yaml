  - id: everyday-online-informal.audience-specific-voice
    cefr: C2
    track: everyday-online-informal
    module: c2.4-language-innovation-and-voice
    can_do: "Create an authentic informal voice for a specific online community while controlling implication, humor, accessibility, and reputational risk."
    advisory_prerequisites:
      strong: [everyday-online-informal.code-switching, everyday-online-informal.subtle-humor]
      soft: [written-production.audience-adaptation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [informal.ill-get-back-to-you, informal.not-sure-i-agree, informal.lets-keep-this-constructive]
    contexts: [professional-community, hobby-forum]
    typical_errors:
      - "Adding fashionable slang that is current elsewhere but inauthentic for the target community."
      - "Copying Russian in-group humor whose implied target becomes hostile in English."
      - "Prioritizing an entertaining voice over accessibility, factual precision, or reputational risk."
    examples:
      - "In a developer forum, the reply is concise and evidence-led: 'I cannot reproduce this on version 4.2; could you share the configuration?'"
