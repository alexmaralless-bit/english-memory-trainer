  - id: word-formation.neologism-interpretation
    cefr: C2
    track: word-formation
    module: c2.4-language-innovation-and-voice
    can_do: "Infer the likely meaning, stance, and register of a plausible unfamiliar coinage from its components and discourse context."
    advisory_prerequisites:
      strong: [word-formation.register-shift, word-formation.prefix-stance]
      soft: [toefl-reading.vocabulary-context]
    dimensions: [recognition, transfer]
    lexicon: [word.overload, word.underestimate, word.overwrite]
    contexts: [technology-commentary, cultural-criticism]
    typical_errors:
      - "Assigning a standard dictionary meaning to a new formation without considering the author's stance."
      - "Treating any unusual compound as an error because Russian would express the idea with a phrase."
      - "Inferring register from an affix alone while ignoring the publication and surrounding irony."
    examples:
      - "In 'meeting-proof software,' the suffix-like element suggests software designed to resist disruption during meetings, with a mildly humorous tone."
      - "The writer calls the policy 'underconsulted,' implying insufficient public consultation rather than a technical procedural category."
    explanation_language: ru-allowed
