  - id: written-interaction.multi-party-alignment
    cefr: C1
    track: written-interaction
    module: c1.4-professional-and-public-discourse
    can_do: "Write an alignment message that reconciles multiple positions and records decisions, dissent, owners, and unresolved dependencies."
    advisory_prerequisites:
      strong: [written-interaction.negotiate-priorities, written-interaction.resolve-ambiguity]
      soft: [written-production.critical-synthesis]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.priority, word.agreement, word.action]
    contexts: [cross-team-decision, stakeholder-summary]
    typical_errors:
      - "Writing we agreed when one party explicitly recorded dissent."
      - "Listing viewpoints without translating them into decisions, owners, and dependencies."
      - "Using vague Russian collective responsibility instead of naming who acts."
    examples:
      - "Product and Support accept the staged launch; Security prefers a delay but will not block it if the audit log ships first."
      - "Mia owns the migration plan, Leon confirms vendor access, and the unresolved licensing question returns to Finance on Monday."
