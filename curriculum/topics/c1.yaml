  - id: everyday-life.bureaucratic-document-navigation
    cefr: C1
    track: everyday-life
    module: c1.4-professional-and-public-discourse
    can_do: "Interpret a dense administrative document, identify obligations and appeal routes, and explain the practical next action."
    advisory_prerequisites:
      strong: [reading.public-information-comparison, reading.evidence-quality]
      soft: [everyday-life.complex-service-negotiation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.requirement, word.service, word.action]
    contexts: [residency-notice, insurance-decision]
    typical_errors:
      - "Treating shall, may, and must as interchangeable Russian official-language markers."
      - "Missing that the appeal deadline starts from receipt rather than the printed date."
      - "Confusing an eligibility condition with a document that merely proves it."
    examples:
      - "The notice requires a response within fourteen days of delivery and provides a separate form for an appeal."
      - "Coverage is denied only for treatment begun before enrollment; the next action is to submit evidence of the later start date."
