  - id: written-interaction.diplomatic-refusal
    cefr: C1
    track: written-interaction
    module: c1.4-professional-and-public-discourse
    can_do: "Refuse a significant request diplomatically while making the constraint, rationale, and viable alternative unmistakable."
    advisory_prerequisites:
      strong: [written-interaction.diplomatic-escalation, written-interaction.negotiate-priorities]
      soft: [grammar.hedging-stance.control]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.reason, word.option, chunk.i-suggest]
    contexts: [client-request, cross-team-negotiation]
    typical_errors:
      - "Translating «это невозможно» as a bare impossible without naming the binding constraint."
      - "Hedging so heavily that the recipient cannot tell the request has been refused."
      - "Offering an alternative that does not address the underlying need."
    examples:
      - "We cannot release the raw records because they contain third-party identifiers. We can provide an aggregated export by Friday."
      - "I am unable to approve the full scope this quarter, but I can reserve capacity for the compliance work and review the remaining items in October."
