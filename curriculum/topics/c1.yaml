    cefr: C1
    track: us-tech-english
    module: c1.4-professional-and-public-discourse
    can_do: "Write a governance brief that distinguishes technical uncertainty, operational exposure, controls, ownership, and escalation criteria."
    advisory_prerequisites:
      strong: [us-tech.incident-postmortem, us-tech.strategic-technical-brief]
      soft: [written-production.evidence-qualified-argument]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-main-risk-is, word.impact, word.action]
    contexts: [risk-committee, control-review]
    typical_errors:
      - "Combining uncertainty and exposure into one vague risk rating."
      - "Calling a safeguard a guarantee and overstating what the control can prevent."
      - "Assigning responsibility to the team without a named decision owner or escalation trigger."
    examples:
      - "Model drift is uncertain, but the operational exposure is bounded because every high-value decision receives human review."
