topics:
  - id: toefl-reading.dense-passage-synthesis
    cefr: C1
    track: toefl-reading-writing
    module: c1.5-toefl-advanced-performance
    can_do: "Synthesize the controlling argument, qualifications, and key evidence of a dense academic passage without flattening its internal distinctions."
    advisory_prerequisites:
      strong: [toefl-reading.academic-main-idea, written-production.multi-source-synthesis]
      soft: [toefl-reading.text-organization]
    dimensions: [recognition, transfer]
    lexicon: [word.summary, word.although]
    contexts: [dense-academic-passage, argument-synthesis]
    typical_errors:
      - "Flattening a qualified argument into one categorical Russian summary sentence."
      - "Giving equal weight to a minor illustration and the evidence that controls the conclusion."
      - "Preserving paragraph order but losing the hierarchy among claim, qualification, and implication."
    examples:
      - "The study finds that shared offices increase informal exchange, but only for teams with overlapping schedules. Its broader claim is therefore conditional: proximity helps when colleagues are present at the same time."
      - "The author rejects a single-cause account of migration while retaining climate as one contributing pressure. Economic networks explain where movement occurs, whereas environmental change helps explain when it intensifies."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: toefl-reading.implicit-qualification
    cefr: C1
    track: toefl-reading-writing
    module: c1.5-toefl-advanced-performance
    can_do: "Recognize an author's implicit limitation, reservation, or degree of commitment when it is distributed across a passage."
    advisory_prerequisites:
      strong: [toefl-reading.inference, reading.author-stance-bias]
      soft: [toefl-reading.rhetorical-purpose]
    dimensions: [recognition, transfer]
    lexicon: [word.although, word.reason]
    contexts: [dense-academic-passage, stance-analysis]
    typical_errors:
      - "Treating the absence of an explicit but as proof that the author has no reservation."
      - "Missing distributed hedging when the limitation appears several sentences after the headline claim."
      - "Converting a narrow exception into complete rejection, following an all-or-nothing Russian paraphrase."
    examples:
      - "The author initially calls the reform effective, then notes that participation rose only in well-funded districts. The later distributional limit qualifies the earlier praise."
      - "No sentence directly rejects the standard model. Nevertheless, repeated references to unmeasured variables show that the author regards its predictions as provisional."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: toefl-writing.source-integration
    cefr: C1
    track: toefl-reading-writing
    module: c1.5-toefl-advanced-performance
    can_do: "Integrate source material into an academic response with accurate attribution, proportionate paraphrase, and a clear distinction from the writer's own analysis."
    advisory_prerequisites:
      strong: [toefl-writing.integrated-synthesis, toefl-writing.source-note-taking]
      soft: [toefl-writing.academic-register]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.according-to, word.summary, word.result]
    contexts: [integrated-writing, source-based-essay]
    typical_errors:
      - "Following a paraphrase with an unsupported claim so closely that source and writer voices merge."
      - "Changing the source's degree of certainty while translating its idea through Russian."
      - "Using long near-copy passages instead of proportionate paraphrase and analysis."
    examples:
      - "Rao attributes the decline mainly to changing land use, although her sample excludes coastal regions. That limitation matters because the proposed national policy would apply to those regions as well."
      - "The survey reports a preference for flexible schedules, not evidence of higher productivity. My conclusion therefore concerns employee choice rather than output."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: toefl-writing.counterargument-nuance
    cefr: C1
    track: toefl-reading-writing
    module: c1.5-toefl-advanced-performance
    can_do: "Address a strong counterargument by conceding its valid scope, identifying its limit, and refining the thesis accordingly."
    advisory_prerequisites:
      strong: [toefl-writing.discussion-response, written-production.counterargument-response]
      soft: [toefl-writing.thesis-position]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.agree, word.disagree, word.reason]
    contexts: [academic-essay, discussion-response]
    typical_errors:
      - "Using although I agree as a formula but conceding nothing specific."
      - "Refuting an exaggerated version of the opposing position rather than its strongest scope."
      - "Ending with the original absolute thesis after the concession logically requires refinement."
    examples:
      - "Critics correctly note that free transit alone cannot solve suburban access, where routes remain sparse. It can still reduce central congestion, so the policy is defensible as one part of a broader network plan."
      - "Standardized deadlines help instructors coordinate feedback across large courses. However, limited extensions should remain available when the same deadline creates unequal barriers."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: toefl-writing.timed-response-control
    cefr: C1
    track: toefl-reading-writing
    module: c1.5-toefl-advanced-performance
    can_do: "Plan, draft, and revise a complete academic response within a fixed time while preserving task fulfillment, structure, and language control."
    advisory_prerequisites:
      strong: [toefl-writing.argument-development, toefl-writing.discussion-response]
      soft: [toefl-writing.academic-email]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.summary, word.reason, word.result]
    contexts: [timed-writing, academic-response]
    typical_errors:
      - "Spending most of the available time translating an elaborate introduction from Russian."
      - "Adding a new argument during the final minutes instead of revising task coverage and clarity."
      - "Proofreading only articles and verb endings while leaving a missing thesis or unsupported paragraph."
    examples:
      - "The response first states a narrow thesis, then develops two reasons with one example each. The final review checks whether every paragraph answers the prompt before correcting local grammar."
      - "A concise outline reserves time for source attribution and revision. When the second reason proves weak, the writer strengthens the first rather than opening an unfinished third point."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: grammar.hedging-stance.control
    cefr: C1
    track: grammar-engine
    module: c1.1-professional-register-and-decision-memos
    can_do: "Calibrate a claim's strength with precise hedging, attribution, and stance instead of sounding either absolute or evasive."
    advisory_prerequisites:
      strong: [grammar.passive.reporting-structures, reading.author-stance-bias]
      soft: [toefl-writing.academic-register]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [chunk.as-far-as-i-understand, word.reason, word.result]
    contexts: [research-claim, risk-assessment]
    typical_errors:
      - "Replacing every Russian uncertainty marker with perhaps and losing distinctions in evidence strength."
      - "Stacking may, might, and possibly until the claim sounds evasive rather than calibrated."
      - "Removing the source's hedge in a summary and turning a limited finding into a fact."
    examples:
      - "The pattern is consistent with a caching fault, although the logs do not establish the cause."
      - "These results appear to support a limited rollout rather than a general release."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: grammar.inversion.formal-emphasis
    cefr: C1
    track: grammar-engine
    module: c1.1-professional-register-and-decision-memos
    can_do: "Use formal inversion selectively to foreground a limiting condition, sequence, or exceptional result without obscuring the argument."
    advisory_prerequisites:
      strong: [grammar.inversion.emphasis, grammar.cleft-sentences.focus]
      soft: [grammar.hedging-stance.control]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: []
    contexts: [decision-memo, formal-analysis]
    typical_errors:
      - "Using inversion after every fronted phrase instead of only licensed negative or restrictive openings."
      - "Leaving the auxiliary uninverted after Not only or Under no circumstances because Russian relies on word order alone for emphasis."
      - "Applying a highly formal pattern in routine correspondence where it distracts from the decision."
    examples:
      - "Only when the recovery test passes should the migration proceed."
      - "Not only did the change increase latency, but it also removed a diagnostic signal."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: written-production.decision-memo
    cefr: C1
    track: written-production-mediation
    module: c1.1-professional-register-and-decision-memos
    can_do: "Write a decision memo that frames the decision, weighs evidence and uncertainty, recommends action, and records residual risk."
    advisory_prerequisites:
      strong: [written-production.executive-summary, written-production.technical-position-paper]
      soft: [toefl-writing.counterargument-nuance]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.summary, chunk.the-main-risk-is, word.recommendation]
    contexts: [investment-decision, architecture-decision]
    typical_errors:
      - "Writing a chronological report instead of foregrounding the decision and recommendation."
      - "Using categorical Russian administrative prose that hides uncertainty and residual risk."
      - "Listing evidence without explaining how it changes the available options."
    examples:
      - "Decision: retain the managed service for one year. It meets the recovery target, while the cheaper alternative remains untested under peak load."
      - "We recommend a staged launch with a ten-percent cohort. This limits exposure while preserving evidence about real usage."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: written-interaction.executive-recommendation
    cefr: C1
    track: written-interaction
    module: c1.1-professional-register-and-decision-memos
    can_do: "Present a concise recommendation to a senior audience with an explicit ask, decision logic, uncertainty, and consequence of delay."
    advisory_prerequisites:
      strong: [written-interaction.negotiate-priorities, written-interaction.diplomatic-escalation]
      soft: [written-production.executive-summary]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.recommendation, word.priority, word.impact]
    contexts: [leadership-email, approval-request]
    typical_errors:
      - "Burying the requested decision beneath technical background."
      - "Using ASAP as a substitute for a clear deadline and consequence of delay."
      - "Presenting a precise forecast when the evidence supports only a range or scenario."
    examples:
      - "Please approve the controlled rollout by Thursday; a later decision moves the customer migration into the audit window."
      - "I recommend pausing the integration. We cannot yet quantify the failure rate, but one confirmed loss would exceed the expected schedule benefit."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: us-tech.strategic-technical-brief
    cefr: C1
    track: us-tech-english
    module: c1.1-professional-register-and-decision-memos
    can_do: "Translate a complex technical decision into a strategic brief that connects system constraints to business impact and governance."
    advisory_prerequisites:
      strong: [us-tech.architecture-tradeoff, us-tech.specification-rationale]
      soft: [written-production.decision-memo]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-main-requirement-is, chunk.the-main-risk-is, word.impact]
    contexts: [platform-strategy, executive-technology-brief]
    typical_errors:
      - "Reporting component details without translating them into business or governance consequences."
      - "Using actual to mean current and perspective to mean long-term outlook under Russian false-friend influence."
      - "Treating a technical constraint as immutable without distinguishing policy, cost, and physical limits."
    examples:
      - "The shared database accelerates delivery today, but it couples every regional release to one maintenance window."
      - "Encryption at the edge reduces central exposure; it also transfers key-recovery responsibility to each operating team."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: reading.implicit-assumptions
    cefr: C1
    track: reading
    module: c1.2-critical-reading-and-synthesis
    can_do: "Identify an unstated assumption that an argument requires and explain how the conclusion changes if it does not hold."
    advisory_prerequisites:
      strong: [reading.argument-structure, toefl-reading.inference]
      soft: [reading.evidence-quality]
    dimensions: [recognition, transfer]
    lexicon: [word.reason, word.result]
    contexts: [policy-argument, technical-proposal]
    typical_errors:
      - "Repeating an explicit premise instead of identifying what must be true but is unstated."
      - "Inventing a hidden motive from cultural expectations rather than a logical assumption."
      - "Treating the assumption as false simply because the text does not prove it."
    examples:
      - "The proposal predicts lower costs after automation, assuming that review volume will remain stable."
      - "The conclusion that longer hours improve access depends on students being able to reach the campus at night."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: reading.methodology-limitations
    cefr: C1
    track: reading
    module: c1.2-critical-reading-and-synthesis
    can_do: "Interpret how a text's method, sample, measurement, or scope limits the conclusions that can reasonably be drawn."
    advisory_prerequisites:
      strong: [reading.evidence-quality, toefl-reading.rhetorical-purpose]
      soft: [toefl-reading.implicit-qualification]
    dimensions: [recognition, transfer]
    lexicon: [informal.do-you-have-a-source, word.result, word.detail]
    contexts: [research-report, product-study]
    typical_errors:
      - "Calling a study invalid because it has a limitation instead of delimiting the supported conclusion."
      - "Generalizing from a narrow sample in the same categorical way common in compressed Russian summaries."
      - "Confusing a measurement limitation with evidence that the measured effect does not exist."
    examples:
      - "Because the trial excluded first-time users, it cannot establish whether the interface is easy to learn."
      - "Self-reported sleep estimates may preserve broad trends while overstating precise nightly differences."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: reading.cross-source-tension
    cefr: C1
    track: reading
    module: c1.2-critical-reading-and-synthesis
    can_do: "Explain a substantive tension between sources even when they use different terminology, evidence, or levels of analysis."
    advisory_prerequisites:
      strong: [reading.compare-source-claims, written-production.multi-source-synthesis]
      soft: [toefl-writing.source-integration]
    dimensions: [recognition, transfer]
    lexicon: [chunk.according-to, word.summary, word.result]
    contexts: [research-synthesis, policy-comparison]
    typical_errors:
      - "Looking only for direct contradiction and missing sources that disagree at different levels of analysis."
      - "Treating different terminology as different concepts without aligning the definitions."
      - "Forcing agreement by dropping qualifiers that make the findings genuinely incompatible."
    examples:
      - "The survey reports high satisfaction, but the usage logs show that most participants left after one week."
      - "One source explains regional variation through policy, while the other attributes the same pattern to infrastructure."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: written-production.critical-synthesis
    cefr: C1
    track: written-production-mediation
    module: c1.2-critical-reading-and-synthesis
    can_do: "Write a critical synthesis that organizes sources around a question, preserves disagreement, and evaluates the limits of the available evidence."
    advisory_prerequisites:
      strong: [reading.cross-source-tension, written-production.multi-source-synthesis]
      soft: [reading.methodology-limitations]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.according-to, word.summary, word.result]
    contexts: [literature-synthesis, decision-evidence-review]
    typical_errors:
      - "Organizing the response as a sequence of source summaries rather than around the research question."
      - "Evaluating a source with vague labels such as good or weak instead of naming the methodological limit."
      - "Erasing disagreement to produce a neat Russian-style conclusion."
    examples:
      - "The three studies agree that feedback timing matters, but only the controlled trial separates timing from instructor experience."
      - "Evidence for lower costs is consistent across short pilots; no source establishes whether the saving persists after maintenance increases."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: written-production.evidence-qualified-argument
    cefr: C1
    track: written-production-mediation
    module: c1.2-critical-reading-and-synthesis
    can_do: "Develop an argument whose scope and certainty remain proportionate to the quality and limitations of its evidence."
    advisory_prerequisites:
      strong: [reading.evidence-quality, toefl-writing.counterargument-nuance]
      soft: [grammar.hedging-stance.control]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.reason, word.result, word.recommendation]
    contexts: [policy-recommendation, research-based-proposal]
    typical_errors:
      - "Making a universal claim from a single local example."
      - "Using obviously or undoubtedly to imitate forceful Russian argumentative style."
      - "Adding a limitation at the end without narrowing the recommendation it affects."
    examples:
      - "The pilot supports extending the service to comparable urban sites, but rural performance should be tested separately."
      - "Current evidence justifies monitoring rather than prohibition because the observed association does not establish cause."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: grammar.reference-cohesion
    cefr: C1
    track: grammar-engine
    module: c1.3-advanced-style-and-cohesion
    can_do: "Maintain unambiguous reference across a dense paragraph by controlling pronouns, demonstratives, repetition, and lexical substitution."
    advisory_prerequisites:
      strong: [toefl-writing.cohesion, grammar.relative-clauses.specification]
      soft: [written-production.multi-source-synthesis]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.summary]
    contexts: [technical-report, academic-paragraph]
    typical_errors:
      - "Using it, this, or they when two preceding nouns are equally plausible antecedents."
      - "Copying Russian pronoun omission and leaving the English clause without an explicit subject."
      - "Replacing a precise term with a near-synonym that accidentally changes the referent."
    examples:
      - "The audit rejected the estimate, not the model. This rejection delayed approval but did not require a redesign."
      - "The client sent the supplier a revised contract. The supplier returned the document after reviewing its liability clause."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: grammar.nominalization-information-flow
    cefr: C1
    track: grammar-engine
    module: c1.3-advanced-style-and-cohesion
    can_do: "Choose between a clause and a nominalization to control information flow without creating unnecessary abstraction."
    advisory_prerequisites:
      strong: [word-formation.academic-nominalization, toefl-writing.academic-register]
      soft: [grammar.reference-cohesion]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.requirement, word.improvement, word.agreement]
    contexts: [formal-report, decision-analysis]
    typical_errors:
      - "Turning every verb into a noun under the influence of Russian bureaucratic style."
      - "Using a nominalization that hides the responsible actor where ownership is material."
      - "Repeating an abstract noun without a determiner or clear reference."
    examples:
      - "The team rejected the proposal, and this rejection forced a new cost review."
      - "We verified the backup before migration, which is clearer here than verification of the backup was performed."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: grammar.participle-clauses.precision
    cefr: C1
    track: grammar-engine
    module: c1.3-advanced-style-and-cohesion
    can_do: "Use and revise participle clauses so their logical relation, time reference, and implied subject remain precise."
    advisory_prerequisites:
      strong: [grammar.participle-clauses.compression, grammar.relative-clauses.specification]
      soft: [grammar.passive.reporting-structures]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: []
    contexts: [research-report, incident-analysis]
    typical_errors:
      - "Leaving a dangling implied subject because Russian adverbial constructions tolerate a looser actor link."
      - "Using an -ing clause where the compressed event actually occurred earlier."
      - "Assuming a participle clause expresses cause when the surrounding logic supports only time."
    examples:
      - "Having completed the calibration, the researchers began the trial."
      - "Stored without encryption, the backup exposed customer identifiers."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 80, independent_attempts: 3}, controlled_production: {active_threshold: 82, independent_attempts: 3}, spontaneous_production: {active_threshold: 82, independent_attempts: 3}, transfer: {active_threshold: 85, independent_attempts: 3}}, mastered: {all_required_active: true, retention_stability_days: 60, retention_confirmations: 3}}

  - id: word-formation.register-shift
    cefr: C1
    track: word-formation
    module: c1.3-advanced-style-and-cohesion
    can_do: "Use related verb, adjective, and noun forms to shift register and information density while preserving the original meaning."
    advisory_prerequisites:
      strong: [word-formation.academic-nominalization, toefl-writing.academic-register]
      soft: [word-formation.quality-suffix]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.requirement, word.improvement, word.recommendation]
    contexts: [formal-revision, audience-adaptation]
    typical_errors:
      - "Choosing a related noun or adjective that has a different conventional meaning from the verb."
      - "Using dense nominal forms everywhere to make the English resemble Russian official prose."
      - "Changing word class without rebuilding the surrounding grammar and collocation."
    examples:
      - "We decided to postpone the launch becomes The decision to postpone the launch in the formal heading."
      - "The model is reliable can be recast as The model's reliability, but only when the sentence needs that quality as its topic."
