  - id: everyday-online-informal.code-switching
    cefr: C1
    track: everyday-online-informal
    module: c1.4-professional-and-public-discourse
    can_do: "Shift the same message between informal community, neutral professional, and formal public registers without distorting stance."
    advisory_prerequisites:
      strong: [everyday-online-informal.tone-repair, toefl-writing.academic-register]
      soft: [word-formation.register-shift]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [informal.ill-get-back-to-you, chunk.could-you-please, word.reason]
    contexts: [community-chat, professional-email, public-notice]
    typical_errors:
      - "Carrying a casual abbreviation into a formal public response because it seems efficient in Russian chat."
      - "Making the formal version more hostile by replacing friendly words with commands."
      - "Changing the strength of the position while changing register."
    examples:
      - "Chat: I'll get back to you tonight. Formal email: I will send the confirmed figures by 9 a.m. tomorrow."
