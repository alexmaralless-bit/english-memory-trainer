  - id: grammar.do-questions
    title: "Questions with do and does"
    cefr: A1
    track: grammar-engine
    module: a1.2-daily-work
    can_do: "Ask and answer simple routine questions with do and does."
    advisory_prerequisites:
      strong: [grammar.present-simple.routines]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: big-five
    lexicon: [chunk.how-often-do-you, lexeme.do, word.task, chunk.do-questions.did-you-forget, chunk.do-questions.do-they-handle, chunk.do-questions.do-we-need, chunk.do-questions.do-you-agree, chunk.do-questions.do-you-have, chunk.do-questions.do-you-know, chunk.do-questions.do-you-mind, chunk.do-questions.do-you-work, chunk.do-questions.does-anyone-know, chunk.do-questions.does-he-work, chunk.do-questions.does-it-work, chunk.do-questions.does-this-need, chunk.do-questions.how-do-we-fix, chunk.do-questions.how-do-you-prefer, chunk.do-questions.how-long-do-you, chunk.do-questions.how-often-do-you, chunk.do-questions.what-do-you-do, chunk.do-questions.what-do-you-need, chunk.do-questions.what-does-he-need, chunk.do-questions.when-do-we-deploy, chunk.do-questions.when-do-you-start, chunk.do-questions.when-does-the-team, chunk.do-questions.where-do-you, chunk.do-questions.where-does-she, chunk.do-questions.who-do-you-report, chunk.do-questions.why-do-you-think, chunk.do-questions.why-does-it-fail]
    contexts: [daily-standup]
    typical_errors:
      - "Keeping Russian statement word order in a question (You work where?)."
      - "Using does together with -s on the main verb (Does she works?)."
      - "Omitting do/does because Russian questions can rely on intonation."
    examples:
      - "Do you review this file every day?"
      - "Does Maya work from home?"
    core_points:
      - "In a Present Simple question, do/does carries the question signal and present-tense agreement."
      - "Put the subject after do/does and keep the main verb in its base form."
      - "Use does with he, she, it, or one singular third-person subject; use do elsewhere."
    contrasts:
      - "Maya works from home. / Does Maya work from home?"
      - "You review the file. / Do you review the file?"
    scope_limits:
      - "Questions with be and modal verbs do not use do-support and belong to their own contrasts."
      - "Past questions with did are deferred until Past Simple is in scope."
    error_patterns:
      - learner_form: "You work where?"
        correction: "Where do you work?"
        explanation: "A neutral information question needs the question word, do, the subject, and then the base verb."
      - learner_form: "Does she works here?"
        correction: "Does she work here?"
        explanation: "Does already carries third-person -s, so the main verb returns to the base form."
      - learner_form: "Do he work here?"
        correction: "Does he work here?"
        explanation: "He selects does in Present Simple questions."
    memory_insights:
      - kind: history
        origin: reference_research
        text: "English do-support is a historical development, not a universal feature of questions. A useful modern mental model is that do becomes the movable helper that carries tense and agreement while the lexical verb keeps its base form."
        sources:
          - title: "The Rise and Fall of Constructions and the History of English Do-Support"
            url: "https://www.cambridge.org/core/journals/journal-of-germanic-linguistics/article/rise-and-fall-of-constructions-and-the-history-of-english-dosupport/69D2D4714DB8098FBE0937283634B6CA"
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
