  - id: grammar.articles.fixed-time-expressions
    title: "Fixed time phrases: in the morning, at night, on the weekend"
    cefr: A1
    track: grammar-engine
    module: a1.10-home-and-daily-life
    can_do: "Use common fixed time expressions such as in the morning, at night, and on the weekend correctly and without extra articles."
    advisory_prerequisites:
      strong: [grammar.time-dates]
      soft: [grammar.articles.identity]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.day, chunk.first-thing-in-the-morning, chunk.at-the-end-of-the-day, chunk.articles-fixed-time-expressions.at-midnight, chunk.articles-fixed-time-expressions.at-night, chunk.articles-fixed-time-expressions.at-present, chunk.articles-fixed-time-expressions.at-the-end-of-the-day, chunk.articles-fixed-time-expressions.at-the-moment, chunk.articles-fixed-time-expressions.at-the-start-of-the-x, chunk.articles-fixed-time-expressions.by-the-end-of-the-x, chunk.articles-fixed-time-expressions.every-other-day, chunk.articles-fixed-time-expressions.first-thing-in-the-morning, chunk.articles-fixed-time-expressions.for-a-while, chunk.articles-fixed-time-expressions.for-the-time-being, chunk.articles-fixed-time-expressions.in-a-hurry, chunk.articles-fixed-time-expressions.in-an-hour, chunk.articles-fixed-time-expressions.in-the-evening, chunk.articles-fixed-time-expressions.in-the-morning, chunk.articles-fixed-time-expressions.in-time, chunk.articles-fixed-time-expressions.on-monday, chunk.articles-fixed-time-expressions.on-the-weekend, chunk.articles-fixed-time-expressions.on-time, chunk.articles-fixed-time-expressions.once-a-week, chunk.articles-fixed-time-expressions.over-the-weekend, chunk.articles-fixed-time-expressions.twice-a-month]
    contexts: [home-message]
    typical_errors:
      - "Adding the before night, Monday, or noon (at the night, on the Monday) by analogy with in the morning."
      - "Using in with weekend and day names instead of on (in the weekend, in Monday)."
      - "Dropping an article inside a fixed phrase that needs one, such as saying at end of the day instead of at the end of the day."
    examples:
      - "I check email in the morning and relax at night."
      - "We usually clean the apartment on the weekend."
    core_points:
      - "Some time phrases fix the with a part of the day: in the morning, in the afternoon, in the evening, at the end of the day."
      - "Other time phrases fix zero article after at or on: at night, at noon, at midnight, on Monday, on the weekend still keeps on."
      - "Learn each time phrase as one fixed unit rather than applying a single article rule to every time word."
    contrasts:
      - "in the morning / at night: the morning takes the; night after at takes no article."
      - "on the weekend / on Monday: both use on, but weekend keeps the while a day name does not."
      - "at the end of the day / at the start of the day: end and start both take the inside this fixed frame."
      - "once a week / once a day: a here means 'per', not the indefinite article introducing a new noun."
      - "at the moment / at that moment: the general fixed phrase at the moment contrasts with the specific at that moment pointing back to a time already mentioned."
      - "in a hurry / in the hurry: only in a hurry is a natural fixed phrase; the second form is not standard English."
      - "for a while / for the while: only for a while is the natural fixed phrase in this set."
    scope_limits:
      - "This topic teaches a fixed inventory of common time phrases; it does not derive every possible time expression from one rule."
      - "Dates with numbers (on 12 May) and clock times (at nine) are covered under grammar.time-dates, not repeated here."
    error_patterns:
      - learner_form: "I sleep well at the night."
        correction: "I sleep well at night."
        explanation: "Night after at is a fixed phrase with no article; only morning, afternoon, and evening take the after in."
      - learner_form: "We clean the apartment in the weekend."
        correction: "We clean the apartment on the weekend."
        explanation: "Weekend is a fixed phrase with on, not in, even though it keeps the article the."
      - learner_form: "Send the report by end of day."
        correction: "Send the report by the end of the day."
        explanation: "The fixed phrase keeps the before both end and day; dropping either article breaks the set expression."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
