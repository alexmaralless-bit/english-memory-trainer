# TODO(review): minimal A1 topic inventory inferred from the approved module descriptions; informal-topic placement and granularity are the minimal P.1b interpretation of the approved concept.
topics:
  - id: grammar.be.identity
    cefr: A1
    track: grammar-engine
    module: a1.1-identity-and-role
    can_do: "State identity, role, and company with forms of be."
    advisory_prerequisites: {}
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [chunk.i-work-as, chunk.my-name-is, word.company]
    contexts: [team-introduction]
    typical_errors:
      - "Omitting be in a statement (калька: «I engineer» вместо I am an engineer)."
      - "Choosing is for I/you or are for he/she (русское «быть» не меняется по лицам так)."
      - "Using a job noun without its article after be (I am manager)."
    examples:
      - "I am a data analyst."
      - "Our company is small."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: grammar.pronouns.possessives
    cefr: A1
    track: grammar-engine
    module: a1.1-identity-and-role
    can_do: "Refer to people, teams, and ownership with pronouns and possessives."
    advisory_prerequisites:
      strong: [grammar.be.identity]
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [chunk.my-main-task-is, word.company, word.team]
    contexts: [team-introduction]
    typical_errors:
      - "Using a subject pronoun before a noun instead of a possessive (he name instead of his name)."
      - "Confusing he/she with him/her after a verb (русские падежи не совпадают с английской позицией)."
      - "Confusing their with they're because Russian does not mark this spelling distinction."
    examples:
      - "She owns the release notes."
      - "Their team has a demo today."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: grammar.basic-word-order
    cefr: A1
    track: grammar-engine
    module: a1.1-identity-and-role
    can_do: "Write simple affirmative statements in a clear English word order."
    advisory_prerequisites:
      strong: [grammar.be.identity]
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [word.company, word.team]
    contexts: [team-introduction]
    typical_errors:
      - "Placing an adverb or object before the subject (русский свободный порядок слов)."
      - "Dropping the subject in a statement (калька: «работаю с данными» без I)."
      - "Putting a question-style auxiliary into an affirmative sentence (гиперкоррекция do)."
    examples:
      - "The client needs a report."
      - "We test the model today."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: grammar.articles.identity
    cefr: A1
    track: grammar-engine
    module: a1.1-identity-and-role
    can_do: "Use a, an, and the in simple descriptions of roles and objects."
    advisory_prerequisites:
      soft: [grammar.be.identity]
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [chunk.i-work-in-the-team, word.company, word.team]
    contexts: [team-introduction]
    typical_errors:
      - "Omitting a/an before a singular countable noun (калька: «я инженер» без артикля)."
      - "Using the before a role for the first mention (перенос «этот/конкретный» без контекста)."
      - "Choosing a instead of an before a vowel sound (ошибка по букве, а не по звучанию)."
    examples:
      - "I am an engineer on the project."
      - "The dashboard has a new chart."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: written-interaction.self-introduction
    cefr: A1
    track: written-interaction
    module: a1.1-identity-and-role
    can_do: "Write a short introduction with a role, company, and responsibility."
    advisory_prerequisites:
      strong: [grammar.be.identity, grammar.pronouns.possessives, grammar.basic-word-order]
      soft: [grammar.articles.identity]
    dimensions: [recognition, controlled_production, transfer]
    lexicon: [chunk.i-work-as, chunk.i-am-responsible-for, chunk.my-name-is]
    contexts: [team-introduction]
    typical_errors:
      - "Writing a Russian-style imperative where English needs a polite request (Send me... without context)."
      - "Omitting the subject, article, or auxiliary in a short message."
      - "Using a direct calque such as Please, explain me instead of explain it to me."
    examples:
      - "Hi, I'm Nina, a QA engineer at BrightBuild."
      - "My main task is testing new releases."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: us-tech.role-responsibilities
