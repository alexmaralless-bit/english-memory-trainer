    frequency_tier: big-five
    lexicon: [chunk.i-usually-start-by, chunk.on-a-typical-day, word.start]
    contexts: [daily-standup]
    typical_errors:
      - "Using Present Continuous for a routine (калька: «я обычно сейчас работаю»)."
      - "Forgetting -s after he/she/it (русский глагол не меняется по лицам)."
      - "Using do together with a main verb inflection (Does she works?)."
