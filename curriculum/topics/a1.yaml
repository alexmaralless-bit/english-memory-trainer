    track: us-tech-english
    module: a1.1-identity-and-role
    can_do: "Describe a simple technology-related role and responsibility."
    advisory_prerequisites:
      strong: [written-interaction.self-introduction]
    dimensions: [recognition, controlled_production, transfer]
    lexicon: [chunk.i-am-responsible-for, chunk.i-work-in-the-team, chunk.im-part-of]
    contexts: [team-introduction]
    typical_errors:
      - "Using a Russian calque instead of a clear technical action (make a deploy instead of deploy)."
      - "Dropping the actor, status, or next step that makes an update actionable."
      - "Using Present Simple for an incident happening now or Past Simple for an unfinished result."
    examples:
      - "I support the data team."
      - "My role is to check model outputs."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: grammar.present-simple.routines
