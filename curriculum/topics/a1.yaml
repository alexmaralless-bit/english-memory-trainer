  - id: grammar.nouns-singular-plural
    title: "One or more: singular and plural nouns"
    cefr: A1
    track: grammar-engine
    module: a1.3-systems-objects-and-data
    can_do: "Refer to one or more objects, files, and records accurately."
    advisory_prerequisites: {}
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.record, word.system, word.data, chunk.nouns-singular-plural.a-few-files, chunk.nouns-singular-plural.a-file, chunk.nouns-singular-plural.a-record, chunk.nouns-singular-plural.a-ticket, chunk.nouns-singular-plural.all-reports, chunk.nouns-singular-plural.both-options, chunk.nouns-singular-plural.data, chunk.nouns-singular-plural.errors-are-fixed, chunk.nouns-singular-plural.feedback, chunk.nouns-singular-plural.five-test-cases, chunk.nouns-singular-plural.information, chunk.nouns-singular-plural.many-tasks, chunk.nouns-singular-plural.multiple-systems, chunk.nouns-singular-plural.one-message, chunk.nouns-singular-plural.one-system, chunk.nouns-singular-plural.several-records, chunk.nouns-singular-plural.software, chunk.nouns-singular-plural.ten-tickets, chunk.nouns-singular-plural.test-case, chunk.nouns-singular-plural.the-error, chunk.nouns-singular-plural.these-fields, chunk.nouns-singular-plural.this-field, chunk.nouns-singular-plural.three-messages, chunk.nouns-singular-plural.two-files, chunk.nouns-singular-plural.two-records]
    contexts: [interface-walkthrough]
    typical_errors:
      - "Omitting plural -s after numbers because Russian number endings work differently."
      - "Adding -s to every noun, including uncountable words such as information."
      - "Forgetting a/an before a singular countable noun."
    examples:
      - "One file is missing."
      - "Two records need review."
    core_points:
      - "A regular countable noun normally adds -s or -es when it refers to more than one."
      - "The written ending has three common pronunciations: /s/, /z/, and /ɪz/."
      - "A singular countable noun normally needs a determiner such as a/an, the, this, or my."
    contrasts:
      - "one task / two tasks; one record / two records; one message / two messages."
      - "countable files / uncountable information: not every English noun forms a counting plural."
    scope_limits:
      - "Irregular plurals are noticed as lexical forms but are not derived by the regular -s/-es rule."
      - "Advanced countability changes such as experience/experiences are outside this first lesson."
    error_patterns:
      - learner_form: "two file"
        correction: "two files"
        explanation: "A number above one selects a plural countable noun."
      - learner_form: "informations"
        correction: "information"
        explanation: "Information is normally uncountable in English; use pieces of information when counting."
      - learner_form: "file is missing"
        correction: "A file is missing."
        explanation: "A singular countable noun normally needs a determiner."
    pronunciation:
      focus: "The regular plural ending agrees in voicing with the preceding sound."
      guidance:
        - "After a voiceless non-sibilant sound, use /s/: tasks."
        - "After a voiced non-sibilant sound, use /z/: records."
        - "After a sibilant sound, add a syllable /ɪz/: messages."
    memory_insights:
      - kind: phonetics
        origin: reference_research
        text: "The three plural sounds make the ending easier to join to the word: /s/ follows a voiceless sound, /z/ follows a voiced sound, and /ɪz/ adds a syllable after a hissing or buzzing sibilant."
        sources:
          - title: "An Introduction to American English Phonetics: plural endings"
            url: "https://opentextbooks.rug.nl/americanenglishphonetics2/chapter/2-1-the-plural-third-person-singular-and-genitive-endings/"
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
