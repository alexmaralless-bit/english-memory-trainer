  - id: grammar.articles.identity
    title: "A, an, and the: introducing and identifying"
    cefr: A1
    track: grammar-engine
    module: a1.1-identity-and-role
    can_do: "Use a, an, and the in simple descriptions of roles and objects."
    advisory_prerequisites:
      soft: [grammar.be.identity]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [chunk.i-work-in-the-team, word.company, word.team, chunk.articles-identity.hes-an, chunk.articles-identity.i-found-a-bug, chunk.articles-identity.i-have-a-question, chunk.articles-identity.i-need-an-hour, chunk.articles-identity.i-opened-a-ticket, chunk.articles-identity.im-a, chunk.articles-identity.im-an, chunk.articles-identity.it-was-a-long-day, chunk.articles-identity.its-a-small-team, chunk.articles-identity.lets-schedule-a-call, chunk.articles-identity.she-sent-an-email, chunk.articles-identity.shes-a, chunk.articles-identity.thats-an-easy-fix, chunk.articles-identity.we-need-a]
    contexts: [team-introduction]
    typical_errors:
      - "Omitting a/an before a singular countable noun (калька: «я инженер» без артикля)."
      - "Using the before a role for the first mention (перенос «этот/конкретный» без контекста)."
      - "Choosing a instead of an before a vowel sound (ошибка по букве, а не по звучанию)."
    examples:
      - "I am an engineer on the project."
      - "The dashboard has a new chart."
    core_points:
      - "Use a/an with one singular countable thing when its exact identity is not yet shared."
      - "Use the when speaker and listener can identify the same person or thing from the context."
      - "Choose a or an by the next sound, not simply by the next written letter."
    contrasts:
      - "a user / an analyst: user begins with the consonant sound /j/; analyst begins with a vowel sound."
      - "a report / the report: a report introduces one; the report points to the identifiable one."
    scope_limits:
      - "This topic does not try to teach every generic, geographical, or institutional use of the."
      - "Zero article with plural and uncountable nouns is introduced only when needed for a clear contrast."
    error_patterns:
      - learner_form: "I am engineer."
        correction: "I am an engineer."
        explanation: "A singular countable role noun normally needs a determiner; engineer starts with a vowel sound."
      - learner_form: "She is a analyst."
        correction: "She is an analyst."
        explanation: "The choice follows the first sound /æ/, so an prevents an awkward vowel-to-vowel boundary."
      - learner_form: "I opened the ticket."
        correction: "I opened a ticket."
        explanation: "Use a on first mention unless the listener can already identify which ticket."
    pronunciation:
      focus: "The boundary between the article and the next word."
      guidance:
        - "Use an before a vowel sound and a before a consonant sound."
        - "Treat acronyms and silent letters by pronunciation: an API, an hour, a URL."
    memory_insights:
      - kind: history
        origin: reference_research
        text: "A/an grew from Old English an, meaning one. The modern split follows sound: an keeps the /n/ before a vowel sound, while a is the reduced form used before a consonant sound."
        sources:
          - title: "Oxford Advanced Learner's Dictionary: a (indefinite article)"
            url: "https://www.oxfordlearnersdictionaries.com/definition/english/a_1"
          - title: "Merriam-Webster: A vs. An"
            url: "https://www.merriam-webster.com/grammar/is-it-a-or-an"
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
