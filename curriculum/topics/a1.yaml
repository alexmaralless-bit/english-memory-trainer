    track: grammar-engine
    module: a1.2-daily-work
    can_do: "State simple times, dates, and schedule points in a work message."
    advisory_prerequisites: {}
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [chunk.first-thing-in-the-morning, chunk.at-the-end-of-the-day, word.day]
    contexts: [daily-standup]
    typical_errors:
      - "Using at with a day or date (at Monday, at 12 May) instead of on."
      - "Omitting the preposition before a clock time (the call starts nine)."
      - "Writing a date in Russian order without a month word, which can be ambiguous internationally."
    examples:
      - "The call starts at nine."
      - "The demo is on 12 May."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: written-production.daily-work-update
