      - "She works from home on Fridays. / She is working from home today.: a fixed weekly routine contrasts with a temporary arrangement for today only."
      - "We usually deploy on Friday. / We are deploying right now.: usually signals a routine; right now signals the ongoing action."
      - "The system checks the queue every minute. / The system is checking the queue at the moment.: general system behavior contrasts with what it is doing right this instant."
