  - id: grammar.articles.second-mention
    title: "From a to the: naming something once, then pointing back to it"
    cefr: A1
    track: grammar-engine
    module: a1.4-work-in-progress
    can_do: "Introduce a new item with a/an and switch to the once both sides know which one is meant."
    advisory_prerequisites:
      strong: [grammar.articles.identity]
      soft: [grammar.nouns-singular-plural]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [chunk.its-still-in-review, chunk.current-status-is, word.update, chunk.im-working-on, chunk.articles-second-mention.as-i-mentioned-the-x-is-ready, chunk.articles-second-mention.back-to-the-x, chunk.articles-second-mention.can-you-send-the-x-again, chunk.articles-second-mention.he-grabbed-a-x-put-the-x, chunk.articles-second-mention.i-already-told-you-about-the-x, chunk.articles-second-mention.i-found-a-x-the-x, chunk.articles-second-mention.i-opened-a-x-the-x, chunk.articles-second-mention.i-ordered-a-x-the-x, chunk.articles-second-mention.i-sent-you-the-x-from-before, chunk.articles-second-mention.the-one-i-mentioned-earlier, chunk.articles-second-mention.the-same-one-as-before, chunk.articles-second-mention.the-x-i-mentioned, chunk.articles-second-mention.the-x-we-discussed, chunk.articles-second-mention.theres-a-x-the-x-kitchen, chunk.articles-second-mention.we-hired-a-x-the-x, chunk.articles-second-mention.wheres-the-x-i-gave-you]
    contexts: [status-update]
    typical_errors:
      - "Repeating a on the second mention instead of switching to the (калька: русский язык не отмечает эту смену маркера)."
      - "Using the on the very first mention of a new item, before the listener can identify it."
      - "Dropping the article completely on the second mention, treating an English noun like a bare Russian noun."
    examples:
      - "I opened a ticket this morning. The ticket is still in review."
      - "We found a bug in the export. The bug only appears with large files."
    core_points:
      - "The first time you name a countable thing, use a/an: the listener cannot identify it yet."
      - "The next time you refer to the same thing, switch to the: both sides now know which one."
      - "This switch happens inside one message or conversation, not only across separate documents."
    contrasts:
      - "I opened a ticket. / I opened the ticket.: a ticket is new information; the ticket points back to the one just opened."
      - "a report / the report / reports: a report introduces one; the report names the one already mentioned; reports drops the article for the general plural."
      - "We found a bug. The bug crashes the app. / We found bugs. The bugs crash the app.: singular a/the pairs with the plural zero-article form."
      - "Send me a file. / Send me the file we discussed.: a file asks for any file; the file we discussed narrows it to one both people know."
      - "There's a new build. / The new build is ready.: a new build first names it; the new build reuses the same identity."
      - "I have a question. / The question is about the deadline.: a question opens the topic; the question refers straight back to it."
      - "She raised a concern. / The concern turned out to be minor.: a concern introduces; the concern tracks the same one through the update."
    scope_limits:
      - "This topic does not cover the with superlatives, unique nouns, or institutions; those get their own topics."
      - "Plural and uncountable nouns without an article appear here only as a background contrast, not as a full lesson."
    error_patterns:
      - learner_form: "I opened a ticket. A ticket is still in review."
        correction: "I opened a ticket. The ticket is still in review."
        explanation: "On the second mention both sides can identify the ticket, so English switches from a to the."
      - learner_form: "We found a bug. Bug crashes the app."
        correction: "We found a bug. The bug crashes the app."
        explanation: "A singular countable noun keeps a determiner on every mention; the second mention needs the, not zero article."
      - learner_form: "Please check the file first, then send a file."
        correction: "Please check a file first, then send the file."
        explanation: "The first mention of an unidentified file needs a; only the repeated reference takes the."
    explanation_language: ru-allowed
