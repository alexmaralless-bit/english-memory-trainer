      - "Using the base verb after a past-time marker (Yesterday I go)."
      - "Using did with a past form (Did you went?)."
      - "Translating Russian aspect word for word instead of choosing the English time frame."
    examples:
      - "The service stopped yesterday."
      - "We fixed the link after lunch."
    contrasts:
      - "We deployed the fix yesterday. / We've deployed the fix.: yesterday is a finished-time marker that forces Past Simple, even though the Russian perfective verb does not itself mark this distinction."
      - "The service stopped at 10:00. / The service has stopped.: a specific finished past time takes Past Simple; no time marker leaves room for Present Perfect instead."
      - "We fixed the link after lunch. / We are fixing the link now.: a completed past action contrasts with an action still in progress."
      - "I checked the logs this morning. / I check the logs every morning.: one specific completed check contrasts with a routine repeated every day."
      - "They tested the build last week. / They have tested the build.: last week anchors the action to a finished past time, unlike the unanchored present perfect form."
      - "The team released version two in March. / The team releases a new version every quarter.: one specific past release contrasts with a general recurring routine."
      - "We did not receive the email yesterday. / We have not received the email yet.: yesterday forces Past Simple even in the negative; yet signals an open present-relevant result instead."
