  - id: grammar.articles.zero-plural-uncountable
    title: "No article: plural and uncountable nouns in general statements"
    cefr: A1
    track: grammar-engine
    module: a1.3-systems-objects-and-data
    can_do: "Talk about data, tests, and other plural or uncountable things in general without a or the."
    advisory_prerequisites:
      strong: [grammar.nouns-singular-plural]
      soft: [grammar.articles.identity]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.data, word.testing, word.feedback, word.record, chunk.articles-zero-plural-uncountable.a-lot-of-x, chunk.articles-zero-plural-uncountable.access-is-limited-right-now, chunk.articles-zero-plural-uncountable.i-dont-have-enough-time, chunk.articles-zero-plural-uncountable.i-have-some-feedback, chunk.articles-zero-plural-uncountable.i-need-advice-on-this, chunk.articles-zero-plural-uncountable.meetings-run-long, chunk.articles-zero-plural-uncountable.plenty-of-x, chunk.articles-zero-plural-uncountable.progress-looks-good-so-far, chunk.articles-zero-plural-uncountable.software-needs-regular-updates, chunk.articles-zero-plural-uncountable.tests-are-passing, chunk.articles-zero-plural-uncountable.that-takes-too-much-money, chunk.articles-zero-plural-uncountable.tickets-are-piling-up, chunk.articles-zero-plural-uncountable.traffic-was-bad-this-morning, chunk.articles-zero-plural-uncountable.we-collected-feedback-from-users, chunk.articles-zero-plural-uncountable.we-need-more-data, chunk.articles-zero-plural-uncountable.we-need-more-information, chunk.articles-zero-plural-uncountable.x-are-x, chunk.articles-zero-plural-uncountable.x-is-x]
    contexts: [interface-walkthrough]
    typical_errors:
      - "Adding a before an uncountable noun (a data, a feedback) because Russian nouns do not mark countability this way."
      - "Adding the before a plural or uncountable noun in a general statement (The data is stored here) when no specific set is meant."
      - "Treating software, information, and feedback as countable and giving them a plural -s."
    examples:
      - "Data moves through three services before it reaches the dashboard."
      - "Tests run automatically after every commit."
    core_points:
      - "A plural countable noun in a general statement takes no article: tests run, records update."
      - "An uncountable noun such as data, information, feedback, or software also takes no article in a general statement."
      - "Add the only when a specific, already-identified set of data or feedback is meant, not the general kind."
    contrasts:
      - "Data is stored here. / The data is corrupted.: data in general takes no article; a specific, already-known data set takes the."
      - "Tests run every night. / The tests failed last night.: tests in general contrasts with the specific set that just ran."
      - "We need feedback. / The feedback from the client was clear.: feedback in general contrasts with one identified batch of feedback."
      - "Software updates automatically. / The software on this server is outdated.: software in general contrasts with the specific installed copy."
      - "Records are backed up daily. / The records from March are missing.: records in general contrasts with a named subset."
      - "Information travels fast in this team. / The information in the ticket is incomplete.: information in general contrasts with the specific piece already mentioned."
      - "We collect data every day. / We collect a data every day.: only the first is possible; data has no singular a form."
    scope_limits:
      - "Countable singular nouns still need a/an or the; this topic only covers the zero-article case for plural and uncountable nouns."
      - "Fixed time expressions and institutional zero-article phrases such as at night or in bed belong to separate topics."
    error_patterns:
      - learner_form: "We need a feedback from the client."
        correction: "We need feedback from the client."
        explanation: "Feedback is uncountable in English; general feedback takes no article, and it never takes a."
      - learner_form: "The data shows different results every time, in general."
        correction: "Data shows different results every time, in general."
        explanation: "A general statement about data as a category takes no article, not the."
      - learner_form: "Tests is passing now."
        correction: "Tests are passing now."
        explanation: "Tests is a regular plural noun and needs a plural verb, even without an article."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
