  - id: everyday-online-informal.tone-repair
    cefr: B1
    track: everyday-online-informal
    module: b1.6-online-communities
    can_do: "Rewrite an abrupt or ambiguous online message so that its intent is clear and its tone fits the relationship."
    advisory_prerequisites:
      strong: [everyday-online-informal.casual-neutral-rephrasing, written-interaction.respectful-disagreement]
      soft: [everyday-online-informal.tone-recognition]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.sorry-for-the-delay, informal.i-see-what-you-mean, informal.not-sure-i-agree]
    contexts: [team-chat, community-message]
    typical_errors:
      - "Adding please to a bare imperative and assuming it automatically sounds polite."
      - "Using normal as a false friend for acceptable or reasonable."
      - "Translating Russian brevity directly, producing a message that sounds accusatory in English."
    examples:
      - "Could you check the figures again? I may be reading the final column differently."
      - "I see what you mean. I am not sure this solution covers the offline case, though."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: everyday-online-informal.community-reply
    cefr: B1
    track: everyday-online-informal
    module: b1.6-online-communities
    can_do: "Write a useful community reply that answers the question, marks uncertainty, and avoids unnecessary confrontation."
    advisory_prerequisites:
      strong: [everyday-online-informal.forum-thread-reply, written-interaction.suggestion-feedback]
      soft: [written-production.fact-inference]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [informal.thanks-for-the-context, informal.do-you-have-a-source, chunk.as-far-as-i-understand]
    contexts: [support-forum, neighborhood-group]
    typical_errors:
      - "Using advice as a count noun (an advice)."
      - "Confusing maybe and may be in a recommendation."
      - "Presenting an uncertain memory as fact instead of marking the source or confidence."
    examples:
      - "Thanks for the context. As far as I understand, the setting is available only to workspace owners; could you check your role?"
      - "The road may be closed after eight. The council page has not been updated, so it would be worth checking before you leave."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: reading.implied-online-stance
    cefr: B1
    track: reading
    module: b1.6-online-communities
    can_do: "Infer a writer's likely stance from wording, qualification, and context in an online exchange."
    advisory_prerequisites:
      strong: [everyday-online-informal.tone-recognition, written-production.fact-inference]
      soft: [reading.personal-message]
    dimensions: [recognition, transfer]
    lexicon: [chunk.as-far-as-i-understand, informal.thanks-for-the-context, slang.kinda]
    contexts: [forum-debate, team-chat]
    typical_errors:
      - "Taking an ironic positive phrase literally because Russian irony uses different cues."
      - "Treating every hedge such as probably or kind of as uncertainty rather than possible politeness or distance."
      - "Reading actually as актуально and missing that it corrects a previous assumption."
    examples:
      - "The writer says the plan is 'ambitious' and then lists three missing resources, which implies doubt rather than praise."
      - "By writing 'That might work for a small team,' the reviewer limits support to one context."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-reading.skimming-main-purpose
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Skim a concise academic or campus text to identify its main purpose before examining supporting details."
    advisory_prerequisites:
      strong: [reading.main-idea-details, reading.connected-technical-explanation]
      soft: [reading.short-news-item]
    dimensions: [recognition, transfer]
    lexicon: [chunk.the-key-point-is, word.summary, word.aspect, word.thesis, word.commentary]
    contexts: [academic-passage, campus-notice]
    typical_errors:
      - "Translating every sentence before deciding what the text is trying to do."
      - "Naming the broad subject as the main purpose, a common Russian-school summary habit."
      - "Choosing a vivid example as the purpose because it is easier to remember than the controlling idea."
    examples:
      - "A campus garden reduced summer heat around two residence halls. The passage explains why small planted areas can improve local conditions."
      - "The library will test longer weekend hours for one month. The notice invites students to use the trial and submit feedback."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-reading.scanning-key-detail
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Scan a focused academic or campus text for the specific fact, condition, or relationship required by a question."
    advisory_prerequisites:
      strong: [reading.documentation-scan, reading.multi-step-service-information]
      soft: [reading.ticket-basics]
    dimensions: [recognition, transfer]
    lexicon: [word.detail, word.requirement, word.indicator, word.parameter, word.statistics, word.preliminary]
    contexts: [academic-passage, campus-information]
    typical_errors:
      - "Selecting the first sentence that repeats a keyword instead of checking the requested relationship."
      - "Missing except, unless, or a negative condition while scanning quickly."
      - "Returning a nearby number or name without verifying its unit or role."
    examples:
      - "The field study ran from April through June, but soil samples were collected only in May. The required detail is the sampling month, not the full study period."
      - "Students may reserve the lab until 8 p.m. on weekdays. On Friday, however, the building closes at 6 p.m."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-reading.paraphrase-match
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Match a sentence or short passage to an accurate paraphrase without being misled by repeated words."
    advisory_prerequisites:
      strong: [written-production.paraphrase-summary, reading.connected-technical-explanation]
      soft: [written-production.paraphrase-expression]
    dimensions: [recognition, transfer]
    lexicon: [word.summary, word.reason, word.contradict, word.inference, word.synthesis, word.valid]
    contexts: [academic-passage, sentence-equivalence]
    typical_errors:
      - "Choosing an option because it repeats source words even though it changes the relationship."
      - "Replacing individual words with synonyms while preserving an un-English Russian sentence structure."
      - "Ignoring a change from possibility to certainty or from cause to simple sequence."
    examples:
      - "The new coating slowed water loss from the leaves. In other words, treated plants retained moisture longer."
      - "Few residents used the first survey because it was available for only two days. The limited response period reduced participation."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-reading.vocabulary-context
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Infer the intended meaning of an unfamiliar or polysemous word from its local academic context."
    advisory_prerequisites:
      strong: [reading.idioms-in-context, word-formation.quality-suffix]
      soft: [word-formation.surpass-out]
    dimensions: [recognition, transfer]
    lexicon: [word.detail, word.reason, word.depict, word.domain, word.discourse]
    contexts: [academic-passage, campus-article]
    typical_errors:
      - "Choosing the first dictionary meaning or Russian cognate without testing it in the sentence."
      - "Ignoring the word's grammatical role when deciding among possible meanings."
      - "Using general topic knowledge instead of the local contrast, definition, or example."
    examples:
      - "The committee called the early estimate conservative because actual demand was much higher. Here, conservative means deliberately low rather than politically traditional."
      - "The beetle population declined after the cold spring, yet it rebounded by midsummer. The contrast shows that rebounded means recovered."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-reading.paragraph-organization
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Identify how a paragraph moves from its controlling idea through explanation, example, contrast, or result."
    advisory_prerequisites:
      strong: [reading.main-idea-details, written-production.cause-effect-explanation]
      soft: [grammar.connectors.cause-contrast]
    dimensions: [recognition, transfer]
    lexicon: [word.because, word.although, word.result, word.coherent, word.logical, word.classification]
    contexts: [academic-paragraph, expository-analysis]
    typical_errors:
      - "Reading the paragraph as a list of facts instead of identifying the controlling idea."
      - "Treating however as a generic Russian linking word and missing the contrast it introduces."
      - "Mistaking an example for a new claim rather than support for the preceding explanation."
    examples:
      - "Urban trees cool streets in two ways. They block direct sunlight, and water released by their leaves lowers nearby air temperature."
      - "The first model was inexpensive to build. However, its frequent repairs made it the costlier option over five years."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-writing.sentence-building
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Arrange supplied words and phrases into a complete grammatical sentence whose meaning fits the surrounding context."
    advisory_prerequisites:
      strong: [grammar.basic-word-order, grammar.relative-clauses.specification]
      soft: [grammar.connectors.cause-contrast]
    dimensions: [recognition, controlled_production, transfer]
    lexicon: [word.because, word.although, word.result, word.accuracy, word.clarify, word.explicit]
    contexts: [academic-sentence, context-completion]
    typical_errors:
      - "Keeping Russian information order when English requires a fixed subject before the finite verb."
      - "Omitting an article, auxiliary, or dummy subject because Russian has no equivalent word."
      - "Attaching a relative or adverbial clause to the wrong noun when arranging supplied phrases."
    examples:
      - "Although the sample was small, the pattern appeared in all three groups. This order keeps the concession subordinate to the main finding."
      - "The device that measured soil moisture was calibrated each morning. The relative clause identifies the device, not the moisture."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-writing.academic-email
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Write a focused email for an academic or campus situation that fulfills the request, gives relevant context, and proposes a clear next step."
    advisory_prerequisites:
      strong: [written-interaction.formal-service-request, written-interaction.project-risk-update]
      soft: [written-interaction.polite-request]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.could-you-please, word.deadline, word.requirement, word.assignment, word.clarify, word.syllabus, word.semester]
    contexts: [academic-email, campus-request]
    typical_errors:
      - "Beginning with I want or You must, a direct Russian transfer that sounds unnecessarily demanding."
      - "Giving a long personal history but omitting the exact request and relevant deadline."
      - "Using teacher as a form of address instead of the recipient's name or appropriate title."
    examples:
      - "Dear Professor Lee, I missed Monday's lab because the campus clinic asked me to isolate. Could I attend the Thursday section instead?"
      - "Hello Ms. Ortiz, the registration page lists two different submission dates. Could you confirm which deadline applies to visiting students?"
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: toefl-writing.discussion-claim-reason
    cefr: B1
    track: toefl-reading-writing
    module: b1.7-toefl-reading-writing-foundations
    can_do: "Contribute a relevant position to an academic discussion and support it with a clear reason and a concrete example."
    advisory_prerequisites:
      strong: [everyday-life.expressing-an-opinion-with-reasons, written-production.reasoned-recommendation]
      soft: [written-interaction.respectful-disagreement]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.reason, word.agree, word.disagree, word.assert, word.justification, word.plausible, word.thesis]
    contexts: [discussion-board, academic-response]
    typical_errors:
      - "Repeating the prompt as a thesis without taking a specific position."
      - "Giving a broad Russian-style example about people in general rather than a concrete case."
      - "Rejecting another participant's view bluntly without adding an original reason."
    examples:
      - "Universities should keep a limited number of quiet study rooms open overnight. Students with jobs often cannot use the library during normal hours, so access affects them unevenly."
      - "I agree that group projects build collaboration, but individual reflection should remain part of the grade. It reveals whether each student understands the shared result."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
