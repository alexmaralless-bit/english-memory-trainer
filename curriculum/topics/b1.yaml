  - id: grammar.articles.generic-statements
    title: "Generic reference in technical writing: users, a user, the user"
    cefr: B1
    track: grammar-engine
    module: b1.1-systems-and-project-reports
    can_do: "Choose zero plural, a plus singular, or the plus singular to describe a general category of people or things in technical writing."
    advisory_prerequisites:
      strong: [grammar.articles.zero-plural-uncountable, grammar.articles.the-unique-superlative-ordinal]
      soft: [grammar.nouns-singular-plural]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [chunk.each-record-has, word.aggregate, word.domain, word.specification, chunk.articles-generic-statements.a-good-leader-listens-first, chunk.articles-generic-statements.a-successful-product-solves-a-real-problem, chunk.articles-generic-statements.a-well-designed-interface-needs-no-manual, chunk.articles-generic-statements.a-x-should-always-x, chunk.articles-generic-statements.customers-expect-fast-support, chunk.articles-generic-statements.developers-usually-test-locally-first, chunk.articles-generic-statements.employees-are-expected-to-log-hours, chunk.articles-generic-statements.managers-often-approve-requests-quickly, chunk.articles-generic-statements.systems-should-be-tested-before-release, chunk.articles-generic-statements.the-average-user-skips-the-tutorial, chunk.articles-generic-statements.the-human-brain-processes-images-quickly, chunk.articles-generic-statements.the-modern-smartphone-replaced-many-devices, chunk.articles-generic-statements.the-x-has-changed-how-we-x, chunk.articles-generic-statements.x-need-x]
    contexts: [architecture-overview, team-onboarding]
    typical_errors:
      - "Adding the before a plural noun used generically (The users need clear error messages) when zero article states the general category."
      - "Switching between a plus singular and the plus singular generic patterns inside one paragraph, creating an inconsistent reference."
      - "Using the with a category noun that has not been narrowed to one specific instance yet, transferring a Russian default toward definiteness."
    examples:
      - "Users need a clear error message when a request fails."
      - "The database stores each record with a unique identifier."
    core_points:
      - "A generic plural with zero article states a rule about the whole category: users need, records include, tests confirm."
      - "A generic singular with a states the same kind of rule about one representative member: a user needs, a request contains."
      - "A generic singular with the states a rule about one defined system or component as a class: the database stores, the cache expires."
    contrasts:
      - "Users need feedback. / The users need feedback.: users in general takes no article; the users narrows the claim to one already-identified group."
      - "A user submits a request. / The user submits a request.: a user speaks generically about any user; the user points to one specific user already introduced."
      - "A database stores records. / The database stores records.: a database makes a broader generic claim about databases as a category; the database names this specific system as a defined type."
      - "Tests confirm the fix. / The tests confirm the fix.: tests in general states expected behavior; the tests points to the specific test run just described."
      - "Requirements change over time. / The requirements changed last week.: requirements as a category contrasts with this project's specific, already-mentioned requirements."
      - "A cache reduces load. / The cache reduces load on this service.: a cache is a generic technical claim; the cache names the particular one in this system."
      - "Errors are logged automatically. / The errors were logged at 10:00.: errors in general as a system behavior contrasts with the specific errors from one incident."
    scope_limits:
      - "This topic focuses on generic reference in technical and project writing; the same pattern in everyday speech is not separately drilled here."
      - "Proper nouns and geographic names have their own article rules and are covered in a separate topic."
    error_patterns:
      - learner_form: "The users need clear error messages, in general."
        correction: "Users need clear error messages, in general."
        explanation: "A generic claim about the whole category of users takes zero article with the plural noun, not the."
      - learner_form: "A database stores each record with unique identifier, referring to this specific system."
        correction: "The database stores each record with a unique identifier."
        explanation: "Referring to this one specific system needs the, not the generic a pattern; the missing a before identifier is also required."
      - learner_form: "Requirement changed last week for this project."
        correction: "The requirement changed last week for this project."
        explanation: "A specific, already-identified requirement in this project needs the and the singular noun, not a bare noun."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

