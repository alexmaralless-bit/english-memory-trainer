# First detailed B1 topics: the semi-opaque word-formation patterns the learner
# reaches for in tech English. B1.1 remains a module sketch until later detailing.
topics:
  - id: word-formation.surpass-out
    cefr: B1
    track: word-formation
    module: b1.2-word-formation
    can_do: "Recognize that out- means to surpass in an action (outrun, outnumber, outperform), not a literal 'outside', and infer an unfamiliar out- word."
    advisory_prerequisites:
      strong: [word-formation.degree-over-under]
      soft: [reading.everyday-phrasal-verbs]
    lexicon: [word.overload, word.overwrite, word.underestimate]
    contexts: [performance-comparison, technical-reading]
    typical_errors:
      - "Reading out- as Russian «наружу» in outperform instead of the meaning 'do better than'."
      - "Treating every word beginning with out as the same productive prefix, including unrelated words such as outcome."
      - "Inventing an out- verb without checking that the derived word exists."
    examples:
      - "The revised parser outperformed the old one on large files."
      - "In the final sample, mobile requests outnumbered desktop requests."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: word-formation.quality-suffix
    cefr: B1
    track: word-formation
    module: b1.2-word-formation
    can_do: "Recognize that -able means able to be X-ed (readable) and -ness names a quality (usefulness), and tell the word class."
    advisory_prerequisites:
      strong: [word-formation.agent-and-noun-suffix]
    lexicon: [word.requirement, word.improvement, word.developer]
    contexts: [product-review, technical-reading]
    typical_errors:
      - "Reading -able as a general adjective ending without recovering the meaning 'can be acted on'."
      - "Using a -ness noun as if it were an adjective because Russian often expresses the idea with a different form."
      - "Attaching -able or -ness to a base mechanically when English uses another established word."
    examples:
      - "The short labels make the dashboard more readable."
      - "The usefulness of the alert depends on its timing."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: grammar.present-perfect.duration
    cefr: B1
    track: grammar-engine
    module: b1.1-systems-and-project-reports
    can_do: "Describe an activity or state that began in the past and continues now, with a clear duration or starting point."
    advisory_prerequisites:
      strong: [grammar.present-perfect.result, grammar.present-perfect-past-simple.choice]
      soft: [grammar.time-dates]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: big-five
    lexicon: [chunk.we-have-not-had-any-issues-since, word.since, word.yet]
    contexts: [project-tenure, service-status]
    typical_errors:
      - "Using Present Simple with since (I work here since 2022), following the Russian present-tense pattern."
      - "Using since with a duration and for with a starting point."
      - "Using a continuous form with a stative verb such as know when the simple perfect is required."
    examples:
      - "I have worked on the platform for three years."
      - "The service has been stable since Monday."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: reading.connected-technical-explanation
    cefr: B1
    track: reading
    module: b1.1-systems-and-project-reports
    can_do: "Follow the main line of a connected technical explanation and locate the details that support each step."
    advisory_prerequisites:
      strong: [reading.main-idea-details, reading.documentation-scan]
      soft: [reading.ticket-basics]
    dimensions: [recognition, transfer]
    lexicon: [chunk.the-key-point-is, chunk.according-to, word.detail]
    contexts: [technical-documentation, system-walkthrough]
    typical_errors:
      - "Translating every sentence before identifying the explanation's main process."
      - "Treating an example as a separate main idea instead of support for the preceding step."
      - "Assuming a connector has the same logical force as a similar Russian connector without checking the clause relation."
    examples:
      - "The queue stores each request before a worker processes it. This prevents a short traffic spike from losing data."
      - "The cache is cleared after deployment. As a result, the first request may take slightly longer."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: written-interaction.project-risk-update
    cefr: B1
    track: written-interaction
    module: b1.1-systems-and-project-reports
    can_do: "Write a project update that states a risk, explains its likely impact, and requests or proposes a response."
    advisory_prerequisites:
      strong: [written-production.project-update, written-interaction.suggestion-feedback]
      soft: [written-interaction.follow-up-recommendation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.project-update, chunk.the-main-risk-is, chunk.i-suggest]
    contexts: [project-update, risk-escalation]
    typical_errors:
      - "Naming a risk without stating its likely impact or the decision needed."
      - "Using the false friend actual for current in a status update."
      - "Writing a categorical Russian-style warning where English needs calibrated probability such as may or is likely to."
    examples:
      - "The main risk is the delayed data export, which may move testing into Friday. I suggest reducing the first test scope."
      - "Access approval is still pending. If it arrives after noon, we will need a one-day extension."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: written-production.system-overview
    cefr: B1
    track: written-production-mediation
    module: b1.1-systems-and-project-reports
    can_do: "Write a connected overview of a system's purpose, main components, and basic data flow for a new teammate."
    advisory_prerequisites:
      strong: [written-production.paraphrase-summary, written-production.option-comparison]
      soft: [us-tech.describe-system-data]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.each-record-has, chunk.its-stored-in, chunk.in-short]
    contexts: [team-onboarding, architecture-overview]
    typical_errors:
      - "Listing components without explaining how data or control moves between them."
      - "Omitting articles before singular components, as Russian has no article system."
      - "Using the false friend scheme when diagram, design, or architecture is intended."
    examples:
      - "The intake service validates each file and sends valid records to the queue. A worker then stores them in the reporting database."
      - "The dashboard reads aggregated data from the warehouse, so it never queries customer systems directly."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: us-tech.incident-root-cause
    cefr: B1
    track: us-tech-english
    module: b1.1-systems-and-project-reports
    can_do: "Explain the observed impact, contributing conditions, and probable root cause of a technical incident without overstating certainty."
    advisory_prerequisites:
      strong: [us-tech.incident-report-basics, written-production.troubleshooting-explanation]
      soft: [written-production.fact-inference]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-root-cause-was, chunk.as-far-as-i-understand, chunk.no-data-was-lost]
    contexts: [incident-review, root-cause-analysis]
    typical_errors:
      - "Calling the first visible symptom the root cause."
      - "Using reason of instead of cause of or reason for under Russian interference."
      - "Stating an unverified cause as certain instead of separating evidence, inference, and confidence."
    examples:
      - "The outage began when the worker pool reached its limit. The probable root cause was a retry loop that kept old jobs active."
      - "No data was lost; however, delayed acknowledgements caused clients to resend several requests."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: us-tech.requirement-rationale
    cefr: B1
    track: us-tech-english
    module: b1.1-systems-and-project-reports
    can_do: "Explain why a technical requirement exists and connect it to a user, operational, or safety need."
    advisory_prerequisites:
      strong: [written-interaction.requirement-question, grammar.modals.requirements]
      soft: [written-production.option-comparison]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-main-requirement-is, word.requirement, chunk.we-should-consider]
    contexts: [requirements-review, safety-design]
    typical_errors:
      - "Restating what the requirement says without explaining why it exists."
      - "Using demand as a neutral equivalent of requirement in a specification."
      - "Writing needed for that instead of linking the requirement to a user, operational, or safety consequence."
    examples:
      - "The audit log must be immutable because investigators need to reconstruct every approval."
      - "Offline export is required for field teams that work without reliable network access."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: grammar.past-perfect.sequence
    cefr: B1
    track: grammar-engine
    module: b1.3-complex-events-and-conditions
    can_do: "Show which of two past events happened first by using the Past Perfect in an incident or narrative."
    advisory_prerequisites:
      strong: [grammar.past-simple.events, grammar.past-continuous.incident-context]
      soft: [grammar.when-while.sequence]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [chunk.it-stopped-working-after, chunk.it-turned-out-that, word.incident]
    contexts: [incident-timeline, personal-narrative]
    typical_errors:
      - "Using Past Perfect for both past events instead of marking only the earlier event when the order needs clarification."
      - "Forming the tense with had plus a Past Simple form (had went, had saw)."
      - "Following Russian narrative order without marking that one event had already happened."
    examples:
      - "The alert arrived after the backup had failed."
      - "By the time I reached the station, the last train had left."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: grammar.second-conditional.hypothetical
    cefr: B1
    track: grammar-engine
    module: b1.3-complex-events-and-conditions
    can_do: "Discuss an unlikely or hypothetical present situation and its consequence with the second conditional."
    advisory_prerequisites:
      strong: [grammar.first-conditional.troubleshooting, grammar.modals.requirements]
      soft: [grammar.past-simple.events]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [chunk.we-should-consider, word.if, word.option]
    contexts: [design-hypothesis, personal-choice]
    typical_errors:
      - "Putting would in the if-clause (If we would add a cache...)."
      - "Using a present form in both clauses and losing the hypothetical distance."
      - "Choosing the second conditional for a realistic near-future plan that needs the first conditional."
    examples:
      - "If we had another week, we would test the migration twice."
      - "I would move closer to work if rent were lower."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: grammar.passive.expanded-process
    cefr: B1
    track: grammar-engine
    module: b1.3-complex-events-and-conditions
    can_do: "Describe a multi-step process in different time frames while keeping the action or result in focus."
    advisory_prerequisites:
      strong: [grammar.passive.basic-process, grammar.present-perfect.result]
      soft: [grammar.sequencing.delivery]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [word.process, word.delivery, chunk.we-have-completed]
    contexts: [process-description, deployment-report]
    typical_errors:
      - "Dropping the form of be and leaving only the participle (The file processed yesterday)."
      - "Keeping the active Russian-style subject when the process or result should be in focus."
      - "Changing the participle instead of the form of be when moving the passive to another time frame."
    examples:
      - "The files are validated before they are uploaded."
      - "The old records had been archived before the migration began."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: grammar.reported-speech.work-updates
    cefr: B1
    track: grammar-engine
    module: b1.3-complex-events-and-conditions
    can_do: "Report a colleague's statement, request, or question accurately in a connected work update."
    advisory_prerequisites:
      strong: [grammar.past-simple.events, grammar.basic-questions.clarification]
      soft: [written-production.paraphrase-summary]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: tail
    lexicon: [chunk.the-key-point-is, chunk.do-you-mean, word.question]
    contexts: [meeting-summary, handover-update]
    typical_errors:
      - "Keeping direct-question word order after asked (She asked when would it start)."
      - "Failing to update pronouns or time references when the reporting viewpoint changes."
      - "Using said me under the influence of Russian сказать мне instead of told me or said to me."
    examples:
      - "Maya said that the client needed a revised estimate."
      - "The reviewer asked whether we had tested the fallback."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: written-production.cause-effect-explanation
    cefr: B1
    track: written-production-mediation
    module: b1.3-complex-events-and-conditions
    can_do: "Write a connected explanation that distinguishes a cause, a contributing factor, and a resulting effect."
    advisory_prerequisites:
      strong: [grammar.connectors.cause-contrast, written-production.fact-inference]
      soft: [written-production.troubleshooting-explanation]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-root-cause-was, word.cause, chunk.as-far-as-i-understand]
    contexts: [incident-analysis, policy-explanation]
    typical_errors:
      - "Using because of before a full clause or because before a noun phrase."
      - "Confusing affect and effect when naming the consequence."
      - "Presenting a contributing condition as the sole cause without evidence."
    examples:
      - "The import slowed because one worker handled every file. Limited memory made the delay worse, and the queue eventually timed out."
      - "Heavy rain reduced visibility, so the ferry departed later than planned."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: everyday-life.explaining-complicated-problem
    cefr: B1
    track: everyday-life
    module: b1.3-complex-events-and-conditions
    can_do: "Explain a non-routine everyday problem, what led to it, what has already been tried, and what help is needed."
    advisory_prerequisites:
      strong: [everyday-life.resolving-a-service-problem, everyday-life.agreeing-on-the-next-step]
      soft: [everyday-life.explaining-an-everyday-incident]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [word.problem, word.repair, chunk.it-turned-out-that]
    contexts: [repair-request, health-appointment]
    typical_errors:
      - "Listing events in Russian discourse order without a clear problem, attempted solution, and current need."
      - "Using the false friend recipe when prescription is intended."
      - "Omitting articles in phrases such as a problem with the heater or the medicine I received."
    examples:
      - "The heater stops every evening. I have reset it twice, but the error returns, so I need a technician to inspect it."
      - "The pharmacy gave me a different dose from the prescription. I have not taken it and need the clinic to confirm the change."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: grammar.relative-clauses.specification
    cefr: B1
    track: grammar-engine
    module: b1.4-collaboration-and-decisions
    can_do: "Define or add relevant information about a person, system, or requirement with a relative clause."
    advisory_prerequisites:
      strong: [grammar.basic-word-order, grammar.articles.identity]
      soft: [grammar.pronouns.possessives]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.team, word.company, chunk.i-work-in-the-team]
    contexts: [requirement-definition, team-description]
    typical_errors:
      - "Repeating the noun with a pronoun inside the relative clause (the service which it stores data)."
      - "Using who for a system or which for a person under literal translation pressure."
      - "Omitting the article before the noun being defined."
    examples:
      - "We need a service that stores the audit records."
      - "The engineer who reviewed the design found the missing constraint."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: grammar.modals.deduction-obligation
    cefr: B1
    track: grammar-engine
    module: b1.4-collaboration-and-decisions
    can_do: "Distinguish obligation, recommendation, possibility, and evidence-based deduction with modal verbs."
    advisory_prerequisites:
      strong: [grammar.modals.requirements, grammar.can-cant.ability-requests]
      soft: [written-production.fact-inference]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [chunk.we-should-consider, word.requirement, chunk.as-far-as-i-understand]
    contexts: [requirements-review, evidence-based-diagnosis]
    typical_errors:
      - "Using must not for absence of obligation instead of do not have to."
      - "Using must for every Russian должен even when should or have to better matches the force."
      - "Reading must be only as obligation and missing its evidence-based deduction meaning."
    examples:
      - "The token must be expired; the same request works with a new one."
      - "You do not have to attend, but you should read the decision note."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: written-interaction.negotiating-scope
    cefr: B1
    track: written-interaction
    module: b1.4-collaboration-and-decisions
    can_do: "Negotiate a manageable scope in writing by stating constraints, priorities, and an acceptable compromise."
    advisory_prerequisites:
      strong: [written-interaction.respectful-disagreement, written-interaction.requirement-question]
      soft: [us-tech.scope-change-update]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-main-requirement-is, chunk.thats-out-of-scope, chunk.we-may-need-more-time]
    contexts: [scope-negotiation, delivery-planning]
    typical_errors:
      - "Using the false friend actual when current scope is intended."
      - "Writing I am agree instead of I agree."
      - "Rejecting a request directly without offering a constraint-based alternative."
    examples:
      - "We can include the export filter this week, but custom reports are outside the current scope. Could we schedule those for the next release?"
      - "To keep Friday's deadline, I suggest supporting two file types now and adding the third after testing."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: written-interaction.constructive-challenge
    cefr: B1
    track: written-interaction
    module: b1.4-collaboration-and-decisions
    can_do: "Challenge an assumption or proposal constructively and invite clarification without making the exchange adversarial."
    advisory_prerequisites:
      strong: [written-interaction.suggestion-feedback, written-interaction.respectful-disagreement]
      soft: [everyday-online-informal.tone-recognition]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.i-see-your-point, chunk.i-suggest, word.feedback]
    contexts: [design-review, planning-discussion]
    typical_errors:
      - "Opening with You are wrong, mirroring direct Russian disagreement without relationship repair."
      - "Using doubt in something instead of doubt something or have doubts about it."
      - "Challenging a person rather than naming the assumption, evidence, or consequence."
    examples:
      - "I see the benefit of the shared cache, but what evidence shows that both services need the same expiry time?"
      - "Could we revisit the assumption that every client has stable connectivity?"
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

  - id: written-production.reasoned-recommendation
    cefr: B1
    track: written-production-mediation
    module: b1.4-collaboration-and-decisions
    can_do: "Write a recommendation that compares relevant options, gives reasons, and acknowledges one limitation."
    advisory_prerequisites:
      strong: [written-production.option-comparison, written-interaction.follow-up-recommendation]
      soft: [grammar.connectors.cause-contrast]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    lexicon: [chunk.the-main-advantage-is, chunk.the-downside-is, chunk.we-should-consider]
    contexts: [option-review, personal-recommendation]
    typical_errors:
      - "Using recommend someone to do instead of recommend doing or recommend that someone do."
      - "Giving several advantages without a selection criterion."
      - "Using more better or the most optimal under Russian comparative interference."
