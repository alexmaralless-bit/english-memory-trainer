  - id: grammar.articles.proper-nouns-geography
    title: "The with geography: the US, the Alps, the Thames, but zero with most countries and cities"
    cefr: B1
    track: grammar-engine
    module: b1.5-independent-life
    can_do: "Use the correctly with countries, mountain ranges, rivers, and organizations, and zero article with most cities and single-word countries."
    advisory_prerequisites:
      strong: [grammar.articles.the-unique-superlative-ordinal]
      soft: [grammar.articles.institutional-places]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.option, chunk.the-main-advantage-is, word.detail, chunk.articles-proper-nouns-geography.germany, chunk.articles-proper-nouns-geography.nasa, chunk.articles-proper-nouns-geography.the-alps, chunk.articles-proper-nouns-geography.the-eu, chunk.articles-proper-nouns-geography.the-fbi, chunk.articles-proper-nouns-geography.the-netherlands, chunk.articles-proper-nouns-geography.the-pacific-ocean, chunk.articles-proper-nouns-geography.the-philippines, chunk.articles-proper-nouns-geography.the-thames, chunk.articles-proper-nouns-geography.the-uk, chunk.articles-proper-nouns-geography.the-un, chunk.articles-proper-nouns-geography.the-united-states, chunk.articles-proper-nouns-geography.the-us, chunk.articles-proper-nouns-geography.the-x-river]
    contexts: [travel-planning]
    typical_errors:
      - "Adding the before a single-word country or city name (the France, the Berlin) by over-generalizing the pattern from plural or descriptive country names."
      - "Dropping the before a country name that is plural or contains a common noun (Netherlands, United States) instead of using the fixed the form."
      - "Adding the before an organization's acronym that functions like a proper name without it (the NASA), or dropping it where the acronym needs it (in EU)."
    examples:
      - "We are flying to the Netherlands, then driving through the Alps."
      - "The Thames divides the city, and the EU has an office nearby."
    core_points:
      - "A single-word country or city name normally takes zero article: France, Berlin, Canada, Tokyo."
      - "A country name that is plural in form or contains a common noun such as states, kingdom, or republic takes the: the United States, the Netherlands, the United Kingdom."
      - "Mountain ranges, rivers, seas, and multi-word organization names normally take the, while single peaks, lakes, and single-word organization names normally do not."
    contrasts:
      - "France / the Netherlands: single-word country names usually take zero article; plural-form or descriptive country names take the."
      - "London / the United States: single cities usually take zero article; multi-word country names with a common noun take the."
      - "Everest / the Alps: a single named peak takes zero article; a mountain range name takes the."
      - "Lake Michigan / the Thames: a lake named with Lake takes zero article; a river name on its own takes the."
      - "NASA / the EU: an acronym pronounced as a word often takes zero article; an acronym read as separate letters for an organization commonly takes the."
      - "Google / the World Health Organization: a single company name usually takes zero article; a descriptive multi-word organization name takes the."
      - "Asia / the Middle East: a continent name takes zero article; a region name built from a common noun such as east or coast takes the."
    scope_limits:
      - "This topic gives the productive pattern and common landmark exceptions; it does not list every irregular place name in English."
      - "Institutional zero-article phrases such as at school or in the hospital are covered in a separate topic, not repeated here."
    error_patterns:
      - learner_form: "We visited the France last summer."
        correction: "We visited France last summer."
        explanation: "Single-word country names normally take zero article; the only appears with plural or descriptive country names."
      - learner_form: "Netherlands has a flat landscape."
        correction: "The Netherlands has a flat landscape."
        explanation: "A country name that is grammatically plural in form keeps the fixed the, even though the country itself is one nation."
      - learner_form: "The Google announced a new policy."
        correction: "Google announced a new policy."
        explanation: "A single proper company name normally takes zero article, unlike a descriptive multi-word organization name."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}

