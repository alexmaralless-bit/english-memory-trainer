  - id: grammar.articles.the-unique-superlative-ordinal
    title: "The with superlatives, ordinals, and one-of-a-kind things"
    cefr: A2
    track: grammar-engine
    module: a2.4-requirements-and-options
    can_do: "Use the correctly with superlatives, ordinals, same/only/next/last, and things that are unique in context."
    advisory_prerequisites:
      strong: [grammar.superlatives.selection, grammar.articles.identity]
      soft: [grammar.comparatives.options]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [chunk.the-main-advantage-is, word.priority, word.compare, chunk.articles-the-unique-superlative-ordinal.the-best-way-to-x, chunk.articles-the-unique-superlative-ordinal.the-biggest-issue, chunk.articles-the-unique-superlative-ordinal.the-ceo, chunk.articles-the-unique-superlative-ordinal.the-fastest-way-to-x, chunk.articles-the-unique-superlative-ordinal.the-first-time, chunk.articles-the-unique-superlative-ordinal.the-internet, chunk.articles-the-unique-superlative-ordinal.the-last-time, chunk.articles-the-unique-superlative-ordinal.the-most-important-thing, chunk.articles-the-unique-superlative-ordinal.the-next-step, chunk.articles-the-unique-superlative-ordinal.the-only-x, chunk.articles-the-unique-superlative-ordinal.the-same-x, chunk.articles-the-unique-superlative-ordinal.the-second-option, chunk.articles-the-unique-superlative-ordinal.the-sun, chunk.articles-the-unique-superlative-ordinal.the-third-attempt, chunk.articles-the-unique-superlative-ordinal.the-weather, chunk.articles-the-unique-superlative-ordinal.the-whole-team]
    contexts: [option-review]
    typical_errors:
      - "Omitting the before a superlative (best option instead of the best option)."
      - "Omitting the before same, only, next, or last when they identify one unique item (I chose same plan instead of the same plan)."
      - "Skipping the before a noun that has only one referent in context, such as the CEO or the internet, treating it like an ordinary countable noun that needs a/an."
    examples:
      - "This is the best option for our budget."
      - "The CEO approved the first version of the plan."
    core_points:
      - "A superlative (best, cheapest, most reliable) is followed by the, because it names the one item at the extreme of the set."
      - "Same, only, next, and last work like superlatives: they point to one unique item, so they take the."
      - "A noun with only one real-world referent in the shared context, such as the sun or a company's the CEO, takes the without needing a prior mention."
    contrasts:
      - "a fast option / the fastest option: a describes any one member of a set; the fastest picks the single extreme."
      - "an option / the only option: an introduces one of several; the only marks that just one exists."
      - "a plan / the same plan: a introduces a new plan; the same plan points to one already identified as identical."
      - "a meeting / the next meeting: a names any meeting; the next singles out the one immediately following."
      - "a step / the last step: a names one step among several; the last step points to the final, unique one."
      - "a manager / the CEO: a manager allows for several people; the CEO names the one person who holds that unique role."
      - "a bright day / the sun: ordinary countable nouns can take a; the sun is treated as unique, so it always takes the."
    scope_limits:
      - "This topic does not cover the with generic categories or with geographic proper nouns; those have their own topics."
      - "Comparative forms without the (cheaper, more reliable) are covered in the comparatives topic, not repeated here."
    error_patterns:
      - learner_form: "This is best option for our budget."
        correction: "This is the best option for our budget."
        explanation: "A superlative names the one item at the extreme of the set, so it needs the."
      - learner_form: "Only option left is the paid plan."
        correction: "The only option left is the paid plan."
        explanation: "Only, like a superlative, marks a single unique item and needs the before it."
      - learner_form: "CEO approved the plan yesterday."
        correction: "The CEO approved the plan yesterday."
        explanation: "CEO names the one person holding a unique role in the company, so English marks it with the."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
