  - id: grammar.articles.institutional-places
    title: "Institutional places: at home, in the hospital, to the doctor's"
    cefr: A2
    track: grammar-engine
    module: a2.9-health-and-wellbeing
    can_do: "Talk about going to or being at home, work, school, or a medical institution with the article American English expects."
    advisory_prerequisites:
      strong: [grammar.articles.identity, grammar.prepositions.location]
      soft: [grammar.articles.fixed-time-expressions]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: core
    lexicon: [word.doctor, word.medicine, word.bed, chunk.articles-institutional-places.at-home, chunk.articles-institutional-places.at-school, chunk.articles-institutional-places.at-the-airport, chunk.articles-institutional-places.at-the-gym, chunk.articles-institutional-places.get-home, chunk.articles-institutional-places.go-to-bed, chunk.articles-institutional-places.go-to-church, chunk.articles-institutional-places.go-to-the-office, chunk.articles-institutional-places.go-to-work, chunk.articles-institutional-places.i-need-to-stop-by-the-x, chunk.articles-institutional-places.in-bed, chunk.articles-institutional-places.in-prison, chunk.articles-institutional-places.in-the-hospital, chunk.articles-institutional-places.to-the-bank, chunk.articles-institutional-places.to-the-dentists, chunk.articles-institutional-places.to-the-doctors]
    contexts: [pharmacy-visit]
    typical_errors:
      - "Adding the before home or bed in fixed institutional phrases (go to the home, stay in the bed) instead of using the zero-article form."
      - "Using at instead of in for a building you are inside for its normal purpose (at the hospital when in the hospital, as a patient, is meant)."
      - "Treating go to the doctor's as go to doctor, dropping both the article and the possessive ending."
    examples:
      - "She stayed in the hospital for three days after the surgery."
      - "I need to go to the doctor's this afternoon."
    core_points:
      - "A small set of institutional nouns drop the article when you use the place for its normal purpose: at home, in bed, in prison, at school, at work."
      - "The same nouns take the when you are simply inside the building without that purpose: I was at the school to vote, not at school to study."
      - "The doctor's, the dentist's is a fixed possessive pattern meaning the doctor's office or clinic."
    contrasts:
      - "in bed / in the bed: in bed means resting or sleeping; in the bed points to the physical piece of furniture."
      - "at home / at the home: at home is the ordinary fixed phrase; at the home only fits a specific named care home."
      - "at school / at the school: at school means studying there; at the school can mean being in the building for another reason, such as a meeting."
      - "go to work / go to the office: go to work is the fixed idiom; go to the office names the specific building."
      - "to the doctor's / to a doctor's office: the doctor's is the natural fixed short form; a doctor's office is the fuller, more formal version."
      - "in prison / in the prison: in prison means serving a sentence; in the prison describes simply being inside the building, for example as a visitor."
      - "in hospital / in the hospital: British usage drops the after in; American usage keeps in the hospital even for a patient."
    scope_limits:
      - "This topic covers a closed set of common institutional nouns; it does not extend the zero-article pattern to every building."
      - "Geographic proper nouns such as country and organization names are covered in a separate topic."
    error_patterns:
      - learner_form: "He is in the bed because he is sick."
        correction: "He is in bed because he is sick."
        explanation: "In bed as a resting or sick state is a fixed zero-article phrase; the article only appears when bed means the physical object."
      - learner_form: "I have an appointment at the doctor."
        correction: "I have an appointment at the doctor's."
        explanation: "The fixed possessive form the doctor's stands for the doctor's office; doctor alone needs a different structure."
      - learner_form: "She works at home office every day."
        correction: "She works from home every day."
        explanation: "The natural fixed phrase for working remotely is from home, not at home office."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
