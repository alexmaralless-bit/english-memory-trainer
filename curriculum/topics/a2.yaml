    track: grammar-engine
    module: a2.1-events-and-incidents
    can_do: "Use a wider set of irregular past forms in an incident account."
    advisory_prerequisites:
      strong: [grammar.past-irregular-basics]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: big-five
    lexicon: [chunk.we-ran-into, lexeme.begin, lexeme.run]
    contexts: [incident-update]
    typical_errors:
      - "Using the base verb after a past-time marker (Yesterday I go)."
      - "Using did with a past form (Did you went?)."
      - "Translating Russian aspect word for word instead of choosing the English time frame."
    examples:
      - "The error began after the update."
      - "We found the missing file."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: written-production.incident-timeline
    cefr: A2
    track: written-production-mediation
    module: a2.1-events-and-incidents
    can_do: "Write a chronological incident timeline with background and events."
    advisory_prerequisites:
      strong: [grammar.when-while.sequence, grammar.past-irregular-events]
    dimensions: [recognition, controlled_production, transfer]
    lexicon: [chunk.we-have-run-into-an-issue, chunk.the-issue-started-at, chunk.users-are-affected]
    contexts: [incident-update]
    typical_errors:
      - "Copying Russian word order into a multi-sentence update or summary."
      - "Mixing a fact and an inference without a marker such as I think or may."
      - "Using a false friend or literal translation that changes the intended meaning."
    examples:
      - "At 10:00 the screen froze. We were testing the payment flow."
      - "At 10:15 we restarted the service."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: us-tech.incident-report-basics
    cefr: A2
    track: us-tech-english
    module: a2.1-events-and-incidents
    can_do: "Write a basic incident report for a technology problem."
    advisory_prerequisites:
      strong: [written-production.incident-timeline]
    dimensions: [recognition, controlled_production, transfer]
    lexicon: [chunk.we-have-run-into-an-issue, chunk.we-ran-into, chunk.it-only-happens-when]
    contexts: [incident-update]
    typical_errors:
      - "Using a Russian calque instead of a clear technical action (make a deploy instead of deploy)."
      - "Dropping the actor, status, or next step that makes an update actionable."
      - "Using Present Simple for an incident happening now or Past Simple for an unfinished result."
    examples:
      - "Users could not log in after the update."
      - "No data was lost during the incident."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: grammar.present-perfect.result
