topics:
  - id: grammar.past-continuous.incident-context
    cefr: A2
    track: grammar-engine
    module: a2.1-events-and-incidents
    can_do: "Set the background of an incident with the Past Continuous."
    advisory_prerequisites:
      strong: [grammar.past-simple.events]
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [word.at-the-time, word.incident, word.error, chunk.past-continuous-incident-context.at-that-time-were, chunk.past-continuous-incident-context.i-was-ing-when, chunk.past-continuous-incident-context.it-was-ing-when, chunk.past-continuous-incident-context.not-were-ing, chunk.past-continuous-incident-context.reason-were-ing, chunk.past-continuous-incident-context.she-was-ing-at, chunk.past-continuous-incident-context.the-server-was, chunk.past-continuous-incident-context.the-was-ing, chunk.past-continuous-incident-context.they-were-ing, chunk.past-continuous-incident-context.was-about-to-when, chunk.past-continuous-incident-context.we-were-ing-when, chunk.past-continuous-incident-context.were-you-ing-when, chunk.past-continuous-incident-context.what-was-ing, chunk.past-continuous-incident-context.when-error-occurred-were, chunk.past-continuous-incident-context.while-were-ing, chunk.past-continuous-incident-context.you-were-ing-when]
    contexts: [incident-update]
    typical_errors:
      - "Using Past Simple for the background action (We tested when it failed)."
      - "Dropping was/were before the -ing verb."
      - "Using Past Continuous for the short completed event instead of the background."
    examples:
      - "We were testing the form when it failed."
      - "The server was running slowly at noon."
    contrasts:
      - "We were testing the form when it failed. / We tested the form after it failed.: the background action in progress contrasts with a separate completed action afterward."
      - "The server was running slowly at noon. / The server ran slowly for two hours.: an ongoing state at one moment contrasts with a completed stretch of time reported as a single fact."
      - "I was writing the report when the call started. / I wrote the report before the call started.: an interrupted background action contrasts with a finished action that happened first."
      - "They were deploying the update at 9:00. / They deployed the update at 9:00.: the process still in progress at that exact moment contrasts with the whole action presented as a single completed event."
      - "We were waiting for approval all morning. / We waited for approval and then started.: a long background state contrasts with one completed episode reported as a fact."
      - "The alert was firing repeatedly when we checked. / The alert fired once and stopped.: a repeated background pattern contrasts with a single completed occurrence."
      - "We deployed the fix yesterday. / We were deploying the fix when the outage started.: a finished-time marker such as yesterday forces the simple completed report; the background frame before another event needs Past Continuous, a distinction Russian aspect does not mark the same way."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
