      strong: [grammar.present-perfect.result]
    dimensions: [recognition, controlled_production, transfer]
    lexicon: [chunk.we-have-completed, chunk.i-have-already-checked, chunk.we-have-not-had-any-issues-since]
    contexts: [deployment-update]
    typical_errors:
      - "Writing a Russian-style imperative where English needs a polite request (Send me... without context)."
      - "Omitting the subject, article, or auxiliary in a short message."
      - "Using a direct calque such as Please, explain me instead of explain it to me."
    examples:
      - "We have completed the test."
      - "The new page has worked well so far."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
