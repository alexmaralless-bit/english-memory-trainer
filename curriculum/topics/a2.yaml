  - id: grammar.future-forms.planning
    cefr: A2
    track: grammar-engine
    module: a2.3-planning-and-delivery
    can_do: "Choose a basic future form for an intention, decision, or arranged plan."
    advisory_prerequisites:
      strong: [grammar.going-to.plans, grammar.will.basic-decisions, grammar.present-continuous.status]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: big-five
    lexicon: [chunk.were-aiming-for, chunk.we-may-need-more-time, word.delivery, chunk.future-forms-planning.are-you-planning-to, chunk.future-forms-planning.do-you-want-me-to-start-now, chunk.future-forms-planning.hes-probably-going-to-refuse, chunk.future-forms-planning.if-it-fails-we-will-call, chunk.future-forms-planning.ill-answer-the-client, chunk.future-forms-planning.ill-call-you-back, chunk.future-forms-planning.ill-handle-this-now, chunk.future-forms-planning.ill-let-you-know-once, chunk.future-forms-planning.ill-sort-it-out, chunk.future-forms-planning.im-going-to-review, chunk.future-forms-planning.im-going-to-send, chunk.future-forms-planning.its-not-happening-until-next-month, chunk.future-forms-planning.maybe-ill-skip-this-meeting, chunk.future-forms-planning.thats-the-plan-for-now, chunk.future-forms-planning.the-meeting-is-tomorrow, chunk.future-forms-planning.theyre-aiming-to-launch, chunk.future-forms-planning.we-are-going-to-test, chunk.future-forms-planning.we-might-need-more-resources, chunk.future-forms-planning.we-should-test-first, chunk.future-forms-planning.well-get-it-done-by-friday, chunk.future-forms-planning.well-need-to-extend-the-timeline, chunk.future-forms-planning.well-release-by-friday, chunk.future-forms-planning.were-meeting-on-friday, chunk.future-forms-planning.when-does-the-feature-launch, chunk.future-forms-planning.when-will-you-finish]
    contexts: [delivery-planning]
    typical_errors:
      - "Using will after if or when in a time clause (If it will fail...)."
      - "Using going to for a decision made at the moment of speaking."
      - "Dropping the be in be going to (I going to call)."
    examples:
      - "I am going to review the plan."
      - "I will answer the client now."
    contrasts:
      - "I will answer the client now. / I am going to answer the client after this call.: a decision made at the moment of speaking contrasts with a plan already decided before now."
      - "We are going to test the API tomorrow. / We are testing the API tomorrow.: an intention formed earlier contrasts with an arrangement already fixed with a time and confirmed steps."
      - "I think we will finish by Friday. / We are finishing the report on Friday.: a prediction based on opinion contrasts with a scheduled arrangement already confirmed."
      - "If the build fails, we will roll back. / We are going to roll back because the build failed.: a future decision conditional on an unknown outcome contrasts with an intention already formed after a known cause."
      - "The team will probably need more time. / The team is going to need more time.: a less certain prediction with will contrasts with a prediction based on visible present evidence."
      - "We'll call you back in five minutes. / We're calling the client in five minutes.: an instant decision contrasts with an already-arranged call with a fixed time."
      - "We deployed the fix yesterday. / We will deploy the fix tomorrow.: a Russian perfective verb can describe both a finished past action and a planned future one; English marks the difference only through the tense form, not the verb itself."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
