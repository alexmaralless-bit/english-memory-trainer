# TODO(review): minimal A2 topic inventory inferred from the approved module descriptions; informal-topic placement and granularity are the minimal P.1b interpretation of the approved concept.
topics:
  - id: grammar.past-continuous.incident-context
    cefr: A2
    track: grammar-engine
    module: a2.1-events-and-incidents
    can_do: "Set the background of an incident with the Past Continuous."
    advisory_prerequisites:
      strong: [grammar.past-simple.events]
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [word.at-the-time, word.incident, word.error]
    contexts: [incident-update]
    typical_errors:
      - "Using the base verb after a past-time marker (Yesterday I go)."
      - "Using did with a past form (Did you went?)."
      - "Translating Russian aspect word for word instead of choosing the English time frame."
    examples:
      - "We were testing the form when it failed."
      - "The server was running slowly at noon."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: grammar.when-while.sequence
    cefr: A2
    track: grammar-engine
    module: a2.1-events-and-incidents
    can_do: "Connect a background action and an event with when and while."
    advisory_prerequisites:
      strong: [grammar.past-continuous.incident-context, grammar.past-time-sequencing]
    dimensions: [recognition, transfer]
    frequency_tier: tail
    lexicon: [chunk.it-only-happens-when, word.during, word.while]
    contexts: [incident-update]
    typical_errors:
      - "Using the base verb after a past-time marker (Yesterday I go)."
      - "Using did with a past form (Did you went?)."
      - "Translating Russian aspect word for word instead of choosing the English time frame."
    examples:
      - "The screen froze while I was paying."
      - "When the alert arrived, we called support."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
  - id: grammar.past-irregular-events
