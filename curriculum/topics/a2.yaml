  - id: grammar.present-perfect-past-simple.choice
    cefr: A2
    track: grammar-engine
    module: a2.2-results-and-experience
    can_do: "Choose Present Perfect for a current result and Past Simple for a finished past event."
    advisory_prerequisites:
      strong: [grammar.present-perfect.result, grammar.past-simple.events]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: big-five
    lexicon: [chunk.we-have-not-had-any-issues-since, word.yet, word.since, chunk.present-perfect-past-simple-choice.has-anyone-tested-vs-did-anyone-test, chunk.present-perfect-past-simple-choice.hasnt-anyone-vs-didnt-anyone, chunk.present-perfect-past-simple-choice.have-you-asked-vs-did-you-ask, chunk.present-perfect-past-simple-choice.have-you-found-vs-did-you-find, chunk.present-perfect-past-simple-choice.i-have-checked-vs-checked, chunk.present-perfect-past-simple-choice.i-havent-seen-vs-i-didnt-see, chunk.present-perfect-past-simple-choice.ive-done-vs-i-did, chunk.present-perfect-past-simple-choice.ive-sent-i-sent, chunk.present-perfect-past-simple-choice.no-one-has-seen-vs-no-one-saw, chunk.present-perfect-past-simple-choice.the-code-has-passed-vs-passed, chunk.present-perfect-past-simple-choice.the-issue-has-been-fixed-vs-was-fixed, chunk.present-perfect-past-simple-choice.the-system-has-been-down-vs-was-down, chunk.present-perfect-past-simple-choice.they-have-gone-vs-they-went, chunk.present-perfect-past-simple-choice.they-havent-vs-they-didnt, chunk.present-perfect-past-simple-choice.we-fixed-vs-we-have-fixed, chunk.present-perfect-past-simple-choice.we-havent-finished-vs-we-didnt-finish, chunk.present-perfect-past-simple-choice.weve-discovered-vs-discovered, chunk.present-perfect-past-simple-choice.weve-learned-vs-learned, chunk.present-perfect-past-simple-choice.what-have-you-done-vs-what-did-you-do]
    contexts: [deployment-update]
    typical_errors:
      - "Using Present Perfect with a finished past time (I have sent it yesterday)."
      - "Using Past Simple for a result that is still relevant now."
      - "Ignoring already/yet/since because Russian does not require the same tense choice."
    examples:
      - "We have fixed the issue."
      - "We fixed it yesterday."
    contrasts:
      - "We have fixed the issue. / We fixed it yesterday.: no time marker keeps the current result in Present Perfect; yesterday moves the same fact into Past Simple."
      - "I have already sent the invoice. / I sent the invoice on Monday.: already keeps the focus on the present result; on Monday anchors it to a finished day."
      - "They have not replied yet. / They did not reply during the call.: yet leaves the window open; during the call closes it to one finished past episode."
      - "The service has been down since 9:00. / The service went down at 9:00 and came back at 9:15.: an unfinished period up to now contrasts with a fully closed past episode."
      - "We have never seen this error before. / We saw this error once last year.: an experience with no specific time contrasts with one dated occurrence."
      - "Has the client approved the design? / Did the client approve the design at the review?: an open question about the current state contrasts with one tied to a specific past event."
      - "We deployed the fix yesterday. / We've deployed the fix.: a finished-time marker such as yesterday forces Past Simple, even though the Russian perfective verb does not itself signal which English tense to choose."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
