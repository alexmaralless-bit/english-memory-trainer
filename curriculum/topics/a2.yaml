  - id: grammar.present-perfect.result
    cefr: A2
    track: grammar-engine
    module: a2.2-results-and-experience
    can_do: "Report a completed action that matters now."
    advisory_prerequisites:
      strong: [grammar.have-has.objects, grammar.past-participle.forms]
      soft: [grammar.past-simple.events]
    dimensions: [recognition, controlled_production, spontaneous_production, transfer]
    frequency_tier: big-five
    lexicon: [chunk.we-have-completed, chunk.i-have-already-checked, chunk.i-have-experience-with, chunk.present-perfect-result.client-hasnt-responded, chunk.present-perfect-result.has-anyone, chunk.present-perfect-result.have-you-ever, chunk.present-perfect-result.have-you-yet, chunk.present-perfect-result.havent-yet, chunk.present-perfect-result.i-have-learned, chunk.present-perfect-result.its-been-since, chunk.present-perfect-result.ive-already, chunk.present-perfect-result.ive-asked, chunk.present-perfect-result.ive-never, chunk.present-perfect-result.no-one-has, chunk.present-perfect-result.report-has-shown, chunk.present-perfect-result.so-far-weve, chunk.present-perfect-result.thats-the-first-time, chunk.present-perfect-result.the-code-has-passed, chunk.present-perfect-result.the-has-been, chunk.present-perfect-result.the-team-has-completed, chunk.present-perfect-result.we-have-just-started, chunk.present-perfect-result.we-havent-had, chunk.present-perfect-result.we-havent-seen, chunk.present-perfect-result.weve-discovered, chunk.present-perfect-result.weve-just]
    contexts: [deployment-update]
    typical_errors:
      - "Omitting have/has before the participle (We completed the test already) when the result matters now."
      - "Adding a finished past time to Present Perfect (We have fixed it yesterday)."
      - "Using Past Simple for a current result without a finished-time marker."
    examples:
      - "We have completed the migration."
      - "I have already checked the data."
    contrasts:
      - "We have completed the migration. / We completed the migration yesterday.: an unmarked current result contrasts with the same action anchored to a finished past time."
      - "I have already checked the data. / I checked the data this morning.: already signals a present-relevant result; this morning anchors it as a finished past event."
      - "The team has fixed the bug. / The team fixed the bug on Monday.: the result still matters now, unlike the same fact reported with a specific finished date."
      - "We have not had any issues since the update. / We did not have any issues yesterday.: an unbroken period up to now contrasts with one specific past day."
      - "She has deployed three releases this month. / She deployed a release last month.: this month is still open, so Present Perfect fits; last month is closed, so Past Simple fits."
      - "Have you seen the new dashboard? / Did you see the new dashboard on Friday?: an open, unspecified-time question contrasts with a question anchored to one finished day."
      - "We deployed the fix yesterday. / We've deployed the fix.: yesterday is a finished-time marker that forces Past Simple, even though both sentences could translate with a similar Russian perfective verb."
    explanation_language: ru-allowed
    mastery_criteria: {schema_version: 1, per_dimension: {recognition: {active_threshold: 70, independent_attempts: 2}, controlled_production: {active_threshold: 75, independent_attempts: 2}, spontaneous_production: {active_threshold: 75, independent_attempts: 2}, transfer: {active_threshold: 75, independent_attempts: 2}}, mastered: {all_required_active: true, retention_stability_days: 30, retention_confirmations: 2}}
